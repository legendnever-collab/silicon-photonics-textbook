name: Chapter 7 validation
on:
  push:
    branches: [feature/ch7-photonic-circuit-modelling]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build models content and independent physics
        run: |
          npm run build
          npm test
          pip install numpy
          python3 tests/ch7-independent-validation.py
      - name: Byte parity and prior release preservation
        run: |
          cp dist/silicon-photonics-textbook-v0.7.0.html /tmp/ch7.html
          npm run build
          cmp /tmp/ch7.html dist/silicon-photonics-textbook-v0.7.0.html
          cd dist
          sha256sum -c CH7_SHA256SUMS.txt
          sha256sum -c CH6_SHA256SUMS.txt
      - name: Browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Chapter7 browser matrix and integrated43 lessons
        env:
          CI_VISUAL_LOG: '1'
        run: npm run test:ch7:browser
      - name: Historical Chapter1–6 independent browser regressions
        run: |
          npm run test:browser
          npm run test:ch2:browser
          npm run test:ch3:browser
          npm run test:ch4:browser
          npm run test:ch5:browser
          npm run test:ch6:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silicon-photonics-textbook-v0.7.0-review
          path: |
            dist/silicon-photonics-textbook-v0.7.0.html
            dist/CH7_SHA256SUMS.txt
            dist/ch7-build-info.json
            artifacts/v0.7.0/
            docs/CH7_*
          retention-days: 30
