name: Chapter 9 validation
on:
  push:
    branches: [feature/ch9-fabrication]
  pull_request:
    branches: [main, feature/ch8-tools-pdk-layout]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build content physics and independent reference
        run: |
          npm run build
          npm test
          python3 tests/ch9-independent-validation.py
          pip install fonttools brotli numpy
          python3 scripts/audit-ch9-font.py
          python3 tests/ch8-independent-validation.py
          python3 tests/ch7-independent-validation.py
      - name: Deterministic build and retained release hashes
        run: |
          cp dist/silicon-photonics-textbook-v0.9.0.html /tmp/ch9.html
          npm run build
          cmp /tmp/ch9.html dist/silicon-photonics-textbook-v0.9.0.html
          cd dist
          sha256sum -c CH9_SHA256SUMS.txt
          sha256sum -c CH8_SHA256SUMS.txt
          sha256sum -c CH7_SHA256SUMS.txt
      - name: Browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.62.0
          npx playwright install chromium
      - name: Chapter9 browser matrix and integrated57 lessons
        env:
          CI_VISUAL_LOG: '1'
        run: npm run test:ch9:browser
      - name: Historical Chapter1–8 browser regressions
        run: |
          npm run test:browser
          npm run test:ch2:browser
          npm run test:ch3:browser
          npm run test:ch4:browser
          npm run test:ch5:browser
          npm run test:ch6:browser
          npm run test:ch7:browser
          npm run test:ch8:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silicon-photonics-textbook-v0.9.0-review
          path: |
            dist/silicon-photonics-textbook-v0.9.0.html
            dist/CH9_SHA256SUMS.txt
            dist/ch9-build-info.json
            artifacts/v0.9.0/
            docs/CH9_*
          retention-days: 30
