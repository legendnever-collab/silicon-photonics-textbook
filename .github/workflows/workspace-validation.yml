name: Workspace U1 validation
on:
  push:
    branches: [feature/workspace-u1-pinned-graph]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build preservation physics and independent reference
        run: |
          npm run build
          npm test
          npm run test:workspace:preservation
          pip install fonttools brotli numpy
          python3 tests/ch12-independent-validation.py
          python3 scripts/audit-workspace-font.py
          cp dist/silicon-photonics-textbook-v0.12.1.html /tmp/u1.html
          npm run build
          cmp /tmp/u1.html dist/silicon-photonics-textbook-v0.12.1.html
          cd dist
          sha256sum -c WORKSPACE_SHA256SUMS.txt
          sha256sum -c CH12_SHA256SUMS.txt
      - name: Browser dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.62.0
          npx playwright install chromium
      - name: Pilot actual last controls resize modal state and downloads
        run: npm run test:workspace:browser
      - name: Original Chapter12 assertions on new integrated79 UI
        run: npm run test:workspace:regression
      - name: Original Chapter1–12 assertions on preserved releases
        run: npm run test:workspace:archived
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silicon-photonics-textbook-v0.12.1-review
          path: |
            dist/*0.12.1*
            dist/workspace-*
            dist/WORKSPACE_*
            artifacts/v0.12.1/
            docs/WORKSPACE_*
          retention-days: 30
