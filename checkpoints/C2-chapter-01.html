  <noscript>이 교재의 Guided Tutor와 Notebook에는 JavaScript가 필요합니다. Source의 textbook/chapter-01에서 설명 원문을 읽을 수 있습니다.</noscript>
  <script>window.TEXTBOOK={"lessons":[{"id":"1.1","short":"Confinement","title":"Why Does Light Stay in a Waveguide?","time":"7–9분","lead":"빛을 가둔다는 말을 재료의 성질에서 시작해 Wave의 조건으로 다시 이해합니다.","question":"Silicon의 Refractive Index가 SiO₂보다 높다는 것이 빛의 진행에 왜 중요할까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"빛이 지나갈 길을 만드는 일","scene":"tir","html":"\u003cp>전자 회로의 Metal Wire가 전류의 경로를 정하듯, Photonic Circuit에는 빛을 원하는 위치까지 전달하는 길이 필요합니다. 그 길이 \u003cstrong>Optical Waveguide\u003c/strong>입니다. 하지만 투명한 재료로 가느다란 선을 만든다고 항상 빛이 그 안에 머무르지는 않습니다. 주변 재료와 어떤 차이가 있는지가 중요합니다.\u003c/p>\u003cp>이번 Chapter에서는 익숙한 Silicon Core와 SiO₂ Cladding을 예로 사용합니다. 먼저 ‘빛이 반사되어 남는다’는 직관을 얻고, 그 직관만으로 설명할 수 없는 공간적 Field Distribution까지 살펴봅니다. 오른쪽 Notebook의 그림은 실제 빛의 궤적을 추적한 결과가 아니라, 경계에서의 방향을 설명하는 \u003cstrong>Conceptual\u003c/strong> 그림입니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Core와 Cladding은 함께 Waveguide를 이룹니다","scene":"tir","html":"\u003cp>\u003cstrong>Refractive Index n\u003c/strong>은 균일하고 투명한 물질에서 Wave의 Phase가 진공보다 얼마나 느리게 진행하는지 나타내는 무차원 수입니다. n이 크면 같은 Frequency에서 Wavelength가 짧아집니다. ‘빛이 느려진다’는 표현은 여기서는 Phase Velocity를 뜻합니다. Pulse가 전달되는 속도와는 구별해야 합니다.\u003c/p>\u003cp>1550 nm 부근을 설명하기 위해 이 교재는 Silicon에 n = 3.48, SiO₂에 n = 1.444라는 고정된 예시 값을 사용합니다. 재료 상수가 모든 파장과 온도에서 같다는 뜻은 아닙니다. 높은 n의 \u003cstrong>Core\u003c/strong>를 낮은 n의 \u003cstrong>Cladding\u003c/strong>이 둘러싸면, 경계에서 특정 조건을 만족하는 빛은 바깥으로 진행하는 굴절파를 만들지 않고 반사될 수 있습니다. 이것이 \u003cstrong>Total Internal Reflection, TIR\u003c/strong>의 출발점입니다.\u003c/p>\u003cp>입사각 θ는 경계면 자체가 아니라 \u003cstrong>경계면에 수직인 Normal\u003c/strong>에서 잽니다. Core에서 Cladding으로 갈 때 θ가 Critical Angle보다 커지면, Cladding 쪽에 멀리까지 진행하는 굴절파가 생기지 않습니다. 그렇다고 바깥의 Electric Field가 갑자기 0이 되지는 않습니다. 경계 근처에는 거리에 따라 감소하는 \u003cstrong>Evanescent Field\u003c/strong>가 남습니다.\u003c/p>\u003cp>따라서 Optical Confinement는 ‘빛이 Core에 100% 들어 있다’는 뜻이 아닙니다. Field가 Core 부근에 국소화되어 있으며, Waveguide 축 방향으로 에너지를 전달하는 상태를 뜻합니다. Cladding의 Field는 나중에 Coupling과 Sensing을 가능하게 하는 중요한 성분입니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"TIR이 시작되는 조건을 계산해 봅니다","scene":"tir","html":"\u003cdiv class='equation'>n₁ sin θ₁ = n₂ sin θ₂\u003cbr>θ\u003csub>c\u003c/sub> = sin⁻¹(n₂ / n₁)\u003cspan class='caption'>[R1, R2] 평탄한 두 유전체 경계에서 Snell’s Law. n₁ &gt; n₂이고 높은 n 쪽에서 입사할 때만 Critical Angle이 정의됩니다.\u003c/span>\u003c/div>\u003cdl class='terms'>\u003cdt>n₁, n₂\u003c/dt>\u003cdd>Core와 Cladding의 Refractive Index · 무차원\u003c/dd>\u003cdt>θ₁, θ₂\u003c/dt>\u003cdd>각 영역의 Normal 기준 각도 · ° 또는 rad, 계산 중 단위를 일관되게 사용\u003c/dd>\u003cdt>θc\u003c/dt>\u003cdd>굴절각 θ₂가 90°가 되는 임계 입사각 · θ₁ &gt; θc에서 TIR\u003c/dd>\u003c/dl>\u003cdiv class='worked'>\u003ch3>Worked Example · Silicon / SiO₂\u003c/h3>\u003cp>n₁ = 3.48, n₂ = 1.444이면 sin θc = 1.444 / 3.48 ≈ 0.415입니다. 따라서 θc ≈ \u003cstrong>24.5°\u003c/strong>입니다. Normal 기준 입사각이 45°인 광선은 이 이상적인 경계에서 TIR 조건을 만족합니다. 15°이면 만족하지 않습니다.\u003c/p>\u003cp>이 계산이 알려 주는 것은 \u003cem>한 경계에서의 광선 조건\u003c/em>입니다. Width가 얼마인 Waveguide가 몇 개의 Mode를 갖는지는 아직 알 수 없습니다. 마주 보는 경계에서 반사된 Wave들이 서로 맞는 Phase를 가져야 하기 때문입니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Phase Velocity를 수식으로 보면\u003c/summary>\u003cdiv class='equation'>n = c / v\u003csub>ph\u003c/sub>\u003cbr>λ\u003csub>material\u003c/sub> = λ₀ / n\u003cspan class='caption'>균일·선형·등방성·투명한 매질의 단색 Plane Wave. c: 진공 광속 [m/s], vph: Phase Velocity [m/s], λ: Wavelength [m]. 흡수와 Dispersion은 여기서 생략합니다.\u003c/span>\u003c/div>\u003cp>λ₀ = 1550 nm일 때 균일한 Silicon 안의 Wavelength는 약 445 nm입니다. 실제 Waveguide 축 방향의 Guided Wavelength는 이 값과 다를 수 있으며 Lesson 1.3에서 다룹니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"반사된다면, 바깥에는 정말 아무것도 없을까요?","scene":"tir","html":"\u003cp>다음 질문에 답한 뒤 설명을 읽어 보세요. 선택은 학습을 막지 않으며 언제든 바꿀 수 있습니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"먼저 예측하고, 경계 조건을 확인합니다","scene":"tir","html":"\u003cp>Normal 기준 입사각을 15°에서 45°로 바꿀 때, Cladding에서 멀리 진행하는 굴절파는 어떻게 될까요? 먼저 예측을 남긴 뒤 Notebook에서 각도를 바꿔 보세요. Critical Angle을 지나면 Snell’s Law에서 sin θ₂가 1보다 커집니다. 이는 일반적인 실수 각도의 굴절파가 더 이상 존재하지 않는다는 뜻입니다.\u003c/p>\u003cp>경계에서의 Field는 여전히 존재합니다. \u003cstrong>TIR은 Mode를 이해하는 직관이지만, Guided Mode의 완전한 정의는 아닙니다.\u003c/strong> 실제 Guided Mode는 Maxwell 방정식과 모든 경계조건을 동시에 만족하는 전자기 고유해입니다. 단면에서 허용된 Field Pattern만이 자기 자신을 유지하며 전파할 수 있습니다. 이 조건을 다음 Lesson에서 살펴봅니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"재료의 차이에서 Wave의 조건으로","scene":"tir","html":"\u003cul>\u003cli>Core보다 낮은 n의 Cladding은 Index Guiding의 기반입니다. 높은 n 하나만으로 충분하지 않습니다.\u003c/li>\u003cli>TIR에서는 바깥으로 진행하는 굴절파가 없어도 Evanescent Field가 남습니다.\u003c/li>\u003cli>Waveguide가 허용하는 상태는 전체 경계조건을 만족하는 Guided Mode입니다.\u003c/li>\u003c/ul>\u003cp>다음에는 ‘어떤 빛이 허용되는가’를 공간적인 Field Pattern으로 읽어 보겠습니다.\u003c/p>"}],"prediction":"Normal 기준 입사각을 15°에서 45°로 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","굴절파가 멀리 전파하지 못하는 TIR 조건이 된다","n이 그대로이므로 아무 변화가 없다","Cladding의 Field가 모든 곳에서 정확히 0이 된다"],"predictionFeedback":"24.5°보다 큰 입사각에서 TIR 조건이 됩니다. Cladding의 Evanescent Field와 멀리 전파하는 굴절파를 구별해 보세요.","reflection":"TIR과 Guided Mode는 어떤 점이 연결되고, 어떤 점이 다를까요? 자신의 말로 설명해 보세요.","sources":["R1","R2"],"tutor":{"question":"이상적인 Silicon / SiO₂ 경계에서 TIR이 일어났습니다. Cladding의 Field를 어떻게 설명해야 할까요?","choices":[{"text":"에너지가 밖으로 굴절되지 않으므로 Cladding의 Field도 전부 0이다.","feedback":"멀리 진행하는 굴절파가 없다는 것과 Field가 없다는 것은 다릅니다. 경계조건 때문에 Cladding에도 Field가 이어지며, 경계에서 멀어질수록 지수적으로 감소합니다. 이 성분이 Evanescent Field입니다.","concept":"전파하는 굴절파와 Evanescent Field의 혼동"},{"text":"Cladding에 감쇠하는 Field가 남으며, 이상적인 경계에 수직인 평균 에너지 유출은 없다.","feedback":"맞습니다. Evanescent Field는 존재하지만 이 이상적 단일 경계에서는 바깥쪽으로 순수하게 전달되는 시간 평균 Power가 없습니다. Waveguide에서는 그 Field도 축 방향 전파의 일부입니다. 가까이에 다른 Core가 있으면 Coupling이 가능해집니다.","concept":"Field와 Power Flow 구별","correct":true},{"text":"nCore가 높으므로 어떤 각도와 어떤 Width에서도 모든 빛이 완전히 갇힌다.","feedback":"nCore > nCladding은 출발 조건입니다. 광선의 TIR에는 입사각 조건이, Guided Mode에는 전체 경계의 Phase와 Field 연속 조건이 추가됩니다. 모든 입력 Field가 임의로 유지되는 것은 아닙니다.","concept":"Index Contrast만으로 모든 전파를 보장한다는 오개념"}],"why":"경계에서 접선 방향 Electric Field와 Magnetic Field가 연속이어야 합니다. Core의 Field가 경계에서 일반적으로 0이 아니므로 Cladding에서도 이어집니다. TIR 조건에서는 그 해가 바깥쪽으로 진동하며 진행하는 대신 감쇠하는 형태가 됩니다.","simple":"벽에 부딪힌 공처럼 빛이 완전히 경계 안쪽에만 있는 것은 아닙니다. 바깥까지 약하게 펼쳐진 Wave가 Core 근처에 묶여 함께 앞으로 간다고 생각해 보세요. 단, 이 비유가 Maxwell의 경계조건을 대신하지는 않습니다.","math":"Cladding에서 축 방향 β가 nClad k₀보다 크면, 횡 방향 파수의 제곱 nClad²k₀² − β²는 음수입니다. 따라서 횡 방향 해는 진동 함수가 아닌 exp(−q x) 꼴이며 q = √(β² − nClad²k₀²) > 0입니다. x는 경계 바깥 방향 거리이고 q의 단위는 1/m입니다.","notebook":"Notebook에서 15°, 24.5° 부근, 45°를 차례로 비교하세요. 그림은 광선 직관이며, 각도와 TIR 판정만 Snell’s Law로 계산합니다. 반사율이나 Evanescent Field 크기를 그림의 선 굵기로 읽지 마세요."}},{"id":"1.2","short":"Optical Modes","title":"What Is an Optical Mode?","time":"6–8분","lead":"같은 Waveguide도 빛을 여러 공간적 형태로 전달할 수 있습니다. Mode는 그중 허용된 형태입니다.","question":"같은 색의 빛이라도, 단면에서 다른 모양으로 전파할 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"빛의 경로만 알아서는 부족합니다","scene":"modes","html":"\u003cp>Lesson 1.1에서는 높은 n의 Core와 낮은 n의 Cladding이 빛을 국소화할 수 있음을 배웠습니다. 이제 같은 Waveguide에 빛을 넣어도 입력의 모양에 따라 다른 결과가 생기는 이유를 생각해 보겠습니다. 어떤 입력은 하나의 안정된 Field Pattern으로 전달되고, 어떤 입력은 여러 Pattern이 섞여 전파합니다.\u003c/p>\u003cp>\u003cstrong>Optical Mode\u003c/strong>를 알면 Coupling할 때 왜 위치와 Polarization을 맞춰야 하는지, Width가 커질 때 왜 단순히 빛의 통로만 넓어지는 것이 아닌지 이해할 수 있습니다. Mode는 빛 한 개의 이동 경로나 주파수의 별명이 아닙니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"전파하면서 자기 모양을 유지하는 Field Pattern","scene":"modes","html":"\u003cp>단면과 재료가 z 방향으로 일정한 이상적인 Waveguide를 생각해 봅니다. 특정 Frequency에서 Maxwell 방정식과 경계조건을 만족하는 Field가 있다면, 그 Field는 z 방향으로 나아가며 전체에 같은 Phase Factor를 곱하는 방식으로 표현될 수 있습니다. 단면의 상대적인 분포는 유지됩니다. 이것이 여기서 말하는 Guided Mode입니다.\u003c/p>\u003cp>가장 낮은 차수의 \u003cstrong>Fundamental Mode\u003c/strong>는 단순한 대칭 Slab에서 내부 Node가 없는 형태입니다. \u003cstrong>Higher-order Mode\u003c/strong>에는 Field가 0을 통과하며 부호가 바뀌는 Node가 생깁니다. 부호가 음수라고 음의 Power가 흐른다는 뜻은 아닙니다. 단색 실수 기준 Field의 부호 차이는 같은 순간에 반대 위상으로 진동함을 나타냅니다.\u003c/p>\u003cp>\u003cstrong>Mode Profile\u003c/strong>을 볼 때는 색이 무엇을 나타내는지 먼저 확인해야 합니다. Electric Field E의 한 성분인지, |E|²인지, 시간 평균 Poynting Vector인지에 따라 의미가 다릅니다. Notebook은 1D Slab의 \u003cstrong>Ey/max|Ey|\u003c/strong>와 그 제곱을 번갈아 보여 줍니다. Slab TE에서는 축 방향 Power Density가 |Ey|²에 비례하지만 일반적인 2D Vector Field의 임의 성분 하나에 같은 해석을 적용할 수는 없습니다.\u003c/p>\u003cp>\u003cstrong>TE\u003c/strong>는 전파 축 z에 대한 Electric Field의 종방향 성분 Ez가 0인 경우, \u003cstrong>TM\u003c/strong>은 Hz가 0인 경우를 뜻합니다. y 방향으로 무한한 Slab에서는 이 분리가 정확히 가능합니다. 이 Notebook의 Slab은 x 방향으로만 제한되며 E가 y 방향인 TE 해를 계산합니다.\u003c/p>\u003cp>반면 실제 Silicon Strip은 x 방향 Width와 y 방향 Height가 모두 유한합니다. 일반적으로 전기장과 자기장의 여러 성분이 섞인 Hybrid Mode가 됩니다. Chip 면을 x–z, 높이를 y로 정의하면 주된 Electric Field가 Chip 면 안에 있는 것을 보통 \u003cstrong>Quasi-TE\u003c/strong>, 주로 수직인 것을 \u003cstrong>Quasi-TM\u003c/strong>이라고 부릅니다. 정확한 정의는 축과 Solver Convention을 함께 확인해야 합니다. Notebook의 Polarization 그림은 이 차이를 보여 주는 Conceptual Illustration입니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"공간 분포와 전파하는 Phase를 분리합니다","scene":"modes","html":"\u003cdiv class='equation'>E(x,y,z,t) = Re{e(x,y) e\u003csup>i(βz − ωt)\u003c/sup>}\u003cspan class='caption'>[R1, R3] 단색·선형·z 불변 Waveguide의 단일 Mode. e: 복소 Field Profile [V/m], β: Propagation Constant [rad/m], z: 거리 [m], ω: Angular Frequency [rad/s], t: 시간 [s].\u003c/span>\u003c/div>\u003cp>e(x,y)는 단면에서의 형태를, 지수 함수는 위치와 시간에 따른 공통 Phase를 나타냅니다. 여기서는 lossless Guided Mode를 다루므로 β를 실수로 둡니다. 실제 손실 구조에서는 진폭의 감쇠도 포함해야 합니다. 여러 Mode를 동시에 여기하면 이 식 하나가 아니라 Mode별 항의 합이 되며, 서로 다른 β 때문에 총 Field Pattern이 z에 따라 달라질 수 있습니다.\u003c/p>\u003cdiv class='worked'>\u003ch3>Worked Example · Field의 부호와 제곱\u003c/h3>\u003cp>어떤 정규화된 Mode에서 두 위치의 Ey가 +0.5와 −0.5라고 합시다. 제곱은 두 곳 모두 0.25입니다. 즉 |Ey|² 그림만으로는 두 곳이 반대 위상이라는 사실을 읽을 수 없습니다. 가운데 Ey = 0인 Node가 있으면 제곱에서도 0이지만, 양·음 Lobe는 모두 양수로 보입니다.\u003c/p>\u003cp>Notebook에서 Width 500 nm, TE₁을 고른 뒤 ‘Signed Field’와 ‘Field²’를 비교하세요. 이 Mode의 중심은 Node입니다. TE₀로 바꾸면 중심에서 가장 큰 같은 부호의 Lobe가 보입니다. 이 차이는 임의로 그린 Gaussian의 개수를 늘려 만든 결과가 아니라 Slab 경계조건을 푼 해입니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>왜 허용된 Mode만 생길까요?\u003c/summary>\u003cp>Core 내부에는 진동하는 해, Cladding에는 감소하는 해가 필요합니다. 양쪽 경계에서 Ey와 그 미분을 함께 맞추려면 임의의 횡 방향 파수가 허용되지 않습니다. 이 동시 조건을 만족하는 값이 Eigenvalue이고, 그 값에 대응하는 Field가 Eigenmode입니다. 수학적으로는 미분 방정식에 경계조건을 부여했기 때문에 생기는 선택입니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"Mode의 개수와 실제 여기되는 빛을 구별합니다","scene":"modes","html":"\u003cp>어떤 Waveguide가 TE₀와 TE₁을 모두 지원한다고 합시다. 그것이 입력과 무관하게 두 Mode에 같은 Power를 넣는다는 뜻일까요?\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"같은 단면에서 서로 다른 허용된 형태를 비교합니다","scene":"modes","html":"\u003cp>Notebook은 nCore = 3.48, nClad = 1.444, λ₀ = 1550 nm인 대칭 Slab을 사용합니다. Width 500 nm에서는 TE₀, TE₁, TE₂가 허용됩니다. Mode를 바꾸어 Node와 Cladding Tail을 비교하고, Signed Field와 Field²의 차이를 관찰하세요.\u003c/p>\u003cp>각 Mode는 보기 쉽게 최대 진폭을 1로 정규화합니다. 따라서 두 그래프의 높이가 같아도 실제 Power가 같다는 뜻은 아닙니다. ‘허용된다’는 것은 가능한 해의 존재이며, 실제로 어떤 Mode에 얼마나 들어가는지는 입력 Field와 Mode의 Overlap에 달려 있습니다. 여기서는 그 Coupling Power를 계산하지 않습니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"모양, Phase, Polarization을 구별해서 읽습니다","scene":"modes","html":"\u003cul>\u003cli>Mode는 전체 경계조건을 만족하며 전파하는 허용된 Field Pattern입니다.\u003c/li>\u003cli>Field의 부호는 Phase 정보입니다. |E|²에는 이 부호가 남지 않습니다.\u003c/li>\u003cli>Slab의 TE/TM과 실제 Strip의 Quasi-TE/Quasi-TM을 구별해야 합니다.\u003c/li>\u003c/ul>\u003cp>허용된 Mode들은 모양뿐 아니라 z 방향의 Phase 변화율도 다릅니다. 다음 Lesson에서 그 변화율을 n_eff로 표현합니다.\u003c/p>"}],"prediction":"TE₁의 Signed Field를 제곱해서 보면 무엇이 사라질까요?","predictionOptions":["먼저 예측을 선택하세요","Field의 양·음 부호 정보가 사라진다","Node가 전부 사라진다","Mode가 Fundamental Mode로 바뀐다"],"predictionFeedback":"제곱하면 부호 정보는 없어지지만 Node는 남습니다. Mode 자체가 바뀌지는 않습니다. 표시하는 물리량이 달라진 것입니다.","reflection":"Mode가 허용된다는 것과 그 Mode가 실제로 여기된다는 것은 어떻게 다를까요?","sources":["R1","R2","R3"],"tutor":{"question":"Waveguide가 TE₀와 TE₁을 지원한다면, 실제 전파 상태에 대해 무엇을 알 수 있을까요?","choices":[{"text":"두 Mode가 반드시 같은 Power로 동시에 전파한다.","feedback":"지원하는 Mode의 수는 가능한 해의 수입니다. 입력 Field의 공간 분포와 Polarization이 각 Mode에 얼마나 겹치는지에 따라 여기되는 Power가 달라집니다. 존재 조건과 여기 조건을 구분해야 합니다.","concept":"Supported Mode와 Excited Mode의 혼동"},{"text":"두 형태가 허용되며, 실제 여기 비율은 입력 Field에 달려 있다.","feedback":"그렇습니다. Mode는 Waveguide가 허용하는 해이고, 입력은 그중 어떤 조합을 만들지 정합니다. 한 Mode만 여기하면 단면의 상대 분포가 유지되지만 여러 Mode의 합은 서로 다른 β 때문에 진행하며 간섭할 수 있습니다.","concept":"Eigenmode와 입력 Overlap 구별","correct":true},{"text":"TE₁의 음수 Field 영역에서는 Power가 뒤로 흐른다.","feedback":"Signed Field의 음수는 같은 기준 순간의 위상 반전을 뜻합니다. 이 Slab의 +z 전파 TE Mode에서 축 방향 평균 Power Density는 |Ey|²에 비례하므로 Field 부호가 바뀐다고 뒤로 흐르지 않습니다.","concept":"Field 부호와 에너지 방향의 혼동"}],"why":"가능한 진동 형태와 실제로 만들어진 진동은 다릅니다. 입력 Field를 허용된 Mode들의 합으로 분해할 때 계수는 각각의 Overlap으로 정해집니다. Mode가 3개 존재해도 대칭과 정렬 때문에 특정 Mode만 여기될 수 있습니다.","simple":"줄이 낼 수 있는 여러 진동 형태와 실제 손으로 만든 진동을 구별해 보세요. 가능한 형태가 여러 개라고 항상 모든 형태가 같은 세기로 섞이는 것은 아닙니다. Waveguide도 입력 모양이 중요합니다.","math":"E = Σ aₘ eₘ exp[i(βₘz − ωt)]로 씁니다. eₘ은 각 Mode의 Profile이고 aₘ은 여기 계수입니다. 서로 다른 βₘ의 Phase 차이가 z에 따라 달라집니다. 정규화 방식과 전체 Vector Field에 맞는 Overlap 적분이 필요하며, 이 Notebook은 aₘ을 계산하지 않습니다.","notebook":"TE₀와 TE₁을 비교해 Node를 찾아 보세요. Field²로 바꾸면 양·음 Lobe가 모두 양수가 됩니다. Polarization 개념도에서는 유한한 Width/Height와 주된 Field 방향을 확인하세요. 그 그림은 2D Mode Solver 결과가 아닙니다."}},{"id":"1.3","short":"Effective Index","title":"Understanding Effective Index","time":"6–9분","lead":"단면의 Mode가 앞으로 진행할 때, 단위 길이당 Phase가 얼마나 변하는지 수식으로 읽습니다.","question":"동일한 재료로 만든 두 Waveguide의 Phase가 서로 다르게 쌓일 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"간섭을 설계하려면 Phase를 알아야 합니다","scene":"phase","html":"\u003cp>같은 Laser의 빛을 두 경로로 나눴다가 합치면 두 Wave의 Phase 차이에 따라 밝기가 달라집니다. 두 경로가 모두 Silicon이어도 길이나 단면이 다르면 Phase가 다르게 쌓일 수 있습니다. 이것이 나중에 MZI와 MZM을 이해하는 출발점입니다.\u003c/p>\u003cp>단면에서 Field가 어떻게 분포하는지는 Lesson 1.2에서 배웠습니다. 이제 그 Mode가 z 방향으로 얼마나 빠르게 Phase를 누적하는지를 나타낼 숫자가 필요합니다. 그 숫자가 \u003cstrong>Propagation Constant β\u003c/strong>이고, 이를 익숙한 굴절률 형태로 표현한 것이 \u003cstrong>Effective Index n_eff\u003c/strong>입니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"n_eff는 재료 상수가 아니라 Mode의 성질입니다","scene":"phase","html":"\u003cp>단일 Mode의 Phase Factor는 exp[i(βz − ωt)]입니다. 같은 순간 두 위치를 비교하면 z가 L만큼 증가할 때 Phase는 βL만큼 달라집니다. β는 거리 1에 대응하는 Phase 변화량이므로 단위는 rad/m입니다. 실무에서는 rad/µm도 자주 사용합니다.\u003c/p>\u003cp>진공에서의 파수 \u003cstrong>k₀ = 2π/λ₀\u003c/strong>와 비교하여 n_eff = β/k₀라고 정의합니다. 따라서 n_eff는 ‘이 Mode의 축 방향 Phase 변화율이 진공 Plane Wave의 몇 배인가’를 나타냅니다. 같은 재료라도 Width, Height, Cladding, Wavelength와 Mode가 바뀌면 경계조건의 해가 달라지고 n_eff도 달라집니다.\u003c/p>\u003cp>보통의 lossless Index-guided 유전체 구조에서는 Guided Mode의 n_eff가 Cladding 쪽 최대 n과 Core n 사이에 있습니다. 이것을 보고 Core와 Cladding의 굴절률을 단순 평균한 값이라고 해석하면 안 됩니다. n_eff는 공간적인 Power 비율만으로 정해지는 평균이 아니라 경계조건의 Eigenvalue β를 다시 표현한 것입니다.\u003c/p>\u003cp>또한 c/n_eff는 이 Mode의 \u003cstrong>Phase Velocity\u003c/strong>입니다. 짧은 Pulse의 도달 시간에는 Frequency에 따른 β의 변화, 즉 Group Velocity가 필요합니다. n_eff 하나만 알고 모든 Pulse Delay를 계산할 수는 없습니다. 이번 Notebook은 단색 Phase를 다룹니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Wavelength, β, Phase를 같은 단위로 연결합니다","scene":"phase","html":"\u003cdiv class='equation'>n\u003csub>eff\u003c/sub> = β / k₀\u003cbr>β = 2πn\u003csub>eff\u003c/sub> / λ₀\u003cbr>φ = βL\u003cbr>λ\u003csub>g\u003c/sub> = 2π/β = λ₀/n\u003csub>eff\u003c/sub>\u003cspan class='caption'>[R3, R4] 단색·균일 단면·단일 Mode·실수 β. φ는 z = 0에서 L까지의 Phase 누적량이며 기준 Phase는 생략합니다. λg는 축 방향의 Guided Wavelength입니다.\u003c/span>\u003c/div>\u003cdl class='terms'>\u003cdt>λ₀, λg, L\u003c/dt>\u003cdd>Free-space / Guided Wavelength와 전파 길이 · 같은 길이 단위 사용\u003c/dd>\u003cdt>k₀, β\u003c/dt>\u003cdd>진공 파수와 축 방향 Propagation Constant · rad/m 또는 rad/µm\u003c/dd>\u003cdt>φ, n_eff\u003c/dt>\u003cdd>Phase [rad], Effective Index [무차원]\u003c/dd>\u003c/dl>\u003cdiv class='worked'>\u003ch3>Worked Example · 10 µm를 진행한 Mode\u003c/h3>\u003cp>λ₀ = 1550 nm = 1.55 µm, \u003cem>가정한\u003c/em> n_eff = 2.40, L = 10 µm입니다. 이 n_eff는 특정 Strip 단면을 새로 풀어 얻은 값이 아닙니다.\u003c/p>\u003cp>① β = 2π × 2.40 / 1.55 ≈ \u003cstrong>9.729 rad/µm\u003c/strong>\u003cbr>② φ = 9.729 × 10 ≈ \u003cstrong>97.288 rad\u003c/strong>\u003cbr>③ λg = 1.55 / 2.40 ≈ \u003cstrong>0.646 µm\u003c/strong>\u003cbr>④ φ/(2π) ≈ \u003cstrong>15.484 cycles\u003c/strong>\u003c/p>\u003cp>빛이 10 µm 가는 동안 축 방향 Phase가 약 15.48번 회전했다는 뜻입니다. 97 rad가 크다고 Power가 커지는 것은 아닙니다. 길이를 두 배로 하면 이 가정 아래에서는 누적 Phase도 두 배가 됩니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>왜 2π로 나눈 나머지도 보나요?\u003c/summary>\u003cp>Phase가 2π만큼 달라지면 단색 Wave의 같은 진동 상태로 돌아옵니다. 두 경로를 비교할 때는 전체 Optical Path 변화도 중요하지만, 합친 순간의 상대 Phase는 2π를 기준으로 반복됩니다. Notebook의 원은 φ mod 2π를 보여 주고 전체 Cycle 수는 따로 표시합니다. 원의 화살표는 실제 광속으로 움직이는 Animation이 아닙니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"n_eff가 커진다는 말을 정확하게 해석합니다","scene":"phase","html":"\u003cp>같은 λ₀와 같은 길이에서 n_eff가 커졌습니다. 이 변화로 확실히 말할 수 있는 것은 무엇일까요?\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"길이가 아니라 Phase를 예측합니다","scene":"phase","html":"\u003cp>먼저 L을 10 µm에서 20 µm로 늘릴 때 β와 φ가 각각 어떻게 될지 예측하세요. Notebook에서 길이를 바꾸고 계산 과정을 확인합니다. 다음으로 길이를 고정하고 가정한 n_eff를 바꾸어 보세요. β가 바뀌고 Guided Wavelength가 줄어드는지 확인할 수 있습니다.\u003c/p>\u003cp>응용으로 두 경로의 n_eff 차이가 0.01이고 공통 길이가 10 µm라면, Δφ = (2π/1.55) × 0.01 × 10 ≈ \u003cstrong>0.405 rad\u003c/strong>입니다. 작아 보이는 Δn_eff도 충분한 길이에서 의미 있는 Phase Difference가 됩니다. MZM은 전압으로 이런 차이를 조절해 간섭 출력을 바꾸지만, 이번 Chapter에서는 그 능동 소자를 구현하지 않습니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"n_eff는 단위 길이당 Phase의 언어입니다","scene":"phase","html":"\u003cul>\u003cli>n_eff는 β를 k₀로 나눈 Mode의 성질이며 단순한 재료 평균이 아닙니다.\u003c/li>\u003cli>φ = βL이며, β를 rad/µm로 쓰면 L도 µm로 써야 합니다.\u003c/li>\u003cli>Guided Wavelength와 Free-space Wavelength, Phase Velocity와 Group Velocity를 구분합니다.\u003c/li>\u003c/ul>\u003cp>다음에는 단면 Geometry를 바꾸어 n_eff와 허용된 Mode의 수가 함께 달라지는 이유를 살펴봅니다.\u003c/p>"}],"prediction":"같은 n_eff와 λ₀에서 L을 10 → 20 µm로 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","β는 같고 φ는 두 배가 된다","β와 φ가 모두 두 배가 된다","n_eff가 길이에 비례해 증가한다"],"predictionFeedback":"β는 Mode와 Wavelength의 성질이므로 그대로입니다. 길이 L만 두 배가 되어 φ = βL이 두 배가 됩니다. Geometry와 재료가 z에 따라 변하는 경우에는 적분이 필요합니다.","reflection":"n_eff를 처음 배우는 동료에게 재료 굴절률과의 차이 및 Phase 계산에서의 역할을 설명해 보세요.","sources":["R3","R4"],"tutor":{"question":"같은 λ₀와 L에서 n_eff가 커졌습니다. 무엇을 확실히 말할 수 있을까요?","choices":[{"text":"축 방향 Phase 누적량이 커지고 Guided Wavelength가 짧아진다.","feedback":"맞습니다. β = 2πn_eff/λ₀이 커져 같은 L에서 φ가 더 크게 쌓입니다. λg = λ₀/n_eff는 짧아집니다. Power가 커지거나 Pulse가 반드시 더 늦게 도착한다고 이 정보만으로 결론 내릴 수는 없습니다.","correct":true,"concept":"축 방향 Phase 변화율"},{"text":"Core 안의 Power 비율을 알면 n_eff를 항상 가중평균으로 계산할 수 있다.","feedback":"n_eff는 경계조건을 만족하는 β에서 정의합니다. 단순한 Core/Cladding Power 가중평균 공식은 일반적으로 성립하지 않습니다. Notebook의 n_eff는 가정한 입력이며 어떤 Power 비율에서 추정한 값이 아닙니다.","concept":"Effective Index의 단순 평균 오개념"},{"text":"n_eff만으로 짧은 Pulse의 도달 시간을 정확하게 계산할 수 있다.","feedback":"단색 Phase와 Pulse Envelope의 전파는 다릅니다. Pulse에는 dβ/dω로 결정되는 Group Velocity가 필요합니다. β가 Frequency에 따라 어떻게 변하는지 모르면 n_eff 하나만으로 정확한 Group Delay를 구할 수 없습니다.","concept":"Phase와 Group Velocity의 혼동"}],"why":"동일한 L 안에 더 많은 Phase Cycle이 들어가면 축 방향 Wavelength는 짧아집니다. n_eff는 바로 그 변화율을 진공에 대한 비율로 표현합니다. 이 정의는 입력 Power를 필요로 하지 않습니다.","simple":"10 µm 길이에 물결 무늬가 몇 번 들어가는지 생각해 보세요. n_eff가 크면 같은 거리에 더 많은 주기가 들어갑니다. 이 ‘물결 간격’의 설명과 Pulse 전체가 이동하는 속도는 다른 질문입니다.","math":"φ = (2π/λ₀)n_eff L이므로 고정 λ₀, L에서 ∂φ/∂n_eff = 2πL/λ₀ > 0입니다. λg = λ₀/n_eff이므로 ∂λg/∂n_eff \u003c 0입니다. Group Index는 n_g = n_eff − λ₀(dn_eff/dλ₀)이며 이번 고정 입력 계산으로 그 미분은 얻을 수 없습니다.","notebook":"λ₀ = 1550 nm, L = 10 µm에서 n_eff를 2.40 → 2.60으로 바꾸세요. 전체 Cycle 수와 Phase 원을 함께 보세요. 원이 반복되어도 전체 누적 Phase는 계속 증가합니다. 이 입력은 실제 Strip Solver의 결과를 뜻하지 않습니다."}}],"sourceHash":"25a3b5bd128b2a2e864a0531bd4a61e496fa6dab790d08df86587dcb07958f36"};</script>
  <script>/* Original educational models. SI conversions are explicit at the boundaries. */
(function(root) {
  'use strict';
  function criticalAngle(nCore=3.48, nClad=1.444) {
    if (!(nCore > nClad && nClad > 0)) throw new RangeError('Require nCore > nClad > 0');
    return Math.asin(nClad/nCore)*180/Math.PI;
  }
  function phase(neff, lambdaNm, lengthUm) {
    if (!(neff>0 && lambdaNm>0 && lengthUm>=0)) throw new RangeError('Invalid phase inputs');
    const lambdaUm=lambdaNm/1000, beta=2*Math.PI*neff/lambdaUm;
    return {beta, phi:beta*lengthUm, cycles:neff*lengthUm/lambdaUm, guidedUm:lambdaUm/neff};
  }
  function slabTE(widthNm=500, lambdaNm=1550, nCore=3.48, nClad=1.444) {
    if (!(widthNm>0 && lambdaNm>0 && nCore>nClad && nClad>0)) throw new RangeError('Invalid slab inputs');
    // x confinement with |x|<=a, infinite y, propagation +z; electric field Ey.
    const a=widthNm/2000, k0=2*Math.PI/(lambdaNm/1000);
    const V=k0*a*Math.sqrt(nCore*nCore-nClad*nClad), modes=[];
    for(let m=0;m<256 && m*Math.PI/2<V-1e-10;m++) {
      const lower=m*Math.PI/2;
      let lo=lower, hi=Math.min(V,lower+Math.PI/2);
      // u = m*pi/2 + atan(sqrt(V^2-u^2)/u); strictly increasing residual.
      for(let j=0;j<80;j++) {
        const u=(lo+hi)/2, w=Math.sqrt(Math.max(0,V*V-u*u));
        if(u-lower-Math.atan2(w,u)>0) hi=u; else lo=u;
      }
      const u=(lo+hi)/2, w=Math.sqrt(Math.max(0,V*V-u*u));
      const h=u/a, q=w/a, beta=Math.sqrt((nClad*k0)**2+q*q), neff=beta/k0;
      const even=m%2===0, edge=even?Math.cos(u):Math.sin(u);
      const inside=a*(1+(even?1:-1)*Math.sin(2*u)/(2*u)), outside=edge*edge/q;
      modes.push({m,u,w,h,q,beta,neff,a,V,even,corePower:inside/(inside+outside)});
    }
    return {widthNm,lambdaNm,nCore,nClad,V,a,k0,modes};
  }
  function slabField(mode,xUm) {
    const {a,u,q,even}=mode, ax=Math.abs(xUm);
    if(ax<=a) return even?Math.cos(u*xUm/a):Math.sin(u*xUm/a);
    const edge=even?Math.cos(u):Math.sin(u)*(xUm<0?-1:1);
    return edge*Math.exp(-q*(ax-a));
  }
  root.Photonics = {criticalAngle, phase, slabTE, slabField};
})(globalThis);
</script>
  <script>(function(){
'use strict';
const {lessons}=TEXTBOOK, P=Photonics, $=s=>document.querySelector(s), key='sipt-ch1-v1';
const defaults=()=>({version:1,lesson:lessons[0].id,theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',positions:{},notes:{},answers:{},extras:{},predictions:{},settings:{},completed:[]});
let state=defaults(), storageOK=true, observer, navigating=false, scrollTimer;
try{const stored=localStorage.getItem(key);if(stored)state=validate(JSON.parse(stored));}catch(e){storageOK=false;}
function validate(v){
 if(!v||v.version!==1||!lessons.some(l=>l.id===v.lesson))throw Error('이 Chapter와 호환되는 version 1 기록이 아닙니다.');
 const clean=defaults();clean.lesson=v.lesson;clean.theme=v.theme==='dark'?'dark':'light';
 for(const id of lessons.map(l=>l.id)){
  clean.positions[id]=Math.max(0,Math.min(100000,Number(v.positions?.[id])||0));
  const l=lessons.find(l=>l.id===id), a=v.answers?.[id];if(Number.isInteger(a)&&a>=0&&a<l.tutor.choices.length)clean.answers[id]=a;
  if(['why','simple','math','notebook'].includes(v.extras?.[id]))clean.extras[id]=v.extras[id];
  const pred=v.predictions?.[id];if(Number.isInteger(pred)&&pred>=0&&pred<l.predictionOptions.length)clean.predictions[id]=pred;
  for(const type of ['reflection','prediction','explanation']){const n=v.notes?.[id+':'+type];if(typeof n==='string')clean.notes[id+':'+type]=n.slice(0,12000);}
  clean.settings[id]={};for(const [k,val] of Object.entries(v.settings?.[id]||{})){if(typeof val==='number'&&Number.isFinite(val))clean.settings[id][k]=Math.max(-100000,Math.min(100000,val));if(['signed','intensity','modes','polarization'].includes(val))clean.settings[id][k]=val;}
 }
 clean.completed=Array.isArray(v.completed)?v.completed.filter(id=>lessons.some(l=>l.id===id)):[];return clean;
}
function save(){try{localStorage.setItem(key,JSON.stringify(state));storageOK=true;}catch{storageOK=false;}$('#save-status').textContent=storageOK?'이 기기에 자동 저장됨':'저장 불가 · 학습 기록에서 내보내세요';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function current(){return lessons.find(l=>l.id===state.lesson)||lessons[0];}
function settings(){return state.settings[state.lesson]||(state.settings[state.lesson]={});}
function num(k,def,min,max){const v=settings()[k];return typeof v==='number'&&Number.isFinite(v)?Math.max(min,Math.min(max,v)):def;}
function setTheme(){document.documentElement.dataset.theme=state.theme;$('#theme').textContent=state.theme==='dark'?'Light':'Dark';$('#theme').setAttribute('aria-label',`${state.theme==='dark'?'Light':'Dark'} Theme로 전환`);}
function position(){return matchMedia('(max-width:760px)').matches?window.scrollY:$('#reading').scrollTop;}

function setupObserver(){const root=matchMedia('(max-width:760px)').matches?null:$('#reading');observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible[0]){const section=visible[0].target;$('#notebook-context').textContent=`지금 읽는 절 · ${section.querySelector('h2').textContent}`;$('#notebook').dataset.scene=section.dataset.scene;}},{root,rootMargin:'-5% 0px -55% 0px',threshold:[0,.1,.3]});document.querySelectorAll('[data-section]').forEach(el=>observer.observe(el));}

function shell(type,title,body,detail){return `<div class="notebook-top"><h2>Physics Notebook</h2><span class="model-type">${type}</span></div><p class="notebook-intro">예측을 남기고 결과를 살펴보세요. 관찰한 변화가 본문의 어떤 원리에서 나왔는지 연결합니다.</p><div class="notebook-sheet"><h3 class="scene-title">${title}</h3>${body}</div><details class="model-details"><summary>모델의 가정 · 단위 · 한계</summary>${detail}</details><p class="notebook-context" id="notebook-context">본문을 읽으면 현재 절과 연결됩니다.</p><a class="return-reading" href="#section-experiment">실험 본문으로 돌아가기 ↑</a>`;}
function slider(id,label,value,min,max,step,unit){return `<div class="controls"><label class="control-row" for="${id}"><span>${label}</span><output id="${id}-value" for="${id}">${value} ${unit}</output></label><input id="${id}" data-setting="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"><div class="range-bounds"><span>${min} ${unit}</span><span>${max} ${unit}</span></div></div>`;}

function renderAdvancedNotebook(l){
 if(l.id==='1.2'){
  const view=settings().view==='polarization'?'polarization':'modes';
  $('#notebook').innerHTML=shell(view==='modes'?'Analytical · Slab TE':'Conceptual','Mode의 공간적 형태',`<div class="segmented"><button data-view="modes" aria-pressed="${view==='modes'}">Slab Mode</button><button data-view="polarization" aria-pressed="${view==='polarization'}">TE / TM 개념</button></div><div id="notebook-plot"></div><div id="mode-buttons" class="segmented"></div><div id="field-toggle" class="segmented"><button data-field="signed">Signed Field</button><button data-field="intensity">Field²</button></div><div class="readout" id="notebook-readout" role="status"></div>`,`<p>Slab: x 방향 Width d = 500 nm, y 방향 무한, z 방향 전파. λ₀ = 1550 nm, nCore = 3.48, nClad = 1.444. Ey인 TE만 풉니다. 유한한 Height의 Strip Mode가 아닙니다.</p><p>해석적으로 유도한 Slab 고유방정식을 80회 Bisection으로 풉니다. 그래프는 실제 1D 해의 성분 Ey 또는 Ey²이며 최대 진폭 1로 정규화합니다. 수치 근 찾기는 Full-vector Simulation 또는 실측 검증을 의미하지 않습니다.</p><p>Polarization 그림은 Conceptual이며 화살표 크기는 실제 Field 세기를 뜻하지 않습니다.</p>`);

function updateNotebook(){
 if(current().id!=='1.1'){updateAdvancedNotebook();return;}
 const theta=num('angle',45,5,80), tc=P.criticalAngle(),tir=theta>tc, rad=theta*Math.PI/180;
 $('#angle-value').textContent=theta+' °';
 const x=240,y=150,len=130,s=Math.sin(rad),c=Math.cos(rad),ratio=3.48/1.444*s;
 const transmit=tir?`<path d="M110 126 Q240 110 370 126" stroke="var(--plot)" fill="none" stroke-width="2" stroke-dasharray="4 5"/><text x="274" y="90">Evanescent field</text>`:(()=>{const t=Math.asin(ratio);return `<path class="ray" d="M${x} ${y} L${x+120*Math.sin(t)} ${y-120*Math.cos(t)}"/><text x="330" y="79">Refracted ray</text>`;})();
 $('#notebook-plot').innerHTML=svg(`Normal 기준 입사각 ${theta}도. ${tir?'TIR, Cladding에 Evanescent Field 존재':'전파하는 굴절파 존재'}`,`<rect class="core" x="20" y="150" width="460" height="150" rx="5"/><line class="axis" x1="20" y1="150" x2="480" y2="150"/><line x1="240" x2="240" y1="45" y2="300" stroke="var(--muted)" stroke-dasharray="5 5"/><text x="252" y="40">Normal</text><text x="30" y="57">SiO₂ · n₂ = 1.444</text><text x="30" y="285">Si · n₁ = 3.48</text><path class="ray" d="M${x-len*s} ${y+len*c} L${x} ${y} L${x+len*s} ${y+len*c}"/>${transmit}<circle cx="240" cy="150" r="4" fill="var(--warm)"/><text x="155" y="211">θ₁ = ${theta}°</text><text x="300" y="252">Reflected ray</text>`);
 $('#notebook-readout').innerHTML=`<p>Critical Angle θc = <strong>${tc.toFixed(2)}°</strong></p><p>${tir?`θ₁ &gt; θc → <strong>TIR 조건을 만족합니다</strong>`:`θ₁ &lt; θc → 굴절각 θ₂ = <strong>${(Math.asin(ratio)*180/Math.PI).toFixed(1)}°</strong>`}</p><p class="caption">${tir?'바깥으로 진행하는 굴절파는 없지만 경계의 Field는 사라지지 않습니다.':'일부 빛이 Cladding으로 전파할 수 있습니다. 반사되는 성분도 존재합니다.'}</p>`;
}
function fieldPlot(model,mode,kind='signed'){
 const extent=Math.max(.8,model.a+.35), left=49,right=475,top=45,bottom=245,mid=(top+bottom)/2;
 const X=x=>left+(x+extent)/(2*extent)*(right-left),Y=e=>kind==='intensity'?bottom-170*e:mid-85*e;
 const values=Array.from({length:501},(_,i)=>{const x=-extent+2*extent*i/500,e=P.slabField(mode,x);return `${i?'L':'M'}${X(x).toFixed(2)} ${Y(kind==='intensity'?e*e:e).toFixed(2)}`;}).join(' ');
 const ticks=[-extent,-model.a,0,model.a,extent].filter((v,i,a)=>!i||v-a[i-1]>.05);
 return svg(`1D symmetric Slab TE${mode.m}, ${kind==='intensity'?'normalized Ey squared':'normalized signed Ey'} versus x in micrometers`, `<rect class="core" x="${X(-model.a)}" y="${top}" width="${X(model.a)-X(-model.a)}" height="${bottom-top}"/><text x="${X(-model.a)+5}" y="34">Si Core</text><text x="340" y="34">SiO₂</text><line class="axis" x1="${left}" x2="${right}" y1="${Y(0)}" y2="${Y(0)}"/><line class="axis" x1="${left}" x2="${left}" y1="${top}" y2="${bottom}"/><path class="field" d="${values}"/>${ticks.map(x=>`<line class="axis" x1="${X(x)}" x2="${X(x)}" y1="${bottom}" y2="${bottom+5}"/><text x="${X(x)}" y="${bottom+24}" text-anchor="middle">${x.toFixed(2)}</text>`).join('')}<text x="12" y="65">1</text><text x="8" y="${Y(0)+5}">0</text>${kind==='signed'?'<text x="4" y="235">−1</text>':''}<text x="245" y="301" text-anchor="middle">x (µm) · ${kind==='intensity'?'Ey² / max|Ey|²':'Ey / max|Ey|'}</text>`);
}

  }else{

  }
 }else if(l.id==='1.3'){
  const n=num('neff',2.4,1.5,3.4),L=num('length',10,0,20),p=P.phase(n,1550,L),angle=p.phi%(2*Math.PI);

  const path=Array.from({length:801},(_,i)=>{const z=i/800*3.1;return `${i?'L':'M'}${(42+z/3.1*420).toFixed(2)} ${(95-38*Math.cos(p.beta*z)).toFixed(2)}`;}).join(' ');
  $('#notebook-plot').innerHTML=svg('Normalized real field cos beta z for first 3.1 micrometers and phase modulo 2 pi at selected length',`<line class="axis" x1="42" x2="462" y1="95" y2="95"/><path class="curve" d="${path}"/><text x="30" y="40">Re(E) / E₀ · first 3.1 µm</text><text x="42" y="155">0</text><text x="427" y="155">3.1 µm</text><circle cx="112" cy="237" r="45" stroke="var(--line)" fill="none"/><path class="curve" d="M112 237 L${112+42*Math.cos(angle)} ${237-42*Math.sin(angle)}"/><text x="185" y="226">φ mod 2π = ${angle.toFixed(3)} rad</text><text x="185" y="252">${p.cycles.toFixed(3)} cycles in ${L.toFixed(1)} µm</text><text x="30" y="310">λg = ${(p.guidedUm*1000).toFixed(1)} nm</text>`);
  $('#notebook-readout').innerHTML=`<p>β = 2π × ${n.toFixed(2)} / 1.55 = <strong>${p.beta.toFixed(3)} rad/µm</strong></p><p>φ = ${p.beta.toFixed(3)} × ${L.toFixed(1)} = <strong>${p.phi.toFixed(3)} rad</strong></p><p>λg = 1.55 / ${n.toFixed(2)} = <strong>${p.guidedUm.toFixed(3)} µm</strong></p><p class="caption">위 그래프는 같은 길이의 확대 구간입니다. L만 바꾸면 β와 물결 간격은 그대로이고 누적 Phase만 변합니다.</p>`;
 }else updateEngineeringNotebook();
}

$('#reading').addEventListener('change',e=>{if(e.target.id==='prediction'){state.predictions[state.lesson]=Number(e.target.value);$('#prediction-feedback').textContent='';save();}});
$('#notebook').addEventListener('input',e=>{if(e.target.dataset.setting){settings()[e.target.dataset.setting]=Number(e.target.value);updateNotebook();save();}});
$('#notebook').addEventListener('change',e=>{if(e.target.dataset.selectSetting){settings()[e.target.dataset.selectSetting]=e.target.value;updateNotebook();save();}});
$('#notebook').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){settings().view=b.dataset.view;renderNotebook();save();}const f=e.target.closest('[data-field]');if(f){settings().field=f.dataset.field;updateNotebook();save();}const m=e.target.closest('[data-mode]');if(m){settings().mode=Number(m.dataset.mode);updateNotebook();save();}});
function onScroll(){if(navigating)return;clearTimeout(scrollTimer);scrollTimer=setTimeout(remember,250);}
$('#reading').addEventListener('scroll',onScroll,{passive:true});window.addEventListener('scroll',onScroll,{passive:true});window.addEventListener('pagehide',remember);
matchMedia('(max-width:760px)').addEventListener('change',()=>{placeNotebook();setupObserver();});
$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';setTheme();save();};
$('.brand').onclick=e=>{e.preventDefault();remember();state.lesson=lessons[0].id;state.positions[state.lesson]=0;save();renderLesson(true);};
$('#session').onclick=showSession;$('#close-session').onclick=()=>$('#session-dialog').close();
$('#export').onclick=()=>{remember();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='silicon-photonics-ch1-study-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('#import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error('1 MB 이하의 학습 기록을 선택해 주세요.');const clean=validate(JSON.parse(await file.text()));state=clean;setTheme();save();renderLesson();$('#import-status').textContent='학습 기록을 불러왔습니다.';}catch(err){$('#import-status').textContent='가져오지 못했습니다. '+err.message;}e.target.value='';};
setTheme();renderLesson();save();
})();
</script>
</body>
</html>
