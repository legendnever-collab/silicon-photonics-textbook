누어 생각해 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Mode 크기부터 비교한 뒤 위치를 바꿉니다","scene":"io","html":"\u003cp>Notebook에서 w₁=5.2 µm, w₂=2.0 µm와 5.2 µm를 차례로 비교하세요. Figure의 두 Map은 동일한 Unit-power 정규화를 사용하며 표시에는 공통 Intensity Scale의 제곱근을 사용합니다. 밝기의 차이를 실제 Laser Power 차이로 읽으면 안 됩니다. 두 Profile의 전체 Power는 같습니다.\u003c/p>\u003cp>다음 Δx를 0에서 2 µm로 옮겨 Overlap을 비교합니다. 한 Profile이 옮겨져도 그 자체의 정규화는 바뀌지 않습니다. 먼저 예측을 기록하고, ηsize와 Offset Factor가 어떻게 곱해지는지 확인하세요. 이 Lesson은 Diffraction Propagation이나 Facet 재료 경계의 Vector 해를 계산하지 않습니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"잘 도착하는 것과 잘 결합하는 것은 다릅니다","scene":"io","html":"\u003cul>\u003cli>Core Geometry와 Mode Field 크기를 구별했습니다.\u003c/li>\u003cli>Overlap은 정규화된 Complex Field의 투영이며 Power는 그 크기의 제곱입니다.\u003c/li>\u003cli>같은 중심에서도 크기·Phase·Polarization이 맞아야 합니다.\u003c/li>\u003cli>총 Interface Efficiency에는 Reflection과 다른 손실 채널이 추가됩니다.\u003c/li>\u003c/ul>\u003cp>다음에는 Chip의 윗면에서 들어오는 Field를 Guided Mode로 연결하는 Grating Coupler를 봅니다. 왜 Period와 Fiber Angle을 함께 정해야 하는지 Chapter 2의 Phase 개념을 이용해 설명하겠습니다.\u003c/p>"}],"prediction":"같은 중심에서 Target 반경을 2.0→5.2 µm로 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","이 Gaussian 모델의 Size Overlap이 1에 가까워진다","Core 중심이 같으므로 처음부터 언제나 1이다","Profile의 전체 Power가 자동으로 증가한다"],"predictionFeedback":"두 반경이 같을 때 정규화된 Profile이 같아져 ηsize=1입니다. 전체 Power가 증가한 것이 아니며 실제 Device의 Reflection/Taper Loss를 없앴다는 뜻도 아닙니다.","reflection":"정렬은 같지만 크기가 다른 두 Mode의 Overlap과 실제 Coupling Efficiency를 구별해 설명해 보세요.","sources":["I0","I1","I2"],"tutor":{"question":"정렬된 두 Scalar Profile의 Overlap이 1입니다. 무엇을 결론 내릴 수 있나요?","choices":[{"text":"실제 Fiber–Silicon Interface도 모든 손실 없이 100% 결합한다.","feedback":"Overlap은 명시한 공통 평면·매질의 두 Profile에 대한 결과입니다. 실제 Facet의 Impedance/Reflection, Mode Conversion, Taper Loss와 Polarization은 따로 확인해야 합니다.","concept":"Overlap과 장치 효율의 혼동"},{"text":"주어진 정규화 Profile의 공간·Phase 일치는 완벽하며, 실제 장치의 나머지 채널은 별도다.","feedback":"맞습니다. Scalar η는 Profile 투영의 한 부분입니다. 실제 총 효율에 적용하려면 같은 조건인지와 Vector/Fresnel/다른 채널의 처리를 확인해야 합니다.","concept":"모델 범위와 채널","correct":true},{"text":"Field를 두 배로 키우면 정규화 Overlap도 항상 네 배로 증가한다.","feedback":"정규화 Overlap은 입력과 Target의 Power로 나누므로 공통 Amplitude 크기에 의존하지 않습니다. 실제 결합 Power는 정규화 Efficiency에 입력 Power를 곱한 값입니다.","concept":"정규화 Efficiency와 절대 Power 혼동"}],"why":"기저 투영은 Field의 유사성을 정규화해 계산합니다. Cauchy–Schwarz 부등식으로 0≤|∫ψ₂*ψ₁|²≤1입니다. 실제 다른 재료 경계에서 어떤 Field가 만들어지는지는 이 적분만으로 풀지 않습니다.","simple":"입구의 모양과 들어오는 무늬가 잘 맞는지를 먼저 따지는 계산입니다. 잘 맞아도 입구에서 반사되거나 연결부에서 다른 Mode가 생길 수 있으므로 실제 장치 효율은 별도로 봐야 합니다.","math":"각 Profile의 ∫|ψ|²=1이면 η=|∫ψ₂*ψ₁|²입니다. 중심 정렬 Gaussian의 적분은 2w₁w₂/(w₁²+w₂²)이므로 η는 그 제곱입니다. 공통 exp(iχ)의 절댓값은 1이므로 η에 영향이 없습니다.","notebook":"반경을 같게 한 뒤 Δx만 바꾸세요. η가 줄어도 각 Map의 전체 Power는 1입니다. 크기 Slider를 실제 Silicon Tip Width로 읽지 말고 주어진 Scalar Profile의 반경으로 읽어 주세요."}},{"id":"3.2","short":"Grating Coupler","title":"Surface Grating Couplers and Phase Matching","time":"15–25분","lead":"주기 구조가 추가하는 Spatial Momentum으로 바깥 Field와 Guided Field의 Phase를 연결합니다. Phase가 맞는 조건과 높은 효율을 만드는 조건을 따로 배웁니다.","question":"왜 Grating Period만 바꾸어도 Fiber가 바라보는 각도와 결합 파장이 달라질까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"윗면에서 Chip에 접근하는 방법","scene":"io","html":"\u003cp>Surface Grating Coupler는 Chip 윗면 근처의 주기 구조를 이용해 외부 Optical Field와 Guided Mode를 연결합니다. Fiber를 위에서 놓을 수 있어 입출력 위치와 Wafer-level 접근을 설계할 여지가 생깁니다. 그러나 주기 구조가 있다는 사실만으로 빛이 원하는 방향과 원하는 Mode에 잘 결합하는 것은 아닙니다.\u003c/p>\u003cp>원본 §5.2는 성능 지표, 이론, 설계 방법, 실험 순서로 이어집니다. 이번 Lesson도 먼저 무엇을 Efficiency로 부르는지 정하고, 그 다음 Phase Matching을 계산한 뒤 실제 설계에서 더 필요한 항목을 정리합니다. 본문은 Grating을 반사 필터로 사용했던 Chapter 2와 직접 연결됩니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Period는 Phase를 맞추고, 구조는 나머지 채널을 정합니다","scene":"io","html":"\u003cp>Guided Field는 축 z를 따라 exp(iβgz)로 Phase를 누적합니다. 외부로 나가는 Plane Wave의 z 방향 성분은 kparallel=k₀nclad sinθ입니다. 여기서 θ는 \u003cstrong>Chip Surface Normal\u003c/strong>에서 잰 각도입니다. 이 두 Phase 누적이 다르면 긴 영역의 산란 기여가 상쇄될 수 있습니다. Grating은 Spatial Frequency G=2π/Λ를 제공하여 그 차이를 맞춥니다.\u003c/p>\u003cp>이번에는 전파 +z, 시간 exp(−iωt), 위쪽으로 나가는 Field의 +z 성분을 양으로 정합니다. 1차 조건은 βg−kparallel=G입니다. Fiber를 반대쪽으로 기울이거나 반대 방향 Guided Mode를 쓰면 부호를 일관되게 바꿔야 합니다. 단순히 sinθ의 절댓값을 넣으면 원래 정의와 다른 설계가 됩니다.\u003c/p>\u003cp>\u003cstrong>Grating 영역의 Effective Phase Index ngrat\u003c/strong>는 그 주기 구조 안의 전파를 근사하는 입력입니다. 이전 Chapter의 고정된 Strip neff와 자동으로 같은 값이 아니며 Group Index도 아닙니다. 이 Notebook은 ngrat를 Geometry에서 풀지 않습니다. 주어진 값에서 Period, 각도, 파장 관계만 계산합니다.\u003c/p>\u003cp>\u003cstrong>성능 지표.\u003c/strong> Coupling Efficiency는 원하는 외부/Guided Mode로 가는 Power 비율입니다. Directionality는 전체 방사 중 원하는 위쪽 방향으로 향하는 비율이며, Mode Overlap은 방사된 Field가 Fiber Mode와 맞는 정도입니다. 반사, 아래쪽 누설, 불완전한 산란과 연결부 손실도 영향을 줍니다. 따라서 Phase Matching의 만족이 Efficiency=1을 보장하지 않습니다. Bandwidth와 Return Loss 역시 별도의 성능입니다.\u003c/p>\u003cp>\u003cstrong>Uniform Array Model.\u003c/strong> N개의 동일한 산란 기여가 있다고 가정해 상대 Phase만 합하면 정규화된 Array Factor를 계산할 수 있습니다. Phase가 맞을 때 최대가 되고 N이 늘면 Phase Mismatch에 더 민감해집니다. 하지만 각 위치의 실제 산란 세기, Guided Power 감소, Gaussian Apodization, 반사와 BOX 간섭을 모두 생략하므로 이 그래프는 실제 Grating의 Coupling Spectrum이 아닙니다.\u003c/p>\u003cdetails>\u003csummary>원본 설계 Section · BOX, Focusing, Layout, 2D/3D와 측정\u003c/summary>\u003cp>실제 설계는 Waveguide/Cladding/Etch 구조에서 Mode를 구하고, 방사 방향·Profile·반사를 계산한 뒤 Fiber와의 Vector Overlap을 확인합니다. BOX와 Substrate는 아래쪽 Field가 반사되어 위쪽 Field와 간섭하는 Phase를 바꿀 수 있습니다. 이를 검증하지 않고 특정 BOX가 항상 더 좋은 효율을 준다고 단정할 수 없습니다.\u003c/p>\u003cp>Focusing Grating의 곡선 Groove는 횡 방향 Phase를 맞춰 좁은 Guide로 연결하는 구조적 방법입니다. 이는 1D Uniform Array만으로 검증할 수 없습니다. 2D FDTD의 단면 가정과 3D의 횡 방향 Focusing/Polarization 차이, Mesh/Port 수렴을 확인해야 합니다. 실제 Mask의 최소 Feature, Etch·Width 오차와 측정 Fiber 정렬도 별도로 봅니다.\u003c/p>\u003cp>측정에서는 Input/Output 두 Interface, Route Loss, Reference와 정렬 조건을 구분해야 합니다. 두 Coupler의 총 Loss를 하나의 값으로 착각하지 않습니다. 원본 실험 수치나 FDTD 결과를 이 릴리스에서 재현한 것은 아니며, 후속 GC-Vector-Solver/Stack/3D-Layout/Measurement로 연결합니다.\u003c/p>\u003c/details>"},{"key":"equation","label":"C · Understand the equation","title":"길이 방향 Phase 조건을 직접 계산합니다","scene":"io","html":"\u003cdiv class=\"equation\">βg = (2π/λ₀)ngrat, k∥ = (2π/λ₀)nclad sinθ\u003cbr>βg−k∥ = 2π/Λ\u003cbr>Λ = λ₀ / (ngrat−nclad sinθ)\u003cbr>sinθmatch = (ngrat−λ₀/Λ)/nclad\u003c/div>\u003cdl class=\"terms\">\u003cdt>λ₀, Λ\u003c/dt>\u003cdd>Vacuum Wavelength와 Period · Notebook nm, 내부 µm\u003c/dd>\u003cdt>θ\u003c/dt>\u003cdd>Surface Normal 기준 방사각 · °, 수식 내부 rad\u003c/dd>\u003cdt>ngrat\u003c/dt>\u003cdd>Grating 영역의 주어진 Phase Index 근사 · 무차원\u003c/dd>\u003cdt>βg,G,k∥\u003c/dt>\u003cdd>길이 방향 Phase 누적 / Spatial Momentum · rad/µm\u003c/dd>\u003c/dl>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 1550 nm, +10°의 Period\u003c/h3>\u003cp>ngrat=2.4, nclad=1, λ₀=1550 nm, θ=+10°이면 Λ=1550/(2.4−sin10°)≈\u003cstrong>696.21 nm\u003c/strong>입니다. θ=0이면 Λ≈645.83 nm이고, −10°이면 약 602.26 nm입니다. 각도의 부호가 바뀌면 같은 식의 결과도 달라집니다. Slider는 1 nm 간격이므로 Λ=696 nm에서 작은 Mismatch가 남을 수 있습니다.\u003c/p>\u003cp>|sinθmatch|&gt;1인 조건에서는 이 매질로 나가는 해당 차수의 Propagating Wave가 없습니다. 예를 들어 λ₀=1550 nm, Λ=400 nm, ngrat=2.4이면 sinθmatch=−1.475입니다. 이를 억지로 실수 각도로 표시하지 않습니다.\u003c/p>\u003c/div>\u003cdiv class=\"equation\">Δβ = βg−k∥−G, δ = ΔβΛ\u003cbr>F = |(1/N) Σ\u003csub>j=0\u003c/sub>\u003csup>N−1\u003c/sup> exp(ijδ)|²\u003cbr>δ→0: F→1\u003c/div>\u003cp>F는 동일한 N개 기여를 총 진폭 N으로 정규화한 상대 Coherent Factor입니다. F=1은 이 정규화의 최댓값이며 실제 100% Coupling이 아닙니다. 파장 곡선에서는 ngrat와 nclad를 고정하고 Phase 조건만 Sweep합니다.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"Phase가 맞으면 모든 Power가 Fiber로 갈까요?","scene":"io","html":"\u003cp>Phase Matching은 멀리 떨어진 산란 기여가 서로 보강될 수 있는 조건입니다. Directionality와 Mode Shape, 실제 산란 강도는 다른 조건이라는 것을 생각하며 Tutor에 답해 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Period, 각도, 산란 기여 수를 분리합니다","scene":"io","html":"\u003cp>ngrat=2.4, θ=10°, Λ=696 nm, λ₀=1550 nm에서 Δβ와 F를 확인하세요. 먼저 θ를 0°로 바꾸면 1550 nm 지점의 결과가 어떻게 바뀔지 예측합니다. 이후 Λ를 약 646 nm로 바꾸어 새 각도의 조건을 다시 맞춥니다.\u003c/p>\u003cp>다음 N만 바꾸어 같은 Phase Mismatch의 상대 민감도를 관찰하세요. N을 늘려 F 곡선이 좁아져도 실제 장치의 1 dB Bandwidth를 얻은 것은 아닙니다. N이 실제 방사 Envelope와 어떻게 연결되는지 풀지 않았기 때문입니다. 구조 Figure의 선이나 Groove 높이 역시 EM Field가 아닌 개념도입니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"공간적 주기는 Phase Matching의 설계 변수입니다","scene":"io","html":"\u003cul>\u003cli>외부 Wave의 축 방향 Phase와 Guided Wave의 Phase를 Grating G가 연결합니다.\u003c/li>\u003cli>Period, Angle, Wavelength는 부호 Convention 아래 함께 결정됩니다.\u003c/li>\u003cli>그 조건과 실제 Coupling Efficiency·Directionality·Bandwidth는 구별합니다.\u003c/li>\u003cli>BOX·Apodization·Focusing·2D/3D·실험은 후속 검증 단계입니다.\u003c/li>\u003c/ul>\u003cp>다음은 Chip 끝면으로 빛을 넣는 Edge Coupler입니다. 이번에는 공간적인 산란 주기 대신, Facet의 Mode 크기를 Fiber와 맞추고 그 Mode를 Chip 내부로 부드럽게 전달하는 과정을 살펴봅니다.\u003c/p>"}],"prediction":"같은 Index에서 Fiber Angle을 +10°→0°로 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","1550 nm에 맞는 Period가 약 696→646 nm로 달라진다","Angle은 Mode Phase와 무관해서 Period가 같다","Phase Matching만 맞추면 실제 효율도 항상 100%다"],"predictionFeedback":"Λ=λ/(ngrat−nclad sinθ)이므로 +10°와 0°의 matched Period가 다릅니다. F의 최댓값 1은 상대 Phase Factor의 정규화이며 실제 장치 효율을 뜻하지 않습니다.","reflection":"Bragg Filter와 Surface Grating Coupler의 출력 채널 차이, Phase Matching과 실제 Efficiency의 차이를 설명해 보세요.","sources":["I0","I3"],"tutor":{"question":"Grating Array Factor F=1을 얻었습니다. 올바른 해석은?","choices":[{"text":"이 Grating의 실제 Fiber Coupling Efficiency가 100%로 검증됐다.","feedback":"F는 동일 산란 기여들의 상대 Phase 합을 정규화한 값입니다. 실제 산란 Envelope, 위/아래 Directionality, Fiber Overlap, Reflection 등을 풀지 않았으므로 총 효율을 알 수 없습니다.","concept":"정규화 Array Factor를 Device 성능으로 오해"},{"text":"주어진 Period·Index·각도에서 동일 기여의 Phase가 맞았고, 실제 효율은 다른 채널도 필요하다.","feedback":"맞습니다. ΔβΛ가 2π 주기 안에서 정렬되었음을 뜻합니다. 원하는 실제 설계에서는 해당 차수와 방사 가능 여부, 전체 Field와 손실도 확인해야 합니다.","concept":"위상 조건과 성능 분리","correct":true},{"text":"원본 Bragg Filter와 같으므로 원하는 출력은 항상 Guide 뒤쪽의 Reflection이다.","feedback":"Bragg Filter는 전진·후진 Guided Mode를 결합합니다. Surface Grating은 외부 방사 Mode와 Guided Mode를 연결합니다. 주기 구조라는 공통점만으로 출력 채널을 같게 놓으면 안 됩니다.","concept":"두 Grating 용도의 혼동"}],"why":"Phase 합은 산란 기여들이 서로 상쇄되는지 보강되는지를 설명합니다. 같은 Phase라도 원하는 방향이 아닌 곳으로 방사하거나 Fiber Profile과 맞지 않으면 해당 Fiber에 전달되는 Power는 작을 수 있습니다.","simple":"여러 사람이 같은 박자로 맞춘 것과 소리가 원하는 마이크에 얼마나 들어오는지는 다른 문제입니다. 여기서는 박자에 해당하는 Relative Phase만 계산합니다. 이 비유는 실제 Field 계산을 대신하지 않습니다.","math":"βg−k₀nclad sinθ−2π/Λ=0이면 Σexp(ijδ)=N이므로 F=|N/N|²=1입니다. 실제 η에는 산란 세기와 Directionality, Vector Overlap 등 추가 입력/계산이 필요합니다.","notebook":"Period와 θ를 바꾸고 F와 Δβ를 함께 보세요. N을 바꾸면 상대 Envelope가 달라지지만 실제 측정 Bandwidth나 Efficiency라고 부르지 않습니다. θ의 Normal 기준과 부호도 확인하세요."}},{"id":"3.3","short":"Edge Coupler","title":"Edge Couplers, Inverse Tapers and Alignment","time":"15–25분","lead":"Facet에서 Mode 크기를 맞춘 뒤 Chip 내부의 작은 Mode로 연결합니다. 공간 정렬과 Angular Error를 분리해 관찰하고, Taper의 역할과 모델의 범위를 구별합니다.","question":"Silicon을 더 가늘게 만든 Inverse Taper가 어떻게 Fiber와 더 큰 Mode로 만날 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"끝면에서 Mode를 받아 Chip 내부로 전달합니다","scene":"io","html":"\u003cp>원본 §5.3의 Edge Coupler는 Chip의 끝면, 즉 \u003cstrong>Facet\u003c/strong> 쪽으로 빛을 주고받습니다. Surface Grating처럼 길이 방향의 주기로 외부 Wave의 Momentum을 바꾸는 대신, 외부 Field와 Facet의 Guided Mode를 맞추고 그 Mode를 Chip 내부로 전달합니다. 따라서 Mode 변환 구조와 실제 Facet 접근·정렬 조건을 함께 설계해야 합니다.\u003c/p>\u003cp>이번 Lesson은 먼저 Inverse Taper와 Overlay의 원리를 이해하고, 명시한 Gaussian Profile로 크기·위치·각도 오차의 영향을 나눠 계산합니다. ‘좁은 Tip이면 효율이 얼마’라는 임의 함수를 만들지 않습니다. Geometry를 바꾸면 Mode가 실제로 어떻게 달라지는지는 별도의 Vector Mode/Propagation 계산이 필요합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"작은 Core와 작은 Mode를 동일시하지 않습니다","scene":"io","html":"\u003cp>\u003cstrong>Inverse Taper\u003c/strong>는 Facet 쪽 Silicon Core를 가늘게 하고 내부로 갈수록 넓히는 구조입니다. 매우 좁은 Silicon Tip에서는 Confinement가 약해져 주변 낮은 Index 영역에 Field가 더 펼쳐질 수 있습니다. 따라서 Core가 작아져도 Mode의 공간 분포는 오히려 커질 수 있습니다. 이 관계는 Chapter 1에서 Core 밖의 Evanescent Field와 Cutoff를 배웠던 내용에 연결됩니다.\u003c/p>\u003cp>그대로 가늘게만 만들면 언제나 좋은 것은 아닙니다. 어떤 Local Mode가 존재하는지, Substrate로 새는 성분이나 제작 가능한 Tip 크기는 무엇인지 확인해야 합니다. \u003cstrong>Overlay Waveguide\u003c/strong>는 낮은 Index의 더 큰 구조에 Field를 담아 Fiber와의 Profile을 맞추고, 길이에 따라 Silicon Mode로 옮기는 방식입니다. 실제 Mode는 Silicon과 Overlay를 함께 포함한 단면의 해입니다.\u003c/p>\u003cp>\u003cstrong>Adiabatic Transition\u003c/strong>은 변화하는 단면의 Local Mode를 따라가면서 다른 Mode나 Radiation으로의 전환을 작게 하는 조건입니다. 단순히 길다는 이유만으로 충분하지 않고, Mode 간 β 차이와 단면의 변화율을 함께 봅니다. EME는 Local Mode 기저를 연결하는 방법이며 FDTD는 시간 영역의 Field를 전파시키는 방법입니다. 이번 정성 도식은 어느 쪽 Solver의 결과도 아닙니다.\u003c/p>\u003cp>\u003cstrong>Lateral Offset\u003c/strong>은 두 Mode 중심이 같은 평면에서 어긋난 경우입니다. Gaussian 반경이 같으면 Offset Penalty는 exp[−Δx²/w²]입니다. 반경이 커지면 같은 이동 거리의 상대 Penalty는 작아집니다. 하지만 처음부터 Size Mismatch가 있으면 중심 정렬의 절대 Overlap 자체가 낮을 수 있으므로, 절대 η와 η(Δx)/η(0)를 나눠 읽어야 합니다.\u003c/p>\u003cp>\u003cstrong>Angular Error\u003c/strong>는 Intensity가 같은 모양으로 겹쳐도 단면에 Phase Gradient를 만듭니다. 이번에는 같은 평면의 Field 하나에 exp(iqx)를 곱한 작은 각도 모델을 사용합니다. 큰 Mode일수록 단면 전체에 더 많은 Phase 차이가 쌓일 수 있으므로, Lateral Tolerance가 좋아지는 방향이 Angular Tolerance에도 항상 좋은 것은 아닙니다. 실제 Gap·NA·Facet Refraction·Wavefront Curvature는 이 모델의 범위 밖입니다.\u003c/p>\u003cp>실제 장치의 Tolerance를 말하려면 어떤 기준점에서 몇 dB 낮아지는지, 어느 방향의 이동인지, 여러 오차가 동시에 있는지 명시해야 합니다. 하나의 Gaussian 1 dB 거리에서 전체 Assembly Yield를 바로 얻을 수는 없습니다. Yield에는 오차 분포와 실제 Geometry/공정 결과가 필요합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"크기·위치·각도의 Penalty를 나눕니다","scene":"io","html":"\u003cdiv class=\"equation\">S=w₁²+w₂², q=(2πn/λ₀)sinδθ\u003cbr>η = [2w₁w₂/S]² × exp[−2Δx²/S] × exp[−q²w₁²w₂²/(2S)]\u003cbr>η(Δx)/η(0)=exp[−2Δx²/S]\u003cbr>Δx\u003csub>1dB\u003c/sub>=√(S ln10/20)\u003c/div>\u003cdl class=\"terms\">\u003cdt>w₁,w₂,Δx\u003c/dt>\u003cdd>가정한 Gaussian 반경과 Lateral Offset · µm\u003c/dd>\u003cdt>δθ\u003c/dt>\u003cdd>작은 Angular Error · °, 수식은 rad\u003c/dd>\u003cdt>q\u003c/dt>\u003cdd>평면의 Phase Gradient · rad/µm. n=1, λ₀=1.55 µm 고정\u003c/dd>\u003cdt>Δx1dB\u003c/dt>\u003cdd>같은 Size/Tilt 조건의 중심 정렬 대비 1 dB Offset · µm\u003c/dd>\u003c/dl>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 같은 5.2 µm Mode의 정렬\u003c/h3>\u003cp>w₁=w₂=5.2 µm, δθ=0이면 Δx=0에서 η=1입니다. Δx=2 µm에서는 η=exp(−4/27.04)≈\u003cstrong>0.8625\u003c/strong>이고 약 \u003cstrong>0.642 dB\u003c/strong> 낮아집니다. 상대 1 dB 거리는 Δx1dB=5.2√(ln10/10)≈\u003cstrong>2.495 µm\u003c/strong>입니다.\u003c/p>\u003cp>Offset을 0으로 돌리고 δθ=1°를 주면 q≈0.07075 rad/µm, ηtilt=exp[−(qw)²/4]≈\u003cstrong>0.9667\u003c/strong>입니다. 이 Angular Penalty는 같은 평면의 Phase Ramp만으로 계산한 값이며 Facet에서의 굴절이나 실제 Optical Gap 전파 결과가 아닙니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Adiabatic 조건을 식으로 읽는 방법\u003c/summary>\u003cdiv class=\"equation\">|⟨m|∂/∂z|n⟩| ≪ |βₙ−βₘ|\u003c/div>\u003cp>Local Mode의 변화가 다른 Mode의 상대 Phase 누적보다 충분히 느려야 한다는 개념적인 기준입니다. 양쪽 단위는 1/길이이며, 실제 Vector Mode 정규화·방사 채널·축방향 변화의 해석이 필요합니다. Local β가 비슷해지는 구간에서는 같은 길이 변화라도 전환이 커질 수 있습니다. 이 식에 임의의 β 값을 넣어 ‘필수 Taper 길이’를 생성하지 않습니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"큰 Mode가 모든 정렬 오차에 유리할까요?","scene":"io","html":"\u003cp>공간적인 위치 오차와 Phase Gradient가 있는 각도 오차는 같은 효과가 아닙니다. 큰 Mode의 Lateral Tolerance와 Angular Sensitivity를 나눠 생각한 뒤 Tutor의 설명과 비교해 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Offset과 Tilt를 각각 한 번씩만 바꿉니다","scene":"io","html":"\u003cp>먼저 Fiber와 Facet Gaussian 반경을 5.2 µm로 맞추고 Tilt=0에서 Δx를 0, 2.0, 2.5 µm로 움직이세요. Figure의 곡선은 중심 정렬 대비 상대 값이고, Readout의 η는 Size와 Tilt까지 포함한 절대 Scalar Overlap입니다. 두 값을 같은 이름으로 비교하지 않습니다.\u003c/p>\u003cp>Δx=0을 유지하고 Tilt를 0°→1°→3°로 바꾸세요. 다음 두 반경을 3 µm로 맞춘 경우와 비교합니다. Mode 크기가 변하면 위치 오차와 각도 오차의 민감도가 반대 방향으로 움직일 수 있습니다. 그림의 실제 Inverse Taper Width는 Slider와 연결하지 않으며, 이 실험은 주어진 Profile 간 비교입니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Facet에서의 일치와 Taper 안의 전달은 모두 필요합니다","scene":"io","html":"\u003cul>\u003cli>Inverse Taper는 작은 Core가 더 큰 Mode를 만들 수 있다는 원리를 이용합니다.\u003c/li>\u003cli>Overlay와 Local Mode 전환은 실제 단면/전파 Solver로 확인해야 합니다.\u003c/li>\u003cli>Size Mismatch, Offset, Tilt는 분리한 후 같은 조건에서 합칩니다.\u003c/li>\u003cli>상대 1 dB 거리를 실제 조립 수율로 바로 읽지 않습니다.\u003c/li>\u003c/ul>\u003cp>이제 공간적인 Profile과 Phase를 다뤘습니다. 다음에는 모양이 완벽하게 맞아도 Polarization이 다르면 결합이 줄어드는 이유를 배웁니다. Fiber의 두 직교 성분을 PIC의 원하는 입력 Mode에 어떻게 연결할지 생각해 보겠습니다.\u003c/p>"}],"prediction":"같은 반경을 키울 때 Offset과 Tilt의 민감도는?","predictionOptions":["먼저 예측을 선택하세요","같은 위치 이동에는 더 관대해질 수 있지만 같은 Tilt에는 더 민감해질 수 있다","두 오차에 항상 같은 비율로 유리하다","크기는 Phase Gradient와 무관하므로 Tilt Penalty는 없다"],"predictionFeedback":"같은 반경 w이면 Offset factor=exp(−Δx²/w²), Tilt factor=exp[−(qw)²/4]입니다. w가 커질 때 두 항의 민감도가 반대가 될 수 있습니다. 실제 Facet의 전체 공차는 추가 검증이 필요합니다.","reflection":"Inverse Taper의 Core 크기와 Mode 크기 관계, 그리고 Lateral/Tilt 오차의 Trade-off를 설명해 보세요.","sources":["I0","I1","I2"],"tutor":{"question":"Inverse Taper와 정렬 공차를 올바르게 설명한 것은?","choices":[{"text":"Silicon Tip을 좁히면 Mode도 언제나 작아져 Fiber와의 Mismatch가 커진다.","feedback":"Core와 Mode 크기는 같지 않습니다. Confinement가 약해지면 Field가 주변으로 펼쳐질 수 있습니다. 실제 크기와 Leakage는 전체 단면의 Local Mode를 풀어 확인해야 합니다.","concept":"Core Width와 Mode Radius 혼동"},{"text":"Field를 확장해 Facet의 공간 일치를 개선할 수 있지만 Taper 전환과 Offset/Tilt는 따로 확인해야 한다.","feedback":"맞습니다. Facet Overlap, Adiabatic Transfer, Reflection과 제조 가능성은 연결되어 있지만 서로 다른 검증입니다. Scalar 반경 Slider가 실제 Tip Geometry를 풀지는 않습니다.","concept":"인터페이스와 전파를 구분","correct":true},{"text":"Mode를 크게 하면 위치와 각도 오차가 모두 무조건 줄며 수율을 알 수 있다.","feedback":"큰 Mode는 같은 Lateral Offset에 관대해질 수 있지만 Phase Gradient에 의한 Angular Penalty는 커질 수 있습니다. Yield에는 실제 오차 분포와 장치 응답이 더 필요합니다.","concept":"Tolerance를 수율과 동일시"}],"why":"Facet의 입력 투영과 길이 방향의 Local Mode 전달은 별개입니다. 첫 번째가 좋아도 Taper 변화가 빠르면 다른 Mode로 전달될 수 있으며, Lateral/Angular 오차는 Amplitude와 Phase에 서로 다른 영향을 줍니다.","simple":"작은 Silicon이 약하게 빛을 붙잡으면 빛의 무늬가 주변으로 넓어질 수 있습니다. 넓은 무늬는 조금 옆으로 움직여도 겹치지만, 기울어진 Phase가 넓은 영역에 쌓이면 적분이 상쇄될 수 있습니다.","math":"같은 w에서 ηoffset=e^(−Δx²/w²), ηtilt=e^(−q²w²/4)입니다. w를 두 배로 하면 같은 Offset의 지수 크기는 1/4, 같은 q의 지수 크기는 4배입니다. 이것은 공통 평면 Gaussian 모델의 결과입니다.","notebook":"먼저 w₁=w₂, Tilt=0에서 상대 Offset 곡선을 읽으세요. 그 다음 Offset=0에서 Tilt만 바꾸세요. 두 실험의 원인을 구별한 뒤 실제 Taper/Facet의 빠진 항목을 메모해 보세요."}},{"id":"3.4","short":"Polarization","title":"Polarization, Jones States and Diversity","time":"15–25분","lead":"Field의 공간 모양이 같아도 Vector 방향과 상대 Phase가 다르면 같은 Optical State가 아닙니다. 두 직교 성분의 복소 Amplitude로 결합과 손실을 설명합니다.","question":"같은 Intensity를 가진 Linear, Circular Polarization을 원하는 PIC Mode로 똑같이 넣을 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"좋은 Spatial Overlap만으로 충분하지 않습니다","scene":"io","html":"\u003cp>지금까지의 Gaussian 모델은 두 Profile의 Polarization이 같다고 가정했습니다. 이제 이 가정을 풀어 봅니다. 같은 모양으로 같은 위치에 들어오는 빛도 원하는 Vector Mode와 Polarization이 직교하면 결합 성분이 0이 될 수 있습니다. 반대로 서로 다른 두 Polarization을 둘 다 사용하도록 Interface를 설계할 수도 있습니다.\u003c/p>\u003cp>원본 §5.4의 Polarization은 Grating과 Edge Coupler 모두에 연결되는 조건입니다. Fiber에서는 두 직교 성분을 생각할 수 있고, Chip의 높은 Index Contrast와 비대칭 단면에서는 Quasi-TE/TM의 Profile·Index·Coupling 응답이 달라질 수 있습니다. 이번 Lesson은 공통 기준면의 Jones State로 이 차이의 출발점을 이해합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"진폭 두 개와 상대 Phase가 상태를 정합니다","scene":"io","html":"\u003cp>한 지점의 Transverse Field를 두 직교 기준축 x,y의 Complex Amplitude로 나타낸 것을 \u003cstrong>Jones Vector\u003c/strong>라고 합니다. 공통 Absolute Phase는 관측 Power에 영향을 주지 않으므로, 전체 크기를 정규화하고 성분의 상대 진폭과 Relative Phase를 사용합니다. Ex와 Ey의 상대 Phase가 0 또는 π이면 직선으로 진동하고, 다른 Phase에서는 일반적으로 타원을 그립니다.\u003c/p>\u003cp>여기서는 전파 +z, 시간 exp(−iωt), j=[cosψ, exp(iχ)sinψ]를 사용합니다. ψ는 두 성분의 혼합 정도이고 χ는 y 성분의 x 대비 Relative Phase입니다. ψ=45°, χ=±90°이면 두 성분 크기가 같고 Quadrature이므로 원을 그립니다. 원편광의 좌·우 손잡이 명칭은 바라보는 방향과 시간 Convention에 따라 혼동될 수 있어, 그림에는 성분과 Convention을 직접 적습니다.\u003c/p>\u003cp>\u003cstrong>Projection.\u003c/strong> 수신 Mode가 공통 기준의 Linear Polarization u=[cosα,sinα]를 받는다면 결합 진폭은 u†j이고 Power 비율은 |u†j|²입니다. 직교한 다른 Analyzer의 결과를 합하면 정규화 입력 Power 1이 됩니다. 한쪽 Projection이 0이라고 모든 에너지가 사라진 것은 아닙니다. 실제 소자에서 그 다른 성분이 반사·흡수·다른 출력으로 가는지는 구조가 결정합니다.\u003c/p>\u003cp>\u003cstrong>TE/TM와 좌표.\u003c/strong> Chapter 1의 Chip 단면에서 x를 Width, y를 Height, z를 전파축으로 두면 Quasi-TE는 주로 Ex, Quasi-TM는 주로 Ey라는 설명을 사용했습니다. Fiber가 기울어져 들어오는 경우 그 Transverse 기준축을 Chip 기준으로 연결하는 변환도 필요합니다. 이번 Notebook은 이미 같은 기준면/기저로 표현한 두 성분을 가정하며, 실제 Quasi-TE/TM Mode Solver나 3D 좌표 변환을 계산하지 않습니다.\u003c/p>\u003cp>\u003cstrong>Polarization Dependent Loss, PDL\u003c/strong>은 입력 Polarization에 따른 최대/최소 Power Transmission의 비율을 dB로 나타냅니다. 공간적으로 좋은 정렬을 해도 PDL이 크면 입력 State 변화에 따라 전달 Power가 달라집니다. 하나의 Polarization에 대한 IL과 전체 State를 바꿔 측정하는 PDL은 다른 지표입니다.\u003c/p>\u003cp>\u003cstrong>Polarization Diversity\u003c/strong>는 입력의 두 직교 성분을 나눈 뒤 필요한 회전/변환을 거쳐 두 처리 경로로 보내는 방식입니다. 2D Polarization-splitting Grating이나 Splitter/Rotator가 이 목적에 쓰일 수 있습니다. 이는 한 성분을 단순히 버리는 Analyzer와 다른 구조입니다. 실제 두 경로의 Loss와 불균형까지 0이라는 뜻은 아닙니다.\u003c/p>\u003cp>Jones Vector는 Fully Polarized Coherent State를 나타냅니다. 두 성분의 Phase 관계가 무작위인 Unpolarized Light를 한 개의 고정 Jones Vector로 표현하면 안 됩니다. 그 경우 Stokes/Coherency 같은 통계적 표현이 필요하며, 이번 Notebook의 범위 밖입니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"복소 Vector의 내적을 Power로 바꿉니다","scene":"io","html":"\u003cdiv class=\"equation\">j = [cosψ, exp(iχ)sinψ]\u003csup>T\u003c/sup>, j†j=1\u003cbr>uα = [cosα,sinα]\u003csup>T\u003c/sup>\u003cbr>η∥=|uα†j|², η⊥=1−η∥\u003cbr>Linear input: η∥=cos²(ψ−α)\u003c/div>\u003cdl class=\"terms\">\u003cdt>ψ,χ\u003c/dt>\u003cdd>혼합각, y/x Relative Phase · ° 입력, 내부 rad\u003c/dd>\u003cdt>α\u003c/dt>\u003cdd>Linear 수신/Analyzer의 방향 · °\u003c/dd>\u003cdt>η∥,η⊥\u003c/dt>\u003cdd>두 직교 Linear Channel의 Power 비율 · 무차원\u003c/dd>\u003cdt>조건\u003c/dt>\u003cdd>정규화 Fully Polarized State, 공통 기저, 이상 Projection\u003c/dd>\u003c/dl>\u003cdiv class=\"worked\">\u003ch3>Worked Example · Linear와 Circular 입력\u003c/h3>\u003cp>x Linear 입력 ψ=0에서 Analyzer α=60°이면 η∥=cos²60°=\u003cstrong>0.25\u003c/strong>, η⊥=0.75입니다. 1 mW 입력이라면 이상적인 두 채널은 0.25/0.75 mW입니다. 반면 ψ=45°, χ=90°의 Circular State는 어떤 Linear Analyzer 방향에서도 η∥=\u003cstrong>0.5\u003c/strong>입니다.\u003c/p>\u003cp>ψ=45°, χ=0°와 χ=180°는 각 성분의 |Ex|²=|Ey|²=0.5가 같습니다. 하지만 α=45°에서 첫 번째는 η∥=1, 두 번째는 0입니다. 직교 축의 Power만으로 Relative Phase를 모두 알 수 없다는 예입니다.\u003c/p>\u003c/div>\u003cdiv class=\"equation\">가정한 독립 Power Transmissions Tx,Ty:\u003cbr>T(ψ)=Tx cos²ψ+Ty sin²ψ\u003cbr>PDL=10log₁₀[Tmax/Tmin]\u003c/div>\u003cp>Tx=1, Ty=0.1이면 PDL=10 dB이고 ψ=45°에서 T=0.55입니다. Ty=0이면 이상 PDL은 무한대입니다. 두 값 모두 0이면 최대/최소 비율이 정의되지 않습니다. 이것은 독립적으로 가정한 대각 Transmission 예이며 실제 Grating/Edge Device의 PDL 데이터가 아닙니다.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"Intensity가 같아도 Relative Phase는 다를 수 있습니다","scene":"io","html":"\u003cp>두 성분의 Power가 각각 0.5라는 정보만으로 Polarization State를 결정할 수 있을까요? j의 Relative Phase와 Analyzer 방향을 함께 생각한 뒤 Tutor 설명을 읽어 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Polarization State와 수신 기저를 따로 바꿉니다","scene":"io","html":"\u003cp>먼저 ψ=45°, χ=0°로 두고 Analyzer를 0°→45°→90°로 움직입니다. 다음 χ=180°로 바꿔 같은 위치의 Transmission을 비교합니다. 성분의 Power는 같아도 45° Analyzer에서는 결과가 바뀝니다. Field Ellipse Figure와 Projection Curve가 같은 State를 사용합니다.\u003c/p>\u003cp>χ=90°에서 ψ=45°인 원편광도 확인합니다. Linear Analyzer 방향을 바꾸어도 각 채널은 0.5입니다. ψ와 χ를 바꿀 때 Curve는 변하지만 두 직교 출력의 합은 항상 1입니다. 이 결과를 실제 단일 Polarization Coupler의 총 효율로 읽지 말고 이상적인 기저 Projection으로 읽어 주세요.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Optical I/O에는 Vector State도 포함됩니다","scene":"io","html":"\u003cul>\u003cli>정규화 Jones Vector는 두 성분의 복소 진폭을 나타냅니다.\u003c/li>\u003cli>Polarization 결합은 u†j의 크기 제곱입니다.\u003c/li>\u003cli>같은 Intensity 성분도 Relative Phase에 따라 다른 상태가 됩니다.\u003c/li>\u003cli>PDL과 단일 상태의 IL을 구별하고, Diversity는 두 성분의 처리 구조로 이해합니다.\u003c/li>\u003c/ul>\u003cp>다음은 Chapter의 마지막 Engineering Exercise입니다. 공간 Overlap과 Polarization Projection, Interface Residual Loss, Route Loss를 중복 없이 연결해 실제 입력 대비 Output Power를 계산하겠습니다.\u003c/p>"}],"prediction":"ψ=45°에서 χ를 0°→180°로 바꾸고 α=45°를 유지하면?","predictionOptions":["먼저 예측을 선택하세요","성분 Power는 같지만 Analyzer Transmission은 1→0으로 바뀐다","각 성분 Power가 같으므로 어떤 Analyzer 결과도 같다","Polarization은 Phase와 무관하므로 상태가 같다"],"predictionFeedback":"χ는 성분 사이의 Relative Phase입니다. j=(1,1)/√2와 (1,−1)/√2는 α=45° 기저에 대해 서로 직교합니다. 성분별 Intensity만으로 이 차이를 볼 수 없습니다.","reflection":"동일한 Ex/Ey Intensity에서 서로 다른 Polarization을 만드는 Relative Phase와, PDL·Diversity의 의미를 설명해 보세요.","sources":["I0","I4"],"tutor":{"question":"ψ=45°일 때 χ=0°와 180°를 어떻게 구별하나요?","choices":[{"text":"Ex/Ey Power가 각각 0.5로 같으므로 같은 Optical State다.","feedback":"같은 Intensity만으로 Relative Phase를 알 수 없습니다. (1,1)/√2와 (1,−1)/√2는 서로 직교한 Linear State이며 α=45° Projection에서 1과 0이 됩니다.","concept":"Intensity만으로 State를 판단"},{"text":"성분 Power는 같아도 Relative Phase가 달라 공통 기저의 Projection 결과가 달라진다.","feedback":"맞습니다. Jones Vector는 복소 성분을 포함합니다. α=45°에서 Field 합이 보강/상쇄되는 과정은 Chapter 2의 Interference와 같은 복소 합 원리입니다.","concept":"Relative Phase와 Vector 투영","correct":true},{"text":"어떤 Jones Vector 하나를 선택해도 Unpolarized Light를 그대로 표현할 수 있다.","feedback":"고정 Jones Vector는 Fully Polarized Coherent State입니다. Unpolarized 혼합에서는 성분 간 안정된 Relative Phase가 없으므로 Coherency/Stokes의 통계적 처리가 필요합니다.","concept":"순수 State와 비편광 혼합 혼동"}],"why":"두 직교 축의 측정은 그 기저의 Power만 줍니다. 다른 방향으로 투영하면 두 복소 성분이 합쳐져 Relative Phase에 대한 Cross Term이 나타나므로 두 상태를 구별할 수 있습니다.","simple":"같은 두 진폭이라도 함께 같은 방향으로 움직이는지 반대 방향으로 움직이는지가 다릅니다. 관찰 방향을 45°로 돌리면 그 차이가 보강과 상쇄로 나타납니다.","math":"u45†j=(cosψ+e^(iχ)sinψ)/√2입니다. ψ=45°이면 (1+e^(iχ))/2가 되고 χ=0,π에서 그 제곱 크기가 1,0입니다. 두 직교 Analyzer의 합은 Unit Norm 때문에 1입니다.","notebook":"ψ=45°를 고정하고 χ를 0,90,180°로 바꾼 뒤 α=45°에서 1,0.5,0을 확인하세요. 두 직교 채널의 합과 Field Ellipse도 함께 읽어 보세요."}},{"id":"3.5","short":"I/O Ledger","title":"Engineering an Optical I/O Power Ledger","time":"15–25분","lead":"앞서 배운 공간·Phase·Polarization을 실제 입력과 출력의 Power로 연결합니다. 서로 다른 정의의 Loss를 중복해서 곱하지 않고, 계산에 포함된 채널과 빠진 채널을 설명합니다.","question":"Interface의 전체 Insertion Loss를 이미 알고 있을 때, Mode Overlap Penalty를 또 곱해도 될까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"소자의 숫자를 연결하기 전에 정의를 맞춥니다","scene":"io","html":"\u003cp>Optical I/O를 비교할 때는 Efficiency와 Loss가 어떤 기준면, 어떤 Mode, 어떤 Polarization을 포함하는지부터 읽어야 합니다. 같은 ‘1 dB’라도 전체 Interface Loss인지, Profile Mismatch를 제외한 추가 Loss인지에 따라 연결 방법이 달라집니다. 숫자만 더하면 같은 손실을 두 번 셀 수 있습니다.\u003c/p>\u003cp>이번 마지막 Lesson은 원본의 Problems와 학습 목표를 바탕으로 새로 작성한 \u003cstrong>Guided Engineering Exercise\u003c/strong>입니다. Fiber Input → I/O Interface → On-chip Route → Output의 Power를 계산합니다. 모든 Parameter는 가정한 입력이며 특정 Foundry나 실제 장치의 추천 성능이 아닙니다. 최적화 점수나 정답 Gate 없이 자신의 설계 설명으로 Chapter를 마무리합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"각 Factor가 포함하는 채널을 먼저 적습니다","scene":"io","html":"\u003cp>첫째, 입력 Fiber와 주어진 Facet Gaussian Profile의 \u003cstrong>Spatial Overlap ηspatial\u003c/strong>을 계산합니다. 둘째, 공통 기저의 Linear Polarization을 수신 x축에 투영해 \u003cstrong>ηpol\u003c/strong>을 구합니다. 세 번째 \u003cstrong>Residual Interface Loss\u003c/strong>는 이 두 Penalty를 \u003cem>제외한\u003c/em> 독립 추가 손실로 정의합니다. 실제 반사나 Taper 전달을 계산한 것이 아니라 외부에서 주어진 가정입니다.\u003c/p>\u003cp>이렇게 정의할 때만 ηspatial×ηpol×ηresidual을 곱할 수 있습니다. 실제 Interface의 측정 Total IL이 이미 공간·편광·반사·연결 손실을 포함한다면, 측정값을 ηtotal로 한 번만 사용해야 합니다. 이때 공간과 편광 Penalty를 다시 곱하면 중복입니다. Factorization 자체도 공간 Profile과 Polarization이 분리된다는 이 모델의 가정이며 실제 Vector Device에서는 정확히 분리되지 않을 수 있습니다.\u003c/p>\u003cp>Chip 내부 Route에는 α[dB/cm]와 길이 L[mm]를 사용합니다. 앞선 Chapter의 dB/cm와 mm→cm 변환을 다시 적용합니다. Output Interface Loss는 \u003cstrong>Total IL\u003c/strong>로 정의해 한 번만 적용합니다. 출력에 또 Gaussian/Polarization Factor를 붙이지 않습니다.\u003c/p>\u003cp>각 단계의 Power를 순서대로 계산하면 그 단계에서 남은 Power와 감소량을 기록할 수 있습니다. 모든 단계의 감소량을 더해 최종 출력에 합하면 입력과 같아야 합니다. 다만 ‘감소량’이 어디로 갔는지까지 이 단순 Ledger가 풀지는 않습니다. 실제 Reflection/Radiation/Absorption을 나누려면 해당 채널을 가진 Solver나 측정이 필요합니다.\u003c/p>\u003cp>\u003cstrong>Grating과 Edge를 비교하는 기준.\u003c/strong> Grating은 Surface 접근과 방사 Phase Matching을, Edge는 Facet 접근과 Mode 변환을 요구합니다. 실제 Bandwidth, Polarization 응답, Alignment와 공정 제약은 구현에 따라 달라집니다. 이번 Gaussian Ledger의 값을 Grating 전체의 효율로 치환하거나, 어느 방식이 항상 우수하다는 결론을 내리지 않습니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>검토 조건\u003c/th>\u003cth>Surface Grating\u003c/th>\u003cth>Edge Coupler\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth>외부 접근\u003c/th>\u003ctd>Chip 윗면과 방사각\u003c/td>\u003ctd>끝면·Facet/패키지 접근\u003c/td>\u003c/tr>\u003ctr>\u003cth>핵심 Field 과정\u003c/th>\u003ctd>주기 구조의 방사·Mode Overlap\u003c/td>\u003ctd>Facet 일치와 Local Mode 변환\u003c/td>\u003c/tr>\u003ctr>\u003cth>이번 정량 범위\u003c/th>\u003ctd>Phase 조건과 상대 Array Factor\u003c/td>\u003ctd>가정한 Profile의 Overlap\u003c/td>\u003c/tr>\u003ctr>\u003cth>후속 검증\u003c/th>\u003ctd>BOX/Apodization/Focusing/Vector Spectrum\u003c/td>\u003ctd>Taper/Overlay/반사/3D 전달\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"key":"equation","label":"C · Understand the equation","title":"Sequential Power와 dB 계산이 같은지 확인합니다","scene":"io","html":"\u003cdiv class=\"equation\">P₁=Pinηspatial\u003cbr>P₂=P₁ηpol\u003cbr>P₃=P₂10\u003csup>−ILresidual/10\u003c/sup>\u003cbr>P₄=P₃10\u003csup>−(αLmm/10)/10\u003c/sup>\u003cbr>Pout=P₄10\u003csup>−ILout/10\u003c/sup>\u003cbr>Pout + Σ(Pbefore−Pafter) = Pin\u003c/div>\u003cdl class=\"terms\">\u003cdt>Pin,Pout\u003c/dt>\u003cdd>입출력 Optical Power · mW\u003c/dd>\u003cdt>α,Lmm\u003c/dt>\u003cdd>Propagation Loss [dB/cm], Route Length [mm]; Lcm=Lmm/10\u003c/dd>\u003cdt>ILresidual\u003c/dt>\u003cdd>Spatial/Polarization을 제외한 Interface Loss · dB\u003c/dd>\u003cdt>ILout\u003c/dt>\u003cdd>출력 Interface의 Total Loss · dB, 한 번만 적용\u003c/dd>\u003c/dl>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 1 mW 입력의 I/O Ledger\u003c/h3>\u003cp>가정한 Fiber와 Facet 반경을 모두 5.2 µm, Offset=0, Linear Polarization Error=0으로 둡니다. 따라서 ηspatial=ηpol=1입니다. Residual Interface IL=1 dB, α=3 dB/cm, L=2 mm=0.2 cm, Output Total IL=1 dB이면 Route는 0.6 dB이고 Total은 \u003cstrong>2.6 dB\u003c/strong>입니다.\u003c/p>\u003cp>Pout=1×10^(−2.6/10)≈\u003cstrong>0.549541 mW\u003c/strong>입니다. 입력 Polarization을 x축에서 45°인 Linear State로 바꾸면 ηpol=0.5가 되어 Pout≈\u003cstrong>0.274770 mW\u003c/strong>, Total≈\u003cstrong>5.610 dB\u003c/strong>입니다. 0.5를 Field Amplitude로 잘못 제곱해 0.25를 적용하면 3 dB를 추가로 중복 잃습니다.\u003c/p>\u003cp>Notebook 기본값 w₂=4.0 µm에서는 Spatial Overlap≈0.934205이므로 기본 Pout≈\u003cstrong>0.513384 mW\u003c/strong>입니다. Worked Example의 반경 5.2 µm를 먼저 넣어 비교한 뒤, 다른 조건을 한 번에 하나씩 바꿔 보세요.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Interface의 측정 Total IL이 주어진 다른 문제\u003c/summary>\u003cp>입력 Interface Total IL이 2 dB이고 그것이 이미 정렬·편광·반사·Taper를 포함한다면, 입력 Interface의 전송은 10^(−2/10) 한 번입니다. 여기에 이번 Spatial Factor와 Polarization Factor를 다시 곱하면 안 됩니다. 이 Notebook은 Residual 정의를 사용하므로 측정 Total IL을 Residual Slider에 그대로 넣어서는 안 됩니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"손실의 크기보다 정의가 먼저입니다","scene":"io","html":"\u003cp>아래 Tutor는 중복 계산과 단위 변환을 점검합니다. 수식으로 설명을 읽은 뒤 현재 Notebook의 각 Stage가 무엇을 포함하는지 직접 말해 보세요. 자유 메모는 자동으로 채점하지 않습니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"예측을 쓰고 Ledger와 비교합니다","scene":"io","html":"\u003col>\u003cli>기본 조건에서 입력과 각 Factor의 의미를 읽고 예상 Pout을 적습니다.\u003c/li>\u003cli>반경을 5.2 µm, Offset=0, Polarization Error=0으로 맞춰 Worked Example의 0.549541 mW를 확인합니다.\u003c/li>\u003cli>Polarization Error만 45°로 바꾸어 Output이 절반이 되는지 확인합니다.\u003c/li>\u003cli>Offset만 2 µm로 바꾸거나 Route Length를 바꾸어 Spatial Penalty와 Propagation Loss의 차이를 설명합니다.\u003c/li>\u003cli>각 단계 Lost Power와 최종 Pout의 합이 1 mW인지 확인합니다.\u003c/li>\u003cli>이 결과에서 알 수 없는 것—실제 Return Loss, 제조 수율, Grating/Edge의 우열—을 모델의 빠진 채널과 연결해 정리합니다.\u003c/li>\u003c/ol>\u003cp>Slider의 값은 현재 Figure와 Ledger가 공유합니다. Figure의 Schematic은 Conceptual이며 Graph와 숫자만 명시한 해석식에서 계산합니다. 실제 장치 데이터가 생기면 입력 정의와 기준면을 먼저 맞춘 다음 교체해야 합니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Chapter Review · Fiber에서 Guided Mode까지","scene":"io","html":"\u003cul>\u003cli>\u003cstrong>Coupling Challenge:\u003c/strong> 같은 중심에서도 공간·Phase·Polarization과 경계가 맞아야 합니다.\u003c/li>\u003cli>\u003cstrong>Grating:\u003c/strong> 주기 구조의 Phase Matching과 실제 Device Efficiency를 구별했습니다.\u003c/li>\u003cli>\u003cstrong>Edge:\u003c/strong> Facet Mode 일치와 Inverse Taper/Overlay의 전파 변환을 구별했습니다.\u003c/li>\u003cli>\u003cstrong>Polarization:\u003c/strong> Jones Vector와 공통 기저의 Projection으로 입력 State를 설명했습니다.\u003c/li>\u003cli>\u003cstrong>Ledger:\u003c/strong> 독립적인 Factor의 의미를 명시하고 손실을 한 번씩만 적용했습니다.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>자기 설명:\u003c/strong> ‘왜 완전한 중심 정렬이 Efficiency=1이 아닌가?’, ‘Grating Period와 θ의 부호가 왜 중요한가?’, ‘왜 작은 Silicon Tip이 큰 Mode를 만들 수 있는가?’, ‘같은 성분 Power인데 왜 다른 Polarization State인가?’, ‘Total IL과 Residual Loss를 어떻게 구별하는가?’를 자신의 말로 답해 보세요.\u003c/p>\u003cp>원본 순서상 다음은 Active Components와 Modulators입니다. 이번 Chapter의 Release Candidate는 여기서 학습 검토를 기다립니다. PN Phase Shifter나 다음 Chapter의 코드는 추가하지 않습니다. I/O Advanced의 Vector/EME/FDTD/제작/측정 심화 위치는 Source Mapping에서 확인할 수 있습니다.\u003c/p>"}],"prediction":"입력 Interface의 측정 Total IL을 사용하면서 Overlap Penalty를 또 곱하면?","predictionOptions":["먼저 예측을 선택하세요","이미 포함한 항목을 중복 계산할 수 있으므로 정의와 기준면을 확인한다","항상 더 정확해지므로 모든 Penalty를 무조건 곱한다","dB 단위면 물리량 정의와 상관없이 더해도 된다"],"predictionFeedback":"Total IL에 이미 Spatial/Polarization 등이 포함됐다면 해당 Penalty를 다시 적용하지 않습니다. 이번 Notebook의 Interface Slider는 두 항을 제외한 Residual Loss로 명시했습니다.","reflection":"현재 I/O Ledger의 입력 정의, Output Power의 변화 원인, 실제 장치 검증에서 추가로 필요한 채널을 수치와 함께 설명해 보세요.","sources":["I0","I1","I2"],"tutor":{"question":"측정 Input Interface Total IL에 Spatial/Polarization Penalty가 이미 포함돼 있습니다. 어떻게 계산하나요?","choices":[{"text":"Total IL에 이번 Gaussian Overlap과 Polarization을 다시 곱해 더 정확하게 만든다.","feedback":"이미 포함된 채널을 다시 적용하면 같은 손실을 중복 계산합니다. 전체 측정 전송을 한 번 쓰거나, 실제로 분리한 독립 Factor를 한 번씩 사용해야 합니다.","concept":"손실 채널 중복 계산"},{"text":"기준면과 포함 채널을 확인하고 측정 Total Transmission을 한 번 적용한다.","feedback":"맞습니다. 이번 Notebook은 Residual Interface Loss를 별도로 정의했으므로 측정 Total IL과 같은 입력이 아닙니다. 물리량의 범위를 맞춘 뒤 계산해야 합니다.","concept":"Loss 정의와 기준면","correct":true},{"text":"α=3 dB/cm, L=2 mm이면 Propagation Loss는 6 dB이다.","feedback":"2 mm는 0.2 cm입니다. 따라서 Propagation Loss는 3×0.2=0.6 dB입니다. 숫자에 단위를 맞추지 않으면 10배의 손실 오류가 생깁니다.","concept":"mm와 cm 단위 변환 오류"}],"why":"Loss는 특정 입력·출력 기준면과 채널을 비교한 비율입니다. 독립 Factor로 분해할 때만 각 Penalty를 곱할 수 있습니다. Total IL은 이미 그 내부 Factor를 합친 값일 수 있습니다.","simple":"한 번의 비용에 이미 포함된 항목을 장부에 다시 쓰면 합계가 달라집니다. Optical Power도 어떤 단계에서 빠진 양인지 먼저 이름을 붙이고 한 번만 계산해야 합니다.","math":"독립 ηj의 곱이면 ILtotal=−10log₁₀(Πηj)=ΣILj입니다. 같은 η를 두 번 곱하면 해당 IL을 두 번 더합니다. α[dB/cm]×L[mm]/10이 Route IL이며, Power는 10^(−IL/10)로 변환합니다.","notebook":"반경5.2, Offset0, Polarization0에서 2.6dB와0.549541mW를 확인하세요. 다음 ψ45°에서 Power가 절반이 됩니다. 각 Lost Stage와 최종 출력의 합이1mW인지도 확인하세요."}}],"figures":[{"id":"1.1A","lesson":"1.1","title":"Core와 Cladding의 단면","classification":"Conceptual","anchor":"#section-concept > p:nth-of-type(2)","renderer":"structure","parameters":"Si Core n = 3.48, SiO₂ Cladding n = 1.444 · λ₀ = 1550 nm 부근의 예시. x: Width, y: Height, z: 전파 방향. 치수와 화살표는 정성적입니다.","limits":"실제 Field나 Mode 수를 계산한 그림이 아닙니다. 굴절률 차이는 Index Guiding의 출발 조건이며 전체 경계조건도 만족해야 합니다.","see":"높은 n의 Core를 낮은 n의 Cladding이 둘러싼 단면입니다.","notice":"전파 축 z와 횡 방향 x–y를 구별하세요.","meaning":"재료의 차이가 Field를 국소화할 수 있는 경계조건을 만듭니다.","source":"Original SVG; existing material assumptions"},{"id":"1.1B","lesson":"1.1","title":"Guided Field와 Evanescent Tail","classification":"Analytical","anchor":"#section-concept > p:last-of-type","renderer":"confinement","parameters":"대칭 Slab TE₀ · 전체 Width d = 500 nm · y 무한 · λ₀ = 1550 nm · nCore = 3.48, nClad = 1.444. x는 µm, Ey는 최대 절댓값으로 정규화합니다.","limits":"1D Slab의 Ey 해입니다. 유한 Height의 2D Strip 결과가 아니며 그래프의 높이는 실제 Optical Power가 아닙니다.","see":"기존 Slab 경계조건을 푼 Fundamental Mode의 Signed Field입니다.","notice":"Core 경계에서 Field가 끊기지 않고 Cladding으로 감소하며 이어집니다.","meaning":"Guiding은 Field가 바깥에서 0이 되는 것이 아니라 Core 부근에 국소화되는 상태입니다.","source":"notebook/models.js slabTE / slabField"},{"id":"1.2A","lesson":"1.2","title":"Fundamental Mode와 Higher-order Mode","classification":"Analytical","anchor":"#section-concept > p:nth-of-type(3)","renderer":"modes","parameters":"대칭 Slab TE · d = 220 또는 500 nm · y 무한 · λ₀ = 1550 nm · nCore = 3.48, nClad = 1.444. 각 Mode를 max|Ey| = 1로 정규화합니다. Field²는 |Ey|²/max|Ey|²입니다.","limits":"TE₁은 실제 해가 있는 조건에서만 표시합니다. Mode별 최대값 정규화는 동일 Power 정규화가 아니며 2D Vector Intensity가 아닙니다.","see":"같은 조건의 TE₀와 TE₁을 공통 x 축으로 비교합니다.","notice":"TE₁의 중심 Node와 부호를 확인한 뒤 Field²로 바꾸세요. 220 nm에서는 TE₁이 없습니다.","meaning":"Mode 차수는 허용된 공간 분포의 차이이며 제곱한 그림은 Phase 부호를 보존하지 않습니다.","source":"notebook/models.js slabTE / slabField"},{"id":"1.2B","lesson":"1.2","title":"2D Scalar Transverse Mode Profile","classification":"Numerical","anchor":"#section-equation > .worked","renderer":"scalar","parameters":"Scalar u₀₀ · Si/SiO₂ · λ₀ = 1550 nm · H = 220 nm · W = 220/500/800 nm. nCore = 3.48, nClad = 1.444. 5 nm 계산 Grid, x–y = ±1 µm에서 u = 0. 101×101 표시 표본과 고정 Color Scale을 사용합니다.","limits":"u는 Scalar Field이며 실제 Vector E 성분이나 TE/TM 분류가 아닙니다. 고굴절률 대비 Silicon의 경계 Vector 효과를 생략합니다. 수치 Grid 수렴은 실제 Strip의 n_eff 정확도를 보장하지 않습니다. |u|²/max|u|²는 상대량이며 실제 Power가 아닙니다.","see":"실제로 계산한 Scalar 고유해의 정규화된 제곱 분포입니다. 사각형은 Core 경계입니다.","notice":"Linear 0–1과 dB −40–0의 Color Bar를 구별하세요. 어두운 Cladding에도 약한 Tail이 이어집니다.","meaning":"두 횡 방향의 경계가 공간 분포를 정합니다. Scalar 근사의 결과를 Full-vector Mode로 해석하지 않습니다.","source":"scripts/precompute_scalar_modes.py → notebook/data/scalar-modes.json; docs/SCALAR_2D_VALIDATION.json"},{"id":"1.3A","lesson":"1.3","title":"Core의 Wavevector를 성분으로 읽기","classification":"Analytical","anchor":"#section-concept > p:nth-of-type(2)","renderer":"vector","parameters":"대칭 Slab d = 500 nm의 TE₀ · λ₀ = 1550 nm · nCore = 3.48, nClad = 1.444. kCore, β, h, q 단위: rad/µm 또는 1/µm. 삼각형은 Core Plane-wave 성분을 나타냅니다.","limits":"Core의 ±h 성분이 합쳐진 Slab Mode입니다. q는 Cladding의 실수 감쇠율이며 전파하는 횡 방향 Wavevector h와 같지 않습니다. 아래 Phase Calculator의 가정한 n_eff와 별도 조건입니다.","see":"Core 내부 kCore를 축 방향 β와 횡 방향 h로 분해합니다.","notice":"빗변 kCore와 β·h의 직각 관계를 보세요. Cladding의 q는 별도로 표시합니다.","meaning":"β는 Mode의 축 방향 Phase 변화율이고 q는 바깥 Tail의 공간적 감소율입니다.","source":"notebook/models.js slabTE; kCore²=β²+h²; q²=β²−(nClad k₀)²"},{"id":"1.3B","lesson":"1.3","title":"같은 조건으로 보는 Phase와 Guided Wavelength","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"phase","parameters":"λ₀ = 1550 nm 고정 · Notebook의 가정한 n_eff와 L을 그대로 공유합니다. β [rad/µm], L·z·λg [µm], φ [rad]. 단색·균일 단면·단일 Mode·무손실을 가정합니다.","limits":"n_eff는 Phase 실험의 가정한 입력이며 2D Strip 계산값이 아닙니다. 정규화된 cos(βz)의 진폭과 화살표 길이는 Power를 뜻하지 않습니다. Group Velocity는 계산하지 않습니다.","see":"고정된 3.1 µm 확대 구간의 Wave와 길이 L까지의 누적 Phase입니다.","notice":"오른쪽 Notebook에서 n_eff 또는 L을 바꾸면 이 Figure와 수식도 함께 변합니다.","meaning":"n_eff가 바뀌면 물결 간격이 변하고, L만 바뀌면 β는 일정한 채 누적 Phase가 변합니다.","source":"notebook/models.js phase","live":true},{"id":"1.4A","lesson":"1.4","title":"같은 조건에서 Geometry를 비교하기","classification":"Numerical","anchor":"#section-concept > p:nth-of-type(2)","renderer":"geometry","parameters":"모든 비교: λ₀ = 1550 nm, H = 220 nm, nCore = 3.48, nClad = 1.444, 동일 Scalar FD/Boundary 조건. W만 220/500/800 nm. 각 Profile의 Peak를 1로 정규화하며 공통 Color Scale을 사용합니다.","limits":"2D Scalar 근사입니다. 표시하는 n_eff,scalar는 해당 방정식의 수치 고유값이며 실제 Strip 또는 Quasi-TE의 설계값이 아닙니다. Peak 정규화는 동일 Input Power 비교가 아닙니다. 아래 Slab TE Branch와도 다른 모델입니다.","see":"선택한 Width의 2D Map과 세 Width의 y = 0 단면을 공통 축으로 비교합니다.","notice":"Narrow / Reference / Wide를 바꾸며 실제 Core 경계와 바깥 Field 분포를 함께 보세요.","meaning":"Geometry가 바뀌면 허용된 공간 분포와 Scalar 고유값도 달라집니다. 같은 Height와 모델 조건에서의 비교입니다.","source":"scripts/precompute_scalar_modes.py → notebook/data/scalar-modes.json"},{"id":"1.4B","lesson":"1.4","title":"Slab Width와 n_eff·Mode Count","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"sweep","parameters":"기존 대칭 Slab TE 계열 · y 무한 · λ₀ = 1550 nm · nCore = 3.48, nClad = 1.444 · d = 100–1000 nm. 점선은 Notebook의 현재 Width d입니다.","limits":"TE 계열만 세며 TM/실제 2D Strip의 Mode 수가 아닙니다. Branch와 Count는 같은 Slab 모델을 사용하고, Numerical Scalar Figure와 값이 같을 필요가 없습니다.","see":"허용된 TE Branch와 같은 Width에서의 TE Mode 수를 위아래로 연결합니다.","notice":"Branch가 Cladding Index 위에 나타날 때 Mode 수가 증가합니다. Width를 조절해 점선을 옮겨 보세요.","meaning":"Single-mode 조건은 재료·파장·Geometry·Polarization과 모델 범위에 의존합니다.","source":"notebook/models.js slabTE","live":true},{"id":"1.5A","lesson":"1.5","title":"Bend Radius와 Radiation을 구별해 보기","classification":"Conceptual","anchor":"#section-concept > p:nth-of-type(2)","renderer":"bend","parameters":"Small R = 2 µm / Large R = 10 µm · 동일한 중심선 Radius Scale의 90° Circular Bend. 선 굵기는 실제 Waveguide Width나 Field 세기가 아닙니다.","limits":"자체 제작한 정성 그림입니다. Maxwell/BPM/FDTD Field Radiation Map, 정량 Radiation Rate 또는 Loss 계산 결과가 아닙니다. 점선 화살표의 개수·길이로 손실량을 읽지 않습니다.","see":"같은 축척에서 작은 Radius와 큰 Radius의 경로와 공간을 비교합니다.","notice":"작은 R의 급한 곡률과 큰 R의 넓은 Bounding Square를 보세요. 점선 화살표는 가능한 Radiation의 개념만 나타냅니다.","meaning":"곡률을 완만하게 하면 Radiation을 줄이는 데 도움이 될 수 있지만 더 큰 Footprint와 경로 길이가 필요합니다.","source":"Original SVG, qualitative bend physics; no bend EM solver"},{"id":"1.5B","lesson":"1.5","title":"가정한 Bend Loss와 Footprint의 Trade-off","classification":"Illustrative","anchor":"#section-equation > .worked","renderer":"tradeoff","parameters":"기존 합성 표: R = 2/5/10/20 µm에서 b(R) = 0.4/0.08/0.02/0.005 dB/90°. α = 3 dB/cm, 직선 2 mm, 90° Circular Bend 4개. Total은 기존 Analytical Ledger로 계산합니다. A = R²는 한 코너의 중심선 Bounding Square [µm²].","limits":"물리 Solver가 산출한 Radius–Loss 곡선이 아닙니다. 네 점은 교육용 후보이며 사이 값을 추정·보간하거나 실제 공정의 Radius 권고로 사용하지 않습니다. 실제 Radiation Map/실측/PDK 데이터가 아닙니다.","see":"네 Radius 후보의 가정한 추가 Bend Loss, 계산한 Total Loss와 한 코너 면적을 비교합니다.","notice":"Notebook의 Radius를 바꾸면 같은 후보가 강조됩니다. Loss 0.8 dB와 면적 100 µm² 제약을 함께 보세요.","meaning":"Bend 추가 손실과 경로 길이에 따른 손실을 구별하고, 공간 조건 안에서 선택 이유를 설명합니다.","source":"notebook/models.js bendTable / designLedger; synthetic inputs unchanged","live":true},{"id":"2.1A","lesson":"2.1","title":"Optical Power Splitting","classification":"Analytical","anchor":"#section-concept > p:last-of-type","renderer":"ch2splitter","see":"입력과 두 Forward 출력의 Power Ledger입니다.","notice":"두 출력 합과 Loss를 함께 입력에 비교하세요.","meaning":"분배율 r와 총 효율 η는 서로 다른 입력입니다.","parameters":"Pin=1 mW; r, Excess Loss는 Notebook과 공유. 선의 기하학은 Conceptual.","limits":"완전한 3-port Scattering Matrix나 Y/DC 형상 해석이 아닙니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.1B","lesson":"2.1","title":"Field Amplitude vs Optical Power","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"ch2amplitude","see":"정규화 진폭 x와 그 제곱 x²를 비교합니다.","notice":"진폭 0.7071에서 Power가 0.5입니다.","meaning":"Field와 Power의 관계는 제곱이며 간섭은 복소 Field를 먼저 합합니다.","parameters":"x=|a|/√Pin, y=진폭 또는 상대 Power; 0–1 무차원.","limits":"Power-normalized Mode 전제; 서로 다른 Mode의 raw E[V/m] 비교가 아닙니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.2A","lesson":"2.2","title":"Directional Coupler Field Coupling","classification":"Conceptual","anchor":"#section-concept > p:nth-of-type(1)","renderer":"ch2dcStructure","see":"두 분리된 Core와 정성적 Tail 겹침입니다.","notice":"겹침의 색과 면적은 정량 Field가 아닙니다.","meaning":"두 Guide 전체의 Supermode가 다른 Phase를 누적합니다.","parameters":"동일 Guide의 정성 구조; κ=(βeven−βodd)/2.","limits":"2D Mode Solver나 실제 Gap→κ 결과가 아닙니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.2B","lesson":"2.2","title":"Coupling Length vs Output Power","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"ch2dcTransfer","see":"Through/Cross가 L에 따라 교환됩니다.","notice":"두 곡선의 합은 항상 1, Cross 최대 이후 되돌아옵니다.","meaning":"단일 입력의 Mode Envelope Power는 cos²/sin² 관계입니다.","parameters":"κ rad/µm와 선택 L µm는 Notebook 공유; 곡선 L=0–100µm, Δβ=0.","limits":"일정 κ, Lossless 2-mode. 실제 2D Electric Field Map이 아닙니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.2C","lesson":"2.2","title":"Y-branch and Symmetric Splitting","classification":"Conceptual","anchor":"#y-branch","renderer":"ch2y","see":"하나의 연결된 Core가 두 Arm으로 갈라집니다.","notice":"역방향 반대 Phase 입력은 대칭 Stem에 전부 전달되지 않습니다.","meaning":"대칭 Mode 분기와 2-guide Coupling은 다른 과정입니다.","parameters":"Forward 대칭 입력, 이상 진폭 1/√2 표시.","limits":"정량 방사/반사/Tip Loss 미계산; 완전한 Lossless Matched 3-port 아님.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.2D","lesson":"2.2","title":"MMI Mode Superposition","classification":"Conceptual","anchor":"#mmi","renderer":"ch2mmi","see":"공통 Multimode 영역과 두 출력입니다.","notice":"점선은 계산된 Mode나 광선 경로가 아닙니다.","meaning":"서로 다른 βm를 가진 여러 Mode가 Self-imaging을 만듭니다.","parameters":"Σ cmψm exp(iβmz)의 개념; 좌표는 구조 도식.","limits":"Self-image 거리와 2D Field를 계산하지 않았습니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.3A","lesson":"2.3","title":"Two Optical Paths","classification":"Analytical","anchor":"#section-concept > p:nth-of-type(3)","renderer":"ch2paths","see":"같은 Index에서 길이가 다른 두 Arm과 Phase 차이입니다.","notice":"아직 결합 전이므로 각 Arm Power는 일정합니다.","meaning":"OPL 차이는 Relative Phase를 누적시킵니다.","parameters":"Lu=10+ΔL µm, Ll=10 µm, n_eff와 λnm은 Notebook 공유. 구조는 정성 도식.","limits":"실수 동일 Index, Lossless 단색. 경로 선은 정량 Layout이 아닙니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.3B","lesson":"2.3","title":"Phase Accumulation","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"ch2phase","see":"같은 진폭의 두 Signed Field가 상대 Phase만큼 이동합니다.","notice":"각 곡선의 높이와 그 상대 위치를 구별하세요.","meaning":"Phase 변화가 곧 단독 Arm의 Power 변화는 아닙니다.","parameters":"Re(a), x=z 0–2 µm; β와 Δφ는 Notebook과 같은 모델.","limits":"시간 Detector 신호나 변조 Eye가 아닙니다. 같은 Frequency·Mode 가정.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.4A","lesson":"2.4","title":"Complete MZI Structure","classification":"Conceptual","anchor":"#section-concept > p:nth-of-type(2)","renderer":"ch2mziStructure","see":"Input U, 두 Arm, Output U†와 두 Port입니다.","notice":"Output Port Convention과 Arm Phase를 같이 읽으세요.","meaning":"두 번의 Field 분배와 Phase를 연속해서 적용해야 합니다.","parameters":"Power-normalized Field, Δφ=φu−φl, Port1 at Δφ0 bright.","limits":"정량 Layout이나 계산한 Spatial Field가 아니라 Circuit Schematic입니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.4B","lesson":"2.4","title":"MZI Transfer Curve","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"ch2mziTransfer","see":"Δφ에 따른 상보적 두 출력입니다.","notice":"T1+T2=1, Port1=cos², Port2=sin²입니다.","meaning":"Lossless Unitary Combiner는 Power를 두 출력에 재분배합니다.","parameters":"Δφ/π 0–2; 두 50:50 Coupler U†DU; Notebook 공유.","limits":"손실·분산·편광·비결맞음·실제 ER 미포함.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.4C","lesson":"2.4","title":"Complex Field Interference","classification":"Analytical","anchor":"#section-experiment > p:first-of-type","renderer":"ch2phasors","see":"Port1에서 1/2과 exp(iΔφ)/2의 Vector 합입니다.","notice":"Vector 길이 제곱이 T1이며 Field 부호가 Power 부호는 아닙니다.","meaning":"Constructive/Destructive Interference는 복소 합에서 나옵니다.","parameters":"Re/Im power-normalized dimensionless amplitudes; Δφ Notebook 공유.","limits":"단면 EM Vector 성분이 아니라 Modal Amplitude의 복소 평면입니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.5R1","lesson":"2.5","title":"Ring Resonator · Recirculating Field","classification":"Conceptual","anchor":"#ring-resonator","renderer":"ch2ringStructure","see":"한 Bus와 닫힌 Ring의 결합 구조입니다.","notice":"a는 Power가 아니라 Round-trip Amplitude입니다.","meaning":"반복 도착한 Field가 직접 Bus Field와 간섭합니다.","parameters":"All-pass Bus 하나; θ Round-trip Phase.","limits":"Stored Field나 단면 EM 해석 결과가 아닙니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md","notebookScene":"ring"},{"id":"2.5R2","lesson":"2.5","title":"Ring Transfer and Local FSR","classification":"Analytical","anchor":"#ring-example","renderer":"ch2ringTransfer","see":"Round-trip Phase에 따른 Bus T와 내부 Dissipation입니다.","notice":"t=a에서 Resonance T=0, a=1이면 All-pass 크기는 1입니다.","meaning":"Critical Coupling에는 내부 Loss와 외부 Coupling의 균형이 필요합니다.","parameters":"θ/π −1–1, t와 a Notebook 공유; FSR λ1550nm,R10µm, ng 독립 입력.","limits":"Phase-axis 그래프, Dispersion Spectrum/Q/Add-drop 모델 아님.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md","notebookScene":"ring"},{"id":"2.5G1","lesson":"2.5","title":"Bragg Grating · Periodic Backscattering","classification":"Conceptual","anchor":"#bragg-grating","renderer":"ch2braggStructure","see":"주기 구조와 Forward/Backward Mode입니다.","notice":"Chip 밖으로 방출하는 Grating Coupler와 구별하세요.","meaning":"Phase-matched 후진 성분이 합쳐져 반사를 만듭니다.","parameters":"1차 Bragg λB≈2neffΛ; 그림은 정성적 구조.","limits":"실제 Corrugation에서 κg를 계산하지 않았습니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md","notebookScene":"bragg"},{"id":"2.5G2","lesson":"2.5","title":"Uniform Bragg Reflection / Transmission","classification":"Analytical","anchor":"#bragg-example","renderer":"ch2braggTransfer","see":"δ에 따른 Uniform CMT의 R/T입니다.","notice":"R+T=1이며 δ=0에서 tanh²/sech²입니다.","meaning":"전후진 경계조건이 DC의 주기 Power Exchange와 다른 응답을 만듭니다.","parameters":"δ µm⁻¹, κg µm⁻¹, Lg µm Notebook 공유; 일정 실수 κg와 Lossless.","limits":"Apodized/Phase-shifted/실제 제작 Spectrum은 계산하지 않습니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md","notebookScene":"bragg"},{"id":"2.5A","lesson":"2.5","title":"Passive PIC Schematic","classification":"Conceptual","anchor":"#passive-circuit","renderer":"ch2mziStructure","see":"Input, 두 Coupler, 두 Arm과 두 출력입니다.","notice":"이 Exercise는 U(r)† D U(r)이며 r를 독립 입력합니다.","meaning":"회로는 검증한 Component의 Field 관계를 연결합니다.","parameters":"실제 Layout 아님; Notebook r, Phase, Loss는 Figure 2.5B에 정량 표시.","limits":"Ring과 Bragg는 앞서 비교한 별도 모델이며 이 MZI에 연결하지 않았습니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md","notebookScene":"circuit"},{"id":"2.5B","lesson":"2.5","title":"Design Conditions and Output Response","classification":"Analytical","anchor":"#section-experiment > p:last-of-type","renderer":"ch2circuit","see":"현재 조건, Phase, Arm Power, Output과 Loss Ledger입니다.","notice":"출력 두 개와 Propagation Loss의 합이 1mW인지 확인하세요.","meaning":"Amplitude→Phase→Combiner→Power를 한 모델로 연결합니다.","parameters":"Pin1mW; Lu1000+ΔLµm,Ll1000µm; αdB/cm, r, λnm, neff는 Circuit Notebook 공유.","limits":"반사/실제 Bend/Excess Loss/PDK/수율 미포함. r와 neff·Loss는 독립 가정.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md","notebookScene":"circuit"},{"id":"3.1A","lesson":"3.1","title":"Fiber and Target Mode Profiles","classification":"Analytical","anchor":"#section-concept > p:first-of-type","renderer":"ioModes","see":"공통 평면에서 단위 Power로 정규화한 두 Scalar Gaussian의 Intensity Map입니다.","notice":"Core Width가 아니라 Gaussian Mode 반경 w를 바꿉니다. 두 Map은 공통 표시 Scale입니다.","meaning":"입력 Power가 같아도 Field 크기와 위치가 다르면 같은 Mode가 아닙니다.","parameters":"x,y −12…12µm; MFD=2w; color=sqrt(I/common Imax). 무한 평면 정규화 해의 유한 표시 창.","limits":"실제 Vector Eigenmode/Si 단면 해가 아닙니다. 색의 밝기 자체가 Input Power는 아닙니다.","source":"Original SVG / IOPhysics. Sources and derivation: TEXTBOOK_SOURCE_MAPPING.md / notebook/CH3_MODEL_CONTRACT.md"},{"id":"3.1B","lesson":"3.1","title":"Normalized Gaussian Mode Overlap","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"ioOverlap","see":"Target 반경에 따른 동일 평면의 정규화 Overlap입니다.","notice":"ηsize, Offset Factor와 η를 분리해 읽습니다.","meaning":"Amplitude 투영의 절댓값 제곱이 정규화 Power Overlap입니다.","parameters":"반경 w₂ µm, η 무차원; 두 Profile·Offset은 Notebook과 동일 입력.","limits":"동일 매질/공통 평면/Planar wavefront/같은 Polarization. 실제 Facet Reflection/총 Device Efficiency는 별도입니다.","source":"Original SVG / IOPhysics. Sources and derivation: TEXTBOOK_SOURCE_MAPPING.md / notebook/CH3_MODEL_CONTRACT.md"},{"id":"3.2A","lesson":"3.2","title":"Grating Momentum and Fiber Angle","classification":"Conceptual","anchor":"#section-concept > p:nth-of-type(2)","renderer":"ioGrating","see":"Guided 방향, Normal, 방사각과 Period의 관계입니다.","notice":"θ의 Normal 기준과 +z 부호를 확인하세요.","meaning":"Grating Spatial Frequency가 두 Wave의 축 방향 Phase 차이를 연결합니다.","parameters":"1차 회절·nclad=1; matched Period 수치는 주어진 ngrat로 계산. 구조 도식은 비축척.","limits":"선/홈 모양은 EM 계산이 아닙니다. ngrat는 Geometry Solver 결과가 아닌 독립 입력입니다.","source":"Original SVG / IOPhysics. Sources and derivation: TEXTBOOK_SOURCE_MAPPING.md / notebook/CH3_MODEL_CONTRACT.md"},{"id":"3.2B","lesson":"3.2","title":"Finite Array Phase Factor","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"ioArray","see":"파장에 따른 N개 동일 산란 기여의 상대 Coherent Factor입니다.","notice":"F=1은 실제 Efficiency 100%가 아닙니다. 현재 λ의 Marker를 읽으세요.","meaning":"공간적으로 누적된 Relative Phase가 보강/상쇄를 만듭니다.","parameters":"λ1450–1650nm, 고정 ngrat,θ,Λ,N; F=|Σexp(ijΔβΛ)/N|².","limits":"산란 강도·Directionality·BOX·분산·반사·Fiber Overlap 미포함. 실제 장치 Bandwidth를 추출하지 않습니다.","source":"Original SVG / IOPhysics. Sources and derivation: TEXTBOOK_SOURCE_MAPPING.md / notebook/CH3_MODEL_CONTRACT.md"},{"id":"3.3A","lesson":"3.3","title":"Inverse Taper and Overlay","classification":"Conceptual","anchor":"#section-concept > p:nth-of-type(2)","renderer":"ioEdge","see":"Fiber, 낮은 Index Overlay, 점차 넓어지는 Silicon Core의 연결입니다.","notice":"작은 Core가 반드시 작은 Mode는 아닙니다.","meaning":"Confinement를 바꿔 Facet의 Mode를 넓히고 내부 Mode로 전달하는 구조입니다.","parameters":"Fiber→Facet→PIC 전파 방향의 정성 도식; 실제 치수와 Field 미표시.","limits":"Tip Width→Mode Radius·Taper Loss·최소 길이를 계산하지 않습니다. Vector/EME/FDTD 미수행.","source":"Original SVG / IOPhysics. Sources and derivation: TEXTBOOK_SOURCE_MAPPING.md / notebook/CH3_MODEL_CONTRACT.md"},{"id":"3.3B","lesson":"3.3","title":"Alignment Penalty and 1 dB Offset","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"ioAlignment","see":"같은 크기/각도에서 중심 정렬 대비 Offset Penalty입니다.","notice":"곡선의 상대 값과 Readout의 절대 Overlap을 구별하세요.","meaning":"Mode 크기와 Phase Gradient는 위치/각도 공차에 다른 영향을 줍니다.","parameters":"Δx −8…8µm; 두 가정한 Gaussian 반경과 작은 Tilt는 Notebook 공유.","limits":"공통 평면 Scalar 모델; 실측 조립 공차·수율·Facet 굴절·Wavefront Propagation 결과가 아닙니다.","source":"Original SVG / IOPhysics. Sources and derivation: TEXTBOOK_SOURCE_MAPPING.md / notebook/CH3_MODEL_CONTRACT.md"},{"id":"3.4A","lesson":"3.4","title":"Complex Jones State","classification":"Analytical","anchor":"#section-concept > p:nth-of-type(2)","render   <script>/* Original educational models. SI conversions are explicit at the boundaries. */
(function(root) {
  'use strict';
  function criticalAngle(nCore=3.48, nClad=1.444) {
    if (!(nCore > nClad && nClad > 0)) throw new RangeError('Require nCore > nClad > 0');
    return Math.asin(nClad/nCore)*180/Math.PI;
  }
  function phase(neff, lambdaNm, lengthUm) {
    if (!(neff>0 && lambdaNm>0 && lengthUm>=0)) throw new RangeError('Invalid phase inputs');
    const lambdaUm=lambdaNm/1000, beta=2*Math.PI*neff/lambdaUm;
    return {beta, phi:beta*lengthUm, cycles:neff*lengthUm/lambdaUm, guidedUm:lambdaUm/neff};
  }
  function slabTE(widthNm=500, lambdaNm=1550, nCore=3.48, nClad=1.444) {
    if (!(widthNm>0 && lambdaNm>0 && nCore>nClad && nClad>0)) throw new RangeError('Invalid slab inputs');
    // x confinement with |x|<=a, infinite y, propagation +z; electric field Ey.
    const a=widthNm/2000, k0=2*Math.PI/(lambdaNm/1000);
    const V=k0*a*Math.sqrt(nCore*nCore-nClad*nClad), modes=[];
    for(let m=0;m<256 && m*Math.PI/2<V-1e-10;m++) {
      const lower=m*Math.PI/2;
      let lo=lower, hi=Math.min(V,lower+Math.PI/2);
      // u = m*pi/2 + atan(sqrt(V^2-u^2)/u); strictly increasing residual.
      for(let j=0;j<80;j++) {
        const u=(lo+hi)/2, w=Math.sqrt(Math.max(0,V*V-u*u));
        if(u-lower-Math.atan2(w,u)>0) hi=u; else lo=u;
      }
      const u=(lo+hi)/2, w=Math.sqrt(Math.max(0,V*V-u*u));
      const h=u/a, q=w/a, beta=Math.sqrt((nClad*k0)**2+q*q), neff=beta/k0;
      const even=m%2===0, edge=even?Math.cos(u):Math.sin(u);
      const inside=a*(1+(even?1:-1)*Math.sin(2*u)/(2*u)), outside=edge*edge/q;
      modes.push({m,u,w,h,q,beta,neff,a,V,even,corePower:inside/(inside+outside)});
    }
    return {widthNm,lambdaNm,nCore,nClad,V,a,k0,modes};
  }
  function slabField(mode,xUm) {
    const {a,u,q,even}=mode, ax=Math.abs(xUm);

  const active=reached.at(-1)||targets[0];if(!active)return;
  const section=active.closest('[data-section]'),topic=active.dataset.notebookScene||section.dataset.scene;
  const context=$('#notebook-context');if(context)context.textContent=`지금 읽는 절 · ${section.querySelector('h2').textContent}`;
  $('#notebook').dataset.scene=topic;
  document.querySelectorAll('.teaching-figure').forEach(el=>el.classList.toggle('figure-active',el===active));
  if(current().id==='2.5'&&['ring','bragg','circuit'].includes(topic)&&topic!==connectedTopic){connectedTopic=topic;settings().ch2View=['ring','bragg','circuit'].indexOf(topic);renderNotebook();const c=$('#notebook-context');if(c)c.textContent=`지금 읽는 절 · ${section.querySelector('h2').textContent}`;}else if(current().id==='1.2'&&topic!==connectedTopic){
   const previous=connectedTopic;connectedTopic=topic;
   const view=topic==='polarization'?'polarization':'modes';
   if(previous&&settings().view!==view){settings().view=view;renderNotebook();const c=$('#notebook-context');if(c)c.textContent=`지금 읽는 절 · ${section.querySelector('h2').textContent}`;}
  }else connectedTopic=topic;
 }
 observer=new IntersectionObserver(connect,{root,rootMargin:'-5% 0px -55% 0px',threshold:[0,.1,.3]});targets.forEach(el=>observer.observe(el));connect();
}

  }else{
   $('#mode-buttons').hidden=false;$('#notebook-plot').innerHTML=view==='dispersion'?dispersionPlot(d,index):fieldPlot(model,mode);
   $('#geometry-caption').textContent=view==='dispersion'?'Analytical Slab · 모든 허용된 TE Branch. 점선은 현재 Width이며 실제 Strip의 Cutoff 곡선이 아닙니다.':'Analytical Slab · Signed Ey / max|Ey|. Core 밖의 Tail도 해의 일부입니다. y 방향 무한, 유한 Height 없음.';
   $('#notebook-readout').innerHTML=`<p>허용된 Slab TE Mode <strong>${model.modes.length}개</strong> · 선택 TE${mode.m}</p><p>n_eff = <strong>${mode.neff.toFixed(4)}</strong> · Core Power ΓTE = <strong>${(mode.corePower*100).toFixed(1)}%</strong></p><p class="caption">V = ${model.V.toFixed(3)} · 내부 Node ${mode.m}개. ΓTE는 이 TE Slab의 축 방향 Power 비율입니다.</p>`;
  }
 }else if(l.id==='1.5'){
  const index=Math.round(num('radius',2,0,3)),p=P.designLedger(index),R=p.radius,scale=5,side=R*scale;
  $('#radius-value').textContent=R+' µm';$('#radius').setAttribute('aria-valuetext',R+' micrometers');
  const bounds=$('#radius').nextElementSibling;bounds.children[0].textContent='2 µm';bounds.children[1].textContent='20 µm';
  $('#notebook-plot').innerHTML=svg('One circular 90 degree bend and radius squared bounding square at a common scale',`<rect x="130" y="45" width="${side}" height="${side}" fill="var(--soft)" stroke="var(--line)"/><path d="M130 ${45+side} A${side} ${side} 0 0 0 ${130+side} 45" fill="none" stroke="var(--plot)" stroke-width="5"/><path d="M130 45 V${45+side} M130 45 H${130+side}" stroke="var(--muted)" stroke-dasharray="4 3"/><text x="275" y="75">R = ${R} µm</text><text x="275" y="108">R² = ${R*R} µm²</text><text x="275" y="141">one 90° corner</text><text x="35" y="205">One corner · fixed scale</text>`, '0 0 500 225');
  $('#notebook-readout').innerHTML=`<p>Propagation <strong>${p.propagationDb.toFixed(3)} dB</strong> + Bend <strong>${p.bendsDb.toFixed(3)} dB</strong></p><p>Total <strong>${p.totalDb.toFixed(3)} dB</strong> → Power <strong>${(p.transmission*100).toFixed(1)}%</strong></p><p class="caption">${p.footprint<=100?'공간 ≤ 100 µm² 조건 만족':'공간 100 µm² 조건 초과'} · ${p.totalDb<=.8?'Loss ≤ 0.8 dB 조건 만족':'Loss 0.8 dB 조건 초과'}</p>`;
  $('#ledger-table').innerHTML=`<table><caption class="caption">가정한 Bend 데이터 · 단위: R [µm], Loss [dB], A [µm²]</caption><thead><tr><th scope="col">R</th><th scope="col">Prop.</th><th scope="col">Bend</th><th scope="col">Total</th><th scope="col">A</th></tr></thead><tbody>${P.bendTable.map((_,i)=>{const p=P.designLedger(i);return `<tr ${i===index?'style="background:var(--soft)"':''}><th scope="row">${p.radius}</th><td>${p.propagationDb.toFixed(3)}</td><td>${p.bendsDb.toFixed(3)}</td><td>${p.totalDb.toFixed(3)}</td><td>${p.footprint}</td></tr>`;}).join('')}</tbody></table><p class="caption">한 코너 A ≤ 100, Total ≤ 0.8. 전체 Route 길이는 선택에 따라 ${p.lengthCm.toFixed(5)} cm이며, 표의 Bend 항은 그 경로의 Propagation 이외의 추가 손실입니다.</p>`;
 }
}
function showSession(){remember();$('#session-content').innerHTML=(storageOK?'':'<p role="status">이 Browser에서 자동 저장할 수 없습니다. 기록 내보내기로 백업해 주세요.</p>')+lessons.map(l=>`<div class="session-item"><span>${l.id} · ${l.short}</span><span>${state.completed.includes(l.id)?'읽음으로 기록':'자유롭게 학습 중'}</span></div>`).join('');$('#session-dialog').showModal();}
$('#lesson-nav').addEventListener('click',e=>navigateClick(e));
$('#reading').addEventListener('click',e=>{
 const a=e.target.closest('[data-answer]'),extra=e.target.closest('[data-extra]');
 if(a){state.answers[state.lesson]=Number(a.dataset.answer);renderTutor();save();}
 if(extra){state.extras[state.lesson]=extra.dataset.extra;renderTutor();save();if(extra.dataset.extra==='notebook'&&matchMedia('(max-width:760px)').matches)$('#notebook').scrollIntoView();}
 if(e.target.closest('[data-lesson]'))navigateClick(e);
 if(e.target.closest('#mark-read')){const i=state.completed.indexOf(state.lesson);if(i<0)state.completed.push(state.lesson);else state.completed.splice(i,1);const b=$('#mark-read');b.setAttribute('aria-pressed',String(i<0));b.textContent=i<0?'읽음 기록됨 · 취소':'이 Lesson 읽음으로 기록';save();}
 if(e.target.closest('#compare-prediction'))$('#prediction-feedback').textContent=current().predictionFeedback;
});
function navigateClick(e){const b=e.target.closest('[data-lesson]');if(!b)return;remember();state.lesson=b.dataset.lesson;save();renderLesson(true);$('#lesson-nav [aria-current]').scrollIntoView({block:'nearest',inline:'nearest'});}
$('#reading').addEventListener('input',e=>{if(e.target.dataset.note){state.notes[state.lesson+':'+e.target.dataset.note]=e.target.value.slice(0,12000);save();}});
$('#reading').addEventListener('change',e=>{if(e.target.id==='prediction'){state.predictions[state.lesson]=Number(e.target.value);$('#prediction-feedback').textContent='';save();}});
$('#notebook').addEventListener('input',e=>{if(e.target.dataset.setting){settings()[e.target.dataset.setting]=Number(e.target.value);updateNotebook();TeachingFigures.refresh($('#reading'),settings());save();}});
$('#notebook').addEventListener('change',e=>{if(e.target.dataset.selectSetting){settings()[e.target.dataset.selectSetting]=e.target.value;updateNotebook();TeachingFigures.refresh($('#reading'),settings());save();}});
$('#notebook').addEventListener('click',e=>{const ch2=e.target.closest('[data-ch2-view]');if(ch2){settings().ch2View=Number(ch2.dataset.ch2View);renderNotebook();save();}const b=e.target.closest('[data-view]');if(b){settings().view=b.dataset.view;renderNotebook();save();}const f=e.target.closest('[data-field]');if(f){settings().field=f.dataset.field;updateNotebook();TeachingFigures.refresh($('#reading'),settings());save();}const m=e.target.closest('[data-mode]');if(m){settings().mode=Number(m.dataset.mode);updateNotebook();TeachingFigures.refresh($('#reading'),settings());save();}});
function onScroll(){if(navigating)return;clearTimeout(scrollTimer);scrollTimer=setTimeout(remember,250);}
$('#reading').addEventListener('scroll',onScroll,{passive:true});window.addEventListener('scroll',onScroll,{passive:true});window.addEventListener('pagehide',remember);
matchMedia('(max-width:760px)').addEventListener('change',()=>{placeNotebook();setupObserver();});
$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';setTheme();save();};
$('.brand').onclick=e=>{e.preventDefault();remember();state.lesson=lessons[0].id;state.positions[state.lesson]=0;save();renderLesson(true);};
$('#session').onclick=showSession;$('#close-session').onclick=()=>$('#session-dialog').close();
$('#export').onclick=()=>{remember();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=TEXTBOOK.multiChapter?'silicon-photonics-study-record.json':'silicon-photonics-ch1-study-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('#import').onchange=async e=>{$('#import-status').textContent='불러오는 중…';try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error('1 MB 이하의 학습 기록을 선택해 주세요.');const clean=validate(JSON.parse(await file.text()));state=clean;setTheme();save();renderLesson();$('#import-status').textContent='학습 기록을 불러왔습니다.';}catch(err){$('#import-status').textContent='가져오지 못했습니다. '+err.message;}e.target.value='';};
TeachingFigures.bind({get:()=>settings(),set:(k,v)=>{settings()[k]=v;save();}});
setTheme();renderLesson();save();
})();
</script>
</body>
</html>
