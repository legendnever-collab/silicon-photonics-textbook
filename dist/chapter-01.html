  <noscript>이 교재의 Guided Tutor와 Notebook에는 JavaScript가 필요합니다. Source의 textbook/chapter-01에서 설명 원문을 읽을 수 있습니다.</noscript>
  <script>window.TEXTBOOK={"lessons":[{"id":"1.1","short":"Confinement","title":"Why Does Light Stay in a Waveguide?","time":"7–9분","lead":"빛을 가둔다는 말을 재료의 성질에서 시작해 Wave의 조건으로 다시 이해합니다.","question":"Silicon의 Refractive Index가 SiO₂보다 높다는 것이 빛의 진행에 왜 중요할까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"빛이 지나갈 길을 만드는 일","scene":"tir","html":"\u003cp>전자 회로의 Metal Wire가 전류의 경로를 정하듯, Photonic Circuit에는 빛을 원하는 위치까지 전달하는 길이 필요합니다. 그 길이 \u003cstrong>Optical Waveguide\u003c/strong>입니다. 하지만 투명한 재료로 가느다란 선을 만든다고 항상 빛이 그 안에 머무르지는 않습니다. 주변 재료와 어떤 차이가 있는지가 중요합니다.\u003c/p>\u003cp>이번 Chapter에서는 익숙한 Silicon Core와 SiO₂ Cladding을 예로 사용합니다. 먼저 ‘빛이 반사되어 남는다’는 직관을 얻고, 그 직관만으로 설명할 수 없는 공간적 Field Distribution까지 살펴봅니다. 오른쪽 Notebook의 그림은 실제 빛의 궤적을 추적한 결과가 아니라, 경계에서의 방향을 설명하는 \u003cstrong>Conceptual\u003c/strong> 그림입니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Core와 Cladding은 함께 Waveguide를 이룹니다","scene":"tir","html":"\u003cp>\u003cstrong>Refractive Index n\u003c/strong>은 균일하고 투명한 물질에서 Wave의 Phase가 진공보다 얼마나 느리게 진행하는지 나타내는 무차원 수입니다. n이 크면 같은 Frequency에서 Wavelength가 짧아집니다. ‘빛이 느려진다’는 표현은 여기서는 Phase Velocity를 뜻합니다. Pulse가 전달되는 속도와는 구별해야 합니다.\u003c/p>\u003cp>1550 nm 부근을 설명하기 위해 이 교재는 Silicon에 n = 3.48, SiO₂에 n = 1.444라는 고정된 예시 값을 사용합니다. 재료 상수가 모든 파장과 온도에서 같다는 뜻은 아닙니다. 높은 n의 \u003cstrong>Core\u003c/strong>를 낮은 n의 \u003cstrong>Cladding\u003c/strong>이 둘러싸면, 경계에서 특정 조건을 만족하는 빛은 바깥으로 진행하는 굴절파를 만들지 않고 반사될 수 있습니다. 이것이 \u003cstrong>Total Internal Reflection, TIR\u003c/strong>의 출발점입니다.\u003c/p>\u003cp>입사각 θ는 경계면 자체가 아니라 \u003cstrong>경계면에 수직인 Normal\u003c/strong>에서 잽니다. Core에서 Cladding으로 갈 때 θ가 Critical Angle보다 커지면, Cladding 쪽에 멀리까지 진행하는 굴절파가 생기지 않습니다. 그렇다고 바깥의 Electric Field가 갑자기 0이 되지는 않습니다. 경계 근처에는 거리에 따라 감소하는 \u003cstrong>Evanescent Field\u003c/strong>가 남습니다.\u003c/p>\u003cp>따라서 Optical Confinement는 ‘빛이 Core에 100% 들어 있다’는 뜻이 아닙니다. Field가 Core 부근에 국소화되어 있으며, Waveguide 축 방향으로 에너지를 전달하는 상태를 뜻합니다. Cladding의 Field는 나중에 Coupling과 Sensing을 가능하게 하는 중요한 성분입니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"TIR이 시작되는 조건을 계산해 봅니다","scene":"tir","html":"\u003cdiv class='equation'>n₁ sin θ₁ = n₂ sin θ₂\u003cbr>θ\u003csub>c\u003c/sub> = sin⁻¹(n₂ / n₁)\u003cspan class='caption'>[R1, R2] 평탄한 두 유전체 경계에서 Snell’s Law. n₁ &gt; n₂이고 높은 n 쪽에서 입사할 때만 Critical Angle이 정의됩니다.\u003c/span>\u003c/div>\u003cdl class='terms'>\u003cdt>n₁, n₂\u003c/dt>\u003cdd>Core와 Cladding의 Refractive Index · 무차원\u003c/dd>\u003cdt>θ₁, θ₂\u003c/dt>\u003cdd>각 영역의 Normal 기준 각도 · ° 또는 rad, 계산 중 단위를 일관되게 사용\u003c/dd>\u003cdt>θc\u003c/dt>\u003cdd>굴절각 θ₂가 90°가 되는 임계 입사각 · θ₁ &gt; θc에서 TIR\u003c/dd>\u003c/dl>\u003cdiv class='worked'>\u003ch3>Worked Example · Silicon / SiO₂\u003c/h3>\u003cp>n₁ = 3.48, n₂ = 1.444이면 sin θc = 1.444 / 3.48 ≈ 0.415입니다. 따라서 θc ≈ \u003cstrong>24.5°\u003c/strong>입니다. Normal 기준 입사각이 45°인 광선은 이 이상적인 경계에서 TIR 조건을 만족합니다. 15°이면 만족하지 않습니다.\u003c/p>\u003cp>이 계산이 알려 주는 것은 \u003cem>한 경계에서의 광선 조건\u003c/em>입니다. Width가 얼마인 Waveguide가 몇 개의 Mode를 갖는지는 아직 알 수 없습니다. 마주 보는 경계에서 반사된 Wave들이 서로 맞는 Phase를 가져야 하기 때문입니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Phase Velocity를 수식으로 보면\u003c/summary>\u003cdiv class='equation'>n = c / v\u003csub>ph\u003c/sub>\u003cbr>λ\u003csub>material\u003c/sub> = λ₀ / n\u003cspan class='caption'>균일·선형·등방성·투명한 매질의 단색 Plane Wave. c: 진공 광속 [m/s], vph: Phase Velocity [m/s], λ: Wavelength [m]. 흡수와 Dispersion은 여기서 생략합니다.\u003c/span>\u003c/div>\u003cp>λ₀ = 1550 nm일 때 균일한 Silicon 안의 Wavelength는 약 445 nm입니다. 실제 Waveguide 축 방향의 Guided Wavelength는 이 값과 다를 수 있으며 Lesson 1.3에서 다룹니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"반사된다면, 바깥에는 정말 아무것도 없을까요?","scene":"tir","html":"\u003cp>다음 질문에 답한 뒤 설명을 읽어 보세요. 선택은 학습을 막지 않으며 언제든 바꿀 수 있습니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"먼저 예측하고, 경계 조건을 확인합니다","scene":"tir","html":"\u003cp>Normal 기준 입사각을 15°에서 45°로 바꿀 때, Cladding에서 멀리 진행하는 굴절파는 어떻게 될까요? 먼저 예측을 남긴 뒤 Notebook에서 각도를 바꿔 보세요. Critical Angle을 지나면 Snell’s Law에서 sin θ₂가 1보다 커집니다. 이는 일반적인 실수 각도의 굴절파가 더 이상 존재하지 않는다는 뜻입니다.\u003c/p>\u003cp>경계에서의 Field는 여전히 존재합니다. \u003cstrong>TIR은 Mode를 이해하는 직관이지만, Guided Mode의 완전한 정의는 아닙니다.\u003c/strong> 실제 Guided Mode는 Maxwell 방정식과 모든 경계조건을 동시에 만족하는 전자기 고유해입니다. 단면에서 허용된 Field Pattern만이 자기 자신을 유지하며 전파할 수 있습니다. 이 조건을 다음 Lesson에서 살펴봅니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"재료의 차이에서 Wave의 조건으로","scene":"tir","html":"\u003cul>\u003cli>Core보다 낮은 n의 Cladding은 Index Guiding의 기반입니다. 높은 n 하나만으로 충분하지 않습니다.\u003c/li>\u003cli>TIR에서는 바깥으로 진행하는 굴절파가 없어도 Evanescent Field가 남습니다.\u003c/li>\u003cli>Waveguide가 허용하는 상태는 전체 경계조건을 만족하는 Guided Mode입니다.\u003c/li>\u003c/ul>\u003cp>다음에는 ‘어떤 빛이 허용되는가’를 공간적인 Field Pattern으로 읽어 보겠습니다.\u003c/p>"}],"prediction":"Normal 기준 입사각을 15°에서 45°로 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","굴절파가 멀리 전파하지 못하는 TIR 조건이 된다","n이 그대로이므로 아무 변화가 없다","Cladding의 Field가 모든 곳에서 정확히 0이 된다"],"predictionFeedback":"24.5°보다 큰 입사각에서 TIR 조건이 됩니다. Cladding의 Evanescent Field와 멀리 전파하는 굴절파를 구별해 보세요.","reflection":"TIR과 Guided Mode는 어떤 점이 연결되고, 어떤 점이 다를까요? 자신의 말로 설명해 보세요.","sources":["R1","R2"],"tutor":{"question":"이상적인 Silicon / SiO₂ 경계에서 TIR이 일어났습니다. Cladding의 Field를 어떻게 설명해야 할까요?","choices":[{"text":"에너지가 밖으로 굴절되지 않으므로 Cladding의 Field도 전부 0이다.","feedback":"멀리 진행하는 굴절파가 없다는 것과 Field가 없다는 것은 다릅니다. 경계조건 때문에 Cladding에도 Field가 이어지며, 경계에서 멀어질수록 지수적으로 감소합니다. 이 성분이 Evanescent Field입니다.","concept":"전파하는 굴절파와 Evanescent Field의 혼동"},{"text":"Cladding에 감쇠하는 Field가 남으며, 이상적인 경계에 수직인 평균 에너지 유출은 없다.","feedback":"맞습니다. Evanescent Field는 존재하지만 이 이상적 단일 경계에서는 바깥쪽으로 순수하게 전달되는 시간 평균 Power가 없습니다. Waveguide에서는 그 Field도 축 방향 전파의 일부입니다. 가까이에 다른 Core가 있으면 Coupling이 가능해집니다.","concept":"Field와 Power Flow 구별","correct":true},{"text":"nCore가 높으므로 어떤 각도와 어떤 Width에서도 모든 빛이 완전히 갇힌다.","feedback":"nCore > nCladding은 출발 조건입니다. 광선의 TIR에는 입사각 조건이, Guided Mode에는 전체 경계의 Phase와 Field 연속 조건이 추가됩니다. 모든 입력 Field가 임의로 유지되는 것은 아닙니다.","concept":"Index Contrast만으로 모든 전파를 보장한다는 오개념"}],"why":"경계에서 접선 방향 Electric Field와 Magnetic Field가 연속이어야 합니다. Core의 Field가 경계에서 일반적으로 0이 아니므로 Cladding에서도 이어집니다. TIR 조건에서는 그 해가 바깥쪽으로 진동하며 진행하는 대신 감쇠하는 형태가 됩니다.","simple":"벽에 부딪힌 공처럼 빛이 완전히 경계 안쪽에만 있는 것은 아닙니다. 바깥까지 약하게 펼쳐진 Wave가 Core 근처에 묶여 함께 앞으로 간다고 생각해 보세요. 단, 이 비유가 Maxwell의 경계조건을 대신하지는 않습니다.","math":"Cladding에서 축 방향 β가 nClad k₀보다 크면, 횡 방향 파수의 제곱 nClad²k₀² − β²는 음수입니다. 따라서 횡 방향 해는 진동 함수가 아닌 exp(−q x) 꼴이며 q = √(β² − nClad²k₀²) > 0입니다. x는 경계 바깥 방향 거리이고 q의 단위는 1/m입니다.","notebook":"Notebook에서 15°, 24.5° 부근, 45°를 차례로 비교하세요. 그림은 광선 직관이며, 각도와 TIR 판정만 Snell’s Law로 계산합니다. 반사율이나 Evanescent Field 크기를 그림의 선 굵기로 읽지 마세요."}},{"id":"1.2","short":"Optical Modes","title":"What Is an Optical Mode?","time":"6–8분","lead":"같은 Waveguide도 빛을 여러 공간적 형태로 전달할 수 있습니다. Mode는 그중 허용된 형태입니다.","question":"같은 색의 빛이라도, 단면에서 다른 모양으로 전파할 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"빛의 경로만 알아서는 부족합니다","scene":"modes","html":"\u003cp>Lesson 1.1에서는 높은 n의 Core와 낮은 n의 Cladding이 빛을 국소화할 수 있음을 배웠습니다. 이제 같은 Waveguide에 빛을 넣어도 입력의 모양에 따라 다른 결과가 생기는 이유를 생각해 보겠습니다. 어떤 입력은 하나의 안정된 Field Pattern으로 전달되고, 어떤 입력은 여러 Pattern이 섞여 전파합니다.\u003c/p>\u003cp>\u003cstrong>Optical Mode\u003c/strong>를 알면 Coupling할 때 왜 위치와 Polarization을 맞춰야 하는지, Width가 커질 때 왜 단순히 빛의 통로만 넓어지는 것이 아닌지 이해할 수 있습니다. Mode는 빛 한 개의 이동 경로나 주파수의 별명이 아닙니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"전파하면서 자기 모양을 유지하는 Field Pattern","scene":"modes","html":"\u003cp>단면과 재료가 z 방향으로 일정한 이상적인 Waveguide를 생각해 봅니다. 특정 Frequency에서 Maxwell 방정식과 경계조건을 만족하는 Field가 있다면, 그 Field는 z 방향으로 나아가며 전체에 같은 Phase Factor를 곱하는 방식으로 표현될 수 있습니다. 단면의 상대적인 분포는 유지됩니다. 이것이 여기서 말하는 Guided Mode입니다.\u003c/p>\u003cp>가장 낮은 차수의 \u003cstrong>Fundamental Mode\u003c/strong>는 단순한 대칭 Slab에서 내부 Node가 없는 형태입니다. \u003cstrong>Higher-order Mode\u003c/strong>에는 Field가 0을 통과하며 부호가 바뀌는 Node가 생깁니다. 부호가 음수라고 음의 Power가 흐른다는 뜻은 아닙니다. 단색 실수 기준 Field의 부호 차이는 같은 순간에 반대 위상으로 진동함을 나타냅니다.\u003c/p>\u003cp>\u003cstrong>Mode Profile\u003c/strong>을 볼 때는 색이 무엇을 나타내는지 먼저 확인해야 합니다. Electric Field E의 한 성분인지, |E|²인지, 시간 평균 Poynting Vector인지에 따라 의미가 다릅니다. Notebook은 1D Slab의 \u003cstrong>Ey/max|Ey|\u003c/strong>와 그 제곱을 번갈아 보여 줍니다. Slab TE에서는 축 방향 Power Density가 |Ey|²에 비례하지만 일반적인 2D Vector Field의 임의 성분 하나에 같은 해석을 적용할 수는 없습니다.\u003c/p>\u003cdiv data-notebook-scene=\"polarization\">\u003cp>\u003cstrong>TE\u003c/strong>는 전파 축 z에 대한 Electric Field의 종방향 성분 Ez가 0인 경우, \u003cstrong>TM\u003c/strong>은 Hz가 0인 경우를 뜻합니다. y 방향으로 무한한 Slab에서는 이 분리가 정확히 가능합니다. 이 Notebook의 Slab은 x 방향으로만 제한되며 E가 y 방향인 TE 해를 계산합니다.\u003c/p>\u003cp>반면 실제 Silicon Strip은 x 방향 Width와 y 방향 Height가 모두 유한합니다. 일반적으로 전기장과 자기장의 여러 성분이 섞인 Hybrid Mode가 됩니다. Chip 면을 x–z, 높이를 y로 정의하면 주된 Electric Field가 Chip 면 안에 있는 것을 보통 \u003cstrong>Quasi-TE\u003c/strong>, 주로 수직인 것을 \u003cstrong>Quasi-TM\u003c/strong>이라고 부릅니다. 정확한 정의는 축과 Solver Convention을 함께 확인해야 합니다. Notebook의 Polarization 그림은 이 차이를 보여 주는 Conceptual Illustration입니다.\u003c/p>\u003c/div>"},{"key":"equation","label":"C · Understand the equation","title":"공간 분포와 전파하는 Phase를 분리합니다","scene":"modes","html":"\u003cdiv class='equation'>E(x,y,z,t) = Re{e(x,y) e\u003csup>i(βz − ωt)\u003c/sup>}\u003cspan class='caption'>[R1, R3] 단색·선형·z 불변 Waveguide의 단일 Mode. e: 복소 Field Profile [V/m], β: Propagation Constant [rad/m], z: 거리 [m], ω: Angular Frequency [rad/s], t: 시간 [s].\u003c/span>\u003c/div>\u003cp>e(x,y)는 단면에서의 형태를, 지수 함수는 위치와 시간에 따른 공통 Phase를 나타냅니다. 여기서는 lossless Guided Mode를 다루므로 β를 실수로 둡니다. 실제 손실 구조에서는 진폭의 감쇠도 포함해야 합니다. 여러 Mode를 동시에 여기하면 이 식 하나가 아니라 Mode별 항의 합이 되며, 서로 다른 β 때문에 총 Field Pattern이 z에 따라 달라질 수 있습니다.\u003c/p>\u003cdiv class='worked'>\u003ch3>Worked Example · Field의 부호와 제곱\u003c/h3>\u003cp>어떤 정규화된 Mode에서 두 위치의 Ey가 +0.5와 −0.5라고 합시다. 제곱은 두 곳 모두 0.25입니다. 즉 |Ey|² 그림만으로는 두 곳이 반대 위상이라는 사실을 읽을 수 없습니다. 가운데 Ey = 0인 Node가 있으면 제곱에서도 0이지만, 양·음 Lobe는 모두 양수로 보입니다.\u003c/p>\u003cp>Notebook에서 Width 500 nm, TE₁을 고른 뒤 ‘Signed Field’와 ‘Field²’를 비교하세요. 이 Mode의 중심은 Node입니다. TE₀로 바꾸면 중심에서 가장 큰 같은 부호의 Lobe가 보입니다. 이 차이는 임의로 그린 Gaussian의 개수를 늘려 만든 결과가 아니라 Slab 경계조건을 푼 해입니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>왜 허용된 Mode만 생길까요?\u003c/summary>\u003cp>Core 내부에는 진동하는 해, Cladding에는 감소하는 해가 필요합니다. 양쪽 경계에서 Ey와 그 미분을 함께 맞추려면 임의의 횡 방향 파수가 허용되지 않습니다. 이 동시 조건을 만족하는 값이 Eigenvalue이고, 그 값에 대응하는 Field가 Eigenmode입니다. 수학적으로는 미분 방정식에 경계조건을 부여했기 때문에 생기는 선택입니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"Mode의 개수와 실제 여기되는 빛을 구별합니다","scene":"modes","html":"\u003cp>어떤 Waveguide가 TE₀와 TE₁을 모두 지원한다고 합시다. 그것이 입력과 무관하게 두 Mode에 같은 Power를 넣는다는 뜻일까요?\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"같은 단면에서 서로 다른 허용된 형태를 비교합니다","scene":"modes","html":"\u003cp>Notebook은 nCore = 3.48, nClad = 1.444, λ₀ = 1550 nm인 대칭 Slab을 사용합니다. Width 500 nm에서는 TE₀, TE₁, TE₂가 허용됩니다. Mode를 바꾸어 Node와 Cladding Tail을 비교하고, Signed Field와 Field²의 차이를 관찰하세요.\u003c/p>\u003cp>각 Mode는 보기 쉽게 최대 진폭을 1로 정규화합니다. 따라서 두 그래프의 높이가 같아도 실제 Power가 같다는 뜻은 아닙니다. ‘허용된다’는 것은 가능한 해의 존재이며, 실제로 어떤 Mode에 얼마나 들어가는지는 입력 Field와 Mode의 Overlap에 달려 있습니다. 여기서는 그 Coupling Power를 계산하지 않습니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"모양, Phase, Polarization을 구별해서 읽습니다","scene":"modes","html":"\u003cul>\u003cli>Mode는 전체 경계조건을 만족하며 전파하는 허용된 Field Pattern입니다.\u003c/li>\u003cli>Field의 부호는 Phase 정보입니다. |E|²에는 이 부호가 남지 않습니다.\u003c/li>\u003cli>Slab의 TE/TM과 실제 Strip의 Quasi-TE/Quasi-TM을 구별해야 합니다.\u003c/li>\u003c/ul>\u003cp>허용된 Mode들은 모양뿐 아니라 z 방향의 Phase 변화율도 다릅니다. 다음 Lesson에서 그 변화율을 n_eff로 표현합니다.\u003c/p>"}],"prediction":"TE₁의 Signed Field를 제곱해서 보면 무엇이 사라질까요?","predictionOptions":["먼저 예측을 선택하세요","Field의 양·음 부호 정보가 사라진다","Node가 전부 사라진다","Mode가 Fundamental Mode로 바뀐다"],"predictionFeedback":"제곱하면 부호 정보는 없어지지만 Node는 남습니다. Mode 자체가 바뀌지는 않습니다. 표시하는 물리량이 달라진 것입니다.","reflection":"Mode가 허용된다는 것과 그 Mode가 실제로 여기된다는 것은 어떻게 다를까요?","sources":["R1","R2","R3"],"tutor":{"question":"Waveguide가 TE₀와 TE₁을 지원한다면, 실제 전파 상태에 대해 무엇을 알 수 있을까요?","choices":[{"text":"두 Mode가 반드시 같은 Power로 동시에 전파한다.","feedback":"지원하는 Mode의 수는 가능한 해의 수입니다. 입력 Field의 공간 분포와 Polarization이 각 Mode에 얼마나 겹치는지에 따라 여기되는 Power가 달라집니다. 존재 조건과 여기 조건을 구분해야 합니다.","concept":"Supported Mode와 Excited Mode의 혼동"},{"text":"두 형태가 허용되며, 실제 여기 비율은 입력 Field에 달려 있다.","feedback":"그렇습니다. Mode는 Waveguide가 허용하는 해이고, 입력은 그중 어떤 조합을 만들지 정합니다. 한 Mode만 여기하면 단면의 상대 분포가 유지되지만 여러 Mode의 합은 서로 다른 β 때문에 진행하며 간섭할 수 있습니다.","concept":"Eigenmode와 입력 Overlap 구별","correct":true},{"text":"TE₁의 음수 Field 영역에서는 Power가 뒤로 흐른다.","feedback":"Signed Field의 음수는 같은 기준 순간의 위상 반전을 뜻합니다. 이 Slab의 +z 전파 TE Mode에서 축 방향 평균 Power Density는 |Ey|²에 비례하므로 Field 부호가 바뀐다고 뒤로 흐르지 않습니다.","concept":"Field 부호와 에너지 방향의 혼동"}],"why":"가능한 진동 형태와 실제로 만들어진 진동은 다릅니다. 입력 Field를 허용된 Mode들의 합으로 분해할 때 계수는 각각의 Overlap으로 정해집니다. Mode가 3개 존재해도 대칭과 정렬 때문에 특정 Mode만 여기될 수 있습니다.","simple":"줄이 낼 수 있는 여러 진동 형태와 실제 손으로 만든 진동을 구별해 보세요. 가능한 형태가 여러 개라고 항상 모든 형태가 같은 세기로 섞이는 것은 아닙니다. Waveguide도 입력 모양이 중요합니다.","math":"E = Σ aₘ eₘ exp[i(βₘz − ωt)]로 씁니다. eₘ은 각 Mode의 Profile이고 aₘ은 여기 계수입니다. 서로 다른 βₘ의 Phase 차이가 z에 따라 달라집니다. 정규화 방식과 전체 Vector Field에 맞는 Overlap 적분이 필요하며, 이 Notebook은 aₘ을 계산하지 않습니다.","notebook":"TE₀와 TE₁을 비교해 Node를 찾아 보세요. Field²로 바꾸면 양·음 Lobe가 모두 양수가 됩니다. Polarization 개념도에서는 유한한 Width/Height와 주된 Field 방향을 확인하세요. 그 그림은 2D Mode Solver 결과가 아닙니다."}},{"id":"1.3","short":"Effective Index","title":"Understanding Effective Index","time":"6–9분","lead":"단면의 Mode가 앞으로 진행할 때, 단위 길이당 Phase가 얼마나 변하는지 수식으로 읽습니다.","question":"동일한 재료로 만든 두 Waveguide의 Phase가 서로 다르게 쌓일 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"간섭을 설계하려면 Phase를 알아야 합니다","scene":"phase","html":"\u003cp>같은 Laser의 빛을 두 경로로 나눴다가 합치면 두 Wave의 Phase 차이에 따라 밝기가 달라집니다. 두 경로가 모두 Silicon이어도 길이나 단면이 다르면 Phase가 다르게 쌓일 수 있습니다. 이것이 나중에 MZI와 MZM을 이해하는 출발점입니다.\u003c/p>\u003cp>단면에서 Field가 어떻게 분포하는지는 Lesson 1.2에서 배웠습니다. 이제 그 Mode가 z 방향으로 얼마나 빠르게 Phase를 누적하는지를 나타낼 숫자가 필요합니다. 그 숫자가 \u003cstrong>Propagation Constant β\u003c/strong>이고, 이를 익숙한 굴절률 형태로 표현한 것이 \u003cstrong>Effective Index n_eff\u003c/strong>입니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"n_eff는 재료 상수가 아니라 Mode의 성질입니다","scene":"phase","html":"\u003cp>단일 Mode의 Phase Factor는 exp[i(βz − ωt)]입니다. 같은 순간 두 위치를 비교하면 z가 L만큼 증가할 때 Phase는 βL만큼 달라집니다. β는 거리 1에 대응하는 Phase 변화량이므로 단위는 rad/m입니다. 실무에서는 rad/µm도 자주 사용합니다.\u003c/p>\u003cp>진공에서의 파수 \u003cstrong>k₀ = 2π/λ₀\u003c/strong>와 비교하여 n_eff = β/k₀라고 정의합니다. 따라서 n_eff는 ‘이 Mode의 축 방향 Phase 변화율이 진공 Plane Wave의 몇 배인가’를 나타냅니다. 같은 재료라도 Width, Height, Cladding, Wavelength와 Mode가 바뀌면 경계조건의 해가 달라지고 n_eff도 달라집니다.\u003c/p>\u003cp>보통의 lossless Index-guided 유전체 구조에서는 Guided Mode의 n_eff가 Cladding 쪽 최대 n과 Core n 사이에 있습니다. 이것을 보고 Core와 Cladding의 굴절률을 단순 평균한 값이라고 해석하면 안 됩니다. n_eff는 공간적인 Power 비율만으로 정해지는 평균이 아니라 경계조건의 Eigenvalue β를 다시 표현한 것입니다.\u003c/p>\u003cp>또한 c/n_eff는 이 Mode의 \u003cstrong>Phase Velocity\u003c/strong>입니다. 짧은 Pulse의 도달 시간에는 Frequency에 따른 β의 변화, 즉 Group Velocity가 필요합니다. n_eff 하나만 알고 모든 Pulse Delay를 계산할 수는 없습니다. 이번 Notebook은 단색 Phase를 다룹니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Wavelength, β, Phase를 같은 단위로 연결합니다","scene":"phase","html":"\u003cdiv class='equation'>n\u003csub>eff\u003c/sub> = β / k₀\u003cbr>β = 2πn\u003csub>eff\u003c/sub> / λ₀\u003cbr>φ = βL\u003cbr>λ\u003csub>g\u003c/sub> = 2π/β = λ₀/n\u003csub>eff\u003c/sub>\u003cspan class='caption'>[R3, R4] 단색·균일 단면·단일 Mode·실수 β. φ는 z = 0에서 L까지의 Phase 누적량이며 기준 Phase는 생략합니다. λg는 축 방향의 Guided Wavelength입니다.\u003c/span>\u003c/div>\u003cdl class='terms'>\u003cdt>λ₀, λg, L\u003c/dt>\u003cdd>Free-space / Guided Wavelength와 전파 길이 · 같은 길이 단위 사용\u003c/dd>\u003cdt>k₀, β\u003c/dt>\u003cdd>진공 파수와 축 방향 Propagation Constant · rad/m 또는 rad/µm\u003c/dd>\u003cdt>φ, n_eff\u003c/dt>\u003cdd>Phase [rad], Effective Index [무차원]\u003c/dd>\u003c/dl>\u003cdiv class='worked'>\u003ch3>Worked Example · 10 µm를 진행한 Mode\u003c/h3>\u003cp>λ₀ = 1550 nm = 1.55 µm, \u003cem>가정한\u003c/em> n_eff = 2.40, L = 10 µm입니다. 이 n_eff는 특정 Strip 단면을 새로 풀어 얻은 값이 아닙니다.\u003c/p>\u003cp>① β = 2π × 2.40 / 1.55 ≈ \u003cstrong>9.729 rad/µm\u003c/strong>\u003cbr>② φ = 9.729 × 10 ≈ \u003cstrong>97.288 rad\u003c/strong>\u003cbr>③ λg = 1.55 / 2.40 ≈ \u003cstrong>0.646 µm\u003c/strong>\u003cbr>④ φ/(2π) ≈ \u003cstrong>15.484 cycles\u003c/strong>\u003c/p>\u003cp>빛이 10 µm 가는 동안 축 방향 Phase가 약 15.48번 회전했다는 뜻입니다. 97 rad가 크다고 Power가 커지는 것은 아닙니다. 길이를 두 배로 하면 이 가정 아래에서는 누적 Phase도 두 배가 됩니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>왜 2π로 나눈 나머지도 보나요?\u003c/summary>\u003cp>Phase가 2π만큼 달라지면 단색 Wave의 같은 진동 상태로 돌아옵니다. 두 경로를 비교할 때는 전체 Optical Path 변화도 중요하지만, 합친 순간의 상대 Phase는 2π를 기준으로 반복됩니다. Notebook의 원은 φ mod 2π를 보여 주고 전체 Cycle 수는 따로 표시합니다. 원의 화살표는 실제 광속으로 움직이는 Animation이 아닙니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"n_eff가 커진다는 말을 정확하게 해석합니다","scene":"phase","html":"\u003cp>같은 λ₀와 같은 길이에서 n_eff가 커졌습니다. 이 변화로 확실히 말할 수 있는 것은 무엇일까요?\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"길이가 아니라 Phase를 예측합니다","scene":"phase","html":"\u003cp>먼저 L을 10 µm에서 20 µm로 늘릴 때 β와 φ가 각각 어떻게 될지 예측하세요. Notebook에서 길이를 바꾸고 계산 과정을 확인합니다. 다음으로 길이를 고정하고 가정한 n_eff를 바꾸어 보세요. β가 바뀌고 Guided Wavelength가 줄어드는지 확인할 수 있습니다.\u003c/p>\u003cp>응용으로 두 경로의 n_eff 차이가 0.01이고 공통 길이가 10 µm라면, Δφ = (2π/1.55) × 0.01 × 10 ≈ \u003cstrong>0.405 rad\u003c/strong>입니다. 작아 보이는 Δn_eff도 충분한 길이에서 의미 있는 Phase Difference가 됩니다. MZM은 전압으로 이런 차이를 조절해 간섭 출력을 바꾸지만, 이번 Chapter에서는 그 능동 소자를 구현하지 않습니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"n_eff는 단위 길이당 Phase의 언어입니다","scene":"phase","html":"\u003cul>\u003cli>n_eff는 β를 k₀로 나눈 Mode의 성질이며 단순한 재료 평균이 아닙니다.\u003c/li>\u003cli>φ = βL이며, β를 rad/µm로 쓰면 L도 µm로 써야 합니다.\u003c/li>\u003cli>Guided Wavelength와 Free-space Wavelength, Phase Velocity와 Group Velocity를 구분합니다.\u003c/li>\u003c/ul>\u003cp>다음에는 단면 Geometry를 바꾸어 n_eff와 허용된 Mode의 수가 함께 달라지는 이유를 살펴봅니다.\u003c/p>"}],"prediction":"같은 n_eff와 λ₀에서 L을 10 → 20 µm로 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","β는 같고 φ는 두 배가 된다","β와 φ가 모두 두 배가 된다","n_eff가 길이에 비례해 증가한다"],"predictionFeedback":"β는 Mode와 Wavelength의 성질이므로 그대로입니다. 길이 L만 두 배가 되어 φ = βL이 두 배가 됩니다. Geometry와 재료가 z에 따라 변하는 경우에는 적분이 필요합니다.","reflection":"n_eff를 처음 배우는 동료에게 재료 굴절률과의 차이 및 Phase 계산에서의 역할을 설명해 보세요.","sources":["R3","R4"],"tutor":{"question":"같은 λ₀와 L에서 n_eff가 커졌습니다. 무엇을 확실히 말할 수 있을까요?","choices":[{"text":"축 방향 Phase 누적량이 커지고 Guided Wavelength가 짧아진다.","feedback":"맞습니다. β = 2πn_eff/λ₀이 커져 같은 L에서 φ가 더 크게 쌓입니다. λg = λ₀/n_eff는 짧아집니다. Power가 커지거나 Pulse가 반드시 더 늦게 도착한다고 이 정보만으로 결론 내릴 수는 없습니다.","correct":true,"concept":"축 방향 Phase 변화율"},{"text":"Core 안의 Power 비율을 알면 n_eff를 항상 가중평균으로 계산할 수 있다.","feedback":"n_eff는 경계조건을 만족하는 β에서 정의합니다. 단순한 Core/Cladding Power 가중평균 공식은 일반적으로 성립하지 않습니다. Notebook의 n_eff는 가정한 입력이며 어떤 Power 비율에서 추정한 값이 아닙니다.","concept":"Effective Index의 단순 평균 오개념"},{"text":"n_eff만으로 짧은 Pulse의 도달 시간을 정확하게 계산할 수 있다.","feedback":"단색 Phase와 Pulse Envelope의 전파는 다릅니다. Pulse에는 dβ/dω로 결정되는 Group Velocity가 필요합니다. β가 Frequency에 따라 어떻게 변하는지 모르면 n_eff 하나만으로 정확한 Group Delay를 구할 수 없습니다.","concept":"Phase와 Group Velocity의 혼동"}],"why":"동일한 L 안에 더 많은 Phase Cycle이 들어가면 축 방향 Wavelength는 짧아집니다. n_eff는 바로 그 변화율을 진공에 대한 비율로 표현합니다. 이 정의는 입력 Power를 필요로 하지 않습니다.","simple":"10 µm 길이에 물결 무늬가 몇 번 들어가는지 생각해 보세요. n_eff가 크면 같은 거리에 더 많은 주기가 들어갑니다. 이 ‘물결 간격’의 설명과 Pulse 전체가 이동하는 속도는 다른 질문입니다.","math":"φ = (2π/λ₀)n_eff L이므로 고정 λ₀, L에서 ∂φ/∂n_eff = 2πL/λ₀ > 0입니다. λg = λ₀/n_eff이므로 ∂λg/∂n_eff \u003c 0입니다. Group Index는 n_g = n_eff − λ₀(dn_eff/dλ₀)이며 이번 고정 입력 계산으로 그 미분은 얻을 수 없습니다.","notebook":"λ₀ = 1550 nm, L = 10 µm에서 n_eff를 2.40 → 2.60으로 바꾸세요. 전체 Cycle 수와 Phase 원을 함께 보세요. 원이 반복되어도 전체 누적 Phase는 계속 증가합니다. 이 입력은 실제 Strip Solver의 결과를 뜻하지 않습니다."}},{"id":"1.4","short":"Geometry & Light","title":"How Geometry Changes Light","time":"6–9분","lead":"재료를 그대로 두어도 단면이 바뀌면 허용된 Mode와 그 Phase 변화율이 함께 달라집니다.","question":"Waveguide를 넓히면 Fundamental Mode만 더 넓어질까요, 새로운 Mode도 생길까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Geometry는 단순한 배선 치수가 아닙니다","scene":"geometry","html":"\u003cp>같은 Silicon과 SiO₂로 만든 Waveguide라도 단면이 다르면 Field의 분포, n_eff, 허용된 Mode 수가 달라집니다. 따라서 Width와 Height를 정하는 일은 Layout의 공간을 채우는 작업만이 아니라 빛의 전파 상태를 선택하는 일입니다.\u003c/p>\u003cp>실제 Silicon Strip에서는 가로 \u003cstrong>Width W\u003c/strong>와 세로 \u003cstrong>Height H\u003c/strong>가 모두 영향을 줍니다. 이번 Lesson에서는 이 사실을 개념도로 먼저 확인하고, 정량 실험에는 한 방향만 제한하는 \u003cstrong>Symmetric Slab\u003c/strong>을 사용합니다. 계산이 단순해지는 대신 실제 Strip의 모든 성질을 대신하지는 못합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"크기가 변하면 경계조건을 만족하는 방법도 달라집니다","scene":"geometry","html":"\u003cp>Core가 매우 좁으면 Fundamental Mode의 Field가 상대적으로 Cladding에 많이 퍼집니다. 충분히 넓혀 주면 같은 Mode가 Core 내부에 더 잘 국소화될 수 있습니다. Notebook에서는 그 변화를 단면의 선폭이 아니라 \u003cstrong>Field Tail과 Core Power Fraction\u003c/strong>으로 확인합니다.\u003c/p>\u003cp>하지만 Width 증가의 효과는 Fundamental Mode 하나에만 나타나지 않습니다. 더 많은 횡 방향 진동이 경계 사이에서 허용되면서 Higher-order Mode가 생길 수 있습니다. 각 Mode가 Guided 상태로 존재하기 시작하는 경계가 \u003cstrong>Cutoff\u003c/strong>입니다. 단순한 대칭 Slab의 TE₀는 양의 Width에서 Cutoff 없이 존재하지만, 좁을수록 약하게 묶이고 Field가 멀리 퍼집니다. ‘존재한다’와 ‘공학적으로 충분히 잘 가둔다’는 같은 말이 아닙니다.\u003c/p>\u003cp>\u003cstrong>Single-mode\u003c/strong>라는 표현에는 조건이 필요합니다. 어떤 Wavelength, 재료, 단면, Polarization 계열에서 Mode를 세는지 밝혀야 합니다. Slab TE가 하나인 것은 이 모델의 TE 계열에 대한 말이며, TM을 포함한 모든 Polarization이나 실제 2D Strip이 Single-mode라는 주장이 아닙니다.\u003c/p>\u003cp>Silicon Strip의 Height를 바꾸면 수직 경계의 제약도 달라지므로 동일한 Width에서 n_eff와 Cutoff가 달라질 수 있습니다. 따라서 ‘Width 450 nm이면 언제나 Single-mode’처럼 외우지 않습니다. 실제 공정에서는 Sidewall Angle, Etch Depth, 상·하부 Cladding도 확인하고 적절한 Full-vector Mode Solver로 검증해야 합니다.\u003c/p>\u003cp>또한 같은 Width 변화라도 Mode Profile의 절대 폭과 Core 안의 Power 비율은 같은 지표가 아닙니다. Core 자체가 넓어지므로 Field Pattern의 절대 폭이 넓어져도 바깥 Tail의 상대 비율은 작아질 수 있습니다. 그래프와 정의된 수치를 함께 읽어야 합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"단순 Slab에서 크기와 허용된 Mode를 연결합니다","scene":"geometry","html":"\u003cdiv class='equation'>V = k₀(d/2) √(n\u003csub>core\u003c/sub>² − n\u003csub>clad\u003c/sub>²)\u003cbr>u² + w² = V²\u003cbr>u = mπ/2 + tan⁻¹(w/u)\u003cspan class='caption'>[R1] 이 교재는 half-width a = d/2로 V를 정의합니다. 다른 교재의 full-width 정의와 혼동하지 마세요. 마지막 식은 이 대칭 Slab의 TE 경계조건입니다.\u003c/span>\u003c/div>\u003cdl class='terms'>\u003cdt>d, a\u003c/dt>\u003cdd>x 방향 전체 Width와 Half-width · µm 또는 m\u003c/dd>\u003cdt>V, u, w\u003c/dt>\u003cdd>무차원. u = ha, w = qa. h는 Core의 횡 방향 파수, q는 Tail 감쇠율 [1/µm]\u003c/dd>\u003cdt>m\u003c/dt>\u003cdd>TE Mode 차수 0, 1, 2… · 이 모델의 내부 Node 수\u003c/dd>\u003c/dl>\u003cp>해가 존재하는 조건은 V &gt; mπ/2입니다. TE₁이 막 생기는 경계는 V = π/2이고, 이때 q = 0이므로 정확한 Cutoff점에서는 국소화된 Guided Mode로 세지 않습니다. 고정된 n과 λ₀에서 d가 커지면 V도 커져 새로운 차수의 해가 생깁니다.\u003c/p>\u003cdiv class='worked'>\u003ch3>Worked Example · 이 Slab에서의 TE₁ Cutoff\u003c/h3>\u003cp>λ₀ = 1550 nm, nCore = 3.48, nClad = 1.444이면 √(nCore² − nClad²) ≈ 3.167입니다. V = π/2를 대입하면 d\u003csub>cutoff,TE1\u003c/sub> = λ₀/[2√(nCore² − nClad²)] ≈ \u003cstrong>244.8 nm\u003c/strong>입니다.\u003c/p>\u003cp>따라서 이 \u003cem>대칭 Slab TE 계열\u003c/em>에서 d = 220 nm는 TE₀ 하나, d = 300 nm는 TE₀와 TE₁을 지원합니다. 이 결과를 높이 220 nm의 실제 Strip에서 Width 244.8 nm가 경계라는 의미로 옮겨서는 안 됩니다. Slab의 y 방향은 무한하며 유한 Height가 없습니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Core Power Fraction의 의미와 계산\u003c/summary>\u003cdiv class='equation'>Γ\u003csub>TE\u003c/sub> = ∫\u003csub>core\u003c/sub>|Ey|² dx / ∫\u003csub>all\u003c/sub>|Ey|² dx\u003cspan class='caption'>이 lossless·동일 μ의 Slab TE에서는 축 방향 평균 Power Density가 β|Ey|²/(2ωμ)에 비례하므로 계수가 상쇄됩니다. Γ는 무차원이며 퍼센트로 표시합니다.\u003c/span>\u003c/div>\u003cp>이 정의를 일반적인 Vector Mode의 임의 Field 성분에 그대로 적용하면 안 됩니다. 에너지 밀도 비율이나 Gain Confinement Factor와도 정의가 다를 수 있습니다. 여기서는 계산된 Slab TE의 축 방향 Power 비율만 뜻합니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"Single-mode라는 말에 조건을 붙여 봅니다","scene":"geometry","html":"\u003cp>Slab 계산에서 TE Mode가 한 개 나왔습니다. 이를 실제 Silicon Strip의 설계 결론으로 바로 사용할 수 있을까요?\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Mode를 세고 Tail을 관찰합니다","scene":"geometry","html":"\u003cp>먼저 Width d를 220 → 500 → 800 nm로 넓힐 때 허용된 TE Mode 수를 예상하세요. Notebook의 Width를 바꾸며 Mode 목록과 n_eff를 확인합니다. 새 Mode가 나타나면 선택하여 Fundamental Mode보다 Field가 바깥으로 더 퍼져 있는지 관찰하세요.\u003c/p>\u003cp>‘n_eff vs Width’에서는 모든 허용된 TE Branch를 함께 봅니다. 각 Branch는 Cladding Index 근처에서 시작하며 Width에 따라 변합니다. ‘Field Profile’로 돌아와 같은 Branch의 공간적 형태와 연결하세요. ‘Strip Geometry’는 유한 Height가 있는 구조를 보여 주는 별도의 Conceptual 그림입니다. 이 그림을 바꾸어 2D 수치가 나온 것처럼 표시하지 않습니다.\u003c/p>\u003cp>관찰을 마치면 결과를 두 문장으로 나누어 설명해 보세요. ‘이 Slab 모델에서 계산으로 확인한 사실’과 ‘실제 Strip에 적용하기 전에 추가 확인할 사항’입니다. 이 구분이 모델을 공학적으로 사용하는 기본 습관입니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"단면은 Mode와 Phase를 함께 정합니다","scene":"geometry","html":"\u003cul>\u003cli>Width와 Height는 Optical Confinement, n_eff와 Mode 수를 결정하는 Geometry입니다.\u003c/li>\u003cli>Single-mode의 주장에는 재료·Wavelength·단면·Polarization과 모델 범위가 필요합니다.\u003c/li>\u003cli>1D Slab의 정확한 해도 실제 2D Strip의 정확한 해와 같지는 않습니다.\u003c/li>\u003c/ul>\u003cp>이제 ‘잘 가두는 것’만으로 설계가 끝나는지, Loss와 배치 공간을 함께 비교해 보겠습니다.\u003c/p>"}],"prediction":"이 Slab TE에서 d를 220 → 500 nm로 늘리면?","predictionOptions":["먼저 예측을 선택하세요","TE₀의 n_eff가 증가하고 Higher-order TE Mode도 허용된다","n_eff는 재료 값이므로 변하지 않는다","모든 Width에서 TE Mode는 반드시 하나다"],"predictionFeedback":"이 조건에서 220 nm는 TE₀ 하나, 500 nm는 TE₀·TE₁·TE₂를 지원합니다. 같은 TE₀의 n_eff도 증가합니다. 이 숫자는 y 방향 무한인 Slab의 결과입니다.","reflection":"‘이 Waveguide는 Single-mode다’라는 설명에 빠지면 안 되는 조건들과, Slab 모델의 한계를 적어 보세요.","sources":["R1","R3"],"tutor":{"question":"Slab TE 계산에서 d = 220 nm일 때 Mode가 한 개였습니다. 올바른 설명은 무엇일까요?","choices":[{"text":"모든 Silicon Waveguide는 Width 220 nm이면 Single-mode다.","feedback":"Width 하나만으로 실제 Strip을 판정할 수 없습니다. Height, Wavelength, 재료와 Polarization 계열이 필요합니다. 이 Slab은 다른 횡 방향이 무한이므로 유한한 Height의 Strip과 경계조건도 다릅니다.","concept":"조건 없는 Single-mode 일반화"},{"text":"명시된 재료·Wavelength의 대칭 Slab TE 계열에서는 허용된 Mode가 하나다.","feedback":"그렇습니다. 계산 결과의 적용 범위를 정확하게 밝혔습니다. 실제 Strip에서는 유한 Height와 Polarization을 포함한 전체 구조를 별도로 검증해야 합니다. TE₀의 존재가 충분한 Confinement나 낮은 Bend Loss를 자동 보장하지는 않습니다.","correct":true,"concept":"조건과 모델 범위 명시"},{"text":"Width가 줄어도 Fundamental Mode는 존재하므로 Confinement는 항상 충분하다.","feedback":"이상적인 대칭 Slab TE₀는 매우 작은 양의 Width에서도 존재하지만 Cladding에 훨씬 넓게 퍼질 수 있습니다. 존재와 충분한 국소화는 다릅니다. 이웃 Waveguide와의 Coupling, Bend와 주변 경계의 영향도 커질 수 있습니다.","concept":"Mode 존재와 공학적 Confinement의 혼동"}],"why":"Mode의 수는 주어진 Frequency의 경계조건 문제에서 나옵니다. Height와 Cladding을 바꾸면 같은 Width에서도 다른 문제를 푸는 것입니다. 그 결과를 재료 이름과 Width만 남긴 규칙으로 축약하면 가정이 사라집니다.","simple":"같은 폭의 통로라도 천장 높이와 벽의 조건이 다르면 허용되는 울림이 달라집니다. Slab은 한 방향으로 벽이 없는 이상화이고 Strip은 두 방향의 경계를 모두 고려합니다. 폭 하나가 모든 것을 정하지 않습니다.","math":"이 Slab에서는 V = k₀(d/2)√(nCore²−nClad²), Mode m의 존재 조건은 V > mπ/2입니다. 이 식에는 유한한 Height H가 없습니다. 따라서 H가 있는 실제 Strip의 Mode 수를 이 식만으로 결정할 수 없습니다.","notebook":"220 nm와 500 nm에서 TE Mode 수를 비교한 뒤 n_eff vs Width의 Branch 시작점을 확인하세요. Strip Geometry 탭의 H와 Slab 계산의 y 방향 무한 조건을 나란히 떠올려 보세요. ΓTE는 이 Slab에서의 Power 비율입니다."}},{"id":"1.5","short":"Physics to Design","title":"From Physics to Design","time":"5–10분","lead":"원리를 안다는 것은 하나의 숫자를 키우는 일이 아니라, 조건과 한계를 밝히며 설계의 선택을 설명하는 일입니다.","question":"좁은 공간에 Waveguide를 배치하면서 Optical Loss를 줄이려면 무엇을 고려해야 할까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"잘 전파하는 단면도 Layout에서는 손실을 만납니다","scene":"design","html":"\u003cp>앞에서는 이상적인 직선 Waveguide의 Mode와 Phase를 배웠습니다. 실제 회로에서는 빛을 먼 곳으로 옮기고 방향도 바꾸어야 합니다. 그 과정에서 \u003cstrong>Propagation Loss\u003c/strong>와 \u003cstrong>Bend Loss\u003c/strong>가 생깁니다. 원하는 위치까지 충분한 Power를 보내려면 전파 경로와 배치 공간을 함께 생각해야 합니다.\u003c/p>\u003cp>이번 실험은 실제 제조 공정의 최적 Radius를 찾는 문제가 아닙니다. 손실을 더하는 방법과 서로 충돌하는 조건을 설명하는 연습입니다. Radius별 Bend Loss는 \u003cstrong>가정한 교육용 데이터\u003c/strong>이며 실측이나 PDK 수치로 사용하지 않습니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"손실을 구분해야 선택을 설명할 수 있습니다","scene":"design","html":"\u003cp>\u003cstrong>Propagation Loss\u003c/strong>는 진행하면서 Guided Mode의 Power가 줄어드는 현상입니다. 재료 흡수와 Sidewall Roughness에 의한 Scattering 등이 원인이 될 수 있습니다. 보통 dB/cm처럼 단위 길이당 손실로 표현합니다. 같은 손실 계수에서 경로가 길어지면 전체 손실은 커집니다.\u003c/p>\u003cp>\u003cstrong>Bend Loss\u003c/strong>는 경로가 휘면서 생기는 추가 손실입니다. 직선에서 성립하던 Mode의 국소화만으로 급격한 곡률을 견딜 수 있는 것은 아닙니다. Field가 바깥으로 Radiation되거나 직선–곡선 접속에서 Mismatch가 생길 수 있습니다. 일반적으로 Radius를 너무 작게 하면 추가 손실을 줄이기 어렵습니다. 단, 정확한 값은 단면, 재료, Wavelength, Mode와 Bend Shape에 달려 있습니다.\u003c/p>\u003cp>큰 Radius는 곡률을 완만하게 만들지만 더 넓은 \u003cstrong>Footprint\u003c/strong>와 더 긴 경로를 요구합니다. 강한 Confinement는 작은 Bend를 가능하게 하는 방향으로 도움이 될 수 있으나, 그것만으로 전체 Loss가 낮다고 결론 내릴 수는 없습니다. 높은 Index Contrast 구조에서는 공정에 따른 Scattering도 중요할 수 있습니다.\u003c/p>\u003cp>따라서 ‘작게 만들기’와 ‘Loss 줄이기’를 독립적인 목표로 놓고 어떤 항이 변하는지 확인해야 합니다. 이번 Notebook에서는 각 Radius의 Bend Loss를 표로 주고, 곡선의 길이와 Propagation Loss를 수식으로 더합니다. 손실의 출처가 드러나는 \u003cstrong>Loss Ledger\u003c/strong>로 판단합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"dB와 Power 비율을 연결합니다","scene":"design","html":"\u003cdiv class='equation'>Loss\u003csub>prop\u003c/sub> = α\u003csub>dB\u003c/sub> L\u003cbr>Loss\u003csub>total\u003c/sub> = Loss\u003csub>prop\u003c/sub> + Σ Loss\u003csub>bend\u003c/sub>\u003cbr>P\u003csub>out\u003c/sub>/P\u003csub>in\u003c/sub> = 10\u003csup>−Loss_total/10\u003c/sup>\u003cspan class='caption'>[R3, R5] αdB: Power 손실 계수 [dB/cm], L: 길이 [cm], 각 Loss: dB. 독립적인 수동 손실이 연속하며 반사에 의한 간섭이 무시될 때 dB를 더합니다.\u003c/span>\u003c/div>\u003cp>Power 비율에는 10 log₁₀를 사용합니다. 같은 임피던스 조건의 Field Amplitude 비율과 연결할 때는 제곱 관계 때문에 20 log₁₀가 나타납니다. Power를 계산하면서 분모에 20을 쓰면 잘못된 결과가 됩니다.\u003c/p>\u003cdiv class='worked'>\u003ch3>Worked Example · 길이 손실과 네 번의 Bend\u003c/h3>\u003cp>가정: α = 3 dB/cm, 직선 길이 2 mm, 동일한 90° Circular Bend 네 개, Radius R = 10 µm입니다. 각 Bend의 경로 길이는 πR/2이므로 총 경로는 2 mm + 4 × π × 10 / 2 µm ≈ \u003cstrong>2.0628 mm = 0.20628 cm\u003c/strong>입니다.\u003c/p>\u003cp>Propagation Loss = 3 × 0.20628 ≈ 0.61885 dB입니다. 가정한 표에서 R = 10 µm의 추가 Bend Loss는 0.020 dB/90°이므로 네 개 합은 0.080 dB입니다. Total Loss ≈ \u003cstrong>0.69885 dB\u003c/strong>, Pout/Pin ≈ \u003cstrong>0.8514\u003c/strong>, 즉 Input Power의 약 85.1%가 남습니다.\u003c/p>\u003cp>Bend의 경로 길이에서 생기는 Propagation Loss와 \u003cem>추가\u003c/em> Bend Loss를 따로 셌습니다. 표의 수치가 이미 전체 손실인지 추가 손실인지 확인하지 않으면 이중 계산이 생길 수 있습니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Footprint와 경로 길이의 정의\u003c/summary>\u003cdiv class='equation'>L\u003csub>bends\u003c/sub> = N · πR/2\u003cbr>A\u003csub>corner\u003c/sub> = R²\u003cspan class='caption'>N = 4개의 90° Circular Bend, R [µm]. A는 한 코너의 중심선 Bounding Square [µm²]이며, 전체 Chip 면적이 아닙니다. Waveguide Width와 Spacing은 생략합니다.\u003c/span>\u003c/div>\u003cp>실제 Layout의 총 면적은 Bend가 서로 어떻게 배치되는지에 따라 달라집니다. Euler Bend나 다른 형상에서는 같은 Radius 표를 그대로 쓰지 않습니다. 여기서는 정의된 한 코너의 공간 제약만 비교합니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"큰 Radius를 항상 선택하면 될까요?","scene":"design","html":"\u003cp>Bend Loss가 작은 선택이 전체 조건도 만족하는지 살펴봅니다. 선택의 이유를 Loss의 항목과 Footprint 정의로 설명해 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"주어진 조건 안에서 두 선택을 비교합니다","scene":"design","html":"\u003cp>설계 연습의 조건은 다음과 같습니다. 한 코너의 Bounding Square는 \u003cstrong>100 µm² 이하\u003c/strong>, 전체 경로의 Total Loss는 \u003cstrong>0.8 dB 이하\u003c/strong>여야 합니다. α = 3 dB/cm, 직선 2 mm, 90° Bend 네 개를 유지합니다. Notebook에서 Radius 2, 5, 10, 20 µm를 비교하세요. 주어진 합성 데이터 안에서의 판단이며 실제 공정의 Radius 권고가 아닙니다.\u003c/p>\u003cp>계산 전 먼저 예상한 선택과 이유를 적어 봅니다. Loss가 가장 작은 선택이 공간 조건도 만족하는지 확인하고, 비교표에서 최소 두 후보의 Propagation/Bend 항목을 읽으세요. 큰 R에서는 Bend 추가 손실은 줄지만 Propagation 항은 경로가 길어져 조금 늘어납니다.\u003c/p>\u003cp>관찰 후에는 선택한 Radius만 적지 말고, 어떤 조건을 만족했고 무엇을 확인하지 못했는지 함께 설명하세요. 실제 설계라면 PDK의 검증된 Bend 데이터, 단면과 Mode, 파장 범위, 공정 변화, 접속 손실 등을 추가로 검토해야 합니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Chapter 1 · 자신의 말로 연결해 봅니다","scene":"design","html":"\u003cul>\u003cli>재료의 Index Contrast와 전체 경계조건이 Guided Mode를 만듭니다. TIR은 좋은 출발 직관입니다.\u003c/li>\u003cli>Mode의 공간적 형태와 β는 연결되며, n_eff와 Geometry로 Phase를 이해할 수 있습니다.\u003c/li>\u003cli>설계는 Loss와 Footprint를 명시된 모델과 조건에서 비교하고 그 한계를 설명하는 일입니다.\u003c/li>\u003c/ul>\u003cdiv class='chapter-review'>\u003ch3>Learning Review · 이해를 스스로 확인하기\u003c/h3>\u003cp>본문을 보지 않고 먼저 설명한 뒤, 펼친 설명과 비교해 보세요. 정답 수로 진행을 제한하지 않습니다.\u003c/p>\u003cdetails>\u003csummary>1. Cladding에 Field가 있는데도 빛이 Guided될 수 있는 이유는?\u003c/summary>\u003cp>Field가 존재하는 것과 바깥으로 평균 Power가 유출되는 것은 다릅니다. Guided Mode의 Cladding Field는 횡 방향으로 감소하고, 전체 해는 축 방향으로 전파합니다. TIR의 광선 직관만으로 Mode 수를 결정할 수는 없습니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>2. 같은 Silicon인데 Width가 다르면 Phase가 달라지는 이유는?\u003c/summary>\u003cp>Width가 바뀌면 경계조건의 Eigenmode와 β가 달라집니다. n_eff = β/k₀이므로 같은 λ₀, L에서도 φ = βL이 달라질 수 있습니다. 재료 n만을 길이에 곱하는 설명으로는 충분하지 않습니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>3. Width 220 nm에서 TE 하나라는 결과를 실제 Strip에 적용하려면?\u003c/summary>\u003cp>계산이 y 무한인 Slab TE임을 먼저 밝힙니다. 실제 Strip의 Height, 재료, Wavelength, Cladding, Polarization과 공정 단면을 확인하고 2D Vector Mode로 다시 검증해야 합니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>4. 주어진 설계 연습의 후보를 어떻게 설명하나요?\u003c/summary>\u003cp>R = 10 µm는 이 가정에서 Loss 약 0.699 dB와 한 코너 100 µm²를 만족합니다. R = 20 µm는 Loss가 더 작지만 한 코너가 400 µm²입니다. R = 5 µm는 공간은 작지만 Loss 약 0.929 dB입니다. 수치 비교는 합성 Bend 데이터의 범위에서만 유효합니다.\u003c/p>\u003c/details>\u003cp>\u003cstrong>자기 설명의 기준\u003c/strong> · 용어 정의 → 원인과 결과 → 수식과 단위 → 모델 조건과 한계를 연결할 수 있나요? 막히는 항목이 있다면 관련 Lesson으로 자유롭게 돌아가세요.\u003c/p>\u003c/div>\u003cp>Chapter 1은 여기까지입니다. 실제 학습 후 설명의 깊이와 Tutor의 도움, Notebook 연결성을 검토한 뒤 다음 Chapter의 방향을 정합니다.\u003c/p>"}],"prediction":"R = 10 → 20 µm에서 Loss와 한 코너 Footprint는?","predictionOptions":["먼저 예측을 선택하세요","주어진 데이터에서는 Total Loss는 줄지만 Footprint는 네 배가 된다","Propagation Loss와 Footprint가 모두 줄어든다","가장 큰 Radius가 항상 모든 조건을 만족한다"],"predictionFeedback":"이 합성 데이터에서는 Total Loss가 약 0.699 → 0.658 dB로 줄고 A = R²는 100 → 400 µm²가 됩니다. 직선 길이를 유지했으므로 곡선이 길어져 Propagation Loss 항은 조금 증가합니다.","reflection":"한 후보를 선택하고 Loss Ledger, Footprint, 모델 한계를 근거로 설명하세요. Chapter 전체에서 아직 불명확한 개념도 적어 보세요.","sources":["R3","R5","R6"],"tutor":{"question":"주어진 데이터에서 R = 20 µm의 Total Loss가 가장 작습니다. 이 후보를 어떻게 평가해야 할까요?","choices":[{"text":"Loss가 최소이므로 모든 Layout에 최선이다.","feedback":"Loss 외에 공간 조건도 필요합니다. 이 연습에서 한 코너 Footprint는 R²이므로 20 µm는 400 µm²입니다. 100 µm² 제약을 넘습니다. 최소 손실과 모든 제약을 만족하는 선택은 다를 수 있습니다.","concept":"한 지표만으로 전체 설계 결정"},{"text":"큰 Radius는 길이가 늘어나므로 Bend 추가 손실도 반드시 커진다.","feedback":"경로 길이 증가로 Propagation Loss는 늘지만, 완만한 곡률에 따른 Bend 추가 손실은 이 표에서 줄어듭니다. 두 항을 구별해야 전체 손실이 왜 변하는지 이해할 수 있습니다.","concept":"Propagation Loss와 Bend 추가 손실의 혼동"},{"text":"Loss와 공간 제약을 함께 확인하고 데이터의 적용 범위도 밝혀야 한다.","feedback":"맞습니다. 이 연습에서는 R = 10 µm가 Loss 0.8 dB 이하와 한 코너 100 µm² 이하를 모두 만족합니다. 이 결과는 주어진 합성 데이터 안의 예제 답이며, 실제 공정에 적용하려면 검증된 Bend 데이터와 Layout 조건이 필요합니다.","correct":true,"concept":"제약과 근거를 함께 설명"}],"why":"Radius가 커지면 A = R²와 곡선 길이가 증가합니다. 한편 같은 구조에서 곡률을 완만하게 하면 Radiation을 줄일 수 있습니다. 각 원인이 Loss Ledger의 어느 항에 들어가는지 분리해야 조건을 설명할 수 있습니다.","simple":"길을 완만하게 돌리면 급한 코너의 불리함은 줄지만 더 넓은 땅과 더 긴 길이 필요합니다. 넓은 길이 언제나 최선인 것은 아닙니다. 공간 예산 안에서 빛이 얼마나 남는지를 함께 살펴봅니다.","math":"Ltotal = 0.2 + 4(πR/2)/10000 [cm], Loss = 3Ltotal + 4b(R) [dB], Pout/Pin = 10^(−Loss/10), A = R² [µm²]입니다. b(R)는 명시적으로 가정한 dB/90° 표의 값이며 Physics Solver로 계산하지 않았습니다.","notebook":"R = 5, 10, 20 µm의 행을 비교하세요. R이 증가할수록 Propagation 항은 조금 커지고 Bend 항은 작아집니다. Total Loss가 작은 행도 Footprint 조건을 넘을 수 있습니다. 비교는 이 합성 데이터에만 적용됩니다."}}],"figures":[{"id":"1.1A","lesson":"1.1","title":"Core와 Cladding의 단면","classification":"Conceptual","anchor":"#section-concept > p:nth-of-type(2)","renderer":"structure","parameters":"Si Core n = 3.48, SiO₂ Cladding n = 1.444 · λ₀ = 1550 nm 부근의 예시. x: Width, y: Height, z: 전파 방향. 치수와 화살표는 정성적입니다.","limits":"실제 Field나 Mode 수를 계산한 그림이 아닙니다. 굴절률 차이는 Index Guiding의 출발 조건이며 전체 경계조건도 만족해야 합니다.","see":"높은 n의 Core를 낮은 n의 Cladding이 둘러싼 단면입니다.","notice":"전파 축 z와 횡 방향 x–y를 구별하세요.","meaning":"재료의 차이가 Field를 국소화할 수 있는 경계조건을 만듭니다.","source":"Original SVG; existing material assumptions"},{"id":"1.1B","lesson":"1.1","title":"Guided Field와 Evanescent Tail","classification":"Analytical","anchor":"#section-concept > p:last-of-type","renderer":"confinement","parameters":"대칭 Slab TE₀ · 전체 Width d = 500 nm · y 무한 · λ₀ = 1550 nm · nCore = 3.48, nClad = 1.444. x는 µm, Ey는 최대 절댓값으로 정규화합니다.","limits":"1D Slab의 Ey 해입니다. 유한 Height의 2D Strip 결과가 아니며 그래프의 높이는 실제 Optical Power가 아닙니다.","see":"기존 Slab 경계조건을 푼 Fundamental Mode의 Signed Field입니다.","notice":"Core 경계에서 Field가 끊기지 않고 Cladding으로 감소하며 이어집니다.","meaning":"Guiding은 Field가 바깥에서 0이 되는 것이 아니라 Core 부근에 국소화되는 상태입니다.","source":"notebook/models.js slabTE / slabField"},{"id":"1.2A","lesson":"1.2","title":"Fundamental Mode와 Higher-order Mode","classification":"Analytical","anchor":"#section-concept > p:nth-of-type(3)","renderer":"modes","parameters":"대칭 Slab TE · d = 220 또는 500 nm · y 무한 · λ₀ = 1550 nm · nCore = 3.48, nClad = 1.444. 각 Mode를 max|Ey| = 1로 정규화합니다. Field²는 |Ey|²/max|Ey|²입니다.","limits":"TE₁은 실제 해가 있는 조건에서만 표시합니다. Mode별 최대값 정규화는 동일 Power 정규화가 아니며 2D Vector Intensity가 아닙니다.","see":"같은 조건의 TE₀와 TE₁을 공통 x 축으로 비교합니다.","notice":"TE₁의 중심 Node와 부호를 확인한 뒤 Field²로 바꾸세요. 220 nm에서는 TE₁이 없습니다.","meaning":"Mode 차수는 허용된 공간 분포의 차이이며 제곱한 그림은 Phase 부호를 보존하지 않습니다.","source":"notebook/models.js slabTE / slabField"},{"id":"1.2B","lesson":"1.2","title":"2D Scalar Transverse Mode Profile","classification":"Numerical","anchor":"#section-equation > .worked","renderer":"scalar","parameters":"Scalar u₀₀ · Si/SiO₂ · λ₀ = 1550 nm · H = 220 nm · W = 220/500/800 nm. nCore = 3.48, nClad = 1.444. 5 nm 계산 Grid, x–y = ±1 µm에서 u = 0. 101×101 표시 표본과 고정 Color Scale을 사용합니다.","limits":"u는 Scalar Field이며 실제 Vector E 성분이나 TE/TM 분류가 아닙니다. 고굴절률 대비 Silicon의 경계 Vector 효과를 생략합니다. 수치 Grid 수렴은 실제 Strip의 n_eff 정확도를 보장하지 않습니다. |u|²/max|u|²는 상대량이며 실제 Power가 아닙니다.","see":"실제로 계산한 Scalar 고유해의 정규화된 제곱 분포입니다. 사각형은 Core 경계입니다.","notice":"Linear 0–1과 dB −40–0의 Color Bar를 구별하세요. 어두운 Cladding에도 약한 Tail이 이어집니다.","meaning":"두 횡 방향의 경계가 공간 분포를 정합니다. Scalar 근사의 결과를 Full-vector Mode로 해석하지 않습니다.","source":"scripts/precompute_scalar_modes.py → notebook/data/scalar-modes.json; docs/SCALAR_2D_VALIDATION.json"},{"id":"1.3A","lesson":"1.3","title":"Core의 Wavevector를 성분으로 읽기","classification":"Analytical","anchor":"#section-concept > p:nth-of-type(2)","renderer":"vector","parameters":"대칭 Slab d = 500 nm의 TE₀ · λ₀ = 1550 nm · nCore = 3.48, nClad = 1.444. kCore, β, h, q 단위: rad/µm 또는 1/µm. 삼각형은 Core Plane-wave 성분을 나타냅니다.","limits":"Core의 ±h 성분이 합쳐진 Slab Mode입니다. q는 Cladding의 실수 감쇠율이며 전파하는 횡 방향 Wavevector h와 같지 않습니다. 아래 Phase Calculator의 가정한 n_eff와 별도 조건입니다.","see":"Core 내부 kCore를 축 방향 β와 횡 방향 h로 분해합니다.","notice":"빗변 kCore와 β·h의 직각 관계를 보세요. Cladding의 q는 별도로 표시합니다.","meaning":"β는 Mode의 축 방향 Phase 변화율이고 q는 바깥 Tail의 공간적 감소율입니다.","source":"notebook/models.js slabTE; kCore²=β²+h²; q²=β²−(nClad k₀)²"},{"id":"1.3B","lesson":"1.3","title":"같은 조건으로 보는 Phase와 Guided Wavelength","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"phase","parameters":"λ₀ = 1550 nm 고정 · Notebook의 가정한 n_eff와 L을 그대로 공유합니다. β [rad/µm], L·z·λg [µm], φ [rad]. 단색·균일 단면·단일 Mode·무손실을 가정합니다.","limits":"n_eff는 Phase 실험의 가정한 입력이며 2D Strip 계산값이 아닙니다. 정규화된 cos(βz)의 진폭과 화살표 길이는 Power를 뜻하지 않습니다. Group Velocity는 계산하지 않습니다.","see":"고정된 3.1 µm 확대 구간의 Wave와 길이 L까지의 누적 Phase입니다.","notice":"오른쪽 Notebook에서 n_eff 또는 L을 바꾸면 이 Figure와 수식도 함께 변합니다.","meaning":"n_eff가 바뀌면 물결 간격이 변하고, L만 바뀌면 β는 일정한 채 누적 Phase가 변합니다.","source":"notebook/models.js phase","live":true},{"id":"1.4A","lesson":"1.4","title":"같은 조건에서 Geometry를 비교하기","classification":"Numerical","anchor":"#section-concept > p:nth-of-type(2)","renderer":"geometry","parameters":"모든 비교: λ₀ = 1550 nm, H = 220 nm, nCore = 3.48, nClad = 1.444, 동일 Scalar FD/Boundary 조건. W만 220/500/800 nm. 각 Profile의 Peak를 1로 정규화하며 공통 Color Scale을 사용합니다.","limits":"2D Scalar 근사입니다. 표시하는 n_eff,scalar는 해당 방정식의 수치 고유값이며 실제 Strip 또는 Quasi-TE의 설계값이 아닙니다. Peak 정규화는 동일 Input Power 비교가 아닙니다. 아래 Slab TE Branch와도 다른 모델입니다.","see":"선택한 Width의 2D Map과 세 Width의 y = 0 단면을 공통 축으로 비교합니다.","notice":"Narrow / Reference / Wide를 바꾸며 실제 Core 경계와 바깥 Field 분포를 함께 보세요.","meaning":"Geometry가 바뀌면 허용된 공간 분포와 Scalar 고유값도 달라집니다. 같은 Height와 모델 조건에서의 비교입니다.","source":"scripts/precompute_scalar_modes.py → notebook/data/scalar-modes.json"},{"id":"1.4B","lesson"   <script>/* Original educational models. SI conversions are explicit at the boundaries. */
(function(root) {
  'use strict';
  function criticalAngle(nCore=3.48, nClad=1.444) {
    if (!(nCore > nClad && nClad > 0)) throw new RangeError('Require nCore > nClad > 0');
    return Math.asin(nClad/nCore)*180/Math.PI;
  }
  function phase(neff, lambdaNm, lengthUm) {
    if (!(neff>0 && lambdaNm>0 && lengthUm>=0)) throw new RangeError('Invalid phase inputs');
    const lambdaUm=lambdaNm/1000, beta=2*Math.PI*neff/lambdaUm;
    return {beta, phi:beta*lengthUm, cycles:neff*lengthUm/lambdaUm, guidedUm:lambdaUm/neff};
  }
  function slabTE(widthNm=500, lambdaNm=1550, nCore=3.48, nClad=1.444) {
    if (!(widthNm>0 && lambdaNm>0 && nCore>nClad && nClad>0)) throw new RangeError('Invalid slab inputs');
    // x confinement with |x|<=a, infinite y, propagation +z; electric field Ey.
    const a=widthNm/2000, k0=2*Math.PI/(lambdaNm/1000);
    const V=k0*a*Math.sqrt(nCore*nCore-nClad*nClad), modes=[];
    for(let m=0;m<256 && m*Math.PI/2<V-1e-10;m++) {
      const lower=m*Math.PI/2;
      let lo=lower, hi=Math.min(V,lower+Math.PI/2);
      // u = m*pi/2 + atan(sqrt(V^2-u^2)/u); strictly increasing residual.
      for(let j=0;j<80;j++) {
        const u=(lo+hi)/2, w=Math.sqrt(Math.max(0,V*V-u*u));
        if(u-lower-Math.atan2(w,u)>0) hi=u; else lo=u;
      }
      const u=(lo+hi)/2, w=Math.sqrt(Math.max(0,V*V-u*u));
      const h=u/a, q=w/a, beta=Math.sqrt((nClad*k0)**2+q*q), neff=beta/k0;
      const even=m%2===0, edge=even?Math.cos(u):Math.sin(u);
      const inside=a*(1+(even?1:-1)*Math.sin(2*u)/(2*u)), outside=edge*edge/q;
      modes.push({m,u,w,h,q,beta,neff,a,V,even,corePower:inside/(inside+outside)});
    }
    return {widthNm,lambdaNm,nCore,nClad,V,a,k0,modes};
  }
  function slabField(mode,xUm) {
    const {a,u,q,even}=mode, ax=Math.abs(xUm);
    if(ax<=a) return even?Math.cos(u*xUm/a):Math.sin(u*xUm/a);
    const edge=even?Math.cos(u):Math.sin(u)*(xUm<0?-1:1);
    return edge*Math.exp(-q*(ax-a));
  }
  // Synthetic exercise inputs only; not a fit to measured or simulated Silicon bends.
  const bendTable=Object.freeze([{radius:2,bendDb:.4},{radius:5,bendDb:.08},{radius:10,bendDb:.02},{radius:20,bendDb:.005}].map(Object.freeze));
  function designLedger(index=2,alphaDbCm=3,straightMm=2,count=4) {
    if(!Number.isInteger(index)||!bendTable[index]||!(alphaDbCm>=0&&straightMm>=0&&Number.isInteger(count)&&count>=0)) throw new RangeError('Invalid ledger inputs');
    const {radius,bendDb}=bendTable[index],bendLengthUm=count*Math.PI*radius/2;
    const lengthCm=straightMm/10+bendLengthUm/10000;
    const propagationDb=alphaDbCm*lengthCm,bendsDb=count*bendDb,totalDb=propagationDb+bendsDb;
    return {radius,bendDb,bendLengthUm,lengthCm,propagationDb,bendsDb,totalDb,transmission:10**(-totalDb/10),footprint:radius*radius};
  }
  root.Photonics = {criticalAngle, phase, slabTE, slabField, bendTable, designLedger};
})(globalThis);
</script>

function updateNotebook(){
 if(current().id!=='1.1'){updateAdvancedNotebook();return;}
 const theta=num('angle',45,5,80), tc=P.criticalAngle(),tir=theta>tc, rad=theta*Math.PI/180;
 $('#angle-value').textContent=theta+' °';
 const x=240,y=150,len=130,s=Math.sin(rad),c=Math.cos(rad),ratio=3.48/1.444*s;
 const transmit=tir?`<path d="M110 126 Q240 110 370 126" stroke="var(--plot)" fill="none" stroke-width="2" stroke-dasharray="4 5"/><text x="274" y="90">Evanescent field</text>`:(()=>{const t=Math.asin(ratio);return `<path class="ray" d="M${x} ${y} L${x+120*Math.sin(t)} ${y-120*Math.cos(t)}"/><text x="330" y="79">Refracted ray</text>`;})();
 $('#notebook-plot').innerHTML=svg(`Normal 기준 입사각 ${theta}도. ${tir?'TIR, Cladding에 Evanescent Field 존재':'전파하는 굴절파 존재'}`,`<rect class="core" x="20" y="150" width="460" height="150" rx="5"/><line class="axis" x1="20" y1="150" x2="480" y2="150"/><line x1="240" x2="240" y1="45" y2="300" stroke="var(--muted)" stroke-dasharray="5 5"/><text x="252" y="40">Normal</text><text x="30" y="57">SiO₂ · n₂ = 1.444</text><text x="30" y="285">Si · n₁ = 3.48</text><path class="ray" d="M${x-len*s} ${y+len*c} L${x} ${y} L${x+len*s} ${y+len*c}"/>${transmit}<circle cx="240" cy="150" r="4" fill="var(--warm)"/><text x="155" y="211">θ₁ = ${theta}°</text><text x="300" y="252">Reflected ray</text>`);
 $('#notebook-readout').innerHTML=`<p>Critical Angle θc = <strong>${tc.toFixed(2)}°</strong></p><p>${tir?`θ₁ &gt; θc → <strong>TIR 조건을 만족합니다</strong>`:`θ₁ &lt; θc → 굴절각 θ₂ = <strong>${(Math.asin(ratio)*180/Math.PI).toFixed(1)}°</strong>`}</p><p class="caption">${tir?'바깥으로 진행하는 굴절파는 없지만 경계의 Field는 사라지지 않습니다.':'일부 빛이 Cladding으로 전파할 수 있습니다. 반사되는 성분도 존재합니다.'}</p>`;
}
function fieldPlot(model,mode,kind='signed'){
 const extent=Math.max(.8,model.a+.35), left=49,right=475,top=45,bottom=245,mid=(top+bottom)/2;
 const X=x=>left+(x+extent)/(2*extent)*(right-left),Y=e=>kind==='intensity'?bottom-170*e:mid-85*e;
 const values=Array.from({length:501},(_,i)=>{const x=-extent+2*extent*i/500,e=P.slabField(mode,x);return `${i?'L':'M'}${X(x).toFixed(2)} ${Y(kind==='intensity'?e*e:e).toFixed(2)}`;}).join(' ');
 const ticks=[-extent,-model.a,0,model.a,extent].filter((v,i,a)=>!i||v-a[i-1]>.05);
 return svg(`1D symmetric Slab TE${mode.m}, ${kind==='intensity'?'normalized Ey squared':'normalized signed Ey'} versus x in micrometers`, `<rect class="core" x="${X(-model.a)}" y="${top}" width="${X(model.a)-X(-model.a)}" height="${bottom-top}"/><text x="${X(-model.a)+5}" y="34">Si Core</text><text x="340" y="34">SiO₂</text><line class="axis" x1="${left}" x2="${right}" y1="${Y(0)}" y2="${Y(0)}"/><line class="axis" x1="${left}" x2="${left}" y1="${top}" y2="${bottom}"/><path class="field" d="${values}"/>${ticks.map(x=>`<line class="axis" x1="${X(x)}" x2="${X(x)}" y1="${bottom}" y2="${bottom+5}"/><text x="${X(x)}" y="${bottom+24}" text-anchor="middle">${x.toFixed(2)}</text>`).join('')}<text x="12" y="65">1</text><text x="8" y="${Y(0)+5}">0</text>${kind==='signed'?'<text x="4" y="235">−1</text>':''}<text x="245" y="301" text-anchor="middle">x (µm) · ${kind==='intensity'?'Ey² / max|Ey|²':'Ey / max|Ey|'}</text>`);
}

function dispersionPlot(width,selected){

 return svg('Slab TE effective indices versus full slab width from 100 to 1000 nanometers, all supported TE branches',`<line class="axis" x1="${left}" x2="${left}" y1="${top}" y2="${bottom}"/><line class="axis" x1="${left}" x2="${right}" y1="${bottom}" y2="${bottom}"/><line x1="${left}" x2="${right}" y1="${Y(1.444)}" y2="${Y(1.444)}" stroke="var(--line)" stroke-dasharray="4 5"/><text x="54" y="28">n_eff · TE₀ … TE₄</text>${[1.444,2,2.5,3,3.48].map(n=>`<text x="43" y="${Y(n)+4}" text-anchor="end">${n.toFixed(2)}</text>`).join('')}${curves}<line x1="${X(width)}" x2="${X(width)}" y1="${top}" y2="${bottom}" stroke="var(--muted)" stroke-dasharray="3 4"/>${[100,250,500,750,1000].map(d=>`<text x="${X(d)}" y="268" text-anchor="middle">${d}</text>`).join('')}<text x="260" y="303" text-anchor="middle">Full slab width d (nm)</text>`);

 }
}
function showSession(){remember();$('#session-content').innerHTML=(storageOK?'':'<p role="status">이 Browser에서 자동 저장할 수 없습니다. 기록 내보내기로 백업해 주세요.</p>')+lessons.map(l=>`<div class="session-item"><span>${l.id} · ${l.short}</span><span>${state.completed.includes(l.id)?'읽음으로 기록':'자유롭게 학습 중'}</span></div>`).join('');$('#session-dialog').showModal();}
$('#lesson-nav').addEventListener('click',e=>navigateClick(e));
$('#reading').addEventListener('click',e=>{
 const a=e.target.closest('[data-answer]'),extra=e.target.closest('[data-extra]');
 if(a){state.answers[state.lesson]=Number(a.dataset.answer);renderTutor();save();}
 if(extra){state.extras[state.lesson]=extra.dataset.extra;renderTutor();save();if(extra.dataset.extra==='notebook'&&matchMedia('(max-width:760px)').matches)$('#notebook').scrollIntoView();}
 if(e.target.closest('[data-lesson]'))navigateClick(e);
 if(e.target.closest('#mark-read')){const i=state.completed.indexOf(state.lesson);if(i<0)state.completed.push(state.lesson);else state.completed.splice(i,1);const b=$('#mark-read');b.setAttribute('aria-pressed',String(i<0));b.textContent=i<0?'읽음 기록됨 · 취소':'이 Lesson 읽음으로 기록';save();}
 if(e.target.closest('#compare-prediction'))$('#prediction-feedback').textContent=current().predictionFeedback;
});
function navigateClick(e){const b=e.target.closest('[data-lesson]');if(!b)return;remember();state.lesson=b.dataset.lesson;save();renderLesson(true);$('#lesson-nav [aria-current]').scrollIntoView({block:'nearest',inline:'nearest'});}
$('#reading').addEventListener('input',e=>{if(e.target.dataset.note){state.notes[state.lesson+':'+e.target.dataset.note]=e.target.value.slice(0,12000);save();}});
$('#reading').addEventListener('change',e=>{if(e.target.id==='prediction'){state.predictions[state.lesson]=Number(e.target.value);$('#prediction-feedback').textContent='';save();}});
$('#notebook').addEventListener('input',e=>{if(e.target.dataset.setting){settings()[e.target.dataset.setting]=Number(e.target.value);updateNotebook();TeachingFigures.refresh($('#reading'),settings());save();}});
$('#notebook').addEventListener('change',e=>{if(e.target.dataset.selectSetting){settings()[e.target.dataset.selectSetting]=e.target.value;updateNotebook();TeachingFigures.refresh($('#reading'),settings());save();}});
$('#notebook').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){settings().view=b.dataset.view;renderNotebook();save();}const f=e.target.closest('[data-field]');if(f){settings().field=f.dataset.field;updateNotebook();TeachingFigures.refresh($('#reading'),settings());save();}const m=e.target.closest('[data-mode]');if(m){settings().mode=Number(m.dataset.mode);updateNotebook();TeachingFigures.refresh($('#reading'),settings());save();}});
function onScroll(){if(navigating)return;clearTimeout(scrollTimer);scrollTimer=setTimeout(remember,250);}
$('#reading').addEventListener('scroll',onScroll,{passive:true});window.addEventListener('scroll',onScroll,{passive:true});window.addEventListener('pagehide',remember);
matchMedia('(max-width:760px)').addEventListener('change',()=>{placeNotebook();setupObserver();});
$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';setTheme();save();};
$('.brand').onclick=e=>{e.preventDefault();remember();state.lesson=lessons[0].id;state.positions[state.lesson]=0;save();renderLesson(true);};
$('#session').onclick=showSession;$('#close-session').onclick=()=>$('#session-dialog').close();
$('#export').onclick=()=>{remember();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='silicon-photonics-ch1-study-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('#import').onchange=async e=>{$('#import-status').textContent='불러오는 중…';try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error('1 MB 이하의 학습 기록을 선택해 주세요.');const clean=validate(JSON.parse(await file.text()));state=clean;setTheme();save();renderLesson();$('#import-status').textContent='학습 기록을 불러왔습니다.';}catch(err){$('#import-status').textContent='가져오지 못했습니다. '+err.message;}e.target.value='';};
TeachingFigures.bind({get:()=>settings(),set:(k,v)=>{settings()[k]=v;save();}});
setTheme();renderLesson();save();
})();
</script>
</body>
</html>
