quency는 같은 정의가 아닙니다.\u003c/li>\u003cli>Bandwidth만으로 Data Rate를 예측하지 않습니다.\u003c/li>\u003c/ul>\u003cp>다음은 Telecom 빛을 흡수할 Material과 Ge-on-Si 공정을 배웁니다.\u003c/p>"}],"prediction":"C_total만 절반으로 줄이면?","predictionOptions":["먼저 예측을 선택하세요","RC f는 두 배, Transit 시간은 일정","모든 Device의 총 Bandwidth가 정확히 두 배","Dark Current가 반드시 절반"],"predictionFeedback":"독립 입력 RC 모델에서는 f_RC가 두 배입니다. Transit, Dark Current, 실제 Device의 총 Bandwidth를 이 변화만으로 예측하지 않습니다.","reflection":"Capacitance 감소만으로 전체 Bandwidth를 보장할 수 없는 이유와 Dark Current DC 및 Shot Noise rms의 차이를 설명하세요.","sources":["D0","D1","D2","D3"],"tutor":{"question":"Junction Capacitance를 낮추면 모든 경우 실제 Detector Bandwidth가 자동으로 향상될까요?","choices":[{"text":"예. Bandwidth는 언제나 RC 한 항으로만 정해집니다.","feedback":"RC가 유일한 제한일 때의 결론입니다. Carrier Transit, Diffusion, 외부 회로가 지배하면 실제 개선은 제한됩니다."},{"text":"아닙니다. RC 제한인지 Transit 등 다른 제한이 지배하는지 확인해야 합니다.","feedback":"맞습니다. C를 줄이면 명시한 RC Bandwidth는 증가하지만 전체 Device 응답을 설명하려면 Collection Impulse와 회로가 더 필요합니다.","correct":true},{"text":"아닙니다. RC는 전하 이동 거리 W와 같은 물리량입니다.","feedback":"RC는 회로의 충방전, W/v는 Carrier 이동 시간입니다. 같은 시간 단위를 갖더라도 원인과 입력이 다릅니다."}],"why":"Junction Capacitance의 감소는 RC 경로에만 직접 적용됩니다. 실제 응답에는 생성 위치와 전기장에 따른 Carrier 수집 분포도 필요합니다.","simple":"물통이 빨리 비워져도 물이 그 통까지 이동하는 길이 느리면 전체 전달은 빨라지지 않습니다. 두 지연의 원인을 따로 보세요.","math":"f_RC=1/(2πRC)이므로 C 절반은 RC f 두 배입니다. τ_tr=W/v는 별도 시간 척도이며 1/τ가 정확한 Device −3 dB는 아닙니다.","notebook":"C Slider와 W Slider를 따로 움직여 RC Graph와 Transit Readout이 독립적으로 변하는지 확인하세요. Noise B도 독립 입력입니다."}},{"id":"5.3","short":"Ge-on-Si Fabrication","title":"How Are Silicon Photonic Detectors Fabricated?","time":"15–22분","lead":"같은 1550 nm 빛도 Material에 따라 흡수되는 정도가 다릅니다. Photon Energy와 Band Structure를 연결하고 Ge-on-Si의 제작 원리와 한계를 살펴봅니다.","question":"Silicon Waveguide의 빛을 검출하려면 왜 Germanium을 사용하는 경우가 많을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Guiding Material과 Absorber의 역할","scene":"detector","html":"\u003cp>Chapter 1의 Silicon Waveguide는 Telecom 빛을 비교적 적은 흡수로 전달하는 데 유리했습니다. 그러나 그 장점이 Detector에서는 제약이 됩니다. 전달할 때는 Power를 남겨 두어야 하지만, 검출할 때는 \u003cstrong>유용한 Absorption\u003c/strong>을 만들어야 하기 때문입니다.\u003c/p>\u003cp>Chapter 3의 Coupling 이후 빛이 Absorption Region과 겹치게 설계하고, Chapter 4의 Junction 원리로 생성된 전하를 수집하면 Material 선택과 Device 구조가 연결됩니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Band Structure에서 제작 공정까지","scene":"detector","html":"\u003cp>λ=1550 nm Photon의 Energy는 약 0.80 eV입니다. 보통 300 K 부근 Crystalline Silicon의 Indirect Bandgap은 약 1.12 eV이므로 이 Photon Energy에서 일반적인 \u003cstrong>Intrinsic Band-to-band Absorption\u003c/strong>은 약합니다. 모든 Silicon 흡수가 완전히 0이라는 뜻은 아닙니다. Defect-assisted Process, Free-carrier Absorption 등은 다른 물리 과정입니다.\u003c/p>\u003cp>Germanium은 Indirect Gap 약 0.66 eV, Direct Gap 약 0.80 eV 부근의 Band Structure를 가지며 Telecom Detector에 유용합니다. 하지만 Bandgap 숫자 하나가 Absorption Coefficient를 결정하지는 않습니다. 특히 1550 nm 부근에서 \u003cstrong>Strain, Temperature, Composition, Transition Probability\u003c/strong>가 Optical Absorption을 바꿉니다. Notebook은 Energy만 비교하며 Ge의 Spectrum을 생성하지 않습니다.\u003c/p>\u003cp>\u003cstrong>Ge-on-Si Integration\u003c/strong>은 Silicon Waveguide에서 전파한 Mode를 Ge Absorption Region에 전달하고 PIN Junction과 Contacts를 형성하는 접근입니다. 자체 Cross-section은 가능한 구조의 원리를 설명하는 개념도이며 Foundry Mask Stack이 아닙니다. 광 전파 방향 z와 Carrier 수집 방향 x를 분리해서 읽어야 합니다.\u003c/p>\u003cp>개념적인 제작 흐름은 Silicon Guiding Region과 성장 영역 준비, Ge Epitaxial Growth, Junction/Contact 형성, Passivation과 전기·광학 시험입니다. 실제 Implant, Anneal, Selective Growth, Planarization, Metal 순서는 공정에 따라 다릅니다. 여기서는 임의의 온도·두께·Mask 번호나 공정 Recipe를 제시하지 않습니다.\u003c/p>\u003cp>Si/Ge의 Lattice Mismatch와 Thermal History는 Defect와 Interface State에 영향을 줄 수 있습니다. 이들은 Recombination과 Dark Current를 바꾸므로 Absorption만 좋게 만드는 것으로는 충분하지 않습니다. Epitaxial Quality, Surface Passivation, Contact Resistance를 함께 검증해야 실제 Photo Response를 알 수 있습니다. 높은 Absorption이 높은 Collection을 자동으로 보장하지 않는다는 5.1의 구분이 다시 중요합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Energy 비교의 정확한 범위","scene":"detector","html":"\u003cdiv class=\"equation\">E_ph [eV] ≈ 1239.84 / λ[nm]\u003cbr>1550 nm → E_ph ≈ 0.800 eV\u003c/div>\u003cp>300 K 부근의 Si Eg≈1.12 eV, Ge Indirect Eg≈0.66 eV, Direct Eg≈0.80 eV는 에너지 위치를 설명하는 대략적 값입니다. 흡수 확률이나 실제 Detector QE를 이 값만으로 계산하지 않습니다. Gap에는 Temperature와 Strain 의존성이 있습니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · Energy 조건과 성능 예측의 차이\u003c/h3>\u003cp>1550 nm에서 0.80 eV&lt;Si의 보통 Bandgap이므로 일반적인 Intrinsic Si는 효율적인 Telecom Absorber로 쓰기 어렵습니다. Ge에서는 유용한 전이가 가능하지만, 이 사실만으로 η_ext=1이나 특정 R, Bandwidth를 지정할 수는 없습니다.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"Si와 Ge의 역할을 연결합니다","scene":"detector","html":"\u003cp>Bandgap 비교는 출발점입니다. Si가 빛을 잘 전달한다는 사실과 Ge가 Detector에 유용하다는 사실을 하나의 Optical Path로 연결해 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Energy와 Device Response를 혼동하지 마세요","scene":"detector","html":"\u003cp>Notebook의 λ를 바꿔 E_ph가 어떻게 변하는지 보세요. 그림 속 Absorber의 크기나 색은 바뀌지 않습니다. Material Absorption Spectrum을 계산하지 않기 때문입니다. Epitaxial Defect가 광학과 전기 응답 중 어느 쪽에 영향을 주는지도 적어 보세요.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"제작은 전하 수집 품질에도 영향을 줍니다","scene":"detector","html":"\u003cul>\u003cli>Telecom에서 Si의 낮은 Intrinsic Absorption은 Guiding에 유용하지만 검출에는 제약입니다.\u003c/li>\u003cli>Ge-on-Si는 Absorption과 Silicon Integration을 연결합니다.\u003c/li>\u003cli>Bandgap은 실제 Absorption Spectrum 또는 QE가 아닙니다.\u003c/li>\u003cli>Fabrication Defect와 Interface Quality는 Dark Current와 Collection에 영향을 줍니다.\u003c/li>\u003c/ul>\u003cp>다음은 서로 다른 Detector Architecture가 전하를 처리하는 방법입니다.\u003c/p>"}],"prediction":"λ를 길게 하면 Photon Energy는?","predictionOptions":["먼저 예측을 선택하세요","작아짐","커짐","Material Gap과 무조건 같아짐"],"predictionFeedback":"E_ph=hc/λ이므로 λ 증가 시 Energy는 감소합니다. Bandgap은 독립적인 Material Property이며 Spectrum은 별도 정보가 필요합니다.","reflection":"Si Guiding과 Ge Absorption의 역할 및 Bandgap 비교만으로 실제 Detector QE를 결정할 수 없는 이유를 설명하세요.","sources":["D0","D1","D2","D3"],"tutor":{"question":"1550 nm의 Photon Energy와 Si Bandgap 비교에서 어떤 결론을 내릴 수 있나요?","choices":[{"text":"Si에서 모든 광학적 Loss가 정확히 0입니다.","feedback":"Intrinsic Band-to-band Absorption이 약하다는 것과 모든 Loss가 0이라는 것은 다릅니다. Defect/Free-carrier/Scattering Loss는 남을 수 있습니다."},{"text":"Ge의 실제 External QE는 자동으로 100%입니다.","feedback":"Ge가 유용한 Absorber여도 Coupling, Spectrum, Collection, Interface Defect와 Geometry를 계산해야 실제 QE를 예측할 수 있습니다."},{"text":"일반적인 Si의 Intrinsic Absorption은 약하며, Ge의 유용성은 별도 Material/Device 조건과 함께 판단합니다.","feedback":"맞습니다. Photon Energy 비교는 전이 가능성을 이해하는 단계이며 Absorption Coefficient나 실제 QE를 대신하지 않습니다.","correct":true}],"why":"Band Structure는 필요한 물리 조건이지만 Optical Mode Overlap, Absorption 확률과 Carrier 수집 효율까지 결정하지 않습니다.","simple":"문을 통과할 Energy가 충분해도 모든 Photon이 문에 도달하고 전하로 수집되는 것은 아닙니다. Material과 Device를 구별하세요.","math":"E_ph=hc/λ로 1550 nm에서 약 0.80 eV입니다. 이 에너지 비교에 η_ext=1을 자동으로 대입하는 계산은 정당화되지 않습니다.","notebook":"λ Slider는 Photon Energy만 바꿉니다. Cross-section과 Fabrication Flow는 비축척 Conceptual이며 실제 PDK Stack이나 Spectrum이 아닙니다."}},{"id":"5.4","short":"Detector Architectures","title":"Photoconductive, PIN and Avalanche Detectors","time":"15–22분","lead":"Generation은 공통 출발점이지만 Conductivity Change, Drift Collection, Impact Ionization은 서로 다른 전류 생성 방식입니다. Gain의 이득과 대가를 함께 비교합니다.","question":"같은 빛을 전류로 바꾸는데 왜 여러 Detector Architecture가 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"같은 Photon, 다른 전하 처리 방식","scene":"detector","html":"\u003cp>5.1은 Unity Gain에서 수집 전하를 셌습니다. 그런데 어떤 Device에서는 Primary Carrier 한 개가 더 큰 평균 Current에 기여할 수 있습니다. 이때 단순히 η가 높아졌다고 말하면 Generation, Collection과 \u003cstrong>Internal Gain\u003c/strong>이 섞입니다.\u003c/p>\u003cp>원서 순서대로 Photoconductive → PIN → Avalanche를 살펴보고, 동일한 입력 Optical Power에서 평균 Current와 Noise/Speed를 따로 해석합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Conductivity, Drift, Multiplication","scene":"detector","html":"\u003cp>\u003cstrong>Photoconductive Detector\u003c/strong>는 빛에 의해 증가한 Carrier가 Material Conductivity를 바꾸는 구조입니다. Bias 아래에서 σ=q(nµ_n+pµ_p)가 달라져 Current가 변합니다. Carrier Lifetime이 Transit Time보다 길면 외부 회로를 통한 전하 공급 때문에 Photoconductive Gain이 가능하지만, 긴 Lifetime이나 Trap은 느린 Recovery를 만들 수 있습니다. 모든 Photoconductor가 같은 Gain과 Speed를 갖는 것은 아닙니다.\u003c/p>\u003cp>\u003cstrong>PIN Detector\u003c/strong>는 p와 n 사이의 약하게 Doped/Intrinsic Absorption Region에서 Electric Field를 형성하고 생성 Carrier를 Drift로 수집합니다. Reverse Bias는 Depletion과 Collection을 돕지만 실제 Field, Saturation Velocity와 Leakage를 검증해야 합니다. Notebook의 PIN은 Unity Gain, 선형 Mean Current를 가정합니다.\u003c/p>\u003cp>\u003cstrong>Avalanche Photodetector (APD)\u003c/strong>는 충분한 Electric Field에서 가속된 Primary Carrier가 Impact Ionization으로 추가 Electron–Hole Pair를 만드는 Multiplication을 이용합니다. Mean Gain M은 Photon Absorption Efficiency와 다른 물리량입니다. Breakdown에 대한 Bias와 Temperature Margin, Field Profile이 실제 동작을 정하지만 이번 모델은 그 Operating Point를 예측하지 않습니다.\u003c/p>\u003cp>Multiplication은 확률적이므로 \u003cstrong>Excess Noise\u003c/strong>가 동반될 수 있으며 큰 M이 반드시 SNR을 높이지는 않습니다. Avalanche Build-up Time도 응답을 늦출 수 있어 Gain–Bandwidth Trade-off를 고려합니다. 검증된 Model과 Parameter 없이 특정 Gain–Bandwidth Product나 APD Noise 숫자를 만들지 않습니다.\u003c/p>\u003cp>\u003cstrong>Charge Region Design\u003c/strong>은 Absorption Region과 Multiplication Region 사이의 Electric Field 분포를 조정하는 설계 개념입니다. Separate Absorption/Charge/Multiplication에서는 빛을 흡수하기 좋은 영역과 Impact Ionization을 일으킬 영역이 다른 Field를 필요로 할 수 있습니다. Charge Layer의 Doping과 Geometry는 이 Field를 연결하지만, 그림의 Layer 순서나 크기는 실제 PDK 설계를 지정하지 않습니다. 정량 해석에는 Semiconductor Transport와 Ionization Model이 필요합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"APD에서는 평균 전류만 계산합니다","scene":"detector","html":"\u003cdiv class=\"equation\">σ = q(nµ_n + pµ_p)\u003cbr>I_primary = R_unity P_opt\u003cbr>I_photo,APD = M I_primary, M ≥ 1\u003c/div>\u003cp>Photoconductivity 식은 개념 설명이며 Notebook은 Mobility나 Lifetime을 Device Voltage로 변환하지 않습니다. APD에서는 Mean Photo Current만 계산합니다. Dark Current 전체를 무조건 M배 하지 않고, Surface/Bulk 기여와 Multiplication 위치가 필요함을 구별합니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · Gain은 QE가 아닙니다\u003c/h3>\u003cp>λ=1550 nm, η_ext=0.8, P=100 µW에서 Primary Current≈100 µA입니다. 가정한 M=5이면 평균 Multiplied Photo Current≈500 µA입니다. 이 수치만으로 APD Bias, Breakdown Voltage, Shot Noise, SNR 또는 실제 Bandwidth를 알 수 없습니다.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"Gain을 높이면 SNR도 늘까요?","scene":"detector","html":"\u003cp>APD가 평균 전류를 키운다는 사실과 Receiver의 SNR이 좋아진다는 주장은 구별해야 합니다. Tutor에서 Signal뿐 아니라 Noise와 응답 속도에 필요한 정보도 생각하세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Primary와 Multiplied Current를 따로 보세요","scene":"detector","html":"\u003cp>Gain을 1→5→10으로 바꾸세요. Primary R과 Primary Current는 유지되며 평균 Multiplied Current만 증가합니다. Figure의 Secondary Pair는 Multiplication 원리를 설명하는 고정 개념도이며 실제 Avalanche 사건 수를 시뮬레이션한 것이 아닙니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Gain에는 Noise와 Speed의 대가가 있습니다","scene":"detector","html":"\u003cul>\u003cli>Photoconductive Gain은 Lifetime/Transit과 연결되며 속도 대가가 있을 수 있습니다.\u003c/li>\u003cli>PIN은 Drift Collection, APD는 Impact Ionization Multiplication을 구분합니다.\u003c/li>\u003cli>큰 M은 QE 증가나 SNR 개선 보장이 아닙니다.\u003c/li>\u003cli>Charge Region은 Electric Field 설계의 일부이며 정량 검증이 필요합니다.\u003c/li>\u003c/ul>\u003cp>다음은 Length, Junction Orientation, Contacts가 이 원리를 어떻게 바꾸는지 살펴봅니다.\u003c/p>"}],"prediction":"M만 1에서 5로 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","평균 Photo Current는 5배, QE와 실제 SNR은 별도 판단","흡수 Photon 수가 반드시 5배","Bandwidth와 SNR도 반드시 5배"],"predictionFeedback":"정의한 Mean Gain에서는 Multiplied Photo Current만 5배입니다. Absorption, Primary QE, Bias와 Noise/Speed를 자동으로 정하지 않습니다.","reflection":"Photoconductive, PIN, APD에서 전류가 생기는 방식과 큰 APD Gain이 항상 유리하지 않은 이유를 설명하세요.","sources":["D0","D1","D2","D3"],"tutor":{"question":"APD의 M을 크게 하면 Responsivity와 SNR은 항상 함께 좋아질까요?","choices":[{"text":"아닙니다. 평균 Photo Current는 커지지만 Excess Noise와 응답 시간을 함께 고려해야 합니다.","feedback":"맞습니다. Mean Gain은 Signal을 키우지만 Multiplication Noise와 Build-up, Receiver 조건이 있어 SNR의 단조 개선을 보장하지 않습니다.","correct":true},{"text":"예. M배 늘어난 Current는 모두 Noise 없는 Signal입니다.","feedback":"Impact Ionization은 확률적입니다. Excess Noise를 제외한 Mean Current 계산만으로 Noise 없는 증폭이라고 할 수 없습니다."},{"text":"예. Unity-gain PIN Shot Noise 식에 I_photo만 M배 대입하면 APD Noise가 완성됩니다.","feedback":"APD Noise에는 Excess Noise Factor와 Multiplication 위치별 Dark Current 등이 필요합니다. PIN 식을 그대로 사용하지 않습니다."}],"why":"흡수 확률과 수집 확률은 Primary QE이며, Avalanche Gain은 수집 전하가 증폭되는 별도의 확률 과정입니다. Noise와 Build-up도 고려해야 합니다.","simple":"작은 소리를 크게 틀어도 잡음이 함께 커지고 증폭 과정이 새 잡음을 만들 수 있습니다. 출력 크기만으로 더 잘 들린다고 결론내릴 수 없습니다.","math":"I_APD=M R_unity P는 평균 Photo Current 관계입니다. Noise에는 M²와 Excess Noise 등 별도 모델이 필요해 이번 Notebook에서 계산하지 않습니다.","notebook":"M Slider는 Primary Current를 유지하고 Multiplied Mean Current만 바꿉니다. APD에서는 PIN Noise 수치를 표시하지 않습니다."}},{"id":"5.5","short":"Geometry & Contacts","title":"How Geometry Changes Detector Performance","time":"15–22분","lead":"Optical Length를 늘려 Absorption을 높이는 일과 Carrier 경로를 줄여 빠르게 수집하는 일은 같은 방향의 문제가 아닙니다. Junction, Contacts, Load를 함께 읽습니다.","question":"Detector를 크게 만들면 빛을 더 많이 흡수하니 언제나 더 좋은 설계일까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Optical과 Electrical Design을 함께 읽습니다","scene":"detector","html":"\u003cp>Chapter 1의 Mode와 Chapter 3의 Coupling을 설계해 Absorber에 빛을 보내더라도, Geometry는 Optical과 Electrical Domain에 서로 다른 영향을 줍니다. \u003cstrong>길수록 좋다\u003c/strong> 또는 \u003cstrong>작을수록 빠르다\u003c/strong>라는 단일 규칙으로 Device를 결정할 수 없습니다.\u003c/p>\u003cp>원서의 Junction Orientation → Geometry → Contacts → External Load 순서로 변수를 구분하고 계산 가능한 Absorption만 정량화하겠습니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Orientation에서 External Load까지","scene":"detector","html":"\u003cp>\u003cstrong>PIN Junction Orientation\u003c/strong>이 Lateral이면 Carrier가 주로 옆 방향으로, Vertical이면 두께 방향으로 수집될 수 있습니다. Optical Propagation은 Waveguide를 따라 진행하므로 Absorption Length와 Transit Distance가 독립적으로 설계될 여지가 있습니다. 실제 전기장은 2D/3D이고 전하 생성 위치도 분포하므로 개념도의 화살표를 균일한 Field 해로 읽지 않습니다.\u003c/p>\u003cp>\u003cstrong>Detector Length L\u003c/strong>은 가정한 α_eff 아래에서 Absorption을 증가시킵니다. 그러나 충분히 긴 영역에서는 남은 Power가 작아져 추가 길이의 효과가 줄어듭니다. Waveguide 반사, Mode Evolution, Contact Absorption과 비균일 Ge가 있으면 단순 지수 모델과 달라질 수 있습니다.\u003c/p>\u003cp>\u003cstrong>Width / Height\u003c/strong>는 Optical Mode Overlap, Junction Area, Depletion Width와 Carrier 수집 경로를 바꿀 수 있습니다. Area가 커지면 특정 평행판 가정에서는 C≈εA/d가 증가할 수 있으나 Fringing, 실제 Junction Profile, Pad Parasitics가 추가됩니다. 이 Chapter는 Length→Capacitance의 임의 상관식을 만들지 않습니다. C_total과 W를 각각 독립 입력으로 두어 가정의 위치를 드러냅니다.\u003c/p>\u003cp>\u003cstrong>Contact Material\u003c/strong>은 Optical Absorption, Contact Resistance, Schottky/Ohmic 특성과 공정 호환성에 영향을 줍니다. \u003cstrong>Contact Geometry\u003c/strong>를 Mode에서 멀리 두면 Metal Optical Loss를 줄일 수 있지만 Carrier 경로와 Series Resistance가 달라질 수 있습니다. 좁은 Contact가 무조건 좋다고 단정할 수 없습니다. 전하 수집의 균일성, Current Crowding과 Fabrication Margin도 중요합니다.\u003c/p>\u003cp>\u003cstrong>External Load\u003c/strong>는 Small-signal R_eq와 C_total에 포함되는 외부 회로의 일부입니다. 특정 Detector 단독의 Junction C만 줄여도 Pad와 Load가 지배하면 RC 개선은 작을 수 있습니다. Contact/Geometry를 바꾸며 얻는 Absorption 증가가 Transit 또는 RC 변화와 어떤 관계인지는 실제 구조와 Model이 필요합니다. 이번 Figure는 구조적 Trade-off를 설명하며 최적 Device를 자동 추천하지 않습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Effective Power Absorption의 한계","scene":"detector","html":"\u003cdiv class=\"equation\">P(z)/P(0) = exp(−α_eff z)\u003cbr>η_abs(L) = 1 − exp(−α_eff L)\u003cbr>η_ext = η_coupling η_abs η_collection\u003cbr>R_ext = η_ext qλ/(hc)\u003c/div>\u003cp>α_eff [cm⁻¹]와 L [µm]는 α_eff L×10⁻⁴로 무차원화합니다. α_eff는 Guided Power의 유효 흡수계수라는 독립 가정이며 Field Amplitude 감쇠계수가 아닙니다. η_collection은 흡수된 Photon당 수집된 Pair 비율로 정의합니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 흡수와 External QE\u003c/h3>\u003cp>α_eff=1000 cm⁻¹, L=20 µm이면 η_abs≈0.8647입니다. Coupling=0.9, Collection=0.9이면 η_ext≈0.7004, 1550 nm에서 R_ext≈0.8756 A/W입니다. 이미 이 방식으로 만든 η_ext에 Absorption을 또 곱하지 않습니다.\u003c/p>\u003cp>L=40 µm이면 η_abs≈0.9817이지만, 실제 Capacitance나 Device Bandwidth는 이 식만으로 결정되지 않습니다.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"Length 증가의 대가를 설명하세요","scene":"detector","html":"\u003cp>Absorption Curve가 포화되는 것과 Electrical Load가 커질 수 있는 이유를 따로 설명해 보세요. 길이 제한에는 Footprint와 공정 제약도 있지만 이들을 하나의 가짜 최적화 점수로 합치지 않습니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"입력의 독립성을 확인합니다","scene":"detector","html":"\u003cp>L과 α_eff만 바꿔 Absorption/η_ext/R을 확인하세요. 이어 독립 C_total과 Transit W를 바꿔 보세요. L만 바꿀 때 이 두 입력이 자동 변경되지 않는 이유는 실제 Device의 상관관계를 가정하지 않았기 때문입니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"크기와 성능의 관계에는 가정이 필요합니다","scene":"detector","html":"\u003cul>\u003cli>Optical Propagation Length와 Carrier Transit Distance는 다릅니다.\u003c/li>\u003cli>Absorption은 길이에 따라 포화될 수 있습니다.\u003c/li>\u003cli>Width/Height, Contact Material/Geometry와 External Load는 별도 검토 대상입니다.\u003c/li>\u003cli>η_ext의 Factor를 한 번씩만 적용합니다.\u003c/li>\u003c/ul>\u003cp>이 관계를 실제 Geometry에서 예측하려면 어떤 Solver 정보가 필요한지 다음 Lesson에서 확인합니다.\u003c/p>"}],"prediction":"L만 늘리고 α와 C, W는 고정하면?","predictionOptions":["먼저 예측을 선택하세요","Absorption 증가·포화, 지정 RC/Transit은 일정","Carrier Transit Distance도 자동으로 같은 비율 증가","External QE가 100% 초과"],"predictionFeedback":"지수 흡수 모델은 Absorption만 증가시킵니다. 실제 Geometry에 따른 C/W 변화는 별도 모델 없이는 만들지 않습니다.","reflection":"Optical Length, Carrier Transit Distance, Capacitance와 Contact Geometry를 구별하고 Absorption→External QE의 Reference Plane을 적으세요.","sources":["D0","D1","D2","D3"],"tutor":{"question":"Detector Length가 Absorption을 높일 수 있는데 왜 실제 Design에 제한을 둘까요?","choices":[{"text":"Length가 늘면 실제 Bandwidth는 어떤 구조에서도 정확히 반비례로 감소하기 때문입니다.","feedback":"보편적인 L→Bandwidth 법칙은 없습니다. Optical Length와 Carrier 경로, Capacitance의 관계는 Junction/Contact Geometry에 따라 다릅니다."},{"text":"Absorption 이득은 포화되며 Geometry/Contacts/Load와 함께 Collection, Capacitance와 Footprint를 검토해야 합니다.","feedback":"맞습니다. 단순 Absorption 개선만으로 실제 전기 응답이나 최적 Geometry를 결정하지 않습니다. 명시한 모델과 독립 검증이 필요합니다.","correct":true},{"text":"Absorption Efficiency가 곧 External QE이므로 나머지는 무시할 수 있습니다.","feedback":"Coupling과 Collection 손실이 남을 수 있습니다. Factorized η_ext는 각 정의된 Efficiency를 중복 없이 한 번씩 곱합니다."}],"why":"길이로 늘어나는 유용한 Absorption은 포화되지만 Contacts, Geometry와 전기적 경로의 비용은 별도입니다. 플랫폼마다 다른 상관관계를 검증해야 합니다.","simple":"빛을 잡는 통로를 길게 하는 것과 전하가 출구까지 이동하는 방향은 다를 수 있습니다. 들어온 양과 실제 배출 속도를 따로 확인하세요.","math":"η_abs=1−exp(−α_eff L)이고 η_ext=η_coupling η_abs η_collection입니다. τ_tr=W/v와 f_RC=1/(2πRC)는 별도 입력입니다.","notebook":"Length를 바꿔도 C와 W는 그대로입니다. 임의 Device Correlation을 숨겨 넣지 않았기 때문입니다. 직접 C/W를 바꿔 구별하세요."}},{"id":"5.6","short":"Optical & Electrical Models","title":"Optical and Electrical Detector Modelling","time":"15–22분","lead":"Optical Solver가 예측한 Absorption을 Carrier Generation으로 연결하고, Transport Solver가 어떤 전하를 실제 수집하는지 계산해야 합니다. 두 Domain의 입력과 출력을 구분합니다.","question":"Photodetector를 예측하려면 왜 Optical Simulation과 Electronic Simulation이 모두 필요할까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"가정한 입력을 실제 Device에서 구하려면","scene":"detector","html":"\u003cp>5.1–5.5에서는 입력 η, C, W를 독립적으로 지정했습니다. 실제 Device에서는 이 값들을 Geometry와 Material에서 예측하거나 측정해야 합니다. \u003cstrong>Optical Field가 크다\u003c/strong>와 \u003cstrong>Current가 크다\u003c/strong> 사이에는 아직 Absorption과 Charge Collection이라는 두 단계가 남아 있습니다.\u003c/p>\u003cp>Chapter 1의 Analytical Slab/Numerical Scalar Mode는 Mode의 공간 분포를 이해하는 예제였습니다. 그 Si/SiO₂ 결과를 Ge 구조에 그대로 붙여 실제 Optical Generation Map이라고 부르면 모델이 바뀐 사실을 숨기게 됩니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Optical Generation을 Electrical Source로 연결합니다","scene":"detector","html":"\u003cp>\u003cstrong>Optical Domain\u003c/strong>의 Eigenmode Solver는 주어진 단면의 Mode Profile과 Propagation Constant를 구하고, 3D FDTD는 입력 Waveguide에서 Ge Region, Contacts, Reflection을 포함하는 공간적 전파와 Absorption을 계산할 수 있습니다. 필요한 것은 복소 Optical Material Property, Geometry, Source Normalization, Boundary Conditions와 Mesh Convergence입니다. Solver 이름만으로 정확도가 보장되지는 않습니다.\u003c/p>\u003cp>Absorbed Power Density와 Photon Energy에서 \u003cstrong>Optical Generation Profile G(r)\u003c/strong>를 얻을 수 있습니다. 유용한 Absorption이 전자–정공 생성으로 이어지는 Yield 가정이 필요하고 Metal이나 다른 Layer의 Parasitic Absorption을 모두 Ge의 Pair Generation으로 계산하면 안 됩니다. Normalized Field²는 Power Density나 Generation Rate와 단위가 다릅니다.\u003c/p>\u003cp>\u003cstrong>Electrical Domain\u003c/strong>은 Doping과 Bias, Contact, Defect/Recombination, Mobility와 Material Parameters로 Electric Potential/Field 및 Carrier Continuity를 풉니다. Drift와 Diffusion을 통한 이동, Recombination과 Trap, Junction Capacitance, Contact Resistance가 수집 전류와 응답 시간에 기여합니다. TCAD 결과 역시 Model Calibration과 Mesh/Boundary 검증을 요구합니다.\u003c/p>\u003cp>연결 인터페이스에서는 Optical Generation의 단위 [m⁻³ s⁻¹], 좌표계, Optical Power Reference Plane, 정규화와 공간 Mesh를 보존해야 합니다. Optical Solver의 Absorption Fraction을 Electronic Solver의 수집 전류로 바꾸려면 Volume에 분포한 Source를 올바르게 전달해야 합니다. Steady-state Photocurrent만 맞춰도 Frequency Response까지 검증한 것은 아닙니다.\u003c/p>\u003cp>이번 Notebook은 \u003cstrong>Uniform 1D Effective Power Absorption과 Lumped Collection Factor\u003c/strong>만 사용합니다. 그림은 Solver 간의 데이터 흐름을 보여주는 Conceptual Diagram이며 FDTD/TCAD를 실행하지 않습니다. 기존 Mode Profile의 중요성을 연결하되 이를 새로운 Ge-on-Si Field Solution으로 재명명하지 않습니다. 실제 Ge Generation Map이 필요하면 해당 Geometry/Material의 독립적인 Solver 계산과 수렴 검증을 후속으로 수행해야 합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Field, Energy, Pair와 Current는 다른 단위입니다","scene":"detector","html":"\u003cdiv class=\"equation\">G(r) = p_abs,useful(r) / E_ph\u003cbr>I_ideal = q ∫ G(r) dV\u003cbr>I_collected ≤ I_ideal (unity gain)\u003c/div>\u003cp>p_abs는 유용한 흡수 Power Density [W/m³], G는 Pair Generation Rate [m⁻³s⁻¹]입니다. 위 식은 Photon당 한 Pair라는 가정의 설명입니다. 이번 App에서 공간 적분 Solver를 수행하지 않으며, Lumped η_collection으로 구분합니다. Gain이 있으면 마지막 부등식을 같은 형태로 쓰지 않습니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 90% Absorption의 다음 질문\u003c/h3>\u003cp>정의한 Absorber Plane에서 η_abs=0.90, 그 앞 Coupling=0.80, 흡수 후 Collection=0.70이라면 η_ext=0.504입니다. 90% Absorption만 보고 External QE도 90%라고 할 수 없습니다. 모든 입력은 예시이며 실제 Solver 결과가 아닙니다.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"Absorption이 90%라면 QE도 90%인가요?","scene":"detector","html":"\u003cp>Absorption 90%라는 보고에서 어느 Material과 어느 Reference Plane을 뜻하는지 먼저 확인합니다. Contact Metal에 흡수된 에너지도 검출 전하로 셀 수 있을지 Tutor와 검토하세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Collection만 바꾸어 보세요","scene":"detector","html":"\u003cp>동일한 Absorption에서 Collection과 Coupling을 각각 바꾸세요. Optical Absorption Curve가 유지되어도 External R과 Current가 달라집니다. Notebook의 지수 곡선은 분포 해석의 대용 모델이며 실제 G(r) Map은 아닙니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"두 Solver는 서로 다른 질문에 답합니다","scene":"detector","html":"\u003cul>\u003cli>Optical Field → 유용한 Absorption → Generation Source를 구분합니다.\u003c/li>\u003cli>Transport는 수집과 손실 및 시간 응답을 계산합니다.\u003c/li>\u003cli>단위, 좌표, 입력 Power Plane의 연결이 중요합니다.\u003c/li>\u003cli>이번 Analytical Notebook은 3D FDTD/TCAD 결과를 주장하지 않습니다.\u003c/li>\u003c/ul>\u003cp>마지막 Lesson에서는 이 경계를 유지하며 Detector 계산을 통합합니다.\u003c/p>"}],"prediction":"Absorption만 고정하고 Collection이 절반이면?","predictionOptions":["먼저 예측을 선택하세요","Factorized η_ext와 Primary Current가 절반","Optical Mode Field가 반드시 절반","Absorption Coefficient가 자동으로 절반"],"predictionFeedback":"독립적인 Collection Factor는 수집 전하만 바꿉니다. Absorption과 Optical Mode가 자동으로 바뀐다는 Device Feedback을 가정하지 않습니다.","reflection":"Optical Solver의 출력과 Electrical Solver의 입력을 단위까지 적고, Absorption Fraction이 External QE와 다른 이유를 설명하세요.","sources":["D0","D1","D2","D3"],"tutor":{"question":"Optical Solver에서 Absorption이 90%라면 External Quantum Efficiency도 반드시 90%일까요?","choices":[{"text":"예. Absorbed Optical Power는 곧 수집 전하이기 때문입니다.","feedback":"흡수 위치와 유용한 Pair Generation, Recombination과 Collection이 남아 있습니다. Metal Absorption을 유용한 Ge 흡수와 혼동하면 안 됩니다."},{"text":"예. 큰 Optical Field를 보면 External Current를 바로 알 수 있습니다.","feedback":"Normalized Field와 Power Density, Generation Rate 및 Current는 단위가 다릅니다. Source Normalization과 Transport가 필요합니다."},{"text":"아닙니다. Absorption Plane, Coupling, 유용한 Generation과 Collection을 확인해야 합니다.","feedback":"맞습니다. 동일한 흡수에서도 전하 수집 손실이 존재할 수 있습니다. External QE는 동일한 Reference Plane의 수집 전하/Photon 비율입니다.","correct":true}],"why":"Optical Solver는 전하 수집을 자동으로 해결하지 않습니다. Electrical Transport에 Generation Source와 공정/접촉/전기장 모델이 추가로 필요합니다.","simple":"빛을 잡았다는 사실과 전하가 출구까지 살아서 도착했다는 사실은 다릅니다. 잡은 위치와 이동 중 손실도 살펴야 합니다.","math":"Photon당 한 Pair라는 가정에서 G=p_abs/E_ph이며 I_ideal=q∫GdV입니다. 실제 Unity-gain Current에는 Collection과 Reference Plane의 손실이 반영됩니다.","notebook":"α/L을 유지하고 Collection을 바꾸면 Absorption Curve는 같지만 η_ext와 Current가 변합니다. 이 차이를 Optical/Electrical Domain과 연결하세요."}},{"id":"5.7","short":"Detector Design Review","title":"Detector Design Review and Worked Problems","time":"15–22분","lead":"Photon Energy부터 Responsivity, Absorption, RC, Dark-current Noise까지 명시한 가정으로 연결합니다. 계산 가능한 양과 실제 Device에서 추가 검증할 양을 나누어 설명합니다.","question":"Detector Specification을 보면 어떤 Reference Plane과 물리적 제한부터 확인해야 할까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"수치 계산 전에 Reference Plane을 확인합니다","scene":"detector","html":"\u003cp>지금까지 배운 식을 조합하기 전에 입력의 정의를 확인합니다. Reference Plane이 Fiber 입력인지, Waveguide인지, Absorber 입구인지에 따라 같은 Device라도 External R의 의미가 달라집니다. Input Power와 QE의 분모가 같은 위치를 기준으로 하는지 먼저 확인하세요.\u003c/p>\u003cp>이번 Review는 계산 결과의 전제와 한계를 설명하는 Engineering Exercise입니다. 원서 7.6 Problems와 7.7 Code Listings는 본문에 접근하지 못했으므로, 여기서는 독자 작성한 Worked Problems와 공개 JS 모델을 사용합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"계산과 Engineering Interpretation","scene":"detector","html":"\u003cp>\u003cstrong>Step 1 · Photon Energy와 Reference Plane\u003c/strong>. 1550 nm에서 Photon Energy는 약 0.80 eV입니다. Power를 측정하는 Plane을 Detector Coupling 앞의 Waveguide로 정의하고, 그 뒤의 Coupling/Absorption/Collection을 Factorized QE에 각각 한 번씩 반영합니다. 5.1의 독립 η_ext 입력과 다른 방식이므로 기존의 External QE를 추가로 곱하지 않습니다.\u003c/p>\u003cp>\u003cstrong>Step 2 · Unity-gain R과 Primary Current\u003c/strong>. α_eff와 L에서 η_abs를 계산하고, η_ext를 구성한 뒤 R=η_ext qλ/(hc), I_primary=RP로 진행합니다. Unity-gain Ideal Limit과 가정한 η_ext의 R을 나누어 읽으세요. Dark Current는 입사 Power로 생긴 전류가 아니므로 Photo Current에 섞지 않습니다.\u003c/p>\u003cp>\u003cstrong>Step 3 · Electrical Response\u003c/strong>. R_eq와 C_total에서 First-order RC만 계산합니다. Carrier의 W/v는 별도의 시간 척도입니다. 실제 Overall Bandwidth에는 Carrier Impulse Response, Field/Generation Profile, Contact/Interconnect와 외부 회로가 필요합니다. GHz를 그대로 Gb/s로 변환해 Link 성능을 선언하지 않습니다.\u003c/p>\u003cp>\u003cstrong>Step 4 · Noise와 Architecture\u003c/strong>. M=1에서는 독립 입력 Noise B에 대한 단순 Poisson Shot Noise를 표시합니다. Dark-only Contribution도 따로 확인합니다. M&gt;1이면 평균 Photo Current만 계산하고 APD Noise와 SNR은 미모델화 상태로 표시합니다. PIN 식을 그대로 적용해 SNR 개선을 예측하지 않습니다.\u003c/p>\u003cp>\u003cstrong>Step 5 · Design Interpretation\u003c/strong>. 높은 Absorption이 짧은 Transit 시간이나 작은 C를 보장하지는 않습니다. Ge-on-Si에서는 Material과 Interface, Contact Geometry, Doping, Bias, Optical Mode, Temperature를 검증해야 합니다. 이번 식은 각 요소의 역할을 이해하는 도구이며 Fabricated Device의 Spec이나 PDK를 생성하지 않습니다. 계산 결과와 Model Boundary를 함께 설명하세요.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"동일 입력으로 재현 가능한 계산","scene":"detector","html":"\u003cdiv class=\"equation\">E = hc/λ\u003cbr>η_abs = 1−exp(−α_eff L)\u003cbr>η_ext = η_coupling η_abs η_collection\u003cbr>R_ext = η_ext qλ/(hc)\u003cbr>I_primary = R_ext P\u003cbr>f_RC = 1/(2π R_eq C_total)\u003cbr>i_dark,rms = √(2q I_dark B), M=1\u003c/div>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 재현 가능한 Detector Ledger\u003c/h3>\u003cp>λ=1550 nm, P=100 µW, α_eff=1000 cm⁻¹, L=20 µm, Coupling=0.9, Collection=0.9를 가정합니다. E≈0.7999 eV, Unity-gain Limit≈1.2502 A/W, η_abs≈0.8647, η_ext≈0.7004, R_ext≈0.8756 A/W, I_primary≈87.56 µA입니다.\u003c/p>\u003cp>R_eq=50 Ω, C_total=100 fF에서 f_RC≈31.83 GHz입니다. I_dark=10 nA, B=10 GHz이면 Dark-only Shot Noise≈5.66 nA rms입니다. M=5를 가정하면 평균 Photo Current≈437.8 µA이지만 APD Noise는 이 표로 계산할 수 없습니다.\u003c/p>\u003c/div>\u003cp>Practice A: P를 절반으로 줄이면 R과 Current 중 무엇이 변하는지 계산하세요. Practice B: C를 절반으로 줄여 RC와 Transit을 구별하세요. Practice C: Collection을 절반으로 줄여도 Absorption Curve는 유지되는 이유를 설명하세요.\u003c/p>\u003cp>Code Connection: notebook/ch5-models.js의 photon, current, rc, shot, absorption, externalQE 함수와 입력 단위를 연결해 보세요. 각 함수의 결과는 실제 Device Spec이 아닌 명시적 모델의 출력입니다.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"표의 수치로 어떤 결론까지 내릴 수 있나요?","scene":"detector","html":"\u003cp>출력된 수치 가운데 실제 Overall Device Bandwidth나 SNR까지 설명하는 양이 있을까요? Tutor에서 모델이 뒷받침하는 결론을 선택하고, 부족한 입력과 물리 과정을 적어 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Worked Problems를 재현합니다","scene":"detector","html":"\u003cp>Notebook에서 Baseline을 재현한 뒤 P, Collection, C, M을 한 번에 하나씩 바꾸세요. 입력 단위와 Reference Plane을 기록하고 Figure 5.7A의 결과와 비교합니다. M&gt;1이면 Noise 항목이 미모델화로 전환되는지도 확인하세요.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Chapter Summary와 학습의 되돌아보기","scene":"detector","html":"\u003cdiv class=\"chapter-review\">\u003ch3>Chapter 5 Summary · 빛에서 전류까지\u003c/h3>\u003cp>Photon Absorption → Electron–Hole Generation → Drift/Diffusion → Collection → Current를 설명할 수 있나요? η와 R, R과 I, Absorption과 External QE를 구별하면 수치를 물리적으로 해석할 수 있습니다.\u003c/p>\u003cul>\u003cli>RC와 Transit은 서로 다른 제한이며 Bandwidth와 Data Rate도 다릅니다.\u003c/li>\u003cli>Ge는 Telecom에서 유용한 흡수를 제공하지만 Material Quality와 Interface는 Collection/Dark에도 영향을 줍니다.\u003c/li>\u003cli>PIN은 Unity-gain Drift Collection, APD는 Impact Ionization과 Noise/Speed Trade-off를 구분합니다.\u003c/li>\u003cli>Orientation, Length, Width/Height, Contacts, External Load를 함께 검토합니다.\u003c/li>\u003cli>Optical Solver는 유용한 Generation을, Electronic Solver는 Collection과 응답을 다룹니다.\u003c/li>\u003c/ul>\u003cp>모델 수치를 실측이나 PDK Spec으로 부르지 않고 미계산 물리를 명시하세요. 후속 System Design에서는 TIA/DSP 등의 역할이 추가됩니다. 이번 Release의 학습 범위는 Chapter 5까지입니다.\u003c/p>\u003c/div>"}],"prediction":"P만 절반으로 줄이고 나머지 입력은 고정하면?","predictionOptions":["먼저 예측을 선택하세요","R은 일정하고 Primary Current는 절반","R과 Current가 모두 반드시 절반","실제 Bandwidth가 반드시 두 배"],"predictionFeedback":"선형 교육 모델에서 R은 QE와 λ로 결정되고 I=RP이므로 P만 절반으로 줄이면 Current가 절반입니다. Saturation/Heating 등의 Feedback은 포함하지 않습니다.","reflection":"Photon에서 Current까지의 전 과정, RC/Transit, Ge/PIN/APD와 Geometry의 Trade-off를 설명하고 이번 모델이 예측하지 못하는 물리량을 3개 적으세요.","sources":["D0","D1","D2","D3"],"tutor":{"question":"Notebook에서 RC Bandwidth와 APD Mean Current를 계산했습니다. 어떤 결론이 타당할까요?","choices":[{"text":"RC와 Mean Current는 명시한 가정의 결과이며 Overall Bandwidth와 APD Noise/SNR에는 별도 검증이 필요합니다.","feedback":"맞습니다. 독립 입력의 교육 모델이 설명하는 범위를 구별하고 Generation/Collection Profile, External Circuit, Excess Noise 등 부족한 정보를 명시합니다.","correct":true},{"text":"수치가 나왔으므로 실제 Ge-on-Si PDK Device 성능을 검증했습니다.","feedback":"가정한 값을 식에 넣는 일은 실제 Material/Geometry/Process의 검증과 다릅니다. 측정이나 검증된 Solver 결과가 필요합니다."},{"text":"RC Bandwidth를 Data Rate로 보고, M배 Current에서 SNR도 M배라고 판단합니다.","feedback":"Data Rate에는 System 조건이, APD Noise에는 Excess Noise 등이 필요합니다. Current Gain과 RC만으로 Link/SNR을 결정하지 않습니다."}],"why":"식으로 구한 양의 이름을 정확히 읽는 것이 중요합니다. RC Pole은 종합 Device 응답이 아니며 APD Mean Current는 Noise 모델을 대신하지 않습니다.","simple":"계산표는 제한된 조건을 보여 줍니다. 무엇을 입력했고 무엇을 계산했는지 구별한 뒤, 다루지 않은 과정에는 어떤 정보가 필요한지 적어 보세요.","math":"η_ext의 각 Factor는 한 번씩 적용합니다. I_primary=RP, I_APD=M I_primary, f_RC=1/(2πRC)이며 Total f, SNR, BER을 구하는 모델은 정의하지 않았습니다.","notebook":"같은 입력에서 Figure 5.7A와 Notebook을 비교하세요. M=1의 PIN Noise 표시와 M>1에서 APD Noise가 미모델화로 전환되는 차이를 확인합니다."}},{"id":"6.1","short":"External Power Supply","title":"Where Does the Light Enter a Silicon PIC?","time":"15–22분","lead":"Chapter 3에서 배운 Optical I/O 앞에는 빛을 공급하는 Source가 필요합니다. Chapter 6에서는 Source 출력과 PIC 입력을 구별하고 빛과 Heat의 이동을 따라갑니다.","question":"같은 20 mW Laser인데 PIC에 도달하는 Power는 왜 다를까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"빛을 만드는 일과 전달하는 일을 나눕니다","scene":"laser","html":"\u003cp>지금까지의 Waveguide·Modulator·Detector는 입력된 빛을 전달하거나 조절하거나 검출했습니다. 그 앞에는 Optical Energy를 공급하는 Source가 있어야 합니다. Laser를 \u003cstrong>Optical Power Supply\u003c/strong>로 보면 External Laser를 사용하는 이유가 분명해집니다.\u003c/p>\u003cp>전기 Power Supply의 단자와 부하 입력이 다르듯, Laser Output Port와 PIC 입력 Plane도 다릅니다. Chapter 3의 Coupling Loss가 이 둘을 연결합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Silicon은 좋은 Waveguide여도 쉬운 Laser Material은 아닙니다","scene":"laser","html":"\u003cp>Silicon의 Bandgap은 Indirect입니다. Band Extrema의 Momentum이 달라 단순한 Electron–Hole Radiative Recombination이 Direct-gap III–V처럼 효율적으로 일어나기 어렵습니다. Silicon이 특정 파장에서 빛을 잘 안내한다는 사실이 효율적인 Light Generation을 뜻하지는 않습니다. III–V Gain Material을 사용하는 주요 이유가 여기에 있습니다.\u003c/p>\u003cp>\u003cstrong>External Laser\u003c/strong>는 Source와 PIC를 다른 위치에 두고 Fiber 또는 다른 Optical Interface로 연결합니다. Source의 파장과 Power를 선택하고 열을 별도로 처리할 수 있으며 교체 가능한 구성도 설계할 수 있습니다. 그러나 Coupling Alignment, Reflection, Polarization과 Package 인터페이스는 여전히 검증해야 합니다. 분리했다는 이름만으로 낮은 전체 소비 전력이 보장되지는 않습니다.\u003c/p>\u003cp>Source Reference Plane A는 여기서 단일 출력 Laser의 총 Optical Output입니다. PIC Reference Plane B는 정의된 Optical I/O 바로 뒤의 Waveguide 입력입니다. A에서 B까지의 Loss만 IL로 세며, B 이후 Splitter·Propagation Loss를 다시 이 IL에 넣지 않습니다. Chapter 3의 Overlap 계산은 이 Interface를 설명하는 한 방법이며 지금은 IL을 독립 가정합니다.\u003c/p>\u003cp>\u003cstrong>Wall-plug Efficiency\u003c/strong>는 같은 Source 경계의 Optical Output을 Electrical Input으로 나눈 비율입니다. WPE가 낮으면 같은 Optical Power를 만들 때 Source에서 더 많은 Power를 소비하고 Heat가 남습니다. 여기서는 Driver와 TEC를 제외합니다. 다른 Port로 빛이 나온다면 그 Power도 Source 총 출력에 포함하거나 별도 항목으로 기록해야 합니다.\u003c/p>\u003cp>Coupling에서 전달되지 않은 빛은 반사되거나 방사되거나 다른 위치에서 흡수될 수 있습니다. 이를 전부 Laser 내부 Heat로 더하면 열의 위치를 잘못 해석합니다. 다음 모델은 에너지 잔차를 계산할 뿐 Source 온도나 Thermal Resistance를 예측하지 않습니다. 교재의 2015년 Foundry 가용성 서술을 현재 상황으로 사용하지도 않습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"같은 Reference Plane으로 Power를 셉니다","scene":"laser","html":"\u003cdiv class=\"equation\">η_c = 10^(−IL_dB/10)\u003cbr>P_PIC = P_source η_c\u003cbr>P_elec = P_source / η_WPE\u003cbr>Q_source = P_elec − P_source\u003c/div>\u003cp>모든 Power는 같은 단위로 사용합니다. Notebook은 mW이며 η는 무차원입니다. dBm은 1 mW 기준의 로그 값입니다. 출력 0 mW는 −∞ dBm / 출력 없음으로 표시합니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 빛 20 mW의 행방\u003c/h3>\u003cp>Single-output Source가 20 mW, WPE가 0.20, IL이 3 dB라고 가정합니다. Electrical Input은 100 mW, Source Heat는 80 mW, PIC 입력은 약 10.0237 mW입니다. Coupling 미전달 Power는 약 9.9763 mW입니다. 100=80+10.0237+9.9763 mW로 에너지가 맞습니다.\u003c/p>\u003c/div>\u003cp>20 mW Source와 20 mW PIC 입력은 다릅니다. IL=0일 때만 이 단순 Interface에서 둘이 같아집니다.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"미전달 Power는 어디에 있나요?","scene":"laser","html":"\u003cp>Tutor에서는 Coupling Loss와 Source Heat의 위치를 구별합니다. 3 dB를 적용한 뒤 같은 손실을 다시 적용하면 어떤 Reference Plane을 두 번 통과시킨 셈인지 설명해 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Coupling과 WPE를 독립적으로 바꿉니다","scene":"laser","html":"\u003cp>Source Power를 20 mW로 두고 IL을 0→3→6 dB로 바꿉니다. PIC 입력은 줄지만 Electrical Input과 Source Heat는 그대로인지 확인하세요. 이어 WPE만 높이면 PIC 입력은 같고 Source Heat만 감소하는 이유를 적어 보세요.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Source와 PIC의 경계를 먼저 표시합니다","scene":"laser","html":"\u003cul>\u003cli>Silicon Guidance와 Light Generation은 다른 기능입니다.\u003c/li>\u003cli>Source 출력과 PIC 입력의 Plane을 먼저 정합니다.\u003c/li>\u003cli>WPE는 Source 변환 효율, Coupling은 전달 효율입니다.\u003c/li>\u003cli>Source Heat와 Coupling 미전달 Power의 위치는 다릅니다.\u003c/li>\u003c/ul>\u003cp>다음 Lesson에서는 Gain만으로 충분하지 않은 이유와 Cavity의 역할을 배웁니다.\u003c/p>"}],"prediction":"Source Power와 WPE 고정, IL만 증가하면?","predictionOptions":["먼저 예측을 선택하세요","PIC 입력만 감소하고 Source Heat는 유지","Source Heat가 반드시 같은 만큼 증가","PIC 입력과 Electrical Input이 함께 증가"],"predictionFeedback":"이 독립 Ledger에서는 P_source/WPE가 고정이므로 Source Heat도 고정입니다. 미전달 Power의 열적 위치는 별도 모델이 필요합니다.","reflection":"Source Plane과 PIC Plane을 그린 뒤 WPE와 Coupling Efficiency가 각각 어떤 두 Power의 비율인지 설명하세요.","sources":["L0","L1","L3"],"tutor":{"question":"Source20 mW, WPE20%, IL3 dB에서 Source 내부 Heat는?","choices":[{"text":"80 mW이며 Coupling 미전달 Power는 별도입니다.","feedback":"맞습니다. 100−20=80 mW입니다. 미전달 약9.98 mW가 어디에서 흡수되는지는 이 모델로 정하지 않습니다.","correct":true},{"text":"약90 mW이며 Coupling Loss를 전부 더합니다.","feedback":"Source에서 생긴 잔차와 Interface 뒤의 손실을 섞었습니다. 반사·방사·흡수 위치를 별도 항목으로 남겨야 합니다."},{"text":"20 mW입니다. Optical Output과 같은 값입니다.","feedback":"Heat는 Electrical Input에서 총 Optical Output을 뺀 값입니다. 출력과 같다는 일반 법칙은 없습니다."}],"why":"효율의 분자·분모와 공간 경계를 정해야 Source Dissipation과 Coupling 손실을 중복 계산하지 않습니다. 열 위치를 아는 것이 Package 선택에도 필요합니다.","simple":"전원에서100을 받고20을 빛으로 보냈다면 Source에는80이 남습니다. 그 빛20 중 길에서 잃은 것은 Source 안의80과 다른 항목입니다.","math":"P_elec=P_source/η_WPE=100 mW, Q=80 mW, P_PIC=20×10^(−0.3)=10.0237 mW입니다. 단위 mW를 유지합니다.","notebook":"IL만 바꿀 때 Source Heat가 유지되는지 관찰하세요. PIC Power를 다시20 mW로 맞추려면 Source Power를 별도로 늘려야 하며 자동 보상하지 않습니다."}},{"id":"6.2","short":"Gain, Feedback & L–I","title":"When Does Optical Gain Become Lasing?","time":"15–22분","lead":"Spontaneous Emission에서 Stimulated Emission으로, 한 번의 Amplification에서 Cavity 왕복으로 생각을 옮깁니다. Gain Threshold와 Current 기반 L–I는 독립된 교육 모델로 살펴봅니다.","question":"Gain Material을 넣기만 하면 왜 Laser가 되지 않을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Amplifier와 Laser를 구별합니다","scene":"laser","html":"\u003cp>한 번 지나가는 빛을 키우는 Amplifier와 외부 Seed 없이도 Oscillation을 유지하는 Laser는 다릅니다. Source를 이해하려면 Gain뿐 아니라 Cavity Feedback과 Loss를 함께 봐야 합니다.\u003c/p>\u003cp>이 Lesson은 균일 Fabry–Pérot 교육 모델로 Gain/Loss의 경계를 설명하고, 별도 L–I 모델로 Current에 따른 출력의 의미를 배웁니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Emission → Gain → Feedback → Threshold","scene":"laser","html":"\u003cp>\u003cstrong>Spontaneous Emission\u003c/strong>은 외부 Photon의 유도 없이 일어나는 전이입니다. 반면 Stimulated Emission에서는 입사한 Optical Mode가 전이를 유도하며 동일 Mode로 Photon이 더해집니다. Semiconductor에서 Absorption을 넘는 Net Optical Gain을 얻으려면 적절한 Carrier 분포가 필요합니다. 단순 에너지 준위 그림은 실제 Si Band Structure 계산이 아닙니다.\u003c/p>\u003cp>Gain Region 안의 Material Power Gain g와 Mode가 실제 겪는 Modal Gain Γg는 다릅니다. Γ는 Gain과 Optical Mode의 유효 Overlap을 나타냅니다. 여기서는 Γ를 독립 가정하며 그림의 면적을 재서 계산하지 않습니다. Internal Power Loss α_i에는 균일하게 분포했다고 가정한 흡수·산란이 들어갑니다.\u003c/p>\u003cp>\u003cstrong>Cavity Feedback\u003c/strong>은 일부 빛이 Gain Region으로 되돌아오게 합니다. 두 거울의 Power Reflectivity R₁,R₂와 왕복 길이2L을 생각하면, 돌아온 Power가 줄어들지 않는 경계가 Gain Threshold입니다. 의도한 Cavity Mirror Feedback과 Package 밖에서 돌아오는 원치 않는 Reflection은 같지 않습니다. 후자는 Instability의 원인이 될 수 있으나 여기서는 동역학을 풀지 않습니다.\u003c/p>\u003cp>Gain=Loss는 Power Balance 조건입니다. 실제 Mode가 발진하려면 왕복 Phase도 Resonance에 맞아야 합니다. Notebook은 Resonant Frequency가 있다는 가정에서 Power Margin만 계산하고 Spectrum·Photon 수·Mode Competition·Gain Clamping은 계산하지 않습니다. 양의 Margin을 무한 Photon 증가나 실제 발진 출력으로 읽으면 안 됩니다.\u003c/p>\u003cp>Threshold Current I_th는 필요한 Carrier Gain을 만드는 전류와 관련되지만, 이 앱에는 Recombination·Injection·Active Volume 모델이 없습니다. 따라서 별도 \u003cstrong>L–I Curve\u003c/strong>에서는 I_th를 독립 입력합니다. Differential Quantum Efficiency η_d는 지정된 Output Port로 나오는 Photon 증가량과 주입 Electron 증가량의 비이며, Electrical-to-optical WPE와 다릅니다. R을 높여 Mirror Loss를 줄여도 출력 결합과 실제 효율을 함께 보아야 합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"왕복 조건과 출력 기울기의 의미","scene":"laser","html":"\u003cdiv class=\"equation\">ln G_rt = ln R₁ + ln R₂ + 2(Γg − α_i)L\u003cbr>α_m = ln[1/(R₁R₂)]/(2L)\u003cbr>Γg_th = α_i + α_m\u003cbr>P_out = η_d hc/(qλ) max(I − I_th, 0)\u003c/div>\u003cp>R은 Amplitude가 아닌 Power Reflectivity입니다. Gain/Loss는 Power Coefficient이며 cm⁻¹→m⁻¹는×100, L은 µm→m로×10⁻⁶입니다. ln G_rt=0이 왕복 Power Unity입니다. L–I의 Current는 mA→A, λ는 nm→m로 변환합니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 두 개의 독립 질문\u003c/h3>\u003cp>R₁=R₂=0.3, L=300 µm, α_i=10 cm⁻¹이면 α_m≈40.1324 cm⁻¹, Modal Threshold≈50.1324 cm⁻¹입니다. Γ=0.2라면 필요한 Material Gain은 약250.662 cm⁻¹입니다.\u003c/p>\u003cp>별도로 λ=1550 nm, η_d=0.5, I_th=20 mA, I=80 mA를 가정하면 Slope≈0.399949 W/A, Output≈23.9969 mW입니다. 앞의 Gain Threshold로20 mA를 유도한 것이 아닙니다.\u003c/p>\u003c/div>\u003cp>Piecewise L–I는 Below-threshold Spontaneous Output, Thermal Rollover와 Dynamics를 생략합니다. 지정 Port 출력만 계산하므로 독립 Power Ledger에 자동으로 넣지 않습니다.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"Reflectivity를 높이면 모든 문제가 해결될까요?","scene":"laser","html":"\u003cp>Loss가 증가하면 같은 Cavity에서 필요한 Modal Gain이 커집니다. 그러나 이 결과를 곧바로 특정 Threshold Current로 바꾸려면 어떤 추가 입력이 필요한지 Tutor에서 확인하세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Threshold와 L–I를 각각 검증합니다","scene":"laser","html":"\u003cp>모델 선택에서 Threshold를 고르고 Internal Loss·R₂·Length를 하나씩 바꿉니다. Γ를0으로 만들면 Material Gain이 있어도 Mode Gain은0입니다. 다음으로 L–I를 선택해 I를 I_th 아래·같음·위로 바꾸고, Threshold 모델의 설정이 L–I 출력을 바꾸지 않는지 확인하세요.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"모델이 답하는 질문을 구별합니다","scene":"laser","html":"\u003cul>\u003cli>Material Gain과 Modal Gain을 Γ로 구별합니다.\u003c/li>\u003cli>Power Balance와 Phase Resonance가 모두 필요합니다.\u003c/li>\u003cli>Threshold Gain은 Threshold Current와 다른 물리량입니다.\u003c/li>\u003cli>η_d, Slope Efficiency, WPE는 서로 다른 정의입니다.\u003c/li>\u003c/ul>\u003cp>다음에는 Gain Region과 Cavity가 Package 안에서 어디까지 이어지는지 살펴봅니다.\u003c/p>"}],"prediction":"Internal Loss만 증가하면 필요한 Modal Threshold Gain은?","predictionOptions":["먼저 예측을 선택하세요","증가합니다.","감소합니다.","항상 그대로이며 Current만 변합니다."],"predictionFeedback":"Γg_th=α_i+α_m이므로 α_i 증가분만큼 Modal Threshold가 증가합니다. 실제 I_th 변화량은 이 모델이 계산하지 않습니다.","reflection":"Gain=Loss와 Phase Resonance가 각각 어떤 조건인지 적고, Threshold Gain에서 I_th를 구하려면 어떤 재료·주입 정보가 더 필요한지 설명하세요.","sources":["L0","L2","L3"],"tutor":{"question":"Gain Threshold가50 cm⁻¹라는 결과만으로 I_th를 알 수 있나요?","choices":[{"text":"아니요. Gain–Carrier와 Injection/Recombination 관계가 필요합니다.","feedback":"맞습니다. 길이당 Power Gain과 주입 전류는 단위도 모델도 다릅니다. 앱은 I_th를 독립 가정으로 남깁니다.","correct":true},{"text":"예.50 cm⁻¹를50 mA로 바꾸면 됩니다.","feedback":"cm⁻¹와 mA는 다른 차원의 물리량입니다. 단위 변환만으로 Material Gain에서 전류를 얻을 수 없습니다."},{"text":"예.η_d와 WPE가 같으므로 효율만 알면 됩니다.","feedback":"η_d는 Photon/Electron의 미분 비이고 WPE는 총 Optical/Electrical Power 비입니다. 서로 바꿔 쓸 수 없습니다."}],"why":"서로 다른 모델 사이에 없는 관계를 숨겨 넣으면 실제 Device 예측처럼 보입니다. Threshold Gain과 Current의 추가 물리를 명시하는 것이 중요합니다.","simple":"필요한 증폭량을 알았다고 배터리에 흐를 전류가 정해지지는 않습니다. 어느 재료에 얼마나 전하를 넣는지 알아야 전류와 연결할 수 있습니다.","math":"Γg_th=α_i+α_m의 단위는 cm⁻¹입니다. L–I는 η_d hc/(qλ) [W/A]에 I−I_th [A]를 곱하는 별도 가정 모델입니다.","notebook":"Threshold에서 Loss를 바꾼 뒤 L–I로 전환해 보세요. I_th가 자동으로 바뀌지 않습니다. 두 설정을 독립적으로 저장하고 비교하는 것이 의도된 동작입니다."}},{"id":"6.3","short":"Co-packaging","title":"Where Does the Laser Cavity End?","time":"15–22분","lead":"같은 Package 안에 있다고 같은 Laser 구조는 아닙니다. Pre-made Laser, External Cavity, Etched-pit Embedded Epitaxy의 Gain·Cavity·Optical Interface를 비교합니다.","question":"Gain Chip 밖의 Silicon Waveguide도 Laser Cavity의 일부일 수 있나요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Package와 Cavity를 따로 그립니다","scene":"laser","html":"\u003cp>External Source를 가까이 옮겨 같은 Package에 배치하면 배선과 Optical 연결 방식이 달라집니다. 그러나 물리적으로 가까워졌다는 정보만으로 Gain이 어디에 있는지, Cavity가 어디까지 이어지는지 알 수 없습니다.\u003c/p>\u003cp>이 Lesson은 원본8.3의 세 하위 항목을 순서대로 다루며 구조 선택의 이유를 설명합니다. Package 경계와 Optical Feedback 경계를 다른 선으로 읽어 보세요.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"세 가지 Co-packaging 접근","scene":"laser","html":"\u003cp>\u003cstrong>Pre-made Laser\u003c/strong>는 이미 Gain과 Feedback 구조를 갖춘 Laser Die를 Silicon PIC와 함께 Package에 놓는 접근입니다. Laser Output Facet에서 Si Waveguide까지 Optical Interface가 필요합니다. Laser Die를 미리 검사할 수 있는 장점이 있을 수 있지만, Assembly Alignment와 Thermal Path, Reflection 허용 범위는 별도로 확인해야 합니다. Cavity가 완성된 Laser Die 안에 있는 예시를 그림으로 보여 줍니다.\u003c/p>\u003cp>\u003cstrong>External Cavity Laser\u003c/strong>는 Gain Chip 자체 바깥의 Optical Path와 Reflector가 Feedback Loop를 완성하는 구조입니다. 예를 들어 Silicon 쪽 Passive Waveguide와 선택적 Reflector가 왕복 경로에 참여할 수 있습니다. 따라서 Gain Chip과 Silicon 사이의 Coupling은 단순 Output 전달뿐 아니라 발진 조건에도 영향을 줄 수 있습니다. Gain Region 길이와 전체 Cavity 길이를 같은 값으로 대입하면 안 됩니다.\u003c/p>\u003cp>\u003cstrong>Etched-pit Embedded Epitaxy\u003c/strong>는 이 교재 목차에서 별도 통합 접근으로 제시됩니다. Epitaxy라는 단어를 보고 Si 위에 III–V를 직접 성장시키는 방식이라고 단정하지 마세요. 확인한 Creazzo et al.(2013)의 1차 Abstract는 III–V Gain이 Silicon Chip 안에 Embedded되고, Gain Section을 Si Substrate에 Metal Bonding하여 Thermal Path를 만드는 구성을 설명합니다. 여기서는 미리 성장된 Gain Material을 Receiving Site에 통합하는 개념으로 구별합니다.\u003c/p>\u003cp>다만 원서8.3.3의 전체 본문과 공정 순서를 확인하지 못했습니다. 따라서 Pit 깊이, Bond Stack, Alignment 공차, Reflector 위치와 Yield를 원서 값처럼 재현하지 않습니다. Figure의 Cavity는 가능한 개념 범위이며 특정 논문의 정확한 Mask나 공정도는 아닙니다. Embedded라는 위치와 Direct Growth라는 재료 형성 방법을 혼동하지 않는 것이 이번 학습의 범위입니다.\u003c/p>\u003cp>세 구조를 비교할 때는 Gain 검증, Cavity Feedback, Output Interface, 열의 위치를 함께 적어야 합니다. 단일 명칭을 성능 순위로 사용하지 않습니다. 같은 Package라도 Cavity가 경계를 가로지르면 Reflection·Round-trip Phase·Alignment에 대한 질문이 달라집니다. 실제 External Cavity의 파장 선택과 안정성은 이 장의 균일 FP 모델이 정확히 풀지 않습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Interface는 왕복 경로에 들어갈 수 있습니다","scene":"laser","html":"\u003cdiv class=\"equation\">Cavity boundary ≠ Package boundary\u003cbr>Round-trip Interface Transmission = η_forward η_return\u003c/div>\u003cp>한 번 통과하는 Power Transmission이 η이고 왕복이 같은 Interface를 한 번씩 지난다고 가정하면 Interface만의 왕복 Power Factor는 η²입니다. 다른 Loss·Mirror·Gain·Phase는 별도입니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 한 번의 Loss와 왕복 Loss\u003c/h3>\u003cp>Interface가 한 방향1 dB Loss이면 Transmission은 약0.7943입니다. 같은 손실을 돌아오는 길에도 겪는 가정에서 왕복은2 dB, Factor는 약0.6310입니다. 이미 왕복 Loss가 주어졌다면 또 두 배 하지 않습니다. 이 예는 Interface 단독 장부이며 실제 External Cavity Threshold 예측이 아닙니다.\u003c/p>\u003c/div>\u003cp>Pre-made Source의 출력 뒤 Loss와 External Cavity 안의 Loss를 같은 역할로 취급할 수 없는 이유가 보입니다.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"같은 Package이면 모두 Hybrid일까요?","scene":"laser","html":"\u003cp>완성된 Laser Die를 옆에 놓은 구조와, Si Reflector가 Gain Chip에 Feedback을 돌려주는 구조를 비교하세요. 동일한1 dB Interface가 어떤 경로에서 등장하는지 Tutor와 확인합니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"구조를 선택하고 네 위치를 찾습니다","scene":"laser","html":"\u003cp>Integration Structure에서 Pre-made → External Cavity → Etched-pit을 선택하세요. 각 그림에서 Gain·Cavity 점선·Si 경로·Output Port를 찾아 본문에 적습니다. Cavity가 길어 보인다는 이유로 Threshold 수치를 부여하지 마세요.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"경계가 다르면 검증 항목도 달라집니다","scene":"laser","html":"\u003cul>\u003cli>Pre-made는 완성된 Laser Die의 통합입니다.\u003c/li>\u003cli>External Cavity는 Gain Chip 바깥이 Feedback 경로에 참여합니다.\u003c/li>\u003cli>Etched-pit Embedded와 Direct Growth는 같은 뜻이 아닙니다.\u003c/li>\u003cli>Package 경계와 Cavity 경계를 별도로 확인합니다.\u003c/li>\u003c/ul>\u003cp>다음은 Bonded Gain과 Silicon Mode의 Overlap을 살펴봅니다.\u003c/p>"}],"prediction":"External Cavity의 왕복 경로에 있는 Interface Loss가 커지면?","predictionOptions":["먼저 예측을 선택하세요","Feedback Power가 줄어 발진 조건에 영향을 줄 수 있습니다.","Output만 줄고 Cavity에는 영향이 없습니다.","반드시 I_th가1 mA 증가합니다."],"predictionFeedback":"Cavity 안의 Interface는 왕복 Feedback에 참여합니다. 실제 Threshold Current 변화량은 Geometry·Gain·Injection과 전체 Cavity 모델 없이 정하지 않습니다.","reflection":"세 Co-packaging 방식에서 Gain·Cavity·Si·Output을 각각 표시하고, Etched-pit과 Direct Growth를 구별하는 질문 한 가지를 적으세요.","sources":["L0","L4"],"tutor":{"question":"Si Reflector까지 Feedback이 이어진다면 Cavity는 어디인가요?","choices":[{"text":"Gain Chip과 Si Feedback Path를 포함합니다.","feedback":"맞습니다. 설계된 Optical 왕복 경로가 Cavity입니다. Package 경계나 Gain Material 경계와 반드시 같지 않습니다.","correct":true},{"text":"Gain Chip 안만 Cavity이며 나머지는 무관합니다.","feedback":"Gain이 있는 영역과 Feedback Loop는 다른 경계입니다. Remote Reflector까지 이어지는 경로를 빠뜨렸습니다."},{"text":"Package 전체의 모든 재료가 Cavity입니다.","feedback":"Cavity는 설계된 Optical Feedback 경로입니다. 모든 Package 재료가 동일한 Optical Mode에 참여하지 않습니다."}],"why":"Feedback 경계를 찾아야 왕복 Loss와 Phase를 셀 수 있습니다. Output 전달 경로와 Cavity 내부 경로를 나누는 첫 단계입니다.","simple":"소리가 증폭되는 장소와 메아리가 돌아오는 길은 다를 수 있습니다. 여기서는 빛이 되돌아오는 전체 경로를 따라 Cavity를 찾습니다.","math":"동일 Interface를 왕복 한 번씩 지나는 가정에서는 Power Factor가 η²입니다. 단방향1 dB이면 왕복2 dB이며 Gain/Reflector/Phase를 별도로 봅니다.","notebook":"구조 선택을 바꿔 Gain 영역과 점선 Cavity가 같은 범위를 차지하는지 비교하세요. 이 선택은 구조 설명이며 자동 Threshold 점수는 계산하지 않습니다."}},{"id":"6.4","short":"Hybrid & Gain Overlap","title":"How Can Bonded Gain Feed a Silicon Mode?","time":"15–22분","lead":"Gain을 제공하는 III–V와 빛을 안내하는 Silicon을 하나의 Optical 구조로 연결합니다. Layer가 포개진 그림과 Mode가 Gain을 실제로 경험한다는 물리적 조건을 구별합니다.","question":"III–V Layer를 Si 위에 붙이면 모든 Optical Mode가 같은 Gain을 얻을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"재료의 역할을 나눕니다","scene":"laser","html":"\u003cp>Hybrid Silicon Laser의 학습 질문은 어떤 재료가 Gain을 만들고 어떤 경로가 빛을 안내하느냐입니다. 두 역할을 나누면 Silicon의 Passive Circuit과 III–V Gain을 함께 사용할 이유가 보입니다.\u003c/p>\u003cp>이 Lesson의 단면은 Bonded Gain Layer와 Si Waveguide의 관계를 독자적으로 그린 비축척 개념도입니다. 실제 Eigenmode를 계산한 결과는 아닙니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Bonded Layer와 Shared Optical Mode","scene":"laser","html":"\u003cp>원서의 \u003cstrong>Hybrid Silicon Lasers\u003c/strong>는 Bonded Gain Material과 Silicon Optical 구조를 결합하는 접근입니다. Fang et al.의 Hybrid Evanescent Laser 연구는 III–V Quantum Well과 Silicon Waveguide가 함께 만드는 Optical 구조를 다룹니다. 빛의 일부가 Gain Material과 겹쳐야 Stimulated Emission의 이득을 얻을 수 있습니다. Si가 모든 Gain을 만든다고 읽으면 안 됩니다.\u003c/p>\u003cp>\u003cstrong>Mode/Gain Overlap\u003c/strong>은 단순히 Layer가 위아래로 겹쳤는지와 다릅니다. Optical Field의 공간 분포, Gain Region의 위치와 Material이 중요합니다. Gain Layer가 넓어도 Mode가 거의 닿지 않는다면 Modal Gain은 작을 수 있습니다. 실제 정량 Overlap에는 올바른 Power/Energy 정규화와 복소 Material, Vector Field를 다루는 적절한 모델이 필요합니다.\u003c/p>\u003cp>여기서는 Γ를 Modal Gain과 Material Gain을 연결하는 유효 교육 입력으로만 사용합니다. 점선 타원은 두 재료에 걸친 Mode 영역의 개념 표시이며 Signed Field나 Intensity의 수치 결과가 아닙니다. 타원 안의 색 면적을 적분하거나 곧바로 Γ라고 부르지 않습니다. Chapter 1의 Slab Field와 달리 이 구조의 Eigenproblem은 풀지 않았습니다.\u003c/p>\u003cp>Bond Interface, Waveguide Geometry, Transition Taper와 Electrical Contact는 Optical·Electrical·Thermal 요구를 동시에 받습니다. Gain Overlap을 늘리는 변화가 Passive Routing Loss나 Electrical Resistance, 열 배출과 같은 다른 항목을 개선한다는 보장은 없습니다. 이 앱은 그 Trade-off를 정성적으로 묻고 실제 효율·수율 수치를 만들지 않습니다.\u003c/p>\u003cp>용어에도 주의하세요. 2015년 교재의 Hybrid라는 제목과 후속 문헌의 \u003cstrong>Heterogeneous Integration\u003c/strong>은 사용 범위가 겹칠 수 있습니다. Hybrid/Heterogeneous를 기술 우열로 읽기보다, Pre-made Die인지 Bonded Material인지 Direct Growth인지와 Optical Coupling 경로를 풀어서 말하는 편이 정확합니다. 여기서는 현대 Foundry별 제공 현황이나 단일 보편 명명법을 단정하지 않습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Material Gain에서 Modal Gain까지","scene":"laser","html":"\u003cdiv class=\"equation\">Modal Power Gain = Γ × Material Power Gain\u003cbr>g_material,th = (α_i + α_m)/Γ   (Γ &gt; 0)\u003c/div>\u003cp>Γ는 무차원, Gain/Loss는 같은 길이의 역수 단위를 씁니다. 이 관계는6.2의 균일 FP 교육 모델에 대한 보충이며 모든 Bonded Laser 구조의 정확한 Threshold 식은 아닙니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 같은 Material Gain, 다른 Overlap\u003c/h3>\u003cp>독립 가정 g=300 cm⁻¹에서 Γ=0.1이면 Modal Gain은30 cm⁻¹, Γ=0.2이면60 cm⁻¹입니다. 필요한 Modal Threshold가50.1324 cm⁻¹인 별도 FP 예에서는 전자는 부족하고 후자는 양의 Power Margin입니다. 이 숫자를 아래 개념 단면에서 계산한 Γ라고 해석하지 않습니다.\u003c/p>\u003c/div>\u003cp>Γ=0에서는 이 Gain Material로 Mode에 이득을 줄 수 없으므로 필요한 Material Gain을 유한한 수치로 표시하지 않습니다.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"눈에 보이는 Layer 면적이 Γ인가요?","scene":"laser","html":"\u003cp>Tutor는 공간 Layer와 Optical Mode의 차이를 묻습니다. Material을 붙였다는 사실 외에 실제 Gain을 판단하려면 어떤 Field 정보가 더 필요한지 설명하세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"개념 단면과 수치 모델의 경계를 확인합니다","scene":"laser","html":"\u003cp>Notebook의 Hybrid 구조에서 III–V Gain, Silicon 경로, 점선 Cavity와 Output Transition을 찾으세요. Γ 수치 변화는6.2 Threshold Notebook에서 별도로 실험합니다. 그 수치가 이 개념 단면으로부터 유도되지 않는다는 점을 비교 기록에 남기세요.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Bonding과 Mode Engineering이 모두 필요합니다","scene":"laser","html":"\u003cul>\u003cli>III–V Gain과 Silicon Guidance의 역할이 다릅니다.\u003c/li>\u003cli>Layer Overlap과 Mode/Gain Overlap은 같지 않습니다.\u003c/li>\u003cli>Γ는 실제 Field와 정의를 확인해야 정량화할 수 있습니다.\u003c/li>\u003cli>Hybrid/Heterogeneous는 구조 설명과 함께 사용합니다.\u003c/li>\u003c/ul>\u003cp>다음에는 Bonding과 구별되는 Direct Growth 및 Ge 접근을 봅니다.\u003c/p>"}],"prediction":"Material Gain 고정, Γ가0.1에서0.2로 증가하면 Modal Gain은?","predictionOptions":["먼저 예측을 선택하세요","이 단순 관계에서 두 배입니다.","항상 같으며 Si만 결정합니다.","WPE도 반드시 두 배입니다."],"predictionFeedback":"Modal Gain=Γg이므로 두 배입니다. Electrical/열 모델이 없으므로 WPE나 실제 I_th 변화량은 결정하지 않습니다.","reflection":"개념 단면의 타원과 실제 Solver Mode Profile의 차이를 설명하고, Γ를 계산하려면 어떤 공간 정보가 필요한지 적으세요.","sources":["L0","L2","L5"],"tutor":{"question":"Bonded Layer의 그림상 면적 비율을 Γ로 사용해도 될까요?","choices":[{"text":"아니요. Optical Mode와 Gain의 정규화된 Overlap 정보가 필요합니다.","feedback":"맞습니다. 기하학적 면적과 Mode가 경험하는 Gain의 유효 비율은 다릅니다. 이 타원은 Solver 결과가 아닙니다.","correct":true},{"text":"예.III–V Layer가 절반이면 Γ=0.5입니다.","feedback":"Field가 균일하다는 근거도 없으며 Power 정규화도 정의하지 않았습니다. 면적만으로 Γ를 정할 수 없습니다."},{"text":"예.Gain Layer가 있으면 Γ=1입니다.","feedback":"Mode가 Gain Layer와 겹치지 않을 수 있습니다. Layer의 존재만으로 전체 Mode가 같은 Gain을 경험하지 않습니다."}],"why":"Material 배치와 Optical 분포를 함께 보아야 구조가 Gain을 전달하는 이유를 이해할 수 있습니다. 그림의 크기를 성능 수치로 읽지 않는 연습입니다.","simple":"빛이 다니는 길이 실제로 Gain이 있는 곳을 지나야 효과가 있습니다. 지도에서 두 영역이 겹쳐 보여도 빛의 분포를 모르면 얼마나 겪는지 알 수 없습니다.","math":"교육 관계는 g_modal=Γg_material입니다. Γ0.1과0.2에서 g300cm⁻¹는30과60cm⁻¹를 주지만, 이 Γ는 독립 가정이며 그림에서 계산한 값이 아닙니다.","notebook":"Hybrid 단면에서 Gain과 Si를 찾은 뒤6.2의 Γ Slider로 수치 관계를 확인하세요. 구조 선택과 Gain 수치 사이에는 숨겨진 자동 변환이 없습니다."}},{"id":"6.5","short":"Monolithic III–V / Ge","title":"What Must Be Solved to Grow a Laser on Silicon?","time":"15–22분","lead":"통합된 위치와 재료를 만든 방법을 구별합니다. III–V Direct Growth와 Germanium 접근을 비교하며 Gain·Defect·Thermal·제조의 연결을 배웁니다.","question":"Ge Detector가 작동한다는 사실이 Ge Laser의 작동을 보장할까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"광원도 재료 통합의 문제입니다","scene":"laser","html":"\u003cp>Source를 Si Platform 안에 형성하려는 이유에는 Optical 연결과 제조 통합이 있습니다. 그러나 통합도를 높이는 목표가 재료의 결정 품질이나 Gain 조건을 자동으로 해결하지는 않습니다.\u003c/p>\u003cp>원본8.5.1 III–V Monolithic Growth와8.5.2 Germanium Lasers를 구별하고,6.3의 Embedded Bonding과6.4의 Bonded Layer를 복습합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"III–V Growth와 Germanium은 다른 접근입니다","scene":"laser","html":"\u003cp>\u003cstrong>III–V Monolithic Growth\u003c/strong>는 Si Platform에 Gain을 제공할 III–V Material을 직접 성장시키는 접근입니다. 별도로 성장시킨 Layer를 옮겨 Bonding하는 것과 재료 형성 경로가 다릅니다. III–V와 Si는 Crystal Lattice와 Thermal Expansion 특성이 다르므로 성장 과정과 냉각 이후의 Defect·Strain·Interface를 관리해야 합니다. 이름만으로 특정 Process Temperature나 Defect Density를 제시할 수 없습니다.\u003c/p>\u003cp>Defect는 Nonradiative Recombination 경로를 만들 수 있어 같은 주입에서도 유용한 Optical Gain을 얻기 어렵게 할 수 있습니다. 하지만 Defect 수 하나로 Threshold·수명·효율을 모두 환산할 수는 없습니다. Active Region, Carrier Confinement, 주입과 열 경로, Optical Loss를 함께 보아야 합니다. 여기서는 실제 Epitaxy Recipe나 수율 모델을 만들지 않습니다.\u003c/p>\u003cp>\u003cstrong>Germanium Lasers\u003c/strong>는 III–V Direct Growth와 구별되는 재료 접근입니다. Ge는 Si와 가까운 Material Integration 경로를 제공할 수 있지만 기본적으로 Indirect-gap Semiconductor입니다. Direct Transition과 관련한 Band Valley의 점유, Strain과 Doping, Free-carrier Absorption과 주입·열 조건을 함께 고려해야 합니다. Strain이나 Doping을 늘리는 조작 하나만으로 효율적인 발진이 보장되지 않습니다.\u003c/p>\u003cp>Chapter 5의 Ge Detector는 빛을 흡수해 전하로 수집했습니다. Laser에서는 주입된 Carrier가 유용한 Stimulated Gain을 만들고 Cavity의 모든 손실을 이겨야 합니다. 잘 흡수하는 Detector Material이라는 사실은 Net Gain과 Feedback이 준비되었다는 증거가 아닙니다. 같은 재료 이름이라도 요구되는 Carrier 분포와 동작 조건이 다릅니다.\u003c/p>\u003cp>Monolithic이라는 말도 문헌·산업에서 범위가 달라질 수 있습니다. 여기서는 원서 목차의 Growth/Ge 접근을 배울 때 Direct Formation의 의미를 명시합니다. Embedded/Bonded 구조를 무조건 같은 제조 분류로 묶지 않습니다. 비교할 때는 Material 형성, Gain 위치, Cavity, Output Interface를 먼저 쓰고, 이후 Thermal·Reliability·Test 요구를 검토합니다. 2015년의 Research 상태를 현재 Commercial Availability라고 표현하지 않습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Absorption과 Lasing의 조건을 나눕니다","scene":"laser","html":"\u003cdiv class=\"equation\">Useful modal gain must meet cavity losses\u003cbr>Absorption / charge collection ≠ net optical gain\u003c/div>\u003cp>새로운 재료 성장 모델은 추가하지 않습니다.6.2의 조건은 Gain이 실제로 확보되었다는 가정 뒤에만 적용하는 교육 기준이며, 성장 조건에서 Gain을 예측하지 않습니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 같은 손실 기준을 두 재료에 적용할 때\u003c/h3>\u003cp>독립 가정 Modal Threshold가50 cm⁻¹이고, 어떤 설계의 Modal Gain을40 cm⁻¹라고 가정하면 Power Gain Margin은−10 cm⁻¹입니다. III–V인지 Ge인지 이름을 바꿔도 이 장부 계산은 같습니다. 실제40 cm⁻¹를 얻는 재료·주입·열 조건은 별도 검증해야 합니다.\u003c/p>\u003c/div>\u003cp>이 값은 실제 Ge 또는 III–V 장치 데이터가 아니라 조건을 설명하는 독자 예제입니다.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"통합도만으로 순위를 정할 수 있나요?","scene":"laser","html":"\u003cp>같은 재료가 Photon Absorption과 Lasing에서 어떤 다른 조건을 요구하는지 Tutor에서 확인합니다. 제조 통합도와 Optical 동작 조건을 하나의 점수로 줄이지 마세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"구조를 비교하고 검증 항목을 남깁니다","scene":"laser","html":"\u003cp>Integration Structure에서 Monolithic III–V와 Germanium을 선택하고 Gain Material과 Si Platform을 확인하세요. 이어 Etched-pit과 Hybrid로 돌아가 Material을 형성한 곳과 통합한 방법이 어떻게 다른지 표나 메모로 비교합니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"이름보다 형성 과정과 Gain을 봅니다","scene":"laser","html":"\u003cul>\u003cli>Direct Growth와 Bonding은 재료 통합 경로가 다릅니다.\u003c/li>\u003cli>III–V/Si에서는 결정·열·Defect 관리가 필요합니다.\u003c/li>\u003cli>Ge Absorption과 Ge Lasing은 다른 동작 조건입니다.\u003c/li>\u003cli>통합 명칭은 실제 효율이나 수율을 보장하지 않습니다.\u003c/li>\u003c/ul>\u003cp>다음에는 Light Generation의 메커니즘과 배치 위치를 다른 축으로 읽습니다.\u003c/p>"}],"prediction":"Ge Detector의 높은 Absorption만 확인했다면 Lasing도 증명되나요?","predictionOptions":["먼저 예측을 선택하세요","아니요.Net Gain과 Feedback/Phase 조건을 더 확인해야 합니다.","예.빛을 흡수하므로 반드시 같은 효율로 발광합니다.","예.Package 안에 넣기만 하면 됩니다."],"predictionFeedback":"Absorption과 Charge Collection 검증만으로 Carrier Inversion, Net Gain, Cavity Resonance와 Source 효율을 증명할 수 없습니다.","reflection":"III–V Growth와 Ge 접근에서 각각 필요한 추가 검증을 두 가지 적고, Embedded/Bonded 구조와의 차이를 설명하세요.","sources":["L0","L1","L2"],"tutor":{"question":"Monolithic Growth라는 이름이 낮은 Threshold Current를 보장하나요?","choices":[{"text":"아니요.Material Gain, Defect, Injection, Cavity Loss를 검증해야 합니다.","feedback":"맞습니다. 형성 방법의 이름과 동작 성능의 수치는 다릅니다. 여러 Optical/Electrical/재료 조건이 함께 필요합니다.","correct":true},{"text":"예.통합도가 높으면 I_th가 항상 낮습니다.","feedback":"통합도와 Threshold 사이의 보편적 단조 관계는 없습니다. 재료 품질과 주입 및 손실 정보가 빠졌습니다."},{"text":"예.Coupling이 없어져 모든 Loss가0입니다.","feedback":"통합되어도 Internal Loss, Output Coupling과 Interface가 존재할 수 있습니다. 모든 Loss가 사라지지 않습니다."}],"why":"재료를 어디에 어떻게 만들었는지와 실제 Gain을 얼마나 얻는지는 다른 질문입니다. 그 차이를 알아야 통합 선택 이유를 설명할 수 있습니다.","simple":"한 건물 안에 모두 모았다고 각 방의 기능이 자동으로 좋아지지는 않습니다. Gain Material과 전류·열·광학 경로가 실제로 작동하는지 확인해야 합니다.","math":"Γg_th=α_i+α_m은 얻어야 할 Modal Gain을 정합니다. Monolithic이라는 이름은 식의 Gain·Loss·Injection 값을 수치로 제공하지 않습니다.","notebook":"III–V와 Ge 구조를 번갈아 고르고 Gain 위치를 말해 보세요. Notebook은 제조 명칭별 자동 효율이나 Threshold 숫자를 만들어 주지 않습니다."}},{"id":"6.6","short":"Alternative Mechanisms","title":"Does Every Light Source Use the Same Gain Mechanism?","time":"15–22분","lead":"원본8.6의 제목은 확인했지만 세부 기술 목록은 확보하지 못했습니다. 별도1차 연구의 Raman Laser를 보충 예로 삼아 Light Generation과 Integration 위치를 구별합니다.","question":"All-silicon Light Source라고 하면 외부 Energy Supply도 필요 없을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"확인한 범위 안에서 비교합니다","scene":"laser","html":"\u003cp>원본8.6 Alternative Light Sources는 공식 목차에서 확인했습니다. 전체 본문과 세부 대상은 확인하지 못했으므로 임의의 기술 목록을 원본의 설명이라고 제시하지 않습니다.\u003c/p>\u003cp>이 Lesson은 독립적인1차 논문 Rong et al.(2005)의 Continuous-wave Raman Silicon Laser를 \u003cstrong>보충 읽기\u003c/strong>로 다룹니다. 원본8.6에 대한 기술별 대응은 원문 확보 후 보완할 남은 범위입니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Raman Gain을 보충 예로 읽습니다","scene":"laser","html":"\u003cp>\u003cstrong>Stimulated Raman Scattering\u003c/strong>은 Optical Pump에서 다른 주파수의 빛으로 Energy를 전달하는 비선형 상호작용입니다. 낮은 주파수의 Stokes Light와 Material의 진동에 Energy가 분배됩니다. III–V Carrier Recombination Gain과 다른 메커니즘이므로 Silicon의 Indirect Bandgap만으로 이 가능성을 부정할 수 없습니다.\u003c/p>\u003cp>Raman Laser에도 Gain과 Feedback이 필요합니다. Cavity는 적절한 Stokes 주파수에서 왕복 조건을 만족해야 하며, Pump는 외부에서 공급해야 합니다. 따라서 All-silicon이라는 Material 표현이 외부 Source나 소비 전력이 필요 없다는 뜻은 아닙니다. Pump 생성·전달 손실과 Material 내부 손실을 전체 장부에서 고려해야 합니다.\u003c/p>\u003cp>확인한2005년 연구는 Si에서 Continuous-wave Raman Lasing을 다루는1차 자료입니다. 그 논문의 측정값이나 공정·Spectrum을 이 앱의 데이터처럼 재현하지 않습니다. Two-photon Absorption과 그에 따른 Free-carrier Loss 같은 제한 요인은 Pumping 조건에서 중요할 수 있지만, 이 장의 정량 모델은 그 Carrier Dynamics를 풀지 않습니다.\u003c/p>\u003cp>Figure의 Pump, Stokes, Phonon은 Energy 흐름을 보여 주는 개념도입니다. 그림의 화살표 두께는 측정한 Power가 아니며, 주파수·길이·Threshold를 계산하지 않았습니다. Uniform FP Threshold 식에 Pump Power를 임의 Gain으로 환산해 대입하거나, 전기 주입 L–I Curve를 Raman Laser의 응답이라고 표시하지 않습니다.\u003c/p>\u003cp>\u003cstrong>Mechanism\u003c/strong>은 어떻게 Gain을 만드는지, \u003cstrong>Integration Location\u003c/strong>은 Source를 어디에 어떻게 배치하는지 묻습니다. External·Co-packaged·Bonded·Grown과 Carrier Recombination·Raman은 서로 다른 질문의 답입니다. LED나 기타 대체 Source도 필요한 Coherence·Spectrum·Coupling 요구가 다를 수 있으나, 확인하지 않은 목록을 이 교재의 범위로 확대하지 않습니다. 이번 장의 목적은 그 분류 축과 Energy Input을 구별하는 데 있습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Pump Energy도 장부에 넣습니다","scene":"laser","html":"\u003cdiv class=\"equation\">hν_p = hν_s + hΩ\u003cbr>ν_p &gt; ν_s,   Ω = ν_p − ν_s\u003c/div>\u003cp>한 번의 Stokes 변환 사건에서 Pump Photon Energy는 Stokes Photon과 진동 Energy로 나뉩니다. ν는 Hz, hν는 J입니다. 이 관계는 전체 Device WPE나 Pump-to-Stokes 효율을 정하지 않습니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 정규화된 Energy 장부\u003c/h3>\u003cp>독자적인 정규화 예로 Pump Energy를1.00, Stokes Energy를0.90이라고 두면 나머지0.10은 같은 사건의 진동 Energy입니다. 이는 임의 주파수비의 교육 예이며 실제 Si Raman Shift나 Device 효율을 나타내지 않습니다. 모든 Pump가 Stokes로 변환된다는 뜻도 아닙니다.\u003c/p>\u003c/div>\u003cp>Electrical Input을 계산하려면 Pump Source의 효율과 변환·전달 손실까지 추가해야 합니다.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"Light Source 종류와 배치가 같은 분류인가요?","scene":"laser","html":"\u003cp>Tutor에서는 All-silicon이라는 재료 이름이 Energy Supply의 범위를 말하는지 묻습니다. Optical Pump를 어디에 기록해야 하는지 생각해 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"메커니즘과 위치를 별도로 기록합니다","scene":"laser","html":"\u003cp>본문의 두 Figure에서 Gain 메커니즘과 Integration 위치가 서로 다른 축인지 확인하세요. Notebook의 구조 선택은 위치 비교만 바꿉니다. 이 선택이 Raman Spectrum이나 Pump Threshold를 계산한다고 해석하지 마세요.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"새 메커니즘도 에너지가 필요합니다","scene":"laser","html":"\u003cul>\u003cli>Raman은 Carrier Recombination과 다른 Gain 메커니즘입니다.\u003c/li>\u003cli>Optical Pump도 외부 Energy Input입니다.\u003c/li>\u003cli>Material·Mechanism·Integration Location을 구별합니다.\u003c/li>\u003cli>원본8.6 세부 목록 미확인은 남은 Source 범위로 명시합니다.\u003c/li>\u003c/ul>\u003cp>다음에는 같은 기준으로 Power·Heat와 구조 선택 이유를 종합합니다.\u003c/p>"}],"prediction":"Raman Gain을 사용하는 Si Source의 Energy Input은?","predictionOptions":["먼저 예측을 선택하세요","Optical Pump가 필요하며 Pump 생성 전력도 별도입니다.","Si가 빛을 만들므로 공급 Energy는0입니다.","항상6.2의 전기 주입 L–I와 같습니다."],"predictionFeedback":"Optical Pump의 Energy를 포함해야 합니다. All-silicon은 Material 표현이며 무료 Energy나 전체 효율100%를 뜻하지 않습니다.","reflection":"Raman Gain과 Carrier Recombination Gain의 차이, 그리고 Integration Location과의 차이를 각각 한 문장으로 적으세요.","sources":["L0","L6"],"tutor":{"question":"All-silicon Raman Laser에서 External Pump를 제외하고 전체 효율을 말해도 되나요?","choices":[{"text":"아니요.Pump 생성과 전달의 Energy 경계를 포함해야 합니다.","feedback":"맞습니다. Source 재료와 Energy Input 경계는 다릅니다. Pump를 제외한 수치를 전체 효율이라고 말하면 안 됩니다.","correct":true},{"text":"예.Si 안에서 발진하므로 소비 전력이 없습니다.","feedback":"빛의 Energy는 Pump에서 옵니다. 재료 이름은 Energy 보존을 바꾸지 않습니다."},{"text":"예.Stokes Energy가 있으므로 WPE는 항상1입니다.","feedback":"Stokes 생성의 존재만으로 Pump 변환·전달·전기 공급의 손실이 사라지지는 않습니다."}],"why":"새로운 Gain 메커니즘도 Energy Source를 필요로 합니다. 공급 경계를 표시하는6.1의 원칙은 Raman 보충 예에도 그대로 적용됩니다.","simple":"다른 색의 빛을 만들더라도 원래 들어온 빛의 Energy가 필요합니다. 그 빛을 만든 전원까지 포함해야 전체 소비를 비교할 수 있습니다.","math":"한 사건의 hν_p=hν_s+hΩ는 Energy 보존입니다. 전체 P_elec→P_pump→P_Stokes의 효율은 별도의 변환·전달 효율들을 알아야 계산됩니다.","notebook":"본문 Raman Figure는 Energy 경로만 보여 줍니다. Notebook 구조 선택은 위치에 관한 비교이며 Pump Power나 Raman Threshold를 예측하지 않습니다."}},{"id":"6.7","short":"Synthesis & Problems","title":"Can You Explain a Light-source Integration Choice?","time":"15–22분","lead":"빛을 어디서 만들고 어떻게 전달하는지 같은 Reference Plane과 가정으로 설명합니다. Power·Heat를 계산하고 구조 선택의 이유와 남은 검증을 기록합니다.","question":"PIC 입력10 mW를 원할 때 무엇을 먼저 정해야 할까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"정답 구조 대신 일관된 설명을 만듭니다","scene":"laser","html":"\u003cp>Chapter 6의 목표는 특정 Laser 구조를 최고로 고르는 것이 아닙니다. Source가 빛을 만드는 조건, PIC까지 전달되는 양, Energy와 Heat의 위치를 설명하는 것이 목표입니다.\u003c/p>\u003cp>원본8.7 Problem에 대응하는 이 Lesson의 문제는 독자 작성했습니다. 원본 문제나 해답을 재현한 것이 아니며, 계산 가능한 범위와 추가로 필요한 입력을 함께 묻습니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Source → Interface → PIC를 다시 연결합니다","scene":"laser","html":"\u003cp>먼저 \u003cstrong>Reference Plane\u003c/strong>을 정합니다. Source Plane의20 mW와 PIC 입력의20 mW는 Coupling Loss가 있으면 다른 요구입니다. 입력 요구를 맞추려면 필요한 Source Power를 계산하고, 그 Plane의 WPE를 사용해 Electrical Input과 Source Heat를 구해야 합니다. 총 Source Output을 기준으로 하는 효율에 일부 Port 출력만 넣지 않습니다.\u003c/p>\u003cp>다음으로 \u003cstrong>Gain·Cavity·Si·Output\u003c/strong>의 위치를 표시합니다. External Source는 분리된 빛 공급원이고, Pre-made Co-packaging은 완성된 Laser Die를 가깝게 둡니다. External Cavity는 Gain Chip 밖 Feedback 경로를 포함합니다. Etched-pit Embedded는 재료를 Receiving Site에 통합하는 의미를 확인해야 하며 Direct Growth와 단정적으로 같게 취급하지 않습니다.\u003c/p>\u003cp>Hybrid Bonded 구조에서는 Gain Layer와 실제 Mode의 Overlap이 중요합니다. Monolithic III–V와 Ge에서는 재료 형성 경로와 Gain의 확보 조건을 구별합니다. 원서 용어와 후속 Heterogeneous 용어를 단순 우열로 바꾸지 않습니다. Alternative Sources에서는 메커니즘과 배치가 다른 축이며, Raman 예는 원본8.6의 세부 목록을 대신 확인한 결과가 아닌 별도 보충임을 기억합니다.\u003c/p>\u003cp>\u003cstrong>세 정량 모델\u003c/strong>의 역할도 다시 구분합니다. Uniform FP Threshold는 Modal Gain/Loss 경계만 계산합니다. Piecewise L–I는 가정한 I_th와 지정 Port의 η_d로 Output을 계산합니다. Independent Power Ledger는 Source Output과 WPE로 에너지를 셉니다. 실제 동일 Device로 결합하려면 주입·Voltage·Port Accounting·Thermal 등의 추가 모델이나 검증 데이터가 필요합니다.\u003c/p>\u003cp>마지막으로 선택 이유와 검증 항목을 적습니다. External을 선택한다면 열 위치·교체·Interface 검증이 이유가 될 수 있고, Bonded를 선택한다면 통합 경로·Mode Overlap·열 및 제조 검증이 이유가 될 수 있습니다. 어느 쪽도 단일 Parameter로 보편적 정답이 되지는 않습니다. 다음 원서 Part IV의 Photonic Circuit Modelling은 이 장의 검토 뒤 별도 개발 범위이며 자동 시작하지 않습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Worked Problems · Power, Heat, Threshold","scene":"laser","html":"\u003cdiv class=\"equation\">Required P_source = Required P_PIC × 10^(IL_dB/10)\u003cbr>P_elec = P_source / η_WPE\u003cbr>Q_source = P_elec − P_source\u003c/div>\u003cp>동일한 Single-output 가정과 경계를 유지합니다. Source가 실제로 이 Power를 안정적으로 낼 수 있는지는 이 장부의 결과만으로 검증하지 않습니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · Problem 1: PIC 입력10 mW\u003c/h3>\u003cp>IL=3 dB이면 Source는 약19.9526 mW가 필요합니다. WPE=0.20이라면 Electrical Input≈99.7631 mW, Source Heat≈79.8105 mW입니다. Coupling 미전달≈9.9526 mW는 Source Heat와 별도입니다.\u003c/p>\u003ch3>Problem 2: Interface를6 dB로 바꾸면?\u003c/h3>\u003cp>같은 PIC 입력10 mW를 유지하려면 Source≈39.8107 mW, Electrical≈199.0536 mW, Source Heat≈159.2429 mW입니다. 6.1에서 Source를 고정하고 IL만 바꿀 때와 달리, 여기서는 Source Power도 요구에 맞춰 바꿨기 때문에 Heat가 증가합니다.\u003c/p>\u003ch3>Problem 3: Threshold와 L–I를 구별하기\u003c/h3>\u003cp>R₁=R₂=0.3, L=300 µm에서 α_i를10→20 cm⁻¹로 바꾸면 Modal Threshold는50.1324→60.1324 cm⁻¹입니다. 그러나 I_th 증가량은 계산할 수 없습니다. 별도 η_d=0.5,1550 nm L–I에서 I−I_th=60 mA이면 Output≈23.9969 mW입니다.\u003c/p>\u003c/div>\u003cp>정확한 Source Power 예제는 수식 계산값입니다. Notebook Slider는 표시 Step에 따라 근처 값만 선택할 수 있어 반올림 오차를 구별하세요.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"같은 숫자가 같은 장치를 뜻하나요?","scene":"laser","html":"\u003cp>Tutor는 Fixed Source와 Fixed PIC Requirement를 구별합니다. 같은 IL 증가라도 무엇을 고정하는지에 따라 Source Heat에 대한 답이 달라지는 이유를 설명합니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"숫자와 선택 이유를 함께 재현합니다","scene":"laser","html":"\u003cp>먼저 Notebook에서 Source20 mW, WPE0.2, IL3 dB를 재현하세요. IL만6 dB로 바꾸고 Fixed Source 결과를 기록합니다. 다음 Source를40 mW로 수동 변경해 PIC 입력을 대략 되돌리고 Heat가 왜 달라졌는지 적습니다. 실제 요구의 정확한39.8107 mW와 Slider 반올림을 구별합니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Chapter Summary · 빛의 공급을 설명합니다","scene":"laser","html":"\u003cul>\u003cli>빛의 생성: Net Gain·Feedback·Phase 조건을 확인합니다.\u003c/li>\u003cli>빛의 전달: Source/PIC Plane과 Coupling을 정의합니다.\u003c/li>\u003cli>빛의 공급: WPE·Electrical Power·Heat의 경계를 셉니다.\u003c/li>\u003cli>통합 선택: Gain·Cavity·Si·Output과 추가 검증을 말합니다.\u003c/li>\u003cli>한계: 계산하지 않은 Dynamics·Mode·Device 성능을 결과처럼 쓰지 않습니다.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>학습 되돌아보기:\u003c/strong> 가장 헷갈렸던 두 개념을 고르고 자신의 말로 차이를 설명하세요. 필요한 경우 해당 Lesson으로 돌아가 Prediction과 실험 메모를 비교합니다. 학습 기록을 Backup한 뒤 검토를 마칩니다.\u003c/p>"}],"prediction":"PIC 입력 요구 고정, Coupling Loss가 증가하면 필요한 Source Power는?","predictionOptions":["먼저 예측을 선택하세요","증가하며 같은 WPE의 Source Heat도 증가합니다.","항상 같으며 PIC 입력도 유지됩니다.","감소하므로 Source Heat가0이 됩니다."],"predictionFeedback":"P_source=P_PIC/η_c이므로 더 필요합니다. Fixed Source에서 IL만 변경한6.1과 고정 조건이 다릅니다. 자동 보상 모델은 사용하지 않습니다.","reflection":"선택한 Integration 구조의 Gain·Cavity·Si·Output 위치, Power 예제의 고정 조건, 아직 확인할 Optical/Thermal/제조 항목을 자신의 말로 정리하세요.","sources":["L0","L1","L2","L3","L4","L5","L6"],"tutor":{"question":"IL 증가 시 Source Heat가 증가한다는 말은 언제 맞나요?","choices":[{"text":"같은 PIC 입력 요구를 맞추도록 Source Power도 늘리고 WPE는 같다고 가정할 때입니다.","feedback":"맞습니다. 무엇을 고정하는지가 핵심입니다. Source를 고정한 실험과 PIC 입력 요구를 고정한 계산은 다른 조건입니다.","correct":true},{"text":"Source Power와 WPE가 고정이어도 항상 증가합니다.","feedback":"P_source와 WPE가 고정이면 Electrical Input과 Source Heat도 고정입니다. PIC 입력이 줄어드는 결과를 빠뜨렸습니다."},{"text":"Coupling 미전달 Power를 모두 Source Heat로 더하면 언제나 맞습니다.","feedback":"미전달 빛의 흡수 위치는 별도입니다. Source Heat에 전부 더하면 경계와 에너지를 잘못 계산합니다."}],"why":"Parameter 변화의 인과관계는 고정 조건에 달려 있습니다. 같은 Loss 증가라도 Source 고정과 PIC 요구 고정은 서로 다른 실험입니다.","simple":"같은 물을 보내다가 길에서 더 잃으면 도착량이 줄어듭니다. 도착량을 유지하려고 보내는 양까지 늘렸을 때만 공급 부담이 더 커지는 비교가 됩니다.","math":"고정 P_source에서는 Q=P_source(1/η_WPE−1)이 IL과 무관합니다. 고정 P_PIC에서는 P_source=P_PIC10^(IL/10)이므로 같은 WPE의 Q가 증가합니다.","notebook":"IL만 바꾼 결과를 먼저 적고 Source Power까지 수동 변경한 결과를 나란히 적으세요. Notebook은 숨겨진 자동 보상을 하지 않으며 두 조건을 직접 비교할 수 있습니다."}}],"figures":[{"id":"1.1A","lesson":"1.1","title":"Core와 Cladding의 단면","classification":"Conceptual","anchor":"#section-concept > p:nth-of-type(2)","renderer":"structure","parameters":"Si Core n = 3.48, SiO₂ Cladding n = 1.444 · λ₀ = 1550 nm 부근의 예시. x: Width, y: Height, z: 전파 방향. 치수와 화살표는 정성적입니다.","limits":"실제 Field나 Mode 수를 계산한 그림이 아닙니다. 굴절률 차이는 Index Guiding의 출발 조건이며 전체 경계조건도 만족해야 합니다.","see":"높은 n의 Core를 낮은 n의 Cladding이 둘러싼 단면입니다.","notice":"전파 축 z와 횡 방향 x–y를 구별하세요.","meaning":"재료의 차이가 Field를 국소화할 수 있는 경계조건을 만듭니다.","source":"Original SVG; existing material assumptions"},{"id":"1.1B","lesson":"1.1","title":"Guided Field와 Evanescent Tail","classification":"Analytical","anchor":"#section-concept > p:last-of-type","renderer":"confinement","parameters":"대칭 Slab TE₀ · 전체 Width d = 500 nm · y 무한 · λ₀ = 1550 nm · nCore = 3.48, nClad = 1.444. x는 µm, Ey는 최대 절댓값으로 정규화합니다.","limits":"1D Slab의 Ey 해입니다. 유한 Height의 2D Strip 결과가 아니며 그래프의 높이는 실제 Optical Power가 아닙니다.","see":"기존 Slab 경계조건을 푼 Fundamental Mode의 Signed Field입니다.","notice":"Core 경계에서 Field가 끊기지 않고 Cladding으로 감소하며 이어집니다.","meaning":"Guiding은 Field가 바깥에서 0이 되는 것이 아니라 Core 부근에 국소화되는 상태입니다.","source":"notebook/models.js slabTE / slabField"},{"id":"1.2A","lesson":"1.2","title":"Fundamental Mode와 Higher-order Mode","classification":"Analytical","anchor":"#section-concept > p:nth-of-type(3)","renderer":"modes","parameters":"대칭 Slab TE · d = 220 또는 500 nm · y 무한 · λ₀ = 1550 nm · nCore = 3.48, nClad = 1.444. 각 Mode를 max|Ey| = 1로 정규화합니다. Field²는 |Ey|²/max|Ey|²입니다.","limits":"TE₁은 실제 해가 있는 조건에서만 표시합니다. Mode별 최대값 정규화는 동일 Power 정규화가 아니며 2D Vector Intensity가 아닙니다.","see":"같은 조건의 TE₀와 TE₁을 공통 x 축으로 비교합니다.","notice":"TE₁의 중심 Node와 부호를 확인한 뒤 Field²로 바꾸세요. 220 nm에서는 TE₁이 없습니다.","meaning":"Mode 차수는 허용된 공간 분포의 차이이며 제곱한 그림은 Phase 부호를 보존하지 않습니다.","source":"notebook/models.js slabTE / slabField"},{"id":"1.2B","lesson":"1.2","title":"2D Scalar Transverse Mode Profile","classification":"Numerical","anchor":"#section-equation > .worked","renderer":"scalar","parameters":"Scalar u₀₀ · Si/SiO₂ · λ₀ = 1550 nm · H = 220 nm · W = 220/500/800 nm. nCore = 3.48, nClad = 1.444. 5 nm 계산 Grid, x–y = ±1 µm에서 u = 0. 101×101 표시 표본과 고정 Color Scale을 사용합니다.","limits":"u는 Scalar Field이며 실제 Vector E 성분이나 TE/TM 분류가 아닙니다. 고굴절률 대비 Silicon의 경계 Vector 효과를 생략합니다. 수치 Grid 수렴은 실제 Strip의 n_eff 정확도를 보장하지 않습니다. |u|²/max|u|²는 상대량이며 실제 Power가 아닙니다.","see":"실제로 계산한 Scalar 고유해의 정규화된 제곱 분포입니다. 사각형은 Core 경계입니다.","notice":"Linear 0–1과 dB −40–0의 Color Bar를 구별하세요. 어두운 Cladding에도 약한 Tail이 이어집니다.","meaning":"두 횡 방향의 경계가 공간 분포를 정합니다. Scalar 근사의 결과를 Full-vector Mode로 해석하지 않습니다.","source":"scripts/precompute_scalar_modes.py → notebook/data/scalar-modes.json; docs/SCALAR_2D_VALIDATION.json"},{"id":"1.3A","lesson":"1.3","title":"Core의 Wavevector를 성분으로 읽기","classification":"Analytical","anchor":"#section-concept > p:nth-of-type(2)","renderer":"vector","parameters":"대칭 Slab d = 500 nm의 TE₀ · λ₀ = 1550 nm · nCore = 3.48, nClad = 1.444. kCore, β, h, q 단위: rad/µm 또는 1/µm. 삼각형은 Core Plane-wave 성분을 나타냅니다.","limits":"Core의 ±h 성분이 합쳐진 Slab Mode입니다. q는 Cladding의 실수 감쇠율이며 전파하는 횡 방향 Wavevector h와 같지 않습니다. 아래 Phase Calculator의 가정한 n_eff와 별도 조건입니다.","see":"Core 내부 kCore를 축 방향 β와 횡 방향 h로 분해합니다.","notice":"빗변 kCore와 β·h의 직각 관계를 보세요. Cladding의 q는 별도로 표시합니다.","meaning":"β는 Mode의 축 방향 Phase 변화율이고 q는 바깥 Tail의 공간적 감소율입니다.","source":"notebook/models.js slabTE; kCore²=β²+h²; q²=β²−(nClad k₀)²"},{"id":"1.3B","lesson":"1.3","title":"같은 조건으로 보는 Phase와 Guided Wavelength","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"phase","parameters":"λ₀ = 1550 nm 고정 · Notebook의 가정한 n_eff와 L을 그대로 공유합니다. β [rad/µm], L·z·λg [µm], φ [rad]. 단색·균일 단면·단일 Mode·무손실을 가정합니다.","limits":"n_eff는 Phase 실험의 가정한 입력이며 2D Strip 계산값이 아닙니다. 정규화된 cos(βz)의 진폭과 화살표 길이는 Power를 뜻하지 않습니다. Group Velocity는 계산하지 않습니다.","see":"고정된 3.1 µm 확대 구간의 Wave와 길이 L까지의 누적 Phase입니다.","notice":"오른쪽 Notebook에서 n_eff 또는 L을 바꾸면 이 Figure와 수식도 함께 변합니다.","meaning":"n_eff가 바뀌면 물결 간격이 변하고, L만 바뀌면 β는 일정한 채 누적 Phase가 변합니다.","source":"notebook/models.js phase","live":true},{"id":"1.4A","lesson":"1.4","title":"같은 조건에서 Geometry를 비교하기","classification":"Numerical","anchor":"#section-concept > p:nth-of-type(2)","renderer":"geometry","parameters":"모든 비교: λ₀ = 1550 nm, H = 220 nm, nCore = 3.48, nClad = 1.444, 동일 Scalar FD/Boundary 조건. W만 220/500/800 nm. 각 Profile의 Peak를 1로 정규화하며 공통 Color Scale을 사용합니다.","limits":"2D Scalar 근사입니다. 표시하는 n_eff,scalar는 해당 방정식의 수치 고유값이며 실제 Strip 또는 Quasi-TE의 설계값이 아닙니다. Peak 정규화는 동일 Input Power 비교가 아닙니다. 아래 Slab TE Branch와도 다른 모델입니다.","see":"선택한 Width의 2D Map과 세 Width의 y = 0 단면을 공통 축으로 비교합니다.","notice":"Narrow / Reference / Wide를 바꾸며 실제 Core 경계와 바깥 Field 분포를 함께 보세요.","meaning":"Geometry가 바뀌면 허용된 공간 분포와 Scalar 고유값도 달라집니다. 같은 Height와 모델 조건에서의 비교입니다.","source":"scripts/precompute_scalar_modes.py → notebook/data/scalar-modes.json"},{"id":"1.4B","lesson":"1.4","title":"Slab Width와 n_eff·Mode Count","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"sweep","parameters":"기존 대칭 Slab TE 계열 · y 무한 · λ₀ = 1550 nm · nCore = 3.48, nClad = 1.444 · d = 100–1000 nm. 점선은 Notebook의 현재 Width d입니다.","limits":"TE 계열만 세며 TM/실제 2D Strip의 Mode 수가 아닙니다. Branch와 Count는 같은 Slab 모델을 사용하고, Numerical Scalar Figure와 값이 같을 필요가 없습니다.","see":"허용된 TE Branch와 같은 Width에서의 TE Mode 수를 위아래로 연결합니다.","notice":"Branch가 Cladding Index 위에 나타날 때 Mode 수가 증가합니다. Width를 조절해 점선을 옮겨 보세요.","meaning":"Single-mode 조건은 재료·파장·Geometry·Polarization과 모델 범위에 의존합니다.","source":"notebook/models.js slabTE","live":true},{"id":"1.5A","lesson":"1.5","title":"Bend Radius와 Radiation을 구별해 보기","classification":"Conceptual","anchor":"#section-concept > p:nth-of-type(2)","renderer":"bend","parameters":"Small R = 2 µm / Large R = 10 µm · 동일한 중심선 Radius Scale의 90° Circular Bend. 선 굵기는 실제 Waveguide Width나 Field 세기가 아닙니다.","limits":"자체 제작한 정성 그림입니다. Maxwell/BPM/FDTD Field Radiation Map, 정량 Radiation Rate 또는 Loss 계산 결과가 아닙니다. 점선 화살표의 개수·길이로 손실량을 읽지 않습니다.","see":"같은 축척에서 작은 Radius와 큰 Radius의 경로와 공간을 비교합니다.","notice":"작은 R의 급한 곡률과 큰 R의 넓은 Bounding Square를 보세요. 점선 화살표는 가능한 Radiation의 개념만 나타냅니다.","meaning":"곡률을 완만하게 하면 Radiation을 줄이는 데 도움이 될 수 있지만 더 큰 Footprint와 경로 길이가 필요합니다.","source":"Original SVG, qualitative bend physics; no bend EM solver"},{"id":"1.5B","lesson":"1.5","title":"가정한 Bend Loss와 Footprint의 Trade-off","classification":"Illustrative","anchor":"#section-equation > .worked","renderer":"tradeoff","parameters":"기존 합성 표: R = 2/5/10/20 µm에서 b(R) = 0.4/0.08/0.02/0.005 dB/90°. α = 3 dB/cm, 직선 2 mm, 90° Circular Bend 4개. Total은 기존 Analytical Ledger로 계산합니다. A = R²는 한 코너의 중심선 Bounding Square [µm²].","limits":"물리 Solver가 산출한 Radius–Loss 곡선이 아닙니다. 네 점은 교육용 후보이며 사이 값을 추정·보간하거나 실제 공정의 Radius 권고로 사용하지 않습니다. 실제 Radiation Map/실측/PDK 데이터가 아닙니다.","see":"네 Radius 후보의 가정한 추가 Bend Loss, 계산한 Total Loss와 한 코너 면적을 비교합니다.","notice":"Notebook의 Radius를 바꾸면 같은 후보가 강조됩니다. Loss 0.8 dB와 면적 100 µm² 제약을 함께 보세요.","meaning":"Bend 추가 손실과 경로 길이에 따른 손실을 구별하고, 공간 조건 안에서 선택 이유를 설명합니다.","source":"notebook/models.js bendTable / designLedger; synthetic inputs unchanged","live":true},{"id":"2.1A","lesson":"2.1","title":"Optical Power Splitting","classification":"Analytical","anchor":"#section-concept > p:last-of-type","renderer":"ch2splitter","see":"입력과 두 Forward 출력의 Power Ledger입니다.","notice":"두 출력 합과 Loss를 함께 입력에 비교하세요.","meaning":"분배율 r와 총 효율 η는 서로 다른 입력입니다.","parameters":"Pin=1 mW; r, Excess Loss는 Notebook과 공유. 선의 기하학은 Conceptual.","limits":"완전한 3-port Scattering Matrix나 Y/DC 형상 해석이 아닙니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.1B","lesson":"2.1","title":"Field Amplitude vs Optical Power","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"ch2amplitude","see":"정규화 진폭 x와 그 제곱 x²를 비교합니다.","notice":"진폭 0.7071에서 Power가 0.5입니다.","meaning":"Field와 Power의 관계는 제곱이며 간섭은 복소 Field를 먼저 합합니다.","parameters":"x=|a|/√Pin, y=진폭 또는 상대 Power; 0–1 무차원.","limits":"Power-normalized Mode 전제; 서로 다른 Mode의 raw E[V/m] 비교가 아닙니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.2A","lesson":"2.2","title":"Directional Coupler Field Coupling","classification":"Conceptual","anchor":"#section-concept > p:nth-of-type(1)","renderer":"ch2dcStructure","see":"두 분리된 Core와 정성적 Tail 겹침입니다.","notice":"겹침의 색과 면적은 정량 Field가 아닙니다.","meaning":"두 Guide 전체의 Supermode가 다른 Phase를 누적합니다.","parameters":"동일 Guide의 정성 구조; κ=(βeven−βodd)/2.","limits":"2D Mode Solver나 실제 Gap→κ 결과가 아닙니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.2B","lesson":"2.2","title":"Coupling Length vs Output Power","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"ch2dcTransfer","see":"Through/Cross가 L에 따라 교환됩니다.","notice":"두 곡선의 합은 항상 1, Cross 최대 이후 되돌아옵니다.","meaning":"단일 입력의 Mode Envelope Power는 cos²/sin² 관계입니다.","parameters":"κ rad/µm와 선택 L µm는 Notebook 공유; 곡선 L=0–100µm, Δβ=0.","limits":"일정 κ, Lossless 2-mode. 실제 2D Electric Field Map이 아닙니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.2C","lesson":"2.2","title":"Y-branch and Symmetric Splitting","classification":"Conceptual","anchor":"#y-branch","renderer":"ch2y","see":"하나의 연결된 Core가 두 Arm으로 갈라집니다.","notice":"역방향 반대 Phase 입력은 대칭 Stem에 전부 전달되지 않습니다.","meaning":"대칭 Mode 분기와 2-guide Coupling은 다른 과정입니다.","parameters":"Forward 대칭 입력, 이상 진폭 1/√2 표시.","limits":"정량 방사/반사/Tip Loss 미계산; 완전한 Lossless Matched 3-port 아님.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.2D","lesson":"2.2","title":"MMI Mode Superposition","classification":"Conceptual","anchor":"#mmi","renderer":"ch2mmi","see":"공통 Multimode 영역과 두 출력입니다.","notice":"점선은 계산된 Mode나 광선 경로가 아닙니다.","meaning":"서로 다른 βm를 가진 여러 Mode가 Self-imaging을 만듭니다.","parameters":"Σ cmψm exp(iβmz)의 개념; 좌표는 구조 도식.","limits":"Self-image 거리와 2D Field를 계산하지 않았습니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.3A","lesson":"2.3","title":"Two Optical Paths","classification":"Analytical","anchor":"#section-concept > p:nth-of-type(3)","renderer":"ch2paths","see":"같은 Index에서 길이가 다른 두 Arm과 Phase 차이입니다.","notice":"아직 결합 전이므로 각 Arm Power는 일정합니다.","meaning":"OPL 차이는 Relative Phase를 누적시킵니다.","parameters":"Lu=10+ΔL µm, Ll=10 µm, n_eff와 λnm은 Notebook 공유. 구조는 정성 도식.","limits":"실수 동일 Index, Lossless 단색. 경로 선은 정량 Layout이 아닙니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.3B","lesson":"2.3","title":"Phase Accumulation","classification":"Analytical","anchor":"#section-equation > .
