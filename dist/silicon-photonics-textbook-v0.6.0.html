worked","renderer":"ch2phase","see":"같은 진폭의 두 Signed Field가 상대 Phase만큼 이동합니다.","notice":"각 곡선의 높이와 그 상대 위치를 구별하세요.","meaning":"Phase 변화가 곧 단독 Arm의 Power 변화는 아닙니다.","parameters":"Re(a), x=z 0–2 µm; β와 Δφ는 Notebook과 같은 모델.","limits":"시간 Detector 신호나 변조 Eye가 아닙니다. 같은 Frequency·Mode 가정.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.4A","lesson":"2.4","title":"Complete MZI Structure","classification":"Conceptual","anchor":"#section-concept > p:nth-of-type(2)","renderer":"ch2mziStructure","see":"Input U, 두 Arm, Output U†와 두 Port입니다.","notice":"Output Port Convention과 Arm Phase를 같이 읽으세요.","meaning":"두 번의 Field 분배와 Phase를 연속해서 적용해야 합니다.","parameters":"Power-normalized Field, Δφ=φu−φl, Port1 at Δφ0 bright.","limits":"정량 Layout이나 계산한 Spatial Field가 아니라 Circuit Schematic입니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.4B","lesson":"2.4","title":"MZI Transfer Curve","classification":"Analytical","anchor":"#section-equation > .worked","renderer":"ch2mziTransfer","see":"Δφ에 따른 상보적 두 출력입니다.","notice":"T1+T2=1, Port1=cos², Port2=sin²입니다.","meaning":"Lossless Unitary Combiner는 Power를 두 출력에 재분배합니다.","parameters":"Δφ/π 0–2; 두 50:50 Coupler U†DU; Notebook 공유.","limits":"손실·분산·편광·비결맞음·실제 ER 미포함.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.4C","lesson":"2.4","title":"Complex Field Interference","classification":"Analytical","anchor":"#section-experiment > p:first-of-type","renderer":"ch2phasors","see":"Port1에서 1/2과 exp(iΔφ)/2의 Vector 합입니다.","notice":"Vector 길이 제곱이 T1이며 Field 부호가 Power 부호는 아닙니다.","meaning":"Constructive/Destructive Interference는 복소 합에서 나옵니다.","parameters":"Re/Im power-normalized dimensionless amplitudes; Δφ Notebook 공유.","limits":"단면 EM Vector 성분이 아니라 Modal Amplitude의 복소 평면입니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md"},{"id":"2.5R1","lesson":"2.5","title":"Ring Resonator · Recirculating Field","classification":"Conceptual","anchor":"#ring-resonator","renderer":"ch2ringStructure","see":"한 Bus와 닫힌 Ring의 결합 구조입니다.","notice":"a는 Power가 아니라 Round-trip Amplitude입니다.","meaning":"반복 도착한 Field가 직접 Bus Field와 간섭합니다.","parameters":"All-pass Bus 하나; θ Round-trip Phase.","limits":"Stored Field나 단면 EM 해석 결과가 아닙니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md","notebookScene":"ring"},{"id":"2.5R2","lesson":"2.5","title":"Ring Transfer and Local FSR","classification":"Analytical","anchor":"#ring-example","renderer":"ch2ringTransfer","see":"Round-trip Phase에 따른 Bus T와 내부 Dissipation입니다.","notice":"t=a에서 Resonance T=0, a=1이면 All-pass 크기는 1입니다.","meaning":"Critical Coupling에는 내부 Loss와 외부 Coupling의 균형이 필요합니다.","parameters":"θ/π −1–1, t와 a Notebook 공유; FSR λ1550nm,R10µm, ng 독립 입력.","limits":"Phase-axis 그래프, Dispersion Spectrum/Q/Add-drop 모델 아님.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md","notebookScene":"ring"},{"id":"2.5G1","lesson":"2.5","title":"Bragg Grating · Periodic Backscattering","classification":"Conceptual","anchor":"#bragg-grating","renderer":"ch2braggStructure","see":"주기 구조와 Forward/Backward Mode입니다.","notice":"Chip 밖으로 방출하는 Grating Coupler와 구별하세요.","meaning":"Phase-matched 후진 성분이 합쳐져 반사를 만듭니다.","parameters":"1차 Bragg λB≈2neffΛ; 그림은 정성적 구조.","limits":"실제 Corrugation에서 κg를 계산하지 않았습니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md","notebookScene":"bragg"},{"id":"2.5G2","lesson":"2.5","title":"Uniform Bragg Reflection / Transmission","classification":"Analytical","anchor":"#bragg-example","renderer":"ch2braggTransfer","see":"δ에 따른 Uniform CMT의 R/T입니다.","notice":"R+T=1이며 δ=0에서 tanh²/sech²입니다.","meaning":"전후진 경계조건이 DC의 주기 Power Exchange와 다른 응답을 만듭니다.","parameters":"δ µm⁻¹, κg µm⁻¹, Lg µm Notebook 공유; 일정 실수 κg와 Lossless.","limits":"Apodized/Phase-shifted/실제 제작 Spectrum은 계산하지 않습니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md","notebookScene":"bragg"},{"id":"2.5A","lesson":"2.5","title":"Passive PIC Schematic","classification":"Conceptual","anchor":"#passive-circuit","renderer":"ch2mziStructure","see":"Input, 두 Coupler, 두 Arm과 두 출력입니다.","notice":"이 Exercise는 U(r)† D U(r)이며 r를 독립 입력합니다.","meaning":"회로는 검증한 Component의 Field 관계를 연결합니다.","parameters":"실제 Layout 아님; Notebook r, Phase, Loss는 Figure 2.5B에 정량 표시.","limits":"Ring과 Bragg는 앞서 비교한 별도 모델이며 이 MZI에 연결하지 않았습니다.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md","notebookScene":"circuit"},{"id":"2.5B","lesson":"2.5","title":"Design Conditions and Output Response","classification":"Analytical","anchor":"#section-experiment > p:last-of-type","renderer":"ch2circuit","see":"현재 조건, Phase, Arm Power, Output과 Loss Ledger입니다.","notice":"출력 두 개와 Propagation Loss의 합이 1mW인지 확인하세요.","meaning":"Amplitude→Phase→Combiner→Power를 한 모델로 연결합니다.","parameters":"Pin1mW; Lu1000+ΔLµm,Ll1000µm; αdB/cm, r, λnm, neff는 Circuit Notebook 공유.","limits":"반사/실제 Bend/Excess Loss/PDK/수율 미포함. r와 neff·Loss는 독립 가정.","source":"Original SVG and PassivePhysics; see TEXTBOOK_SOURCE_MAPPING.md / CH2_MODEL_CONTRACT.md","notebookScene":"circuit"},{"id":"3.1A","lesson":"3.1","title":"Fiber and Target Mode Profiles","classification":"Analytical","anchor":"#section-concept > p:first-of-type","renderer":"ioModes","see":"공통 평면에서 단위 Power로 정규화한 두 Scalar Gaussian의 Intensity Map입니다.","notice":"Core Width가 아니라 Gaussian Mode 반경 w를 바꿉니다. 두 Map은 공통 표시 Scale입니다.","meaning":"입력 Power가 같아도 Field 크기와 위치가 다르면 같은 Mode가 아닙니다.","parameters":"x,y −12…12µm; MFD=2w; color=sqrt(I/common Imax). 무한 평면 정규화 해의 유한 표시 창.","limits":"실제 Vector Eigenmode/Si 단면 해가 아닙니다. 색의 밝기 자체가 Input Power는 아닙니다.","source":"Original SVG / IOPhysics. Sources and derivation: TEXTBOOK_SOURCE_MAPPING.md / notebook/CH3_MODEL_CONTRACT.md"},{"id th","classification":"Analytical","renderer":"detectorResponsivity","anchor":"#section-equation > .worked","see":"선택 η_ext와 비교 η=0.5,1.0의 Unity-gain R(λ) 곡선을 봅니다.","notice":"η를 고정한 계산입니다. λ가 길면 W당 Photon 수가 많아져 R이 증가합니다.","meaning":"R=ηqλ/hc이며 같은 Plane에서 I=RP를 계산합니다.","parameters":"λ 800–1800nm; 독립 η_ext [0,1]; R[A/W]; Reference Plane은 Detector Coupling 앞 Waveguide. Source: 자체 작성 SVG/Model; official Chapter 7 목차; notebook/CH5_MODEL_CONTRACT.md. Full text/원본 Figure는 재현하지 않았습니다.","limits":"실제 Ge Spectral Response가 아닙니다. Bandgap, Strain, Material absorption, Gain, Saturation을 예측하지 않습니다.","source":"Original SVG and educational model; CH5_MODEL_CONTRACT.md; CH5_TEXTBOOK_SOURCE_MAPPING.md"},{"id":"5.2A","lesson":"5.2","title":"Transit Time vs RC Response","classification":"Conceptual","renderer":"detectorTiming","anchor":"#section-concept > p:first-of-type","see":"Carrier Collection Path와 Small-signal RC Circuit을 나란히 비교합니다.","notice":"W는 Carrier 이동 거리, C_total은 Junction/Parasitic/Load를 포함하는 독립 입력입니다.","meaning":"RC와 Transit의 물리적 원인이 다르므로 하나의 시간 상수로 동일시하지 않습니다.","parameters":"상수 Drift Velocity 가정의 W/v와 독립 Lumped RC. 구조는 비축척 개념도입니다. Source: 자체 작성 SVG/Model; official Chapter 7 목차; notebook/CH5_MODEL_CONTRACT.md. Full text/원본 Figure는 재현하지 않았습니다.","limits":"생성 위치별 Current Impulse나 실제 종합 Bandwidth를 계산하지 않습니다. RC Circuit은 1차 등가입니다.","source":"Original SVG and educational model; CH5_MODEL_CONTRACT.md; CH5_TEXTBOOK_SOURCE_MAPPING.md"},{"id":"5.2B","lesson":"5.2","title":"First-order RC Frequency Response","classification":"Analytical","renderer":"detectorBandwidth","anchor":"#section-equation > .worked","see":"|H_RC(f)| 곡선과 지정 Probe Frequency에서의 값, Transit 시간과 PIN Noise를 봅니다.","notice":"f_RC의 Magnitude 0.7071, Power 0.5입니다. Noise B는 f_RC와 독립입니다.","meaning":"Capacitance 감소는 RC Pole을 올리지만 Transit 지배 Device 성능 개선을 보장하지 않습니다.","parameters":"R_eq[Ω], C_total[fF], Frequency[GHz]; τ_RC=RC. Shot Noise는 독립 Equivalent Noise B와 Unity Gain Poisson Model. Source: 자체 작성 SVG/Model; official Chapter 7 목차; notebook/CH5_MODEL_CONTRACT.md. Full text/원본 Figure는 재현하지 않았습니다.","limits":"Transit Bandwidth/RC와 Transit 결합, Thermal/Amplifier/APD Noise, Receiver SNR은 계산하지 않습니다.","source":"Original SVG and educational model; CH5_MODEL_CONTRACT.md; CH5_TEXTBOOK_SOURCE_MAPPING.md"},{"id":"5.3A","lesson":"5.3","title":"Ge-on-Si Detector Cross-section","classification":"Conceptual","renderer":"detectorGe","anchor":"#section-concept > p:first-of-type","see":"Si Waveguide 위의 Ge 흡수 영역, p/n Contacts와 Oxide를 구별합니다.","notice":"Optical z는 지면 안 방향이고 Carrier는 x 방향으로 수집됩니다.","meaning":"Optical Coupling/Absorption과 전하 수집을 같은 구조에서 함께 설계해야 합니다.","parameters":"횡단면 x–y; 비축척 개념도. Photon Energy만 λ에서 계산합니다. Source: 자체 작성 SVG/Model; official Chapter 7 목차; notebook/CH5_MODEL_CONTRACT.md. Full text/원본 Figure는 재현하지 않았습니다.","limits":"실제 PDK Stack, 독립적인 Ge Mode 해, Doping Profile 또는 Field Map이 아닙니다.","source":"Original SVG and educational model; CH5_MODEL_CONTRACT.md; CH5_TEXTBOOK_SOURCE_MAPPING.md"},{"id":"5.3B","lesson":"5.3","title":"Simplified Fabrication Flow","classification":"Conceptual","renderer":"detectorFabrication","anchor":"#section-equation > .worked","see":"Si 준비, Ge Epitaxy, Junction/Contacts, Passivation/Test의 논리를 봅니다.","notice":"실제 공정 순서, Mask, 온도, 치수는 지정하지 않았습니다.","meaning":"Interface Defect와 Contact는 Optical Absorption 이후의 Collection 및 Leakage에도 중요합니다.","parameters":"Foundry-independent integration concept; 실제 단계와 순서는 Process에 따라 달라집니다. Source: 자체 작성 SVG/Model; official Chapter 7 목차; notebook/CH5_MODEL_CONTRACT.md. Full text/원본 Figure는 재현하지 않았습니다.","limits":"공정 Recipe나 제조 가능성을 검증한 것이 아닙니다. 실제 Mask Stack으로 사용하지 않습니다.","source":"Original SVG and educational model; CH5_MODEL_CONTRACT.md; CH5_TEXTBOOK_SOURCE_MAPPING.md"},{"id":"5.4A","lesson":"5.4","title":"Photoconductive, PIN and APD Architectures","classification":"Conceptual","renderer":"detectorArchitectures","anchor":"#section-concept > p:first-of-type","see":"Conductivity Change, Drift Collection, Absorption/Charge/Multiplication 영역을 비교합니다.","notice":"동일한 Box 크기는 동일한 실제 치수나 성능을 뜻하지 않습니다.","meaning":"Gain의 원리와 Charge Region의 Field Engineering 역할을 구별합니다.","parameters":"각 구조는 자체 비축척 개념도. APD Layer는 설계 원리 예시이며 실제 Device Stack이 아닙니다. Source: 자체 작성 SVG/Model; official Chapter 7 목차; notebook/CH5_MODEL_CONTRACT.md. Full text/원본 Figure는 재현하지 않았습니다.","limits":"Mobility/Lifetime, Doping, Electric Field, Gain–Bandwidth를 계산하지 않습니다.","source":"Original SVG and educational model; CH5_MODEL_CONTRACT.md; CH5_TEXTBOOK_SOURCE_MAPPING.md"},{"id":"5.4B","lesson":"5.4","title":"APD Multiplication Concept","classification":"Conceptual","renderer":"detectorAvalanche","anchor":"#section-equation > .worked","see":"Primary Electron과 Impact Ionization으로 생성된 Secondary Pair를 구별합니다.","notice":"그림의 Pair 수는 고정된 예시이며 M을 사건 시뮬레이션으로 표현하지 않습니다.","meaning":"M은 Primary Photon QE와 다르며 Mean Current를 키우는 별도 Gain입니다.","parameters":"Mean I_photo=M I_primary, M≥1; 입력 λ, η_ext, Power는 Primary를 정의합니다. Source: 자체 작성 SVG/Model; official Chapter 7 목차; notebook/CH5_MODEL_CONTRACT.md. Full text/원본 Figure는 재현하지 않았습니다.","limits":"APD Noise/Excess Noise Factor/Breakdown/SNR/Operating Bias를 예측하지 않습니다.","source":"Original SVG and educational model; CH5_MODEL_CONTRACT.md; CH5_TEXTBOOK_SOURCE_MAPPING.md"},{"id":"5.5A","lesson":"5.5","title":"Detector Length and Effective Absorption","classification":"Analytical","renderer":"detectorAbsorption","anchor":"#section-concept > p:first-of-type","see":"Solid는 Absorption Fraction, Dashed는 남은 Guided Power Fraction을 보여 줍니다.","notice":"L과 α_eff는 광학 흡수만 결정합니다. C/W를 독립적으로 유지합니다.","meaning":"Absorption 포화와 Collection/Coupling 손실을 분리하고 QE를 중복 곱하지 않습니다.","parameters":"η_abs=1−exp(−α_eff L×10⁻⁴), α_eff[cm⁻¹], L[µm]; Factorized η_ext. Source: 자체 작성 SVG/Model; official Chapter 7 목차; notebook/CH5_MODEL_CONTRACT.md. Full text/원본 Figure는 재현하지 않았습니다.","limits":"반사/Mode Evolution, Material Spectrum, 실제 Length→Capacitance/Transit 상관관계를 포함하지 않습니다.","source":"Original SVG and educational model; CH5_MODEL_CONTRACT.md; CH5_TEXTBOOK_SOURCE_MAPPING.md"},{"id":"5.5B","lesson":"5.5","title":"Junction Orientation, Contacts and Load","classification":"Conceptual","renderer":"detectorOrientation","anchor":"#section-equation > .worked","see":"Lateral/Vertical Collection과 Optical Propagation z를 구별합니다.","notice":"Contact가 광학 흡수와 Resistance를 함께 바꿀 수 있습니다.","meaning":"Absorption, Carrier Transit, Capacitance를 같은 한 변수로 대체할 수 없습니다.","parameters":"비축척 구조; Junction C와 Pad/Load C는 별도 기여. 수치 상관식 없음. Source: 자체 작성 SVG/Model; official Chapter 7 목차; notebook/CH5_MODEL_CONTRACT.md. Full text/원본 Figure는 재현하지 않았습니다.","limits":"실제 Field/Profile, Fringing Capacitance와 Contact Material 손실을 계산하지 않습니다.","source":"Original SVG and educational model; CH5_MODEL_CONTRACT.md; CH5_TEXTBOOK_SOURCE_MAPPING.md"},{"id":"5.6A","lesson":"5.6","title":"Optical Generation to Electrical Collection","classification":"Conceptual","renderer":"detectorGeneration","anchor":"#section-concept > p:first-of-type","see":"Field→Useful Absorption→Pair Generation→Transport→Current의 물리량을 구별합니다.","notice":"Metal 흡수를 모두 유용한 Ge Pair Generation으로 세면 안 됩니다.","meaning":"Optical과 Electrical Domain을 연결할 때 공간 Source와 단위 정규화가 필요합니다.","parameters":"G=p_abs,useful/E_ph는 Photon당 Pair 하나를 가정한 관계. 자체 흐름도이며 공간 해 없음. Source: 자체 작성 SVG/Model; official Chapter 7 목차; notebook/CH5_MODEL_CONTRACT.md. Full text/원본 Figure는 재현하지 않았습니다.","limits":"기존 Si Scalar Profile을 실제 Ge Field/Generation Map으로 재사용하거나 주장하지 않습니다.","source":"Original SVG and educational model; CH5_MODEL_CONTRACT.md; CH5_TEXTBOOK_SOURCE_MAPPING.md"},{"id":"5.6B","lesson":"5.6","title":"Optical vs Electrical Simulation Domains","classification":"Conceptual","renderer":"detectorDomains","anchor":"#section-equation > .worked","see":"Eigenmode/FDTD와 Semiconductor Transport/TCAD의 역할을 비교합니다.","notice":"연결 정보 G(r), 좌표, Mesh, Optical Input Power의 기준이 중요합니다.","meaning":"높은 Optical Absorption도 불완전한 Collection이면 높은 External QE를 보장하지 않습니다.","parameters":"숫자는 독립적인 Coupling/Absorption/Collection의 Lumped 교육 모델입니다.   <script>/* Original educational models. SI conversions are explicit at the boundaries. */
(function(root) {
  'use strict';
  function criticalAngle(nCore=3.48, nClad=1.444) {
    if (!(nCore > nClad && nClad > 0)) throw new RangeError('Require nCore > nClad > 0');
    return Math.asin(nClad/nCore)*180/Math.PI;
  }
  function phase(neff, lambdaNm, lengthUm) {
    if (!(neff>0 && lambdaNm>0 && lengthUm>=0)) throw new RangeError('Invalid phase inputs');
    const lambdaUm=lambdaNm/1000, beta=2*Math.PI*neff/lambdaUm;
    return {beta, phi:beta*lengthUm, cycles:neff*lengthUm/lambdaUm, guidedUm:lambdaUm/neff};
  }
  function slabTE(widthNm=500, lambdaNm=1550, nCore=3.48, nClad=1.444) {
    if (!(widthNm>0 && lambdaNm>0 && nCore>nClad && nClad>0)) throw new RangeError('Invalid slab inputs');
    // x confinement with |x|<=a, infinite y, propagation +z; electric field Ey.
    const a=widthNm/2000, k0=2*Math.PI/(lambdaNm/1000);
    const V=k0*a*Math.sqrt(nCore*nCore-nClad*nClad), modes=[];
    for(let m=0;m<256 && m*Math.PI/2<V-1e-10;m++) {
      const lower=m*Math.PI/2;
      let lo=lower, hi=Math.min(V,lower+Math.PI/2);
      // u = m*pi/2 + atan(sqrt(V^2-u^2)/u); strictly increasing residual.
      for(let j=0;j<80;j++) {
        const u=(lo+hi)/2, w=Math.sqrt(Math.max(0,V*V-u*u));
        if(u-lower-Math.atan2(w,u)>0) hi=u; else lo=u;
      }
      const u=(lo+hi)/2, w=Math.sqrt(Math.max(0,V*V-u*u));
      const h=u/a, q=w/a, beta=Math.sqrt((nClad*k0)**2+q*q), neff=beta/k0;
      const even=m%2===0, edge=even?Math.cos(u):Math.sin(u);
      const inside=a*(1+(even?1:-1)*Math.sin(2*u)/(2*u)), outside=edge*edge/q;
      modes.push({m,u,w,h,q,beta,neff,a,V,even,corePower:inside/(inside+outside)});
    }
    return {widthNm,lambdaNm,nCore,nClad,V,a,k0,modes};
  }
  function slabField(mode,xUm) {
    const {a,u,q,even}=mode, ax=Math.abs(xUm);
    if(ax<=a) return even?Math.cos(u*xUm/a):Math.sin(u*xUm/a);
    const edge=even?Math.cos(u):Math.sin(u)*(xUm<0?-1:1);
    return edge*Math.exp(-q*(ax-a));
  }
  // Synthetic exercise inputs only; not a fit to measured or simulated Silicon bends.
  const bendTable=Object.freeze([{radius:2,bendDb:.4},{radius:5,bendDb:.08},{radius:10,bendDb:.02},{radius:20,bendDb:.005}].map(Object.freeze));
  function designLedger(index=2,alphaDbCm=3,straightMm=2,count=4) {
    if(!Number.isInteger(index)||!bendTable[index]||!(alphaDbCm>=0&&straightMm>=0&&Number.isInteger(count)&&count>=0)) throw new RangeError('Invalid ledger inputs');
    const {radius,bendDb}=bendTable[index],bendLengthUm=count*Math.PI*radius/2;
    const lengthCm=straightMm/10+bendLengthUm/10000;
    const propagationDb=alphaDbCm*lengthCm,bendsDb=count*bendDb,totalDb=propagationDb+bendsDb;
    return {radius,bendDb,bendLengthUm,lengthCm,propagationDb,bendsDb,totalDb,transmission:10**(-totalDb/10),footprint:radius*radius};
  }
  root.Photonics = {criticalAngle, phase, slabTE, slabField, bendTable, designLedger};
})(globalThis);

(function(root){
'use strict';
const TAU=2*Math.PI,abs2=z=>z.re*z.re+z.im*z.im;
function finite(x,name){if(!Number.isFinite(x))throw RangeError(name+' must be finite');return x;}
function bound(x,a,b,name){finite(x,name);if(x<a||x>b)throw RangeError(name+' out of range');return x;}
function positive(x,name){finite(x,name);if(x<=0)throw RangeError(name+' must be positive');return x;}
function splitter(pin=1,r=.5,excessDb=0){bound(pin,0,1e6,'Pin');bound(r,0,1,'ratio');bound(excessDb,0,100,'excess');const eta=10**(-excessDb/10),p1=pin*r*eta,p2=pin*(1-r)*eta;return {pin,r,eta,p1,p2,a1:Math.sqrt(p1),a2:Math.sqrt(p2),lost:pin-p1-p2};}
function dc(kappa=.04,length=20,deltaBeta=0){bound(kappa,0,1,'kappa');bound(length,0,1e4,'length');finite(deltaBeta,'deltaBeta');const q=Math.hypot(kappa,deltaBeta/2),sin=q?Math.sin(q*length):0,cs=Math.cos(q*length),x=q?kappa/q*sin:0,z=q?deltaBeta/(2*q)*sin:0;return {through:cs*cs+z*z,cross:x*x,fieldThrough:{re:cs,im:z},fieldCross:{re:0,im:x},q,kappa,length,halfLength:kappa?Math.PI/(4*kappa):Infinity,fullLength:kappa?Math.PI/(2*kappa):Infinity};}
function phase(neff=2.4,wavelengthNm=1550,lengthUm=10){positive(neff,'neff');positive(wavelengthNm,'wavelength');bound(lengthUm,0,1e7,'length');const beta=TAU*neff/(wavelengthNm/1000),phi=beta*lengthUm;return {beta,phi,cycles:phi/TAU};}
function phaseDifference(nUpper=2.4,nLower=2.4,lUpper=10,lLower=10,wavelengthNm=1550){const u=phase(nUpper,wavelengthNm,lUpper),l=phase(nLower,wavelengthNm,lLower);return {upper:u,lower:l,delta:u.phi-l.phi};}
function circuit({ratio=.5,delta=0,upperUm=1000,lowerUm=1000,alphaDbCm=0,pin=1}={}){bound(ratio,0,1,'ratio');finite(delta,'delta');bound(upperUm,0,1e7,'upper length');bound(lowerUm,0,1e7,'lower length');bound(alphaDbCm,0,1000,'loss');bound(pin,0,1e6,'Pin');const gu=10**(-alphaDbCm*upperUm/200000),gl=10**(-alphaDbCm*lowerUm/200000),e={re:Math.cos(delta),im:Math.sin(delta)},c=Math.sqrt(ratio*(1-ratio));
 const e1={re:ratio*gu*e.re+(1-ratio)*gl,im:ratio*gu*e.im},e2={re:c*gu*e.im,im:c*(gl-gu*e.re)},t1=abs2(e1),t2=abs2(e2),delivered=ratio*gu*gu+(1-ratio)*gl*gl;
 const max=(ratio*gu+(1-ratio)*gl)**2,min=(ratio*gu-(1-ratio)*gl)**2;
 return {e1,e2,t1,t2,p1:pin*t1,p2:pin*t2,pin,delivered,lost:pin*(1-delivered),gu,gl,armUpper:pin*ratio*gu*gu,armLower:pin*(1-ratio)*gl*gl,max,min,erDb:min<1e-28?(max>0?Infinity:NaN):10*Math.log10(max/min)};}
function mzi(delta=0){return circuit({delta});}
function ring(theta=0,t=.9,a=.9){finite(theta,'theta');bound(t,0,1,'self coupling');bound(a,0,1,'round trip');const c=Math.cos(theta),s=Math.sin(theta),dr=1-t*a*c,di=-t*a*s,nr=t-a*c,ni=-a*s,den=dr*dr+di*di;if(den<1e-28&&t===1)return {transmission:1,h:{re:1,im:0}};const h={re:(nr*dr+ni*di)/den,im:(ni*dr-nr*di)/den};return {transmission:abs2(h),h};}
function fsr(wavelengthNm=1550,ng=4,radiusUm=10){positive(wavelengthNm,'lambda');positive(ng,'ng');positive(radiusUm,'R');return (wavelengthNm/1000)**2/(ng*TAU*radiusUm)*1000;}
function bragg(kappa=.01,lengthUm=100,delta=0){bound(kappa,0,1,'grating kappa');bound(lengthUm,0,1000,'grating length');finite(delta,'detuning');const d=kappa*kappa-delta*delta;let f,c;if(Math.abs(d)<1e-18){f=lengthUm;c=1;}else if(d>0){const s=Math.sqrt(d),u=s*lengthUm,h=Math.tanh(u),den=s*s+delta*delta*h*h,e=Math.exp(-u),sech=2*e/(1+e*e);return {reflection:kappa*kappa*h*h/den,transmission:s*s*sech*sech/den};}else{const q=Math.sqrt(-d);f=Math.sin(q*lengthUm)/q;c=Math.cos(q*lengthUm);}const den=c*c+delta*delta*f*f;return {reflection:kappa*kappa*f*f/den,transmission:1/den};}
root.PassivePhysics={splitter,dc,phase,phaseDifference,circuit,mzi,ring,fsr,bragg,abs2};
})(globalThis);

(function(root){
'use strict';
const TAU=2*Math.PI,rad=d=>d*Math.PI/180;
function range(v,lo,hi,name){if(!Number.isFinite(v)||v<lo||v>hi)throw RangeError(name+' outside model domain');return v;}
function positive(v,name){if(!Number.isFinite(v)||v<=0)throw RangeError(name+' must be positive');return v;}
function gaussianField(x,y,w,dx=0,dy=0){positive(w,'radius');return Math.sqrt(2/Math.PI)/w*Math.exp(-((x-dx)**2+(y-dy)**2)/(w*w));}

let connectedTopic='';
function setupObserver(){
 observer?.disconnect();connectedTopic='';
 const mobile=matchMedia('(max-width:760px)').matches,root=mobile?null:$('#reading');
 const targets=[...document.querySelectorAll('[data-section], [data-notebook-scene], [data-figure]')];
 function connect(){
  const top=(root?root.getBoundingClientRect().top:0)+80;
  const reached=targets.filter(el=>el.getBoundingClientRect().top<=top);
  const active=reached.at(-1)||targets[0];if(!active)return;
  const section=active.closest('[data-section]'),topic=active.dataset.notebookScene||section.dataset.scene;
  const context=$('#notebook-context');if(context)context.textContent=`지금 읽는 절 · ${section.querySelector('h2').textContent}`;
  $('#notebook').dataset.scene=topic;
  document.querySelectorAll('.teaching-figure').forEach(el=>el.classList.toggle('figure-active',el===active));
  if(current().id==='2.5'&&['ring','bragg','circuit'].includes(topic)&&topic!==connectedTopic){connectedTopic=topic;settings().ch2View=['ring','bragg','circuit'].indexOf(topic);renderNotebook();const c=$('#notebook-context');if(c)c.textContent=`지금 읽는 절 · ${section.querySelector('h2').textContent}`;}else if(current().id==='1.2'&&topic!==connectedTopic){
   const previous=connectedTopic;connectedTopic=topic;
   const view=topic==='polarization'?'polarization':'modes';
   if(previous&&settings().view!==view){settings().view=view;renderNotebook();const c=$('#notebook-context');if(c)c.textContent=`지금 읽는 절 · ${section.querySelector('h2').textContent}`;}
  }else connectedTopic=topic;
 }
 observer=new IntersectionObserver(connect,{root,rootMargin:'-5% 0px -55% 0px',threshold:[0,.1,.3]});targets.forEach(el=>observer.observe(el));connect();
}

function slider(id,label,value,min,max,step,unit){return `<div class="controls"><label class="control-row" for="${id}"><span>${label}</span><output id="${id}-value" for="${id}">${value} ${unit}</output></label><input id="${id}" data-setting="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"><div class="range-bounds"><span>${min} ${unit}</span><span>${max} ${unit}</span></div></div>`;}

function updateNotebook(){
 if(current().id.startsWith('6.')){Ch6Notebook.update(current(),settings());return;}
 if(current().id.startsWith('5.')){Ch5Notebook.update(current(),settings());return;}
 if(current().id.startsWith('4.')){Ch4Notebook.update(current(),settings());return;}
 if(current().id.startsWith('3.')){Ch3Notebook.update(current(),settings());return;}
 if(current().id.startsWith('2.')){Ch2Notebook.update(current(),settings());return;}
 if(current().id!=='1.1'){updateAdvancedNotebook();return;}
 const theta=num('angle',45,5,80), tc=P.criticalAngle(),tir=theta>tc, rad=theta*Math.PI/180;
 $('#angle-value').textContent=theta+' °';
 const x=240,y=150,len=130,s=Math.sin(rad),c=Math.cos(rad),ratio=3.48/1.444*s;
 const transmit=tir?`<path d="M110 126 Q240 110 370 126" stroke="var(--plot)" fill="none" stroke-width="2" stroke-dasharray="4 5"/><text x="274" y="90">Evanescent field</text>`:(()=>{const t=Math.asin(ratio);return `<path class="ray" d="M${x} ${y} L${x+120*Math.sin(t)} ${y-120*Math.cos(t)}"/><text x="330" y="79">Refracted ray</text>`;})();
 $('#notebook-plot').innerHTML=svg(`Normal 기준 입사각 ${theta}도. ${tir?'TIR, Cladding에 Evanescent Field 존재':'전파하는 굴절파 존재'}`,`<rect class="core" x="20" y="150" width="460" height="150" rx="5"/><line class="axis" x1="20" y1="150" x2="480" y2="150"/><line x1="240" x2="240" y1="45" y2="300" stroke="var(--muted)" stroke-dasharray="5 5"/><text x="252" y="40">Normal</text><text x="30" y="57">SiO₂ · n₂ = 1.444</text><text x="30" y="285">Si · n₁ = 3.48</text><path class="ray" d="M${x-len*s} ${y+len*c} L${x} ${y} L${x+len*s} ${y+len*c}"/>${transmit}<circle cx="240" cy="150" r="4" fill="var(--warm)"/><text x="155" y="211">θ₁ = ${theta}°</text><text x="300" y="252">Reflected ray</text>`);
 $('#notebook-readout').innerHTML=`<p>Critical Angle θc = <strong>${tc.toFixed(2)}°</strong></p><p>${tir?`θ₁ &gt; θc → <strong>TIR 조건을 만족합니다</strong>`:`θ₁ &lt; θc → 굴절각 θ₂ = <strong>${(Math.asin(ratio)*180/Math.PI).toFixed(1)}°</strong>`}</p><p class="caption">${tir?'바깥으로 진행하는 굴절파는 없지만 경계의 Field는 사라지지 않습니다.':'일부 빛이 Cladding으로 전파할 수 있습니다. 반사되는 성분도 존재합니다.'}</p>`;
}
function fieldPlot(model,mode,kind='signed'){
 const extent=Math.max(.8,model.a+.35), left=49,right=475,top=45,bottom=245,mid=(top+bottom)/2;
 const X=x=>left+(x+extent)/(2*extent)*(right-left),Y=e=>kind==='intensity'?bottom-170*e:mid-85*e;
 const values=Array.from({length:501},(_,i)=>{const x=-extent+2*extent*i/500,e=P.slabField(mode,x);return `${i?'L':'M'}${X(x).toFixed(2)} ${Y(kind==='intensity'?e*e:e).toFixed(2)}`;}).join(' ');
 const ticks=[-extent,-model.a,0,model.a,extent].filter((v,i,a)=>!i||v-a[i-1]>.05);
 return svg(`1D symmetric Slab TE${mode.m}, ${kind==='intensity'?'normalized Ey squared':'normalized signed Ey'} versus x in micrometers`, `<rect class="core" x="${X(-model.a)}" y="${top}" width="${X(model.a)-X(-model.a)}" height="${bottom-top}"/><text x="${X(-model.a)+5}" y="34">Si Core</text><text x="340" y="34">SiO₂</text><line class="axis" x1="${left}" x2="${right}" y1="${Y(0)}" y2="${Y(0)}"/><line class="axis" x1="${left}" x2="${left}" y1="${top}" y2="${bottom}"/><path class="field" d="${values}"/>${ticks.map(x=>`<line class="axis" x1="${X(x)}" x2="${X(x)}" y1="${bottom}" y2="${bottom+5}"/><text x="${X(x)}" y="${bottom+24}" text-anchor="middle">${x.toFixed(2)}</text>`).join('')}<text x="12" y="65">1</text><text x="8" y="${Y(0)+5}">0</text>${kind==='signed'?'<text x="4" y="235">−1</text>':''}<text x="245" y="301" text-anchor="middle">x (µm) · ${kind==='intensity'?'Ey² / max|Ey|²':'Ey / max|Ey|'}</text>`);
}

}
function dispersionPlot(width,selected){
 const left=50,right=476,top=40,bottom=240,X=d=>left+(d-100)/900*(right-left),Y=n=>bottom-(n-1.4)/2.1*(bottom-top);
 const colors=['var(--plot)','var(--warm)','#647bc0','#92709c','#7b8548'];
 const curves=colors.map((color,m)=>{let path='';for(let d=100;d<=1000;d+=5){const mode=P.slabTE(d).modes[m];if(mode)path+=`${path?'L':'M'}${X(d).toFixed(2)} ${Y(mode.neff).toFixed(2)} `;}return `<path fill="none" stroke="${color}" stroke-width="${m===selected?3:1.6}" d="${path}"/>`;}).join('');
 return svg('Slab TE effective indices versus full slab width from 100 to 1000 nanometers, all supported TE branches',`<line class="axis" x1="${left}" x2="${left}" y1="${top}" y2="${bottom}"/><line class="axis" x1="${left}" x2="${right}" y1="${bottom}" y2="${bottom}"/><line x1="${left}" x2="${right}" y1="${Y(1.444)}" y2="${Y(1.444)}" stroke="var(--line)" stroke-dasharray="4 5"/><text x="54" y="28">n_eff · TE₀ … TE₄</text>${[1.444,2,2.5,3,3.48].map(n=>`<text x="43" y="${Y(n)+4}" text-anchor="end">${n.toFixed(2)}</text>`).join('')}${curves}<line x1="${X(width)}" x2="${X(width)}" y1="${top}" y2="${bottom}" stroke="var(--muted)" stroke-dasharray="3 4"/>${[100,250,500,750,1000].map(d=>`<text x="${X(d)}" y="268" text-anchor="middle">${d}</text>`).join('')}<text x="260" y="303" text-anchor="middle">Full slab width d (nm)</text>`);
}
function updateEngineeringNotebook(){
 const l=current();
 if(l.id==='1.4'){
  const d=num('width',220,100,1000),model=P.slabTE(d),index=Math.round(num('mode',0,0,model.modes.length-1)),mode=model.modes[index],view=settings().view||'field';
  $('#width-value').textContent=d.toFixed(0)+' nm';
  $('#mode-buttons').innerHTML=model.modes.map(m=>`<button data-mode="${m.m}" aria-pressed="${m.m===index}">TE${m.m}</button>`).join('');
  if(view==='strip'){
   const W=80+d*.23;
   $('#notebook-plot').innerHTML=svg('Conceptual finite strip cross section, width varies for illustration and height 220nm is not used in slab calculation',`<rect class="core" x="25" y="35" width="450" height="235" rx="10"/><rect x="${250-W/2}" y="110" width="${W}" height="90" fill="var(--core)" stroke="var(--muted)"/><path d="M${250-W/2} 225 H${250+W/2}" stroke="var(--plot)" stroke-width="2"/><text x="250" y="252" text-anchor="middle">W = ${d.toFixed(0)} nm (illustration)</text><text x="${260+W/2}" y="150">H</text><text x="42" y="75">SiO₂ cladding · finite Si core</text><text x="250" y="301" text-anchor="middle">H = 220 nm · conceptual only</text>`);
   $('#geometry-caption').textContent='Conceptual · 실제 Strip은 Width와 Height가 모두 유한합니다. 이 그림에서 2D Field나 n_eff를 계산하지 않습니다.';
   $('#mode-buttons').hidden=true;$('#notebook-readout').innerHTML='<p>아래 Slab 계산과 이 Strip 개념도를 구별하세요. 유한 H = 220 nm는 Slab 모델의 입력이 아닙니다.</p><p class="caption">Field Profile 또는 n_eff vs Width에서 y 방향이 무한한 별도 모델을 실험할 수 있습니다.</p>';
  }else{
   $('#mode-buttons').hidden=false;$('#notebook-plot').innerHTML=view==='dispersion'?dispersionPlot(d,index):fieldPlot(model,mode);
   $('#geometry-caption').textContent=view==='dispersion'?'Analytical Slab · 모든 허용된 TE Branch. 점선은 현재 Width이며 실제 Strip의 Cutoff 곡선이 아닙니다.':'Analytical Slab · Signed Ey / max|Ey|. Core 밖의 Tail도 해의 일부입니다. y 방향 무한, 유한 Height 없음.';
   $('#notebook-readout').innerHTML=`<p>허용된 Slab TE Mode <strong>${model.modes.length}개</strong> · 선택 TE${mode.m}</p><p>n_eff = <strong>${mode.neff.toFixed(4)}</strong> · Core Power ΓTE = <strong>${(mode.corePower*100).toFixed(1)}%</strong></p><p class="caption">V = ${model.V.toFixed(3)} · 내부 Node ${mode.m}개. ΓTE는 이 TE Slab의 축 방향 Power 비율입니다.</p>`;
  }
 }else if(l.id==='1.5'){
  const index=Math.round(num('radius',2,0,3)),p=P.designLedger(index),R=p.radius,scale=5,side=R*scale;
  $('#radius-value').textContent=R+' µm';$('#radius').setAttribute('aria-valuetext',R+' micrometers');
  const bounds=$('#radius').nextElementSibling;bounds.children[0].textContent='2 µm';bounds.children[1].textContent='20 µm';
  $('#notebook-plot').innerHTML=svg('One circular 90 degree bend and radius squared bounding square at a common scale',`<rect x="130" y="45" width="${side}" height="${side}" fill="var(--soft)" stroke="var(--line)"/><path d="M130 ${45+side} A${side} ${side} 0 0 0 ${130+side} 45" fill="none" stroke="var(--plot)" stroke-width="5"/><path d="M130 45 V${45+side} M130 45 H${130+side}" stroke="var(--muted)" stroke-dasharray="4 3"/><text x="275" y="75">R = ${R} µm</text><text x="275" y="108">R² = ${R*R} µm²</text><text x="275" y="141">one 90° corner</text><text x="35" y="205">One corner · fixed scale</text>`, '0 0 500 225');
  $('#notebook-readout').innerHTML=`<p>Propagation <strong>${p.propagationDb.toFixed(3)} dB</strong> + Bend <strong>${p.bendsDb.toFixed(3)} dB</strong></p><p>Total <strong>${p.totalDb.toFixed(3)} dB</strong> → Power <strong>${(p.transmission*100).toFixed(1)}%</strong></p><p class="caption">${p.footprint<=100?'공간 ≤ 100 µm² 조건 만족':'공간 100 µm² 조건 초과'} · ${p.totalDb<=.8?'Loss ≤ 0.8 dB 조건 만족':'Loss 0.8 dB 조건 초과'}</p>`;
  $('#ledger-table').innerHTML=`<table><caption class="caption">가정한 Bend 데이터 · 단위: R [µm], Loss [dB], A [µm²]</caption><thead><tr><th scope="col">R</th><th scope="col">Prop.</th><th scope="col">Bend</th><th scope="col">Total</th><th scope="col">A</th></tr></thead><tbody>${P.bendTable.map((_,i)=>{const p=P.designLedger(i);return `<tr ${i===index?'style="background:var(--soft)"':''}><th scope="row">${p.radius}</th><td>${p.propagationDb.toFixed(3)}</td><td>${p.bendsDb.toFixed(3)}</td><td>${p.totalDb.toFixed(3)}</td><td>${p.footprint}</td></tr>`;}).join('')}</tbody></table><p class="caption">한 코너 A ≤ 100, Total ≤ 0.8. 전체 Route 길이는 선택에 따라 ${p.lengthCm.toFixed(5)} cm이며, 표의 Bend 항은 그 경로의 Propagation 이외의 추가 손실입니다.</p>`;
 }
}
function showSession(){remember();$('#session-content').innerHTML=(storageOK?'':'<p role="status">이 Browser에서 자동 저장할 수 없습니다. 기록 내보내기로 백업해 주세요.</p>')+lessons.map(l=>`<div class="session-item"><span>${l.id} · ${l.short}</span><span>${state.completed.includes(l.id)?'읽음으로 기록':'자유롭게 학습 중'}</span></div>`).join('');$('#session-dialog').showModal();}
$('#lesson-nav').addEventListener('click',e=>navigateClick(e));
$('#reading').addEventListener('click',e=>{
 const a=e.target.closest('[data-answer]'),extra=e.target.closest('[data-extra]');
 if(a){state.answers[state.lesson]=Number(a.dataset.answer);renderTutor();save();}
 if(extra){state.extras[state.lesson]=extra.dataset.extra;renderTutor();save();if(extra.dataset.extra==='notebook'&&matchMedia('(max-width:760px)').matches)$('#notebook').scrollIntoView();}
 if(e.target.closest('[data-lesson]'))navigateClick(e);
 if(e.target.closest('#mark-read')){const i=state.completed.indexOf(state.lesson);if(i<0)state.completed.push(state.lesson);else state.completed.splice(i,1);const b=$('#mark-read');b.setAttribute('aria-pressed',String(i<0));b.textContent=i<0?'읽음 기록됨 · 취소':'이 Lesson 읽음으로 기록';save();}
 if(e.target.closest('#compare-prediction'))$('#prediction-feedback').textContent=current().predictionFeedback;
});
function navigateClick(e){const b=e.target.closest('[data-lesson]');if(!b)return;remember();state.lesson=b.dataset.lesson;save();renderLesson(true);$('#lesson-nav [aria-current]').scrollIntoView({block:'nearest',inline:'nearest'});}
$('#reading').addEventListener('input',e=>{if(e.target.dataset.note){state.notes[state.lesson+':'+e.target.dataset.note]=e.target.value.slice(0,12000);save();}});
$('#reading').addEventListener('change',e=>{if(e.target.id==='prediction'){state.predictions[state.lesson]=Number(e.target.value);$('#prediction-feedback').textContent='';save();}});
$('#notebook').addEventListener('input',e=>{if(e.target.dataset.setting){settings()[e.target.dataset.setting]=Number(e.target.value);updateNotebook();TeachingFigures.refresh($('#reading'),settings());save();}});
$('#notebook').addEventListener('change',e=>{if(e.target.dataset.selectSetting){settings()[e.target.dataset.selectSetting]=e.target.value;updateNotebook();TeachingFigures.refresh($('#reading'),settings());save();}});
$('#notebook').addEventListener('click',e=>{const ch2=e.target.closest('[data-ch2-view]');if(ch2){settings().ch2View=Number(ch2.dataset.ch2View);renderNotebook();save();}const b=e.target.closest('[data-view]');if(b){settings().view=b.dataset.view;renderNotebook();save();}const f=e.target.closest('[data-field]');if(f){settings().field=f.dataset.field;updateNotebook();TeachingFigures.refresh($('#reading'),settings());save();}const m=e.target.closest('[data-mode]');if(m){settings().mode=Number(m.dataset.mode);updateNotebook();TeachingFigures.refresh($('#reading'),settings());save();}});
function onScroll(){if(navigating)return;clearTimeout(scrollTimer);scrollTimer=setTimeout(remember,250);}
$('#reading').addEventListener('scroll',onScroll,{passive:true});window.addEventListener('scroll',onScroll,{passive:true});window.addEventListener('pagehide',remember);
matchMedia('(max-width:760px)').addEventListener('change',()=>{placeNotebook();setupObserver();});
$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';setTheme();save();};
$('.brand').onclick=e=>{e.preventDefault();remember();state.lesson=lessons[0].id;state.positions[state.lesson]=0;save();renderLesson(true);};
$('#session').onclick=showSession;$('#close-session').onclick=()=>$('#session-dialog').close();
$('#export').onclick=()=>{remember();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=TEXTBOOK.multiChapter?'silicon-photonics-study-record.json':'silicon-photonics-ch1-study-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('#import').onchange=async e=>{$('#import-status').textContent='불러오는 중…';try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error('1 MB 이하의 학습 기록을 선택해 주세요.');const clean=validate(JSON.parse(await file.text()));state=clean;setTheme();save();renderLesson();$('#import-status').textContent='학습 기록을 불러왔습니다.';}catch(err){$('#import-status').textContent='가져오지 못했습니다. '+err.message;}e.target.value='';};
TeachingFigures.bind({get:()=>settings(),set:(k,v)=>{settings()[k]=v;save();}});
setTheme();renderLesson();save();
})();
</script>
</body>
