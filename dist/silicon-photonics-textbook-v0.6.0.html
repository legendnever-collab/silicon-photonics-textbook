  <script>window.TEXTBOOK={"lessons":[{"id":"1.1","short":"Confinement","title":"Why Does Light Stay in a Waveguide?","time":"7–9분","lead":"빛을 가둔다는 말을 재료의 성질에서 시작해 Wave의 조건으로 다시 이해합니다.","question":"Silicon의 Refractive Index가 SiO₂보다 높다는 것이 빛의 진행에 왜 중요할까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"빛이 지나갈 길을 만드는 일","scene":"tir","html":"\u003cp>전자 회로의 Metal Wire가 전류의 경로를 정하듯, Photonic Circuit에는 빛을 원하는 위치까지 전달하는 길이 필요합니다. 그 길이 \u003cstrong>Optical Waveguide\u003c/strong>입니다. 하지만 투명한 재료로 가느다란 선을 만든다고 항상 빛이 그 안에 머무르지는 않습니다. 주변 재료와 어떤 차이가 있는지가 중요합니다.\u003c/p>\u003cp>이번 Chapter에서는 익숙한 Silicon Core와 SiO₂ Cladding을 예로 사용합니다. 먼저 ‘빛이 반사되어 남는다’는 직관을 얻고, 그 직관만으로 설명할 수 없는 공간적 Field Distribution까지 살펴봅니다. 오른쪽 Notebook의 그림은 실제 빛의 궤적을 추적한 결과가 아니라, 경계에서의 방향을 설명하는 \u003cstrong>Conceptual\u003c/strong> 그림입니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Core와 Cladding은 함께 Waveguide를 이룹니다","scene":"tir","html":"\u003cp>\u003cstrong>Refractive Index n\u003c/strong>은 균일하고 투명한 물질에서 Wave의 Phase가 진공보다 얼마나 느리게 진행하는지 나타내는 무차원 수입니다. n이 크면 같은 Frequency에서 Wavelength가 짧아집니다. ‘빛이 느려진다’는 표현은 여기서는 Phase Velocity를 뜻합니다. Pulse가 전달되는 속도와는 구별해야 합니다.\u003c/p>\u003cp>1550 nm 부근을 설명하기 위해 이 교재는 Silicon에 n = 3.48, SiO₂에 n = 1.444라는 고정된 예시 값을 사용합니다. 재료 상수가 모든 파장과 온도에서 같다는 뜻은 아닙니다. 높은 n의 \u003cstrong>Core\u003c/strong>를 낮은 n의 \u003cstrong>Cladding\u003c/strong>이 둘러싸면, 경계에서 특정 조건을 만족하는 빛은 바깥으로 진행하는 굴절파를 만들지 않고 반사될 수 있습니다. 이것이 \u003cstrong>Total Internal Reflection, TIR\u003c/strong>의 출발점입니다.\u003c/p>\u003cp>입사각 θ는 경계면 자체가 아니라 \u003cstrong>경계면에 수직인 Normal\u003c/strong>에서 잽니다. Core에서 Cladding으로 갈 때 θ가 Critical Angle보다 커지면, Cladding 쪽에 멀리까지 진행하는 굴절파가 생기지 않습니다. 그렇다고 바깥의 Electric Field가 갑자기 0이 되지는 않습니다. 경계 근처에는 거리에 따라 감소하는 \u003cstrong>Evanescent Field\u003c/strong>가 남습니다.\u003c/p>\u003cp>따라서 Optical Confinement는 ‘빛이 Core에 100% 들어 있다’는 뜻이 아닙니다. Field가 Core 부근에 국소화되어 있으며, Waveguide 축 방향으로 에너지를 전달하는 상태를 뜻합니다. Cladding의 Field는 나중에 Coupling과 Sensing을 가능하게 하는 중요한 성분입니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"TIR이 시작되는 조건을 계산해 봅니다","scene":"tir","html":"\u003cdiv class='equation'>n₁ sin θ₁ = n₂ sin θ₂\u003cbr>θ\u003csub>c\u003c/sub> = sin⁻¹(n₂ / n₁)\u003cspan class='caption'>[R1, R2] 평탄한 두 유전체 경계에서 Snell’s Law. n₁ &gt; n₂이고 높은 n 쪽에서 입사할 때만 Critical Angle이 정의됩니다.\u003c/span>\u003c/div>\u003cdl class='terms'>\u003cdt>n₁, n₂\u003c/dt>\u003cdd>Core와 Cladding의 Refractive Index · 무차원\u003c/dd>\u003cdt>θ₁, θ₂\u003c/dt>\u003cdd>각 영역의 Normal 기준 각도 · ° 또는 rad, 계산 중 단위를 일관되게 사용\u003c/dd>\u003cdt>θc\u003c/dt>\u003cdd>굴절각 θ₂가 90°가 되는 임계 입사각 · θ₁ &gt; θc에서 TIR\u003c/dd>\u003c/dl>\u003cdiv class='worked'>\u003ch3>Worked Example · Silicon / SiO₂\u003c/h3>\u003cp>n₁ = 3.48, n₂ = 1.444이면 sin θc = 1.444 / 3.48 ≈ 0.415입니다. 따라서 θc ≈ \u003cstrong>24.5°\u003c/strong>입니다. Normal 기준 입사각이 45°인 광선은 이 이상적인 경계에서 TIR 조건을 만족합니다. 15°이면 만족하지 않습니다.\u003c/p>\u003cp>이 계산이 알려 주는 것은 \u003cem>한 경계에서의 광선 조건\u003c/em>입니다. Width가 얼마인 Waveguide가 몇 개의 Mode를 갖는지는 아직 알 수 없습니다. 마주 보는 경계에서 반사된 Wave들이 서로 맞는 Phase를 가져야 하기 때문입니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Phase Velocity를 수식으로 보면\u003c/summary>\u003cdiv class='equation'>n = c / v\u003csub>ph\u003c/sub>\u003cbr>λ\u003csub>material\u003c/sub> = λ₀ / n\u003cspan class='caption'>균일·선형·등방성·투명한 매질의 단색 Plane Wave. c: 진공 광속 [m/s], vph: Phase Velocity [m/s], λ: Wavelength [m]. 흡수와 Dispersion은 여기서 생략합니다.\u003c/span>\u003c/div>\u003cp>λ₀ = 1550 nm일 때 균일한 Silicon 안의 Wavelength는 약 445 nm입니다. 실제 Waveguide 축 방향의 Guided Wavelength는 이 값과 다를 수 있으며 Lesson 1.3에서 다룹니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"반사된다면, 바깥에는 정말 아무것도 없을까요?","scene":"tir","html":"\u003cp>다음 질문에 답한 뒤 설명을 읽어 보세요. 선택은 학습을 막지 않으며 언제든 바꿀 수 있습니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"먼저 예측하고, 경계 조건을 확인합니다","scene":"tir","html":"\u003cp>Normal 기준 입사각을 15°에서 45°로 바꿀 때, Cladding에서 멀리 진행하는 굴절파는 어떻게 될까요? 먼저 예측을 남긴 뒤 Notebook에서 각도를 바꿔 보세요. Critical Angle을 지나면 Snell’s Law에서 sin θ₂가 1보다 커집니다. 이는 일반적인 실수 각도의 굴절파가 더 이상 존재하지 않는다는 뜻입니다.\u003c/p>\u003cp>경계에서의 Field는 여전히 존재합니다. \u003cstrong>TIR은 Mode를 이해하는 직관이지만, Guided Mode의 완전한 정의는 아닙니다.\u003c/strong> 실제 Guided Mode는 Maxwell 방정식과 모든 경계조건을 동시에 만족하는 전자기 고유해입니다. 단면에서 허용된 Field Pattern만이 자기 자신을 유지하며 전파할 수 있습니다. 이 조건을 다음 Lesson에서 살펴봅니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"재료의 차이에서 Wave의 조건으로","scene":"tir","html":"\u003cul>\u003cli>Core보다 낮은 n의 Cladding은 Index Guiding의 기반입니다. 높은 n 하나만으로 충분하지 않습니다.\u003c/li>\u003cli>TIR에서는 바깥으로 진행하는 굴절파가 없어도 Evanescent Field가 남습니다.\u003c/li>\u003cli>Waveguide가 허용하는 상태는 전체 경계조건을 만족하는 Guided Mode입니다.\u003c/li>\u003c/ul>\u003cp>다음에는 ‘어떤 빛이 허용되는가’를 공간적인 Field Pattern으로 읽어 보겠습니다.\u003c/p>"}],"prediction":"Normal 기준 입사각을 15°에서 45°로 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","굴절파가 멀리 전파하지 못하는 TIR 조건이 된다","n이 그대로이므로 아무 변화가 없다","Cladding의 Field가 모든 곳에서 정확히 0이 된다"],"predictionFeedback":"24.5°보다 큰 입사각에서 TIR 조건이 됩니다. Cladding의 Evanescent Field와 멀리 전파하는 굴절파를 구별해 보세요.","reflection":"TIR과 Guided Mode는 어떤 점이 연결되고, 어떤 점이 다를까요? 자신의 말로 설명해 보세요.","sources":["R1","R2"],"tutor":{"question":"이상적인 Silicon / SiO₂ 경계에서 TIR이 일어났습니다. Cladding의 Field를 어떻게 설명해야 할까요?","choices":[{"text":"에너지가 밖으로 굴절되지 않으므로 Cladding의 Field도 전부 0이다.","feedback":"멀리 진행하는 굴절파가 없다는 것과 Field가 없다는 것은 다릅니다. 경계조건 때문에 Cladding에도 Field가 이어지며, 경계에서 멀어질수록 지수적으로 감소합니다. 이 성분이 Evanescent Field입니다.","concept":"전파하는 굴절파와 Evanescent Field의 혼동"},{"text":"Cladding에 감쇠하는 Field가 남으며, 이상적인 경계에 수직인 평균 에너지 유출은 없다.","feedback":"맞습니다. Evanescent Field는 존재하지만 이 이상적 단일 경계에서는 바깥쪽으로 순수하게 전달되는 시간 평균 Power가 없습니다. Waveguide에서는 그 Field도 축 방향 전파의 일부입니다. 가까이에 다른 Core가 있으면 Coupling이 가능해집니다.","concept":"Field와 Power Flow 구별","correct":true},{"text":"nCore가 높으므로 어떤 각도와 어떤 Width에서도 모든 빛이 완전히 갇힌다.","feedback":"nCore > nCladding은 출발 조건입니다. 광선의 TIR에는 입사각 조건이, Guided Mode에는 전체 경계의 Phase와 Field 연속 조건이 추가됩니다. 모든 입력 Field가 임의로 유지되는 것은 아닙니다.","concept":"Index Contrast만으로 모든 전파를 보장한다는 오개념"}],"why":"경계에서 접선 방향 Electric Field와 Magnetic Field가 연속이어야 합니다. Core의 Field가 경계에서 일반적으로 0이 아니므로 Cladding에서도 이어집니다. TIR 조건에서는 그 해가 바깥쪽으로 진동하며 진행하는 대신 감쇠하는 형태가 됩니다.","simple":"벽에 부딪힌 공처럼 빛이 완전히 경계 안쪽에만 있는 것은 아닙니다. 바깥까지 약하게 펼쳐진 Wave가 Core 근처에 묶여 함께 앞으로 간다고 생각해 보세요. 단, 이 비유가 Maxwell의 경계조건을 대신하지는 않습니다.","math":"Cladding에서 축 방향 β가 nClad k₀보다 크면, 횡 방향 파수의 제곱 nClad²k₀² − β²는 음수입니다. 따라서 횡 방향 해는 진동 함수가 아닌 exp(−q x) 꼴이며 q = √(β² − nClad²k₀²) > 0입니다. x는 경계 바깥 방향 거리이고 q의 단위는 1/m입니다.","notebook":"Notebook에서 15°, 24.5° 부근, 45°를 차례로 비교하세요. 그림은 광선 직관이며, 각도와 TIR 판정만 Snell’s Law로 계산합니다. 반사율이나 Evanescent Field 크기를 그림의 선 굵기로 읽지 마세요."}},{"id":"1.2","short":"Optical Modes","title":"What Is an Optical Mode?","time":"6–8분","lead":"같은 Waveguide도 빛을 여러 공간적 형태로 전달할 수 있습니다. Mode는 그중 허용된 형태입니다.","question":"같은 색의 빛이라도, 단면에서 다른 모양으로 전파할 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"빛의 경로만 알아서는 부족합니다","scene":"modes","html":"\u003cp>Lesson 1.1에서는 높은 n의 Core와 낮은 n의 Cladding이 빛을 국소화할 수 있음을 배웠습니다. 이제 같은 Waveguide에 빛을 넣어도 입력의 모양에 따라 다른 결과가 생기는 이유를 생각해 보겠습니다. 어떤 입력은 하나의 안정된 Field Pattern으로 전달되고, 어떤 입력은 여러 Pattern이 섞여 전파합니다.\u003c/p>\u003cp>\u003cstrong>Optical Mode\u003c/strong>를 알면 Coupling할 때 왜 위치와 Polarization을 맞춰야 하는지, Width가 커질 때 왜 단순히 빛의 통로만 넓어지는 것이 아닌지 이해할 수 있습니다. Mode는 빛 한 개의 이동 경로나 주파수의 별명이 아닙니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"전파하면서 자기 모양을 유지하는 Field Pattern","scene":"modes","html":"\u003cp>단면과 재료가 z 방향으로 일정한 이상적인 Waveguide를 생각해 봅니다. 특정 Frequency에서 Maxwell 방정식과 경계조건을 만족하는 Field가 있다면, 그 Field는 z 방향으로 나아가며 전체에 같은 Phase Factor를 곱하는 방식으로 표현될 수 있습니다. 단면의 상대적인 분포는 유지됩니다. 이것이 여기서 말하는 Guided Mode입니다.\u003c/p>\u003cp>가장 낮은 차수의 \u003cstrong>Fundamental Mode\u003c/strong>는 단순한 대칭 Slab에서 내부 Node가 없는 형태입니다. \u003cstrong>Higher-order Mode\u003c/strong>에는 Field가 0을 통과하며 부호가 바뀌는 Node가 생깁니다. 부호가 음수라고 음의 Power가 흐른다는 뜻은 아닙니다. 단색 실수 기준 Field의 부호 차이는 같은 순간에 반대 위상으로 진동함을 나타냅니다.\u003c/p>\u003cp>\u003cstrong>Mode Profile\u003c/strong>을 볼 때는 색이 무엇을 나타내는지 먼저 확인해야 합니다. Electric Field E의 한 성분인지, |E|²인지, 시간 평균 Poynting Vector인지에 따라 의미가 다릅니다. Notebook은 1D Slab의 \u003cstrong>Ey/max|Ey|\u003c/strong>와 그 제곱을 번갈아 보여 줍니다. Slab TE에서는 축 방향 Power Density가 |Ey|²에 비례하지만 일반적인 2D Vector Field의 임의 성분 하나에 같은 해석을 적용할 수는 없습니다.\u003c/p>\u003cdiv data-notebook-scene=\"polarization\">\u003cp>\u003cstrong>TE\u003c/strong>는 전파 축 z에 대한 Electric Field의 종방향 성분 Ez가 0인 경우, \u003cstrong>TM\u003c/strong>은 Hz가 0인 경우를 뜻합니다. y 방향으로 무한한 Slab에서는 이 분리가 정확히 가능합니다. 이 Notebook의 Slab은 x 방향으로만 제한되며 E가 y 방향인 TE 해를 계산합니다.\u003c/p>\u003cp>반면 실제 Silicon Strip은 x 방향 Width와 y 방향 Height가 모두 유한합니다. 일반적으로 전기장과 자기장의 여러 성분이 섞인 Hybrid Mode가 됩니다. Chip 면을 x–z, 높이를 y로 정의하면 주된 Electric Field가 Chip 면 안에 있는 것을 보통 \u003cstrong>Quasi-TE\u003c/strong>, 주로 수직인 것을 \u003cstrong>Quasi-TM\u003c/strong>이라고 부릅니다. 정확한 정의는 축과 Solver Convention을 함께 확인해야 합니다. Notebook의 Polarization 그림은 이 차이를 보여 주는 Conceptual Illustration입니다.\u003c/p>\u003c/div>"},{"key":"equation","label":"C · Understand the equation","title":"공간 분포와 전파하는 Phase를 분리합니다","scene":"modes","html":"\u003cdiv class='equation'>E(x,y,z,t) = Re{e(x,y) e\u003csup>i(βz − ωt)\u003c/sup>}\u003cspan class='caption'>[R1, R3] 단색·선형·z 불변 Waveguide의 단일 Mode. e: 복소 Field Profile [V/m], β: Propagation Constant [rad/m], z: 거리 [m], ω: Angular Frequency [rad/s], t: 시간 [s].\u003c/span>\u003c/div>\u003cp>e(x,y)는 단면에서의 형태를, 지수 함수는 위치와 시간에 따른 공통 Phase를 나타냅니다. 여기서는 lossless Guided Mode를 다루므로 β를 실수로 둡니다. 실제 손실 구조에서는 진폭의 감쇠도 포함해야 합니다. 여러 Mode를 동시에 여기하면 이 식 하나가 아니라 Mode별 항의 합이 되며, 서로 다른 β 때문에 총 Field Pattern이 z에 따라 달라질 수 있습니다.\u003c/p>\u003cdiv class='worked'>\u003ch3>Worked Example · Field의 부호와 제곱\u003c/h3>\u003cp>어떤 정규화된 Mode에서 두 위치의 Ey가 +0.5와 −0.5라고 합시다. 제곱은 두 곳 모두 0.25입니다. 즉 |Ey|² 그림만으로는 두 곳이 반대 위상이라는 사실을 읽을 수 없습니다. 가운데 Ey = 0인 Node가 있으면 제곱에서도 0이지만, 양·음 Lobe는 모두 양수로 보입니다.\u003c/p>\u003cp>Notebook에서 Width 500 nm, TE₁을 고른 뒤 ‘Signed Field’와 ‘Field²’를 비교하세요. 이 Mode의 중심은 Node입니다. TE₀로 바꾸면 중심에서 가장 큰 같은 부호의 Lobe가 보입니다. 이 차이는 임의로 그린 Gaussian의 개수를 늘려 만든 결과가 아니라 Slab 경계조건을 푼 해입니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>왜 허용된 Mode만 생길까요?\u003c/summary>\u003cp>Core 내부에는 진동하는 해, Cladding에는 감소하는 해가 필요합니다. 양쪽 경계에서 Ey와 그 미분을 함께 맞추려면 임의의 횡 방향 파수가 허용되지 않습니다. 이 동시 조건을 만족하는 값이 Eigenvalue이고, 그 값에 대응하는 Field가 Eigenmode입니다. 수학적으로는 미분 방정식에 경계조건을 부여했기 때문에 생기는 선택입니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"Mode의 개수와 실제 여기되는 빛을 구별합니다","scene":"modes","html":"\u003cp>어떤 Waveguide가 TE₀와 TE₁을 모두 지원한다고 합시다. 그것이 입력과 무관하게 두 Mode에 같은 Power를 넣는다는 뜻일까요?\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"같은 단면에서 서로 다른 허용된 형태를 비교합니다","scene":"modes","html":"\u003cp>Notebook은 nCore = 3.48, nClad = 1.444, λ₀ = 1550 nm인 대칭 Slab을 사용합니다. Width 500 nm에서는 TE₀, TE₁, TE₂가 허용됩니다. Mode를 바꾸어 Node와 Cladding Tail을 비교하고, Signed Field와 Field²의 차이를 관찰하세요.\u003c/p>\u003cp>각 Mode는 보기 쉽게 최대 진폭을 1로 정규화합니다. 따라서 두 그래프의 높이가 같아도 실제 Power가 같다는 뜻은 아닙니다. ‘허용된다’는 것은 가능한 해의 존재이며, 실제로 어떤 Mode에 얼마나 들어가는지는 입력 Field와 Mode의 Overlap에 달려 있습니다. 여기서는 그 Coupling Power를 계산하지 않습니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"모양, Phase, Polarization을 구별해서 읽습니다","scene":"modes","html":"\u003cul>\u003cli>Mode는 전체 경계조건을 만족하며 전파하는 허용된 Field Pattern입니다.\u003c/li>\u003cli>Field의 부호는 Phase 정보입니다. |E|²에는 이 부호가 남지 않습니다.\u003c/li>\u003cli>Slab의 TE/TM과 실제 Strip의 Quasi-TE/Quasi-TM을 구별해야 합니다.\u003c/li>\u003c/ul>\u003cp>허용된 Mode들은 모양뿐 아니라 z 방향의 Phase 변화율도 다릅니다. 다음 Lesson에서 그 변화율을 n_eff로 표현합니다.\u003c/p>"}],"prediction":"TE₁의 Signed Field를 제곱해서 보면 무엇이 사라질까요?","predictionOptions":["먼저 예측을 선택하세요","Field의 양·음 부호 정보가 사라진다","Node가 전부 사라진다","Mode가 Fundamental Mode로 바뀐다"],"predictionFeedback":"제곱하면 부호 정보는 없어지지만 Node는 남습니다. Mode 자체가 바뀌지는 않습니다. 표시하는 물리량이 달라진 것입니다.","reflection":"Mode가 허용된다는 것과 그 Mode가 실제로 여기된다는 것은 어떻게 다를까요?","sources":["R1","R2","R3"],"tutor":{"question":"Waveguide가 TE₀와 TE₁을 지원한다면, 실제 전파 상태에 대해 무엇을 알 수 있을까요?","choices":[{"text":"두 Mode가 반드시 같은 Power로 동시에 전파한다.","feedback":"지원하는 Mode의 수는 가능한 해의 수입니다. 입력 Field의 공간 분포와 Polarization이 각 Mode에 얼마나 겹치는지에 따라 여기되는 Power가 달라집니다. 존재 조건과 여기 조건을 구분해야 합니다.","concept":"Supported Mode와 Excited Mode의 혼동"},{"text":"두 형태가 허용되며, 실제 여기 비율은 입력 Field에 달려 있다.","feedback":"그렇습니다. Mode는 Waveguide가 허용하는 해이고, 입력은 그중 어떤 조합을 만들지 정합니다. 한 Mode만 여기하면 단면의 상대 분포가 유지되지만 여러 Mode의 합은 서로 다른 β 때문에 진행하며 간섭할 수 있습니다.","concept":"Eigenmode와 입력 Overlap 구별","correct":true},{"text":"TE₁의 음수 Field 영역에서는 Power가 뒤로 흐른다.","feedback":"Signed Field의 음수는 같은 기준 순간의 위상 반전을 뜻합니다. 이 Slab의 +z 전파 TE Mode에서 축 방향 평균 Power Density는 |Ey|²에 비례하므로 Field 부호가 바뀐다고 뒤로 흐르지 않습니다.","concept":"Field 부호와 에너지 방향의 혼동"}],"why":"가능한 진동 형태와 실제로 만들어진 진동은 다릅니다. 입력 Field를 허용된 Mode들의 합으로 분해할 때 계수는 각각의 Overlap으로 정해집니다. Mode가 3개 존재해도 대칭과 정렬 때문에 특정 Mode만 여기될 수 있습니다.","simple":"줄이 낼 수 있는 여러 진동 형태와 실제 손으로 만든 진동을 구별해 보세요. 가능한 형태가 여러 개라고 항상 모든 형태가 같은 세기로 섞이는 것은 아닙니다. Waveguide도 입력 모양이 중요합니다.","math":"E = Σ aₘ eₘ exp[i(βₘz − ωt)]로 씁니다. eₘ은 각 Mode의 Profile이고 aₘ은 여기 계수입니다. 서로 다른 βₘ의 Phase 차이가 z에 따라 달라집니다. 정규화 방식과 전체 Vector Field에 맞는 Overlap 적분이 필요하며, 이 Notebook은 aₘ을 계산하지 않습니다.","notebook":"TE₀와 TE₁을 비교해 Node를 찾아 보세요. Field²로 바꾸면 양·음 Lobe가 모두 양수가 됩니다. Polarization 개념도에서는 유한한 Width/Height와 주된 Field 방향을 확인하세요. 그 그림은 2D Mode Solver 결과가 아닙니다."}},{"id":"1.3","short":"Effective Index","title":"Understanding Effective Index","time":"6–9분","lead":"단면의 Mode가 앞으로 진행할 때, 단위 길이당 Phase가 얼마나 변하는지 수식으로 읽습니다.","question":"동일한 재료로 만든 두 Waveguide의 Phase가 서로 다르게 쌓일 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"간섭을 설계하려면 Phase를 알아야 합니다","scene":"phase","html":"\u003cp>같은 Laser의 빛을 두 경로로 나눴다가 합치면 두 Wave의 Phase 차이에 따라 밝기가 달라집니다. 두 경로가 모두 Silicon이어도 길이나 단면이 다르면 Phase가 다르게 쌓일 수 있습니다. 이것이 나중에 MZI와 MZM을 이해하는 출발점입니다.\u003c/p>\u003cp>단면에서 Field가 어떻게 분포하는지는 Lesson 1.2에서 배웠습니다. 이제 그 Mode가 z 방향으로 얼마나 빠르게 Phase를 누적하는지를 나타낼 숫자가 필요합니다. 그 숫자가 \u003cstrong>Propagation Constant β\u003c/strong>이고, 이를 익숙한 굴절률 형태로 표현한 것이 \u003cstrong>Effective Index n_eff\u003c/strong>입니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"n_eff는 재료 상수가 아니라 Mode의 성질입니다","scene":"phase","html":"\u003cp>단일 Mode의 Phase Factor는 exp[i(βz − ωt)]입니다. 같은 순간 두 위치를 비교하면 z가 L만큼 증가할 때 Phase는 βL만큼 달라집니다. β는 거리 1에 대응하는 Phase 변화량이므로 단위는 rad/m입니다. 실무에서는 rad/µm도 자주 사용합니다.\u003c/p>\u003cp>진공에서의 파수 \u003cstrong>k₀ = 2π/λ₀\u003c/strong>와 비교하여 n_eff = β/k₀라고 정의합니다. 따라서 n_eff는 ‘이 Mode의 축 방향 Phase 변화율이 진공 Plane Wave의 몇 배인가’를 나타냅니다. 같은 재료라도 Width, Height, Cladding, Wavelength와 Mode가 바뀌면 경계조건의 해가 달라지고 n_eff도 달라집니다.\u003c/p>\u003cp>보통의 lossless Index-guided 유전체 구조에서는 Guided Mode의 n_eff가 Cladding 쪽 최대 n과 Core n 사이에 있습니다. 이것을 보고 Core와 Cladding의 굴절률을 단순 평균한 값이라고 해석하면 안 됩니다. n_eff는 공간적인 Power 비율만으로 정해지는 평균이 아니라 경계조건의 Eigenvalue β를 다시 표현한 것입니다.\u003c/p>\u003cp>또한 c/n_eff는 이 Mode의 \u003cstrong>Phase Velocity\u003c/strong>입니다. 짧은 Pulse의 도달 시간에는 Frequency에 따른 β의 변화, 즉 Group Velocity가 필요합니다. n_eff 하나만 알고 모든 Pulse Delay를 계산할 수는 없습니다. 이번 Notebook은 단색 Phase를 다룹니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Wavelength, β, Phase를 같은 단위로 연결합니다","scene":"phase","html":"\u003cdiv class='equation'>n\u003csub>eff\u003c/sub> = β / k₀\u003cbr>β = 2πn\u003csub>eff\u003c/sub> / λ₀\u003cbr>φ = βL\u003cbr>λ\u003csub>g\u003c/sub> = 2π/β = λ₀/n\u003csub>eff\u003c/sub>\u003cspan class='caption'>[R3, R4] 단색·균일 단면·단일 Mode·실수 β. φ는 z = 0에서 L까지의 Phase 누적량이며 기준 Phase는 생략합니다. λg는 축 방향의 Guided Wavelength입니다.\u003c/span>\u003c/div>\u003cdl class='terms'>\u003cdt>λ₀, λg, L\u003c/dt>\u003cdd>Free-space / Guided Wavelength와 전파 길이 · 같은 길이 단위 사용\u003c/dd>\u003cdt>k₀, β\u003c/dt>\u003cdd>진공 파수와 축 방향 Propagation Constant · rad/m 또는 rad/µm\u003c/dd>\u003cdt>φ, n_eff\u003c/dt>\u003cdd>Phase [rad], Effective Index [무차원]\u003c/dd>\u003c/dl>\u003cdiv class='worked'>\u003ch3>Worked Example · 10 µm를 진행한 Mode\u003c/h3>\u003cp>λ₀ = 1550 nm = 1.55 µm, \u003cem>가정한\u003c/em> n_eff = 2.40, L = 10 µm입니다. 이 n_eff는 특정 Strip 단면을 새로 풀어 얻은 값이 아닙니다.\u003c/p>\u003cp>① β = 2π × 2.40 / 1.55 ≈ \u003cstrong>9.729 rad/µm\u003c/strong>\u003cbr>② φ = 9.729 × 10 ≈ \u003cstrong>97.288 rad\u003c/strong>\u003cbr>③ λg = 1.55 / 2.40 ≈ \u003cstrong>0.646 µm\u003c/strong>\u003cbr>④ φ/(2π) ≈ \u003cstrong>15.484 cycles\u003c/strong>\u003c/p>\u003cp>빛이 10 µm 가는 동안 축 방향 Phase가 약 15.48번 회전했다는 뜻입니다. 97 rad가 크다고 Power가 커지는 것은 아닙니다. 길이를 두 배로 하면 이 가정 아래에서는 누적 Phase도 두 배가 됩니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>왜 2π로 나눈 나머지도 보나요?\u003c/summary>\u003cp>Phase가 2π만큼 달라지면 단색 Wave의 같은 진동 상태로 돌아옵니다. 두 경로를 비교할 때는 전체 Optical Path 변화도 중요하지만, 합친 순간의 상대 Phase는 2π를 기준으로 반복됩니다. Notebook의 원은 φ mod 2π를 보여 주고 전체 Cycle 수는 따로 표시합니다. 원의 화살표는 실제 광속으로 움직이는 Animation이 아닙니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"n_eff가 커진다는 말을 정확하게 해석합니다","scene":"phase","html":"\u003cp>같은 λ₀와 같은 길이에서 n_eff가 커졌습니다. 이 변화로 확실히 말할 수 있는 것은 무엇일까요?\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"길이가 아니라 Phase를 예측합니다","scene":"phase","html":"\u003cp>먼저 L을 10 µm에서 20 µm로 늘릴 때 β와 φ가 각각 어떻게 될지 예측하세요. Notebook에서 길이를 바꾸고 계산 과정을 확인합니다. 다음으로 길이를 고정하고 가정한 n_eff를 바꾸어 보세요. β가 바뀌고 Guided Wavelength가 줄어드는지 확인할 수 있습니다.\u003c/p>\u003cp>응용으로 두 경로의 n_eff 차이가 0.01이고 공통 길이가 10 µm라면, Δφ = (2π/1.55) × 0.01 × 10 ≈ \u003cstrong>0.405 rad\u003c/strong>입니다. 작아 보이는 Δn_eff도 충분한 길이에서 의미 있는 Phase Difference가 됩니다. MZM은 전압으로 이런 차이를 조절해 간섭 출력을 바꾸지만, 이번 Chapter에서는 그 능동 소자를 구현하지 않습니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"n_eff는 단위 길이당 Phase의 언어입니다","scene":"phase","html":"\u003cul>\u003cli>n_eff는 β를 k₀로 나눈 Mode의 성질이며 단순한 재료 평균이 아닙니다.\u003c/li>\u003cli>φ = βL이며, β를 rad/µm로 쓰면 L도 µm로 써야 합니다.\u003c/li>\u003cli>Guided Wavelength와 Free-space Wavelength, Phase Velocity와 Group Velocity를 구분합니다.\u003c/li>\u003c/ul>\u003cp>다음에는 단면 Geometry를 바꾸어 n_eff와 허용된 Mode의 수가 함께 달라지는 이유를 살펴봅니다.\u003c/p>"}],"prediction":"같은 n_eff와 λ₀에서 L을 10 → 20 µm로 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","β는 같고 φ는 두 배가 된다","β와 φ가 모두 두 배가 된다","n_eff가 길이에 비례해 증가한다"],"predictionFeedback":"β는 Mode와 Wavelength의 성질이므로 그대로입니다. 길이 L만 두 배가 되어 φ = βL이 두 배가 됩니다. Geometry와 재료가 z에 따라 변하는 경우에는 적분이 필요합니다.","reflection":"n_eff를 처음 배우는 동료에게 재료 굴절률과의 차이 및 Phase 계산에서의 역할을 설명해 보세요.","sources":["R3","R4"],"tutor":{"question":"같은 λ₀와 L에서 n_eff가 커졌습니다. 무엇을 확실히 말할 수 있을까요?","choices":[{"text":"축 방향 Phase 누적량이 커지고 Guided Wavelength가 짧아진다.","feedback":"맞습니다. β = 2πn_eff/λ₀이 커져 같은 L에서 φ가 더 크게 쌓입니다. λg = λ₀/n_eff는 짧아집니다. Power가 커지거나 Pulse가 반드시 더 늦게 도착한다고 이 정보만으로 결론 내릴 수는 없습니다.","correct":true,"concept":"축 방향 Phase 변화율"},{"text":"Core 안의 Power 비율을 알면 n_eff를 항상 가중평균으로 계산할 수 있다.","feedback":"n_eff는 경계조건을 만족하는 β에서 정의합니다. 단순한 Core/Cladding Power 가중평균 공식은 일반적으로 성립하지 않습니다. Notebook의 n_eff는 가정한 입력이며 어떤 Power 비율에서 추정한 값이 아닙니다.","concept":"Effective Index의 단순 평균 오개념"},{"text":"n_eff만으로 짧은 Pulse의 도달 시간을 정확하게 계산할 수 있다.","feedback":"단색 Phase와 Pulse Envelope의 전파는 다릅니다. Pulse에는 dβ/dω로 결정되는 Group Velocity가 필요합니다. β가 Frequency에 따라 어떻게 변하는지 모르면 n_eff 하나만으로 정확한 Group Delay를 구할 수 없습니다.","concept":"Phase와 Group Velocity의 혼동"}],"why":"동일한 L 안에 더 많은 Phase Cycle이 들어가면 축 방향 Wavelength는 짧아집니다. n_eff는 바로 그 변화율을 진공에 대한 비율로 표현합니다. 이 정의는 입력 Power를 필요로 하지 않습니다.","simple":"10 µm 길이에 물결 무늬가 몇 번 들어가는지 생각해 보세요. n_eff가 크면 같은 거리에 더 많은 주기가 들어갑니다. 이 ‘물결 간격’의 설명과 Pulse 전체가 이동하는 속도는 다른 질문입니다.","math":"φ = (2π/λ₀)n_eff L이므로 고정 λ₀, L에서 ∂φ/∂n_eff = 2πL/λ₀ > 0입니다. λg = λ₀/n_eff이므로 ∂λg/∂n_eff \u003c 0입니다. Group Index는 n_g = n_eff − λ₀(dn_eff/dλ₀)이며 이번 고정 입력 계산으로 그 미분은 얻을 수 없습니다.","notebook":"λ₀ = 1550 nm, L = 10 µm에서 n_eff를 2.40 → 2.60으로 바꾸세요. 전체 Cycle 수와 Phase 원을 함께 보세요. 원이 반복되어도 전체 누적 Phase는 계속 증가합니다. 이 입력은 실제 Strip Solver의 결과를 뜻하지 않습니다."}},{"id":"1.4","short":"Geometry & Light","title":"How Geometry Changes Light","time":"6–9분","lead":"재료를 그대로 두어도 단면이 바뀌면 허용된 Mode와 그 Phase 변화율이 함께 달라집니다.","question":"Waveguide를 넓히면 Fundamental Mode만 더 넓어질까요, 새로운 Mode도 생길까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Geometry는 단순한 배선 치수가 아닙니다","scene":"geometry","html":"\u003cp>같은 Silicon과 SiO₂로 만든 Waveguide라도 단면이 다르면 Field의 분포, n_eff, 허용된 Mode 수가 달라집니다. 따라서 Width와 Height를 정하는 일은 Layout의 공간을 채우는 작업만이 아니라 빛의 전파 상태를 선택하는 일입니다.\u003c/p>\u003cp>실제 Silicon Strip에서는 가로 \u003cstrong>Width W\u003c/strong>와 세로 \u003cstrong>Height H\u003c/strong>가 모두 영향을 줍니다. 이번 Lesson에서는 이 사실을 개념도로 먼저 확인하고, 정량 실험에는 한 방향만 제한하는 \u003cstrong>Symmetric Slab\u003c/strong>을 사용합니다. 계산이 단순해지는 대신 실제 Strip의 모든 성질을 대신하지는 못합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"크기가 변하면 경계조건을 만족하는 방법도 달라집니다","scene":"geometry","html":"\u003cp>Core가 매우 좁으면 Fundamental Mode의 Field가 상대적으로 Cladding에 많이 퍼집니다. 충분히 넓혀 주면 같은 Mode가 Core 내부에 더 잘 국소화될 수 있습니다. Notebook에서는 그 변화를 단면의 선폭이 아니라 \u003cstrong>Field Tail과 Core Power Fraction\u003c/strong>으로 확인합니다.\u003c/p>\u003cp>하지만 Width 증가의 효과는 Fundamental Mode 하나에만 나타나지 않습니다. 더 많은 횡 방향 진동이 경계 사이에서 허용되면서 Higher-order Mode가 생길 수 있습니다. 각 Mode가 Guided 상태로 존재하기 시작하는 경계가 \u003cstrong>Cutoff\u003c/strong>입니다. 단순한 대칭 Slab의 TE₀는 양의 Width에서 Cutoff 없이 존재하지만, 좁을수록 약하게 묶이고 Field가 멀리 퍼집니다. ‘존재한다’와 ‘공학적으로 충분히 잘 가둔다’는 같은 말이 아닙니다.\u003c/p>\u003cp>\u003cstrong>Single-mode\u003c/strong>라는 표현에는 조건이 필요합니다. 어떤 Wavelength, 재료, 단면, Polarization 계열에서 Mode를 세는지 밝혀야 합니다. Slab TE가 하나인 것은 이 모델의 TE 계열에 대한 말이며, TM을 포함한 모든 Polarization이나 실제 2D Strip이 Single-mode라는 주장이 아닙니다.\u003c/p>\u003cp>Silicon Strip의 Height를 바꾸면 수직 경계의 제약도 달라지므로 동일한 Width에서 n_eff와 Cutoff가 달라질 수 있습니다. 따라서 ‘Width 450 nm이면 언제나 Single-mode’처럼 외우지 않습니다. 실제 공정에서는 Sidewall Angle, Etch Depth, 상·하부 Cladding도 확인하고 적절한 Full-vector Mode Solver로 검증해야 합니다.\u003c/p>\u003cp>또한 같은 Width 변화라도 Mode Profile의 절대 폭과 Core 안의 Power 비율은 같은 지표가 아닙니다. Core 자체가 넓어지므로 Field Pattern의 절대 폭이 넓어져도 바깥 Tail의 상대 비율은 작아질 수 있습니다. 그래프와 정의된 수치를 함께 읽어야 합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"단순 Slab에서 크기와 허용된 Mode를 연결합니다","scene":"geometry","html":"\u003cdiv class='equation'>V = k₀(d/2) √(n\u003csub>core\u003c/sub>² − n\u003csub>clad\u003c/sub>²)\u003cbr>u² + w² = V²\u003cbr>u = mπ/2 + tan⁻¹(w/u)\u003cspan class='caption'>[R1] 이 교재는 half-width a = d/2로 V를 정의합니다. 다른 교재의 full-width 정의와 혼동하지 마세요. 마지막 식은 이 대칭 Slab의 TE 경계조건입니다.\u003c/span>\u003c/div>\u003cdl class='terms'>\u003cdt>d, a\u003c/dt>\u003cdd>x 방향 전체 Width와 Half-width · µm 또는 m\u003c/dd>\u003cdt>V, u, w\u003c/dt>\u003cdd>무차원. u = ha, w = qa. h는 Core의 횡 방향 파수, q는 Tail 감쇠율 [1/µm]\u003c/dd>\u003cdt>m\u003c/dt>\u003cdd>TE Mode 차수 0, 1, 2… · 이 모델의 내부 Node 수\u003c/dd>\u003c/dl>\u003cp>해가 존재하는 조건은 V &gt; mπ/2입니다. TE₁이 막 생기는 경계는 V = π/2이고, 이때 q = 0이므로 정확한 Cutoff점에서는 국소화된 Guided Mode로 세지 않습니다. 고정된 n과 λ₀에서 d가 커지면 V도 커져 새로운 차수의 해가 생깁니다.\u003c/p>\u003cdiv class='worked'>\u003ch3>Worked Example · 이 Slab에서의 TE₁ Cutoff\u003c/h3>\u003cp>λ₀ = 1550 nm, nCore = 3.48, nClad = 1.444이면 √(nCore² − nClad²) ≈ 3.167입니다. V = π/2를 대입하면 d\u003csub>cutoff,TE1\u003c/sub> = λ₀/[2√(nCore² − nClad²)] ≈ \u003cstrong>244.8 nm\u003c/strong>입니다.\u003c/p>\u003cp>따라서 이 \u003cem>대칭 Slab TE 계열\u003c/em>에서 d = 220 nm는 TE₀ 하나, d = 300 nm는 TE₀와 TE₁을 지원합니다. 이 결과를 높이 220 nm의 실제 Strip에서 Width 244.8 nm가 경계라는 의미로 옮겨서는 안 됩니다. Slab의 y 방향은 무한하며 유한 Height가 없습니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Core Power Fraction의 의미와 계산\u003c/summary>\u003cdiv class='equation'>Γ\u003csub>TE\u003c/sub> = ∫\u003csub>core\u003c/sub>|Ey|² dx / ∫\u003csub>all\u003c/sub>|Ey|² dx\u003cspan class='caption'>이 lossless·동일 μ의 Slab TE에서는 축 방향 평균 Power Density가 β|Ey|²/(2ωμ)에 비례하므로 계수가 상쇄됩니다. Γ는 무차원이며 퍼센트로 표시합니다.\u003c/span>\u003c/div>\u003cp>이 정의를 일반적인 Vector Mode의 임의 Field 성분에 그대로 적용하면 안 됩니다. 에너지 밀도 비율이나 Gain Confinement Factor와도 정의가 다를 수 있습니다. 여기서는 계산된 Slab TE의 축 방향 Power 비율만 뜻합니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"Single-mode라는 말에 조건을 붙여 봅니다","scene":"geometry","html":"\u003cp>Slab 계산에서 TE Mode가 한 개 나왔습니다. 이를 실제 Silicon Strip의 설계 결론으로 바로 사용할 수 있을까요?\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Mode를 세고 Tail을 관찰합니다","scene":"geometry","html":"\u003cp>먼저 Width d를 220 → 500 → 800 nm로 넓힐 때 허용된 TE Mode 수를 예상하세요. Notebook의 Width를 바꾸며 Mode 목록과 n_eff를 확인합니다. 새 Mode가 나타나면 선택하여 Fundamental Mode보다 Field가 바깥으로 더 퍼져 있는지 관찰하세요.\u003c/p>\u003cp>‘n_eff vs Width’에서는 모든 허용된 TE Branch를 함께 봅니다. 각 Branch는 Cladding Index 근처에서 시작하며 Width에 따라 변합니다. ‘Field Profile’로 돌아와 같은 Branch의 공간적 형태와 연결하세요. ‘Strip Geometry’는 유한 Height가 있는 구조를 보여 주는 별도의 Conceptual 그림입니다. 이 그림을 바꾸어 2D 수치가 나온 것처럼 표시하지 않습니다.\u003c/p>\u003cp>관찰을 마치면 결과를 두 문장으로 나누어 설명해 보세요. ‘이 Slab 모델에서 계산으로 확인한 사실’과 ‘실제 Strip에 적용하기 전에 추가 확인할 사항’입니다. 이 구분이 모델을 공학적으로 사용하는 기본 습관입니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"단면은 Mode와 Phase를 함께 정합니다","scene":"geometry","html":"\u003cul>\u003cli>Width와 Height는 Optical Confinement, n_eff와 Mode 수를 결정하는 Geometry입니다.\u003c/li>\u003cli>Single-mode의 주장에는 재료·Wavelength·단면·Polarization과 모델 범위가 필요합니다.\u003c/li>\u003cli>1D Slab의 정확한 해도 실제 2D Strip의 정확한 해와 같지는 않습니다.\u003c/li>\u003c/ul>\u003cp>이제 ‘잘 가두는 것’만으로 설계가 끝나는지, Loss와 배치 공간을 함께 비교해 보겠습니다.\u003c/p>"}],"prediction":"이 Slab TE에서 d를 220 → 500 nm로 늘리면?","predictionOptions":["먼저 예측을 선택하세요","TE₀의 n_eff가 증가하고 Higher-order TE Mode도 허용된다","n_eff는 재료 값이므로 변하지 않는다","모든 Width에서 TE Mode는 반드시 하나다"],"predictionFeedback":"이 조건에서 220 nm는 TE₀ 하나, 500 nm는 TE₀·TE₁·TE₂를 지원합니다. 같은 TE₀의 n_eff도 증가합니다. 이 숫자는 y 방향 무한인 Slab의 결과입니다.","reflection":"‘이 Waveguide는 Single-mode다’라는 설명에 빠지면 안 되는 조건들과, Slab 모델의 한계를 적어 보세요.","sources":["R1","R3"],"tutor":{"question":"Slab TE 계산에서 d = 220 nm일 때 Mode가 한 개였습니다. 올바른 설명은 무엇일까요?","choices":[{"text":"모든 Silicon Waveguide는 Width 220 nm이면 Single-mode다.","feedback":"Width 하나만으로 실제 Strip을 판정할 수 없습니다. Height, Wavelength, 재료와 Polarization 계열이 필요합니다. 이 Slab은 다른 횡 방향이 무한이므로 유한한 Height의 Strip과 경계조건도 다릅니다.","concept":"조건 없는 Single-mode 일반화"},{"text":"명시된 재료·Wavelength의 대칭 Slab TE 계열에서는 허용된 Mode가 하나다.","feedback":"그렇습니다. 계산 결과의 적용 범위를 정확하게 밝혔습니다. 실제 Strip에서는 유한 Height와 Polarization을 포함한 전체 구조를 별도로 검증해야 합니다. TE₀의 존재가 충분한 Confinement나 낮은 Bend Loss를 자동 보장하지는 않습니다.","correct":true,"concept":"조건과 모델 범위 명시"},{"text":"Width가 줄어도 Fundamental Mode는 존재하므로 Confinement는 항상 충분하다.","feedback":"이상적인 대칭 Slab TE₀는 매우 작은 양의 Width에서도 존재하지만 Cladding에 훨씬 넓게 퍼질 수 있습니다. 존재와 충분한 국소화는 다릅니다. 이웃 Waveguide와의 Coupling, Bend와 주변 경계의 영향도 커질 수 있습니다.","concept":"Mode 존재와 공학적 Confinement의 혼동"}],"why":"Mode의 수는 주어진 Frequency의 경계조건 문제에서 나옵니다. Height와 Cladding을 바꾸면 같은 Width에서도 다른 문제를 푸는 것입니다. 그 결과를 재료 이름과 Width만 남긴 규칙으로 축약하면 가정이 사라집니다.","simple":"같은 폭의 통로라도 천장 높이와 벽의 조건이 다르면 허용되는 울림이 달라집니다. Slab은 한 방향으로 벽이 없는 이상화이고 Strip은 두 방향의 경계를 모두 고려합니다. 폭 하나가 모든 것을 정하지 않습니다.","math":"이 Slab에서는 V = k₀(d/2)√(nCore²−nClad²), Mode m의 존재 조건은 V > mπ/2입니다. 이 식에는 유한한 Height H가 없습니다. 따라서 H가 있는 실제 Strip의 Mode 수를 이 식만으로 결정할 수 없습니다.","notebook":"220 nm와 500 nm에서 TE Mode 수를 비교한 뒤 n_eff vs Width의 Branch 시작점을 확인하세요. Strip Geometry 탭의 H와 Slab 계산의 y 방향 무한 조건을 나란히 떠올려 보세요. ΓTE는 이 Slab에서의 Power 비율입니다."}},{"id":"1.5","short":"Physics to Design","title":"From Physics to Design","time":"5–10분","lead":"원리를 안다는 것은 하나의 숫자를 키우는 일이 아니라, 조건과 한계를 밝히며 설계의 선택을 설명하는 일입니다.","question":"좁은 공간에 Waveguide를 배치하면서 Optical Loss를 줄이려면 무엇을 고려해야 할까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"잘 전파하는 단면도 Layout에서는 손실을 만납니다","scene":"design","html":"\u003cp>앞에서는 이상적인 직선 Waveguide의 Mode와 Phase를 배웠습니다. 실제 회로에서는 빛을 먼 곳으로 옮기고 방향도 바꾸어야 합니다. 그 과정에서 \u003cstrong>Propagation Loss\u003c/strong>와 \u003cstrong>Bend Loss\u003c/strong>가 생깁니다. 원하는 위치까지 충분한 Power를 보내려면 전파 경로와 배치 공간을 함께 생각해야 합니다.\u003c/p>\u003cp>이번 실험은 실제 제조 공정의 최적 Radius를 찾는 문제가 아닙니다. 손실을 더하는 방법과 서로 충돌하는 조건을 설명하는 연습입니다. Radius별 Bend Loss는 \u003cstrong>가정한 교육용 데이터\u003c/strong>이며 실측이나 PDK 수치로 사용하지 않습니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"손실을 구분해야 선택을 설명할 수 있습니다","scene":"design","html":"\u003cp>\u003cstrong>Propagation Loss\u003c/strong>는 진행하면서 Guided Mode의 Power가 줄어드는 현상입니다. 재료 흡수와 Sidewall Roughness에 의한 Scattering 등이 원인이 될 수 있습니다. 보통 dB/cm처럼 단위 길이당 손실로 표현합니다. 같은 손실 계수에서 경로가 길어지면 전체 손실은 커집니다.\u003c/p>\u003cp>\u003cstrong>Bend Loss\u003c/strong>는 경로가 휘면서 생기는 추가 손실입니다. 직선에서 성립하던 Mode의 국소화만으로 급격한 곡률을 견딜 수 있는 것은 아닙니다. Field가 바깥으로 Radiation되거나 직선–곡선 접속에서 Mismatch가 생길 수 있습니다. 일반적으로 Radius를 너무 작게 하면 추가 손실을 줄이기 어렵습니다. 단, 정확한 값은 단면, 재료, Wavelength, Mode와 Bend Shape에 달려 있습니다.\u003c/p>\u003cp>큰 Radius는 곡률을 완만하게 만들지만 더 넓은 \u003cstrong>Footprint\u003c/strong>와 더 긴 경로를 요구합니다. 강한 Confinement는 작은 Bend를 가능하게 하는 방향으로 도움이 될 수 있으나, 그것만으로 전체 Loss가 낮다고 결론 내릴 수는 없습니다. 높은 Index Contrast 구조에서는 공정에 따른 Scattering도 중요할 수 있습니다.\u003c/p>\u003cp>따라서 ‘작게 만들기’와 ‘Loss 줄이기’를 독립적인 목표로 놓고 어떤 항이 변하는지 확인해야 합니다. 이번 Notebook에서는 각 Radius의 Bend Loss를 표로 주고, 곡선의 길이와 Propagation Loss를 수식으로 더합니다. 손실의 출처가 드러나는 \u003cstrong>Loss Ledger\u003c/strong>로 판단합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"dB와 Power 비율을 연결합니다","scene":"design","html":"\u003cdiv class='equation'>Loss\u003csub>prop\u003c/sub> = α\u003csub>dB\u003c/sub> L\u003cbr>Loss\u003csub>total\u003c/sub> = Loss\u003csub>prop\u003c/sub> + Σ Loss\u003csub>bend\u003c/sub>\u003cbr>P\u003csub>out\u003c/sub>/P\u003csub>in\u003c/sub> = 10\u003csup>−Loss_total/10\u003c/sup>\u003cspan class='caption'>[R3, R5] αdB: Power 손실 계수 [dB/cm], L: 길이 [cm], 각 Loss: dB. 독립적인 수동 손실이 연속하며 반사에 의한 간섭이 무시될 때 dB를 더합니다.\u003c/span>\u003c/div>\u003cp>Power 비율에는 10 log₁₀를 사용합니다. 같은 임피던스 조건의 Field Amplitude 비율과 연결할 때는 제곱 관계 때문에 20 log₁₀가 나타납니다. Power를 계산하면서 분모에 20을 쓰면 잘못된 결과가 됩니다.\u003c/p>\u003cdiv class='worked'>\u003ch3>Worked Example · 길이 손실과 네 번의 Bend\u003c/h3>\u003cp>가정: α = 3 dB/cm, 직선 길이 2 mm, 동일한 90° Circular Bend 네 개, Radius R = 10 µm입니다. 각 Bend의 경로 길이는 πR/2이므로 총 경로는 2 mm + 4 × π × 10 / 2 µm ≈ \u003cstrong>2.0628 mm = 0.20628 cm\u003c/strong>입니다.\u003c/p>\u003cp>Propagation Loss = 3 × 0.20628 ≈ 0.61885 dB입니다. 가정한 표에서 R = 10 µm의 추가 Bend Loss는 0.020 dB/90°이므로 네 개 합은 0.080 dB입니다. Total Loss ≈ \u003cstrong>0.69885 dB\u003c/strong>, Pout/Pin ≈ \u003cstrong>0.8514\u003c/strong>, 즉 Input Power의 약 85.1%가 남습니다.\u003c/p>\u003cp>Bend의 경로 길이에서 생기는 Propagation Loss와 \u003cem>추가\u003c/em> Bend Loss를 따로 셌습니다. 표의 수치가 이미 전체 손실인지 추가 손실인지 확인하지 않으면 이중 계산이 생길 수 있습니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Footprint와 경로 길이의 정의\u003c/summary>\u003cdiv class='equation'>L\u003csub>bends\u003c/sub> = N · πR/2\u003cbr>A\u003csub>corner\u003c/sub> = R²\u003cspan class='caption'>N = 4개의 90° Circular Bend, R [µm]. A는 한 코너의 중심선 Bounding Square [µm²]이며, 전체 Chip 면적이 아닙니다. Waveguide Width와 Spacing은 생략합니다.\u003c/span>\u003c/div>\u003cp>실제 Layout의 총 면적은 Bend가 서로 어떻게 배치되는지에 따라 달라집니다. Euler Bend나 다른 형상에서는 같은 Radius 표를 그대로 쓰지 않습니다. 여기서는 정의된 한 코너의 공간 제약만 비교합니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"큰 Radius를 항상 선택하면 될까요?","scene":"design","html":"\u003cp>Bend Loss가 작은 선택이 전체 조건도 만족하는지 살펴봅니다. 선택의 이유를 Loss의 항목과 Footprint 정의로 설명해 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"주어진 조건 안에서 두 선택을 비교합니다","scene":"design","html":"\u003cp>설계 연습의 조건은 다음과 같습니다. 한 코너의 Bounding Square는 \u003cstrong>100 µm² 이하\u003c/strong>, 전체 경로의 Total Loss는 \u003cstrong>0.8 dB 이하\u003c/strong>여야 합니다. α = 3 dB/cm, 직선 2 mm, 90° Bend 네 개를 유지합니다. Notebook에서 Radius 2, 5, 10, 20 µm를 비교하세요. 주어진 합성 데이터 안에서의 판단이며 실제 공정의 Radius 권고가 아닙니다.\u003c/p>\u003cp>계산 전 먼저 예상한 선택과 이유를 적어 봅니다. Loss가 가장 작은 선택이 공간 조건도 만족하는지 확인하고, 비교표에서 최소 두 후보의 Propagation/Bend 항목을 읽으세요. 큰 R에서는 Bend 추가 손실은 줄지만 Propagation 항은 경로가 길어져 조금 늘어납니다.\u003c/p>\u003cp>관찰 후에는 선택한 Radius만 적지 말고, 어떤 조건을 만족했고 무엇을 확인하지 못했는지 함께 설명하세요. 실제 설계라면 PDK의 검증된 Bend 데이터, 단면과 Mode, 파장 범위, 공정 변화, 접속 손실 등을 추가로 검토해야 합니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Chapter 1 · 자신의 말로 연결해 봅니다","scene":"design","html":"\u003cul>\u003cli>재료의 Index Contrast와 전체 경계조건이 Guided Mode를 만듭니다. TIR은 좋은 출발 직관입니다.\u003c/li>\u003cli>Mode의 공간적 형태와 β는 연결되며, n_eff와 Geometry로 Phase를 이해할 수 있습니다.\u003c/li>\u003cli>설계는 Loss와 Footprint를 명시된 모델과 조건에서 비교하고 그 한계를 설명하는 일입니다.\u003c/li>\u003c/ul>\u003cdiv class='chapter-review'>\u003ch3>Learning Review · 이해를 스스로 확인하기\u003c/h3>\u003cp>본문을 보지 않고 먼저 설명한 뒤, 펼친 설명과 비교해 보세요. 정답 수로 진행을 제한하지 않습니다.\u003c/p>\u003cdetails>\u003csummary>1. Cladding에 Field가 있는데도 빛이 Guided될 수 있는 이유는?\u003c/summary>\u003cp>Field가 존재하는 것과 바깥으로 평균 Power가 유출되는 것은 다릅니다. Guided Mode의 Cladding Field는 횡 방향으로 감소하고, 전체 해는 축 방향으로 전파합니다. TIR의 광선 직관만으로 Mode 수를 결정할 수는 없습니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>2. 같은 Silicon인데 Width가 다르면 Phase가 달라지는 이유는?\u003c/summary>\u003cp>Width가 바뀌면 경계조건의 Eigenmode와 β가 달라집니다. n_eff = β/k₀이므로 같은 λ₀, L에서도 φ = βL이 달라질 수 있습니다. 재료 n만을 길이에 곱하는 설명으로는 충분하지 않습니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>3. Width 220 nm에서 TE 하나라는 결과를 실제 Strip에 적용하려면?\u003c/summary>\u003cp>계산이 y 무한인 Slab TE임을 먼저 밝힙니다. 실제 Strip의 Height, 재료, Wavelength, Cladding, Polarization과 공정 단면을 확인하고 2D Vector Mode로 다시 검증해야 합니다.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>4. 주어진 설계 연습의 후보를 어떻게 설명하나요?\u003c/summary>\u003cp>R = 10 µm는 이 가정에서 Loss 약 0.699 dB와 한 코너 100 µm²를 만족합니다. R = 20 µm는 Loss가 더 작지만 한 코너가 400 µm²입니다. R = 5 µm는 공간은 작지만 Loss 약 0.929 dB입니다. 수치 비교는 합성 Bend 데이터의 범위에서만 유효합니다.\u003c/p>\u003c/details>\u003cp>\u003cstrong>자기 설명의 기준\u003c/strong> · 용어 정의 → 원인과 결과 → 수식과 단위 → 모델 조건과 한계를 연결할 수 있나요? 막히는 항목이 있다면 관련 Lesson으로 자유롭게 돌아가세요.\u003c/p>\u003c/div>\u003cp>Chapter 1은 여기까지입니다. 실제 학습 후 설명의 깊이와 Tutor의 도움, Notebook 연결성을 검토한 뒤 다음 Chapter의 방향을 정합니다.\u003c/p>"}],"prediction":"R = 10 → 20 µm에서 Loss와 한 코너 Footprint는?","predictionOptions":["먼저 예측을 선택하세요","주어진 데이터에서는 Total Loss는 줄지만 Footprint는 네 배가 된다","Propagation Loss와 Footprint가 모두 줄어든다","가장 큰 Radius가 항상 모든 조건을 만족한다"],"predictionFeedback":"이 합성 데이터에서는 Total Loss가 약 0.699 → 0.658 dB로 줄고 A = R²는 100 → 400 µm²가 됩니다. 직선 길이를 유지했으므로 곡선이 길어져 Propagation Loss 항은 조금 증가합니다.","reflection":"한 후보를 선택하고 Loss Ledger, Footprint, 모델 한계를 근거로 설명하세요. Chapter 전체에서 아직 불명확한 개념도 적어 보세요.","sources":["R3","R5","R6"],"tutor":{"question":"주어진 데이터에서 R = 20 µm의 Total Loss가 가장 작습니다. 이 후보를 어떻게 평가해야 할까요?","choices":[{"text":"Loss가 최소이므로 모든 Layout에 최선이다.","feedback":"Loss 외에 공간 조건도 필요합니다. 이 연습에서 한 코너 Footprint는 R²이므로 20 µm는 400 µm²입니다. 100 µm² 제약을 넘습니다. 최소 손실과 모든 제약을 만족하는 선택은 다를 수 있습니다.","concept":"한 지표만으로 전체 설계 결정"},{"text":"큰 Radius는 길이가 늘어나므로 Bend 추가 손실도 반드시 커진다.","feedback":"경로 길이 증가로 Propagation Loss는 늘지만, 완만한 곡률에 따른 Bend 추가 손실은 이 표에서 줄어듭니다. 두 항을 구별해야 전체 손실이 왜 변하는지 이해할 수 있습니다.","concept":"Propagation Loss와 Bend 추가 손실의 혼동"},{"text":"Loss와 공간 제약을 함께 확인하고 데이터의 적용 범위도 밝혀야 한다.","feedback":"맞습니다. 이 연습에서는 R = 10 µm가 Loss 0.8 dB 이하와 한 코너 100 µm² 이하를 모두 만족합니다. 이 결과는 주어진 합성 데이터 안의 예제 답이며, 실제 공정에 적용하려면 검증된 Bend 데이터와 Layout 조건이 필요합니다.","correct":true,"concept":"제약과 근거를 함께 설명"}],"why":"Radius가 커지면 A = R²와 곡선 길이가 증가합니다. 한편 같은 구조에서 곡률을 완만하게 하면 Radiation을 줄일 수 있습니다. 각 원인이 Loss Ledger의 어느 항에 들어가는지 분리해야 조건을 설명할 수 있습니다.","simple":"길을 완만하게 돌리면 급한 코너의 불리함은 줄지만 더 넓은 땅과 더 긴 길이 필요합니다. 넓은 길이 언제나 최선인 것은 아닙니다. 공간 예산 안에서 빛이 얼마나 남는지를 함께 살펴봅니다.","math":"Ltotal = 0.2 + 4(πR/2)/10000 [cm], Loss = 3Ltotal + 4b(R) [dB], Pout/Pin = 10^(−Loss/10), A = R² [µm²]입니다. b(R)는 명시적으로 가정한 dB/90° 표의 값이며 Physics Solver로 계산하지 않았습니다.","notebook":"R = 5, 10, 20 µm의 행을 비교하세요. R이 증가할수록 Propagation 항은 조금 커지고 Bend 항은 작아집니다. Total Loss가 작은 행도 Footprint 조건을 넘을 수 있습니다. 비교는 이 합성 데이터에만 적용됩니다."}},{"id":"2.1","short":"Power & Field","title":"How Do We Split Optical Power?","time":"15–25분","lead":"Chapter 1에서 배운 Mode를 이제 회로의 입력으로 사용합니다. Power와 Field를 구별하는 것이 모든 Passive Component 계산의 출발점입니다.","question":"입력 1 mW를 두 출력에 절반씩 나눌 때 Field Amplitude도 절반이 될까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"하나의 길에서 여러 경로로","scene":"passive","html":"\u003cp>Chapter 1에서는 하나의 Waveguide가 어떤 공간적 Mode를 유지하는지 살펴봤습니다. 이제 동일한 단일 Mode를 전달하는 경로들을 연결해 봅니다. 한 Laser를 두 경로에 공급하거나, 한쪽을 Reference로 남기거나, 서로 다른 Phase를 만든 뒤 다시 합치려면 먼저 \u003cstrong>Optical Power Splitting\u003c/strong>이 필요합니다. 이 Chapter는 원본 교재 Chapter 4의 DC → Y-branch → MZI → Ring → Bragg 순서로 소자를 배웁니다. 이번 짧은 Lesson은 그 앞에 놓은 Power/Field 선수 개념입니다.\u003c/p>\u003cp>‘절반으로 나눈다’는 문장만으로는 충분하지 않습니다. 측정기로 읽는 Power와 간섭 계산에 더하는 Complex Field는 다른 물리량이기 때문입니다. 두 양을 혼동하면 Power Conservation을 어기거나 MZI의 최대 출력이 입력보다 커지는 잘못된 결과를 얻습니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Power는 제곱이고, 간섭은 Field의 합입니다","scene":"passive","html":"\u003cp>고정된 Frequency에서 한 Mode의 Electric/Magnetic Field 분포를 일정한 기준으로 정규화하면, 그 Mode를 얼마나 강하게 여기했는지 하나의 \u003cstrong>Complex Modal Amplitude a\u003c/strong>로 표현할 수 있습니다. 여기서는 \u003cstrong>|a|² = P\u003c/strong>가 되도록 Power-normalized Mode를 씁니다. P를 mW로 표시하면 a의 단위는 √mW입니다. 이 a는 단면의 한 지점에서 읽은 Electric Field E [V/m] 자체가 아닙니다.\u003c/p>\u003cp>실제 Guided Power는 단면을 지나는 시간 평균 Poynting Vector의 적분, P = ½ Re∫(E×H*)·ẑ dA로 정의됩니다. 같은 Mode의 E와 H를 함께 두 배로 키우면 P는 네 배가 됩니다. 이 관계를 간단히 다루기 위한 정규화가 |a|²입니다. 서로 다른 Impedance나 Mode 크기를 가진 E [V/m]를 아무 정규화 없이 비교해서 P∝|E|²의 동일 계수를 적용하면 안 됩니다.\u003c/p>\u003cp>입력 Port 하나와 출력 Port 두 개인 \u003cstrong>1×2 Splitter\u003c/strong>는 Forward 입력을 두 갈래로 보냅니다. \u003cstrong>2×2 Coupler\u003c/strong>는 두 입력과 두 출력의 Field 관계를 함께 정의합니다. 한쪽만 입력해 똑같이 50:50 Power를 얻더라도, 두 입력을 동시에 사용할 때의 Phase 관계와 역방향 동작까지 같다는 뜻은 아닙니다.\u003c/p>\u003cp>또한 Passive는 각 출력이 입력보다 작다는 말만을 뜻하지 않습니다. 이상적인 Lossless 소자에서는 모든 출력 Power의 합이 입력과 같습니다. 실제로는 방사·흡수·원하지 않는 Mode·반사 등 다른 채널로 Power가 갈 수 있습니다. 어느 Port를 출력 합에 포함했는지부터 명시해야 합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"분배율과 손실을 따로 계산합니다","scene":"passive","html":"\u003cdiv class=\"equation\">η = 10\u003csup>−EL/10\u003c/sup>\u003cbr>P₁ = rηP\u003csub>in\u003c/sub>, P₂ = (1−r)ηP\u003csub>in\u003c/sub>\u003cbr>|a₁| = √P₁, |a₂| = √P₂\u003c/div>\u003cdl class=\"terms\">\u003cdt>r\u003c/dt>\u003cdd>수집된 Forward Power의 출력 1 분배 비율 · 0–1\u003c/dd>\u003cdt>EL\u003c/dt>\u003cdd>Excess Loss · dB. 두 유효 출력의 합이 입력보다 감소한 정도\u003c/dd>\u003cdt>η\u003c/dt>\u003cdd>수집한 두 출력의 총 Power 효율 · 무차원\u003c/dd>\u003cdt>a\u003c/dt>\u003cdd>Power-normalized Modal Amplitude · √mW, 복소 Phase는 별도\u003c/dd>\u003c/dl>\u003cp>한 Port의 \u003cstrong>Insertion Loss\u003c/strong>는 IL₁ = −10 log₁₀(P₁/Pin) = EL −10 log₁₀r입니다. 반면 Excess Loss는 −10 log₁₀[(P₁+P₂)/Pin]입니다. 따라서 이상적인 50:50에서 한 출력은 약 3.010 dB 낮지만 Excess Loss는 0 dB입니다. 나머지 절반은 다른 출력에 있으며 소실된 것이 아닙니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 1 mW의 50:50 분배\u003c/h3>\u003cp>Pin = 1 mW, r = 0.5, EL = 0 dB이면 P₁ = P₂ = 0.5 mW입니다. |ain| = 1 √mW이고 각 출력 |a| = √0.5 ≈ \u003cstrong>0.7071 √mW\u003c/strong>입니다. 만약 각 a를 0.5로 놓으면 합계 Power는 0.25+0.25 = 0.5 mW가 되어, 가정에 없던 손실 50%를 만든 셈입니다.\u003c/p>\u003cp>EL = 1 dB이면 η ≈ 0.7943이고 각 출력은 0.3972 mW입니다. 총 유효 출력 0.7943 mW와 미수집/손실 채널 0.2057 mW의 합이 입력입니다. 이 단순 Ledger는 흡수와 방사를 개별적으로 구분하지 않습니다.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"수치가 맞아도 물리량의 이름을 확인합니다","scene":"passive","html":"\u003cp>다음 질문에서는 Output Power의 값만 고르지 말고 그 값에 대응하는 Amplitude를 함께 생각해 보세요. Offline Guided Tutor는 미리 작성한 설명을 제공하며 자유 입력을 자동 평가하지 않습니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"예측한 뒤 Power Ledger를 확인합니다","scene":"passive","html":"\u003cp>Notebook에서 r를 0.5로 두고 Excess Loss를 0에서 1 dB로 바꾸기 전에 두 출력의 합을 예측해 보세요. 그 다음 r만 0.8로 바꾸면 합계가 변하는지도 확인합니다. r는 총량의 배분이고 η는 유효 출력으로 남는 총량입니다.\u003c/p>\u003cp>Figure의 Waveguide 선 굵기는 Power를 그린 것이 아닙니다. 숫자와 정규화 곡선을 읽어 주세요. 이번 모델은 \u003cem>Forward Power Ledger\u003c/em>이며 완전한 Reciprocal 3-port Scattering Matrix가 아닙니다. Phase를 포함한 2×2 Matrix는 다음 Lesson에서 배웁니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Power 정규화는 다음 식을 읽는 언어입니다","scene":"passive","html":"\u003cul>\u003cli>Power는 |a|²이며 50:50 Power의 각 진폭 비율은 1/√2입니다.\u003c/li>\u003cli>한 Port의 3 dB 분배 손실과 전체 Excess Loss를 구별합니다.\u003c/li>\u003cli>간섭에서는 Power끼리 더하기 전에 Complex Field가 어떻게 결합되는지 알아야 합니다.\u003c/li>\u003c/ul>\u003cp>다음에는 Chapter 1의 Evanescent Tail이 다른 Waveguide와 겹칠 때 생기는 Directional Coupling부터 살펴봅니다. 그 뒤 원본의 다음 Section인 Y-branch를 배우며, MMI는 비교를 위한 보충 내용으로 덧붙입니다.\u003c/p>"}],"prediction":"Lossless 50:50에서 각 출력의 정규화 진폭은?","predictionOptions":["먼저 예측을 선택하세요","1/√2이며 두 출력 Power의 합은 1이다","0.5이므로 Power 합도 1이다","1이므로 두 출력 Power의 합은 2이다"],"predictionFeedback":"50:50는 Power 비율입니다. 두 진폭의 제곱 합 (1/√2)²+(1/√2)²=1을 확인하세요. 진폭만 합해서 에너지 보존을 검사하지 않습니다.","reflection":"한 Port의 3 dB Insertion Loss와 0 dB Excess Loss가 동시에 가능한 이유를 Power와 Field로 설명해 보세요.","sources":["C0"],"tutor":{"question":"Pin=1 mW인 Lossless 50:50 Forward Splitter의 각 출력은?","choices":[{"text":"P=0.5 mW, 정규화 진폭 0.5이다.","feedback":"Power 값은 맞지만 진폭은 다릅니다. 0.5²=0.25이므로 두 출력의 합은 0.5 mW뿐입니다. 진폭은 √0.5입니다.","concept":"Power와 Amplitude의 선형 혼동"},{"text":"P=0.5 mW, 진폭은 1/√2 √mW이다.","feedback":"맞습니다. 두 진폭 제곱을 합하면 1 mW입니다. 다만 각 출력의 복소 Phase까지 정하려면 소자의 Field Convention이 필요합니다.","concept":"정규화와 보존","correct":true},{"text":"각 출력에 3 dB가 있으므로 입력의 절반은 소자에서 흡수된다.","feedback":"각 출력의 3.010 dB는 절반이 다른 출력으로 간 결과입니다. 두 출력 합을 사용한 Excess Loss는 0 dB이며 이 모델에는 흡수가 없습니다.","concept":"분배와 소실의 혼동"}],"why":"시간 평균 Power는 E와 H의 곱을 적분한 값입니다. 고정된 Mode의 두 Field가 a에 비례하므로 Power는 |a|²에 비례합니다. 정규화하면 계수를 1로 둘 수 있습니다.","simple":"절반의 Power를 만들려면 Field를 절반보다 조금 크게 남겨야 합니다. 0.707을 두 번 제곱해 더하면 약 1입니다. 서로 다른 길에서 오는 빛을 합칠 때는 이 진폭과 Phase를 함께 씁니다.","math":"P₁/Pin=rη이고 |a₁/ain|=√(rη)입니다. r=1/2, η=1이면 1/√2입니다. 단일 Port IL=−10log₁₀(rη), EL=−10log₁₀η로 서로 다릅니다.","notebook":"Notebook의 r와 Excess Loss를 따로 조작하세요. r를 바꾸면 분배가 변하고 두 출력의 합은 일정합니다. Excess Loss를 키우면 합계가 줄고 그 차이는 Loss 항에 기록됩니다."}},{"id":"2.2","short":"Couplers","title":"Directional Coupler, Y-branch and MMI","time":"15–25분","lead":"Evanescent Coupling에서 출발해, Y-branch의 대칭 분기와 MMI의 Self-imaging을 차례로 비교합니다. 비슷한 출력 비율이 같은 동작 원리를 뜻하지는 않습니다.","question":"가까운 두 Waveguide 사이에 빛이 건너가게 하는 것은 무엇이며, Y-branch와 MMI는 어떻게 다른가요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Evanescent Tail이 회로의 연결 수단이 됩니다","scene":"passive","html":"\u003cp>Chapter 1의 Guided Mode는 Core 밖에도 Evanescent Field를 가졌습니다. 단독 Waveguide에서는 그 Tail이 Cladding에서 감쇠하지만, 가까이에 두 번째 Core가 있으면 그곳의 Guided Mode와 상호작용할 수 있습니다. 그래서 물리적으로 Core가 이어지지 않아도 두 Waveguide 사이에 Power가 교환됩니다. 이것이 \u003cstrong>Directional Coupler, DC\u003c/strong>의 출발점입니다.\u003c/p>\u003cp>원본 §4.1은 DC, §4.2는 Y-branch를 다룹니다. 이 순서대로 먼저 두 Guide의 결합을 이해하고, 다음으로 Core 자체가 갈라지는 Y-branch를 봅니다. 마지막 MMI는 사용자가 요청한 추가 비교 내용입니다. 세 구조의 모양을 구별하는 데서 끝내지 않고, 무엇이 Phase를 누적하는지를 기준으로 읽어 보겠습니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"두 Guide, 한 분기, 넓은 Multimode 영역","scene":"passive","html":"\u003cp>\u003cstrong>DC의 Supermode 관점.\u003c/strong> 가까운 두 동일 Guide 전체를 하나의 단면으로 보면 Even과 Odd Supermode가 생깁니다. 두 Supermode는 서로 다른 Propagation Constant βeven, βodd를 가지므로 전파하면서 상대 Phase가 쌓입니다. 한 Guide만 여기한 입력은 두 Supermode의 중첩입니다. 이들이 다시 같은/반대 Phase로 정렬되는 위치에 따라 Field가 원래 Guide 또는 다른 Guide에 집중됩니다. ‘빛이 한 방향으로 새어 나가 끝난다’는 비가역 과정이 아니라 이상 조건에서 왕복하는 Coherent Power Exchange입니다.\u003c/p>\u003cp>\u003cstrong>Coupling Coefficient κ\u003c/strong>는 결합된 두 Mode의 상호작용 세기를 나타내며 이 Lesson에서는 rad/µm를 사용합니다. 같은 κ에서도 Interaction Length L이 달라지면 출력 비율이 달라집니다. Through는 입력과 같은 Guide의 출력, Cross는 다른 Guide의 출력입니다. Notebook은 Phase-matched, Lossless인 두 Mode만을 풉니다.\u003c/p>\u003cp>실제 Gap·Width·Height·Wavelength가 변하면 Mode와 Supermode가 바뀌므로 κ도 달라질 수 있습니다. 동일 Guide에서 κ=(βeven−βodd)/2로 구할 수 있지만, 이 Notebook은 형상에서 β를 푸는 Mode Solver가 아닙니다. 따라서 Gap Slider에 임의 지수식을 붙이지 않습니다. 서로 다른 Guide의 β 차이도 Power Transfer를 제한합니다.\u003c/p>\u003ch3 id=\"y-branch\">원본 §4.2 · Y-branch\u003c/h3>\u003cp>\u003cstrong>Y-branch\u003c/strong>는 하나의 Core가 두 Core로 이어져 갈라지는 1×2 구조입니다. 이상적인 대칭 입력과 충분히 완만한 변화에서는 입력의 대칭 Mode가 두 Arm의 대칭 조합으로 이어져 같은 Phase와 같은 Power의 출력을 만들 수 있습니다. Y Tip의 유한한 제작 크기, 급격한 변화, Mode Mismatch는 방사·반사·원하지 않는 Mode를 만듭니다. 본문 그림은 정성적 구조도이며 Adiabaticity나 Loss를 수치 예측하지 않습니다.\u003c/p>\u003cp>역방향을 생각할 때는 더 주의해야 합니다. 두 Arm의 같은 Phase 입력은 대칭 조합으로 입력 Stem에 결합할 수 있지만, 반대 Phase 입력은 반대칭 조합입니다. 이 성분이 같은 단일 Mode Stem으로 전부 전달될 수는 없습니다. 방사·반사 같은 추가 채널을 고려해야 합니다. \u003cstrong>세 Guided Port만으로 모든 입력에 대해 Reciprocal·Lossless·Matched를 동시에 만족하는 소자\u003c/strong>로 Y-branch를 취급하지 않습니다.\u003c/p>\u003ch3 id=\"mmi\">보충 · Multimode Interference, MMI\u003c/h3>\u003cp>MMI에서는 두 개의 분리된 단일 Mode Core 대신 넓은 \u003cstrong>공통 Multimode Region\u003c/strong>을 사용합니다. 여러 횡 Mode ψm이 각각 다른 βm로 전파하고, 상대 Phase의 누적으로 입력 Field와 유사한 상이 하나 또는 여러 위치에 다시 생깁니다. 이를 \u003cstrong>Self-imaging\u003c/strong>이라고 합니다. MMI는 ‘폭이 넓어진 DC’가 아닙니다. Supermode 두 개로 근사한 DC와 여러 횡 Mode를 사용하는 MMI는 모델의 공간과 Mode 기저가 다릅니다.\u003c/p>\u003cp>여기서는 MMI의 Self-image 거리와 실제 Field를 계산하지 않습니다. 도식의 점선을 광선 경로나 Full-wave 결과로 읽으면 안 됩니다. Y, DC, MMI 중 실제 구현을 고르려면 Bandwidth, Imbalance, Phase, Footprint, 제조 민감도와 측정 Loss를 따로 비교해야 하며 어느 하나가 항상 우수하다고 단정하지 않습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Power 교환과 Cross Field의 Phase","scene":"passive","html":"\u003cdiv class=\"equation\">[a\u003csub>through\u003c/sub>, a\u003csub>cross\u003c/sub>]\u003csup>T\u003c/sup> = U[a\u003csub>in\u003c/sub>,0]\u003csup>T\u003c/sup>\u003cbr>U = [[cos(κL), i sin(κL)], [i sin(κL), cos(κL)]]\u003cbr>P\u003csub>through\u003c/sub>/Pin = cos²(κL)\u003cbr>P\u003csub>cross\u003c/sub>/Pin = sin²(κL)\u003c/div>\u003cdl class=\"terms\">\u003cdt>κ\u003c/dt>\u003cdd>실수 Coupling Coefficient · rad/µm (rad은 무차원)\u003c/dd>\u003cdt>L\u003c/dt>\u003cdd>Interaction Length · µm\u003c/dd>\u003cdt>i\u003c/dt>\u003cdd>Cross Field의 Quadrature Phase. 공통 전파 Phase는 생략\u003c/dd>\u003cdt>조건\u003c/dt>\u003cdd>동일 β, 두 단일 Mode, 일정한 κ, Lossless, e^(−iωt) Convention\u003c/dd>\u003c/dl>\u003cp>U†U=I이므로 모든 입력 Field에 대해 Power가 보존됩니다. 한쪽 입력에서 두 출력은 일반적으로 π/2 상대 Phase를 가집니다. +i와 −i 선택은 시간·Port 기준에 의존하며, 이 Chapter는 +i를 사용합니다. 두 출력 Power만 읽어서는 이 Phase를 알 수 없습니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 50:50와 Full Transfer\u003c/h3>\u003cp>κ=0.04 rad/µm이면 처음 50:50인 길이 L50=π/(4κ)≈\u003cstrong>19.635 µm\u003c/strong>입니다. Full-transfer 길이 Lc=π/(2κ)≈\u003cstrong>39.270 µm\u003c/strong>에서 Through는 0, Cross는 1입니다. 길이를 78.540 µm로 늘리면 원래 Guide로 Power가 돌아옵니다. κ=0이면 길이에 상관없이 Cross=0입니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Phase Mismatch와 원본의 설계·실험 Section\u003c/summary>\u003cp>Δβ=β₁−β₂, q=√[κ²+(Δβ/2)²]이면 Pcross/Pin=(κ/q)²sin²(qL)입니다. Δβ가 0이 아니면 최대 전달이 κ²/q²로 제한됩니다. κ와 Δβ 모두 1/µm 단위로 사용해야 합니다. 이번 Notebook은 Δβ=0 조건이며 General 식은 Model 테스트로 확인합니다.\u003c/p>\u003cp>원본의 Mode Solver/FDTD 비교, Strip 구현, 기생 Coupling, 공정 민감도와 실험 데이터는 이상 모델의 한계를 읽는 근거입니다. 실제 설계에서는 Mesh/Domain 수렴, Port 정규화, S-parameter와 측정 데이터를 확인해야 합니다. 여기서는 해당 Solver·공정 결과를 생성하지 않았습니다. 상세 후속 위치는 TEXTBOOK_SOURCE_MAPPING.md에 기록했습니다.\u003c/p>\u003c/details>\u003cdiv class=\"equation\">MMI: E(x,z) = Σ c\u003csub>m\u003c/sub>ψ\u003csub>m\u003c/sub>(x)e\u003csup>iβₘz\u003c/sup>\u003cspan class=\"caption\">Conceptual 식 · cm은 입력의 Mode 여기 계수. 이번 Figure는 ψm, βm을 푼 결과가 아닙니다.\u003c/span>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"Power 이동을 비가역 누출로 생각하지 않습니다","scene":"passive","html":"\u003cp>한 Guide만 여기했을 때 Coupler 길이를 계속 늘리면 항상 Cross Power가 증가할까요? 먼저 답한 뒤 Through/Cross 곡선을 함께 확인하세요. 이어 Y-branch의 역방향 반대 Phase 입력과 DC의 두 입력 문제를 비교해 봅니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"κ와 L을 나누어 관찰합니다","scene":"passive","html":"\u003cp>Notebook의 κ를 0.04로 고정하고 L을 0 → 약 19.5 → 약 39.5 → 약 78.5 µm로 움직이세요. 길이 Slider가 0.5 µm 단위이므로 정확한 π/(4κ) 지점과는 약간 다를 수 있습니다. Through와 Cross의 합은 모든 위치에서 1입니다. κ=0으로 두면 두 곡선이 어떻게 되는지도 확인합니다.\u003c/p>\u003cp>Notebook의 그래프는 해석 모델의 \u003cstrong>Mode Envelope Power\u003c/strong>입니다. Core 사이의 2D Electric Field Map을 계산한 것이 아닙니다. Figure의 정성적 Tail 겹침과 정량 Port Power 그래프를 구별하세요. MMI Self-imaging을 동일한 sin²(κL) 그래프로 표현하지 않습니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"같은 분배율, 서로 다른 구조와 Phase","scene":"passive","html":"\u003cul>\u003cli>DC: 두 Guide의 Coherent Coupling과 Supermode의 Phase 누적.\u003c/li>\u003cli>Y-branch: 이어진 Core에서 대칭 Mode가 두 Arm으로 분기; 역방향 반대칭 성분은 추가 채널 필요.\u003c/li>\u003cli>MMI: 넓은 공통 영역의 여러 Mode가 만들어 내는 Self-imaging.\u003c/li>\u003c/ul>\u003cp>이제 분리된 두 Arm이 다시 만나는 상황으로 넘어갑니다. Coupler 자체의 Phase와 별개로 각 Arm에서 쌓이는 Propagation Phase를 계산해야 합니다. 이것이 MZI를 이해하는 다음 단계입니다.\u003c/p>"}],"prediction":"Phase-matched DC에서 L을 Full-transfer 길이보다 더 늘리면?","predictionOptions":["먼저 예측을 선택하세요","주기적으로 Through로 Power가 돌아온다","Cross가 1에 도달하면 계속 1로 유지된다","Energy가 점점 사라진다"],"predictionFeedback":"Lossless CMT에서는 두 Supermode의 상대 Phase가 계속 누적되어 Power가 주기적으로 교환됩니다. κL=π에서 Cross=0, Through=1입니다. 실제 Loss가 있는 소자와 구별하세요.","reflection":"DC, Y-branch, MMI에서 서로 다른 어떤 Mode/Phase 과정이 50:50 출력을 만드는지 설명해 보세요.","sources":["C0","C1","C2"],"tutor":{"question":"MMI를 DC와 물리적으로 구분하는 올바른 설명은?","choices":[{"text":"MMI는 넓어진 DC이므로 언제나 정확히 sin²(κL)로 계산한다.","feedback":"MMI는 넓은 공통 영역의 여러 횡 Mode와 Self-imaging으로 설명합니다. 두 Mode DC의 단일 κ 식을 검증 없이 그대로 적용할 수 없습니다.","concept":"두 모델의 기저 혼동"},{"text":"MMI의 여러 횡 Mode는 β가 달라 상대 Phase를 누적하며 Self-image를 만든다.","feedback":"맞습니다. DC의 Even/Odd Supermode 설명과 공통점은 Coherent Phase 누적이지만 MMI는 공통 Multimode 영역의 여러 Mode를 사용합니다. 이번 도식은 그 원리만 표시합니다.","concept":"Self-imaging","correct":true},{"text":"DC에서는 Cross로 이동한 Power가 다시 Through로 돌아올 수 없다.","feedback":"이상적인 DC는 Coherent하고 Lossless입니다. L을 늘리면 sin²와 cos²에 따라 Power가 되돌아옵니다. 이동을 흡수나 비가역 누출로 생각하지 마세요.","concept":"가역 Coupling의 오해"}],"why":"DC 전체의 Even/Odd Mode, Y의 대칭 분기, MMI 공통 영역의 다중 Mode는 모두 경계조건과 Phase를 따릅니다. 같은 출력 비율은 내부 Field 과정과 완전한 Scattering Matrix의 동일성을 보장하지 않습니다.","simple":"서로 가까운 두 길이 서로 빛을 주고받는 구조와, 한 길이 두 길로 갈라지는 구조, 넓은 공간에서 여러 무늬가 겹치는 구조를 구별하세요. 세 장치의 모양뿐 아니라 허용 Mode가 다릅니다.","math":"DC는 aout=[cosκL, i sinκL]ᵀ에서 Psum=cos²+sin²=1입니다. MMI는 Σ cmψm exp(iβmz)이고 서로 다른 (βm−βn)z가 상을 결정합니다. 이 Figure는 MMI βm을 계산하지 않습니다.","notebook":"κ를 고정하고 L을 바꾸어 Power가 돌아오는지 보세요. 다음 κ=0을 확인하세요. Y와 MMI의 정성 Figure에서 숫자 성능을 읽지 말고 동작 원리와 Phase 기준을 비교하세요."}},{"id":"2.3","short":"Optical Phase","title":"Optical Phase and Path Difference","time":"15–25분","lead":"동일 Mode라도 길이와 Effective Index가 다르면 서로 다른 Phase로 도착합니다. 두 경로를 아직 합치지 않았다는 점을 먼저 구별합니다.","question":"길이 차이만 만들었는데도 Output Power가 바뀔까요, 아니면 결합 과정이 더 필요할까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Chapter 1의 β를 두 경로에 적용합니다","scene":"passive","html":"\u003cp>Chapter 1에서 β = k₀neff를 사용해 하나의 Waveguide에서 Phase가 얼마나 빠르게 누적되는지 계산했습니다. 이제 하나의 입력을 나눈 두 Arm을 생각해 봅니다. 두 Arm이 같은 Frequency를 유지하고 안정적인 Relative Phase를 가진다면, 다시 합칠 때 각 Field의 Phase 관계가 중요합니다. 이를 위해 먼저 \u003cstrong>각 경로에서 쌓이는 Phase\u003c/strong>를 독립적으로 계산해야 합니다.\u003c/p>\u003cp>이 Lesson은 원본 §4.3 MZI를 읽기 직전의 선수 개념입니다. §4.1.2에서 배운 Coupler의 Cross Phase와 이번의 Propagation Phase는 서로 다른 항입니다. 전체 회로에서는 두 항을 같은 기준으로 연결해야 합니다. 분리된 경로의 Phase 차이가 곧바로 각 경로의 Power 감소를 뜻하는 것은 아닙니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Absolute Phase와 Relative Phase","scene":"passive","html":"\u003cp>단색 Mode를 a(z,t)=a₀ exp[i(βz−ωt)]로 쓰면, z가 증가할수록 βz가 누적됩니다. \u003cstrong>Phase φ\u003c/strong>는 진동의 주기 안에서 어느 상태에 있는지 나타내는 각도입니다. φ가 2π 증가하면 같은 진동 상태로 돌아오지만, 실제 누적한 Cycle 수와 길이가 같아졌다는 뜻은 아닙니다.\u003c/p>\u003cp>두 경로의 \u003cstrong>Relative Phase Δφ=φupper−φlower\u003c/strong>는 공통 Phase를 뺀 차이입니다. 두 Arm에 같은 Phase χ를 더해도 출력 Power는 변하지 않습니다. |exp(iχ)|²=1이기 때문입니다. 반대로 한 Arm에만 Phase가 더해지면 합친 Field의 크기가 달라질 수 있습니다. Absolute Phase의 기준을 바꾸는 일과 Relative Phase를 바꾸는 일을 구별해야 합니다.\u003c/p>\u003cp>\u003cstrong>Optical Path Length, OPL\u003c/strong>은 균일 경로에서 neffL입니다. 물리 길이 L이 같아도 neff가 다르면 OPL과 Phase가 달라집니다. 단면이 바뀌는 경로에서는 φ=∫β(z)dz가 기본이며, 연결부의 Mode Conversion이나 반사는 이 적분만으로 설명할 수 없습니다. 여기서는 각 Arm의 단면과 neff가 일정한 경우를 다룹니다.\u003c/p>\u003cp>Δφ=0이면 두 Field가 같은 Phase이고, π이면 반대 Phase이며, π/2이면 Quadrature입니다. 이 명칭은 \u003cem>결합 지점에서의 Field 기준\u003c/em>을 말합니다. 실제 Port의 Constructive/Destructive 조건에는 Combiner의 Matrix Phase도 포함해야 하므로, 단순히 ‘Arm Phase가 같으면 모든 출력이 최대’라고 말할 수는 없습니다.\u003c/p>\u003cp>Notebook의 두 파형은 정규화된 Signed Field입니다. 한 파형을 좌우로 옮겨도 각각의 진폭은 그대로입니다. Lossless 단일 Mode에서 Phase Factor exp(iφ)의 절댓값은 1이므로, 두 Arm을 결합하기 전 각 Arm의 Power는 일정합니다. 다음 Lesson에서 Combiner가 Field 합을 어떻게 두 Port에 나누는지 확인합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"길이와 Index를 같은 단위로 비교합니다","scene":"passive","html":"\u003cdiv class=\"equation\">β = (2π/λ₀)n\u003csub>eff\u003c/sub>\u003cbr>φ = βL\u003cbr>Δφ = βᵤLᵤ − βₗLₗ = (2π/λ₀)(nᵤLᵤ−nₗLₗ)\u003cbr>동일 n\u003csub>eff\u003c/sub>: Δφ = (2πn\u003csub>eff\u003c/sub>/λ₀)ΔL\u003c/div>\u003cdl class=\"terms\">\u003cdt>λ₀\u003c/dt>\u003cdd>Vacuum Wavelength · µm. Notebook 입력 nm는 1000으로 나눔\u003c/dd>\u003cdt>β\u003c/dt>\u003cdd>Propagation Constant · rad/µm\u003c/dd>\u003cdt>L, ΔL\u003c/dt>\u003cdd>Arm Length와 길이 차이 · µm\u003c/dd>\u003cdt>n_eff\u003c/dt>\u003cdd>Phase Index · 무차원, Group Index와 구분\u003c/dd>\u003cdt>Δφ\u003c/dt>\u003cdd>Upper − Lower Phase · rad. 양수는 여기서 Upper가 더 많은 Phase 누적\u003c/dd>\u003c/dl>\u003cdiv class=\"worked\">\u003ch3>Worked Example · π만큼 다르게 도착시키기\u003c/h3>\u003cp>λ₀=1550 nm=1.55 µm, neff=2.4이면 β≈\u003cstrong>9.7288 rad/µm\u003c/strong>입니다. Δφ=π를 만들려면 ΔL=λ₀/(2neff)≈\u003cstrong>0.322917 µm = 322.917 nm\u003c/strong>입니다. Notebook의 0.323 µm 입력에서는 약 3.1424 rad이며 Slider 반올림 때문에 정확한 π와 조금 다릅니다.\u003c/p>\u003cp>서로 같은 길이 L=10 µm이고 nupper=2.50, nlower=2.40이면 Δφ=2π×(0.1×10)/1.55≈\u003cstrong>4.0537 rad\u003c/strong>입니다. 이 경우 ΔL=0인데도 Index 차이로 Phase 차이가 생깁니다. Notebook은 동일 Index의 길이 차이 실험을 사용하며 이 두 번째 예제는 위 일반식으로 계산합니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Phase 주기와 Group Index가 필요한 지점\u003c/summary>\u003cp>동일 λ에서 ΔL을 λ₀/neff만큼 더하면 Δφ는 2π 증가합니다. 따라서 이상적인 간섭 Power는 되풀이됩니다. 그러나 λ를 바꾸는 Spectrum의 간격을 계산할 때는 neff의 파장 미분이 포함되어 ng=neff−λ dneff/dλ가 필요합니다. 이 Lesson의 Index Slider는 Geometry/Dispersion Solver가 아니라 명시한 예제 값입니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"π 차이와 Power 소실은 다릅니다","scene":"passive","html":"\u003cp>Phase를 π 바꾸면 ‘빛이 사라진다’고 바로 결론 내릴 수 있을까요? 두 경로를 따로 측정하는 경우와 같은 Port로 합치는 경우를 구별해서 답해 보세요. 두 Field가 Quadrature인 경우도 함께 생각해 봅니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"두 파형의 위치와 높이를 나누어 봅니다","scene":"passive","html":"\u003cp>먼저 ΔL=0을 선택하세요. 두 Signed Field가 겹칩니다. 다음 ΔL≈0.323 µm로 바꾸면 파형이 거의 반대가 됩니다. ΔL≈0.161 µm는 약 π/2, ΔL≈0.646 µm는 거의 2π입니다. 이 동안 진폭은 ±1 범위를 유지합니다. 이 그림은 Power Detector의 시간 신호가 아니라 단색 Field의 공간 Phase 비교입니다.\u003c/p>\u003cp>λ₀와 neff를 바꿔 β가 달라지는 경우도 관찰하세요. 단위 변환을 생략하면 1000배의 오류가 생깁니다. 아직 Output Combiner를 두지 않았으므로 Notebook은 출력 Transmission을 만들어 내지 않습니다. Phase를 정확히 이해한 다음 다음 Lesson의 두 Port 결과를 예측해 보세요.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"같은 빛도 서로 다른 Phase로 도착합니다","scene":"passive","html":"\u003cul>\u003cli>β는 단위 길이당 Phase 누적, φ는 전체 누적량입니다.\u003c/li>\u003cli>OPL 차이는 길이 차이와 Index 차이 모두에서 생깁니다.\u003c/li>\u003cli>Phase Factor만으로 각 Arm Power가 변하지 않습니다.\u003c/li>\u003cli>간섭 출력은 Combiner의 Phase Convention까지 포함해 결정됩니다.\u003c/li>\u003c/ul>\u003cp>이제 두 경로를 다시 연결할 준비가 됐습니다. MZI에서는 Splitter → 두 Arm → Combiner의 Field 관계를 연속적으로 따라가며, 에너지가 사라지지 않고 두 출력 사이에서 이동한다는 것을 확인합니다.\u003c/p>"}],"prediction":"두 경로를 합치기 전, Lossless Arm 하나의 Phase만 π 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","그 Arm Power는 그대로이고 다른 Field와 합칠 때 결과가 달라진다","그 Arm Power가 0이 된다","Phase가 Power이므로 Power가 두 배가 된다"],"predictionFeedback":"|a exp(iπ)|²=|a|²입니다. Phase는 단독 Arm의 Power를 바꾸지 않습니다. 실제 Output은 Combiner의 Field 합과 Port Convention으로 다음 Lesson에서 계산합니다.","reflection":"Δφ=π인 두 Arm이 각각 같은 Power를 유지하면서도 한 Output에서 Destructive Interference를 만드는 이유를 설명해 보세요.","sources":["C0","C1"],"tutor":{"question":"Lossless Waveguide 한 경로에 exp(iπ)를 곱했습니다. 올바른 설명은?","choices":[{"text":"Power가 음수가 되거나 0이 된다.","feedback":"Field의 부호가 바뀌어도 |−a|²=|a|²입니다. 단독 경로의 Power가 0이 되려면 진폭을 실제로 줄이거나 다른 Field와 같은 Port에서 상쇄해야 합니다.","concept":"Field 부호와 Power 혼동"},{"text":"그 경로의 Power는 같고 다른 Field와 결합할 때 Relative Phase가 영향을 준다.","feedback":"맞습니다. exp(iπ)의 절댓값은 1입니다. 두 Arm의 Field 합에서만 Cross Term이 나타나며 Combiner의 Phase 기준도 포함해야 합니다.","concept":"Phase와 단독 Power 구분","correct":true},{"text":"두 Arm에 같은 공통 Phase를 더하면 언제나 MZI 출력이 바뀐다.","feedback":"두 출력 Field에 같은 exp(iχ)가 곱해지면 그 절댓값 제곱은 변하지 않습니다. 출력 Power에 중요한 것은 상대 Phase입니다.","concept":"Absolute와 Relative Phase 혼동"}],"why":"Phase Factor는 복소 평면에서 Vector를 회전시키지만 길이는 바꾸지 않습니다. 한 경로의 Power는 Vector 길이의 제곱이고, 간섭은 두 Vector의 합의 길이를 측정하는 과정입니다.","simple":"시계 바늘을 회전해도 바늘 길이는 같습니다. 두 바늘을 더한 결과는 방향에 따라 달라집니다. 실제 간섭에서는 두 Field가 같은 Mode/Port에서 겹쳐야 이 더하기가 가능합니다.","math":"|a e^(iφ)|²=|a|². |a+b|²=|a|²+|b|²+2Re(ab*)에서 마지막 Cross Term이 상대 Phase에 의존합니다. 공통 Phase χ는 ab*에서 소거됩니다.","notebook":"ΔL 0, 약 0.161, 0.323, 0.646 µm를 비교하세요. Field의 높이가 유지되고 상대 위치가 변합니다. 계산된 Δφ를 다음 MZI Lesson의 Phase Slider 값과 연결해 보세요."}},{"id":"2.4","short":"MZI","title":"Mach–Zehnder Interferometer","time":"15–25분","lead":"두 Field가 다시 만나는 과정을 Matrix와 Phasor로 연결합니다. 밝고 어두운 Port는 Phase를 Power로 읽는 두 개의 상보적 관측입니다.","question":"한 Port에서 빛이 상쇄된다면 입력 에너지는 어디로 갈까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Phase를 관측할 수 있는 Power로 바꿉니다","scene":"passive","html":"\u003cp>단독 Waveguide의 Power Detector는 Absolute Phase를 읽지 못합니다. 그러나 다른 경로의 Field를 Reference로 사용해 같은 출력 Mode에 겹치면 Relative Phase가 Power에 나타납니다. \u003cstrong>Mach–Zehnder Interferometer, MZI\u003c/strong>는 이 원리를 Splitter, 두 Arm, Combiner로 구현한 대표적인 Passive Circuit입니다.\u003c/p>\u003cp>이번 Lesson은 원본 §4.3에 대응합니다. 핵심은 cos² 식의 암기가 아니라, 왜 각 Arm의 진폭에 1/√2가 두 번 적용되는지, Coupler가 도입한 ±i를 어떻게 처리하는지, 한 출력에서 감소한 Power가 다른 출력으로 어떻게 가는지를 설명하는 것입니다. Active PN Phase Shifter나 전기적 Modulation은 이번 Chapter의 범위가 아닙니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Splitter에서 Detector까지 Field를 따라갑니다","scene":"passive","html":"\u003cp>입력의 정규화 진폭을 1로 둡니다. 50:50 Input Coupler U를 지나면 Upper Arm은 1/√2, Lower Arm은 i/√2가 됩니다. 여기에 각 Arm의 Propagation Phase exp(iφu), exp(iφl)가 곱해집니다. Output Coupler에서도 각 Arm의 진폭이 각 출력으로 나뉘므로, 각 Output에 기여하는 크기는 1/2입니다. 두 기여의 합 또는 차가 Output Field입니다.\u003c/p>\u003cp>\u003cstrong>Port Convention.\u003c/strong> DC Lesson에서 U=(1/√2)[[1,i],[i,1]]를 사용했습니다. 이번 회로의 Output Coupler는 U†=(1/√2)[[1,−i],[−i,1]]로 정의합니다. 이는 Port Phase를 명시한 이상적인 재위상 기준입니다. U† D U에서 Δφ=0이면 원래 입력에 해당하는 Port 1로 모두 나옵니다. 동일한 U를 두 번 쓰는 다른 흔한 기준에서는 Port 1/2의 밝고 어두운 이름이 바뀔 수 있습니다. 두 기준의 식을 중간에 섞지 않습니다.\u003c/p>\u003cp>Lower의 공통 Phase를 빼면 두 출력 진폭은 a₁=(exp(iΔφ)+1)/2, a₂=i(1−exp(iΔφ))/2입니다. Δφ=0에서 두 Arm 기여가 Port 1에는 더해지고 Port 2에는 상쇄됩니다. Δφ=π에서는 반대입니다. 한 Port의 Destructive Interference는 에너지가 없어졌다는 뜻이 아니라 다른 Port로 향하는 결합 결과입니다.\u003c/p>\u003cp>\u003cstrong>Coherence 조건.\u003c/strong> 두 Arm이 같은 Frequency와 겹치는 Mode/Polarization을 유지하며 관측 중 Relative Phase가 안정적이라고 가정합니다. 빠르게 흔들리는 Phase를 평균하거나 서로 직교하는 Mode를 합치면 같은 Fringe Contrast를 얻지 못합니다. 이 Notebook은 그런 통계적/편광 효과를 계산하지 않습니다.\u003c/p>\u003cp>\u003cstrong>Extinction Ratio, ER\u003c/strong>는 특정 출력의 최대/최소 Power 비율입니다. 완전히 균형 잡힌 이상 모델의 최소는 0이므로 ER은 무한대입니다. 실제 Loss·분배 불균형·누설·측정 Noise Floor가 있으면 유한합니다. ‘이상 모델의 0’을 제작 장치에서 무한 ER을 얻었다는 주장으로 바꾸지 않습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"두 번의 50:50 분배에서 cos²까지","scene":"passive","html":"\u003cdiv class=\"equation\">E\u003csub>out\u003c/sub> = U† diag(e\u003csup>iφᵤ\u003c/sup>, e\u003csup>iφₗ\u003c/sup>) U [1,0]\u003csup>T\u003c/sup>\u003cbr>a₁ = (e\u003csup>iΔφ\u003c/sup>+1)/2\u003cbr>a₂ = i(1−e\u003csup>iΔφ\u003c/sup>)/2\u003cbr>T₁ = |a₁|² = cos²(Δφ/2)\u003cbr>T₂ = |a₂|² = sin²(Δφ/2)\u003c/div>\u003cdl class=\"terms\">\u003cdt>Δφ\u003c/dt>\u003cdd>Upper − Lower Propagation Phase · rad\u003c/dd>\u003cdt>T₁,T₂\u003c/dt>\u003cdd>Pin으로 정규화한 Output Power · 무차원\u003c/dd>\u003cdt>U†\u003c/dt>\u003cdd>U의 Conjugate Transpose · 출력 Port Convention\u003c/dd>\u003cdt>ER\u003c/dt>\u003cdd>10 log₁₀(Pmax/Pmin) · dB; 같은 Port의 Phase Sweep 최대/최소\u003c/dd>\u003c/dl>\u003cp>전개하면 T₁=(1+cosΔφ)/2입니다. ±1/2 Field가 먼저 더해지고 그 절댓값을 제곱해서 Cross Term이 생깁니다. T₁+T₂=1은 두 Coupler와 Arm이 모두 Lossless라는 가정에서 성립합니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 세 가지 Relative Phase\u003c/h3>\u003cp>Δφ=0: a₁=1, a₂=0 → (T₁,T₂)=(1,0). Δφ=π/2: a₁=(1+i)/2, a₂=(1+i)/2 → 각각 |a|²=1/2. Δφ=π: a₁=0, a₂=i → (0,1). 1 mW 입력이면 이 정규화 수치에 1 mW를 곱합니다. Arm 두 개의 0.5 mW를 무조건 모든 Port에 다시 더하면 안 됩니다.\u003c/p>\u003cp>이전 Lesson의 ΔL≈0.322917 µm, neff=2.4, λ₀=1550 nm는 Δφ=π이므로 Port 2가 밝습니다. 이는 이번 U† Convention의 결과입니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Unequal Arms, Loss와 Spectral FSR\u003c/summary>\u003cp>실수 진폭 잔존율 gu, gl을 넣으면 a₁=(gu exp(iΔφ)+gl)/2이고 a₂=i(gl−gu exp(iΔφ))/2입니다. α[dB/cm], L[µm]일 때 gj=10^(−αLj/200000)입니다. 두 출력 합은 (gu²+gl²)/2이며 감소량은 Propagation Loss입니다. 분배 불균형 r는 다음 Circuit Notebook의 U(r)로 별도 계산합니다.\u003c/p>\u003cp>Δφ(λ)=2πneff(λ)ΔL/λ, ng=neff−λdneff/dλ이면, 국소적인 FSRλ≈λ²/(ng|ΔL|)입니다. 예를 들어 λ=1.55 µm, ng=4, ΔL=100 µm일 때 약 6.01 nm입니다. 이는 ng가 근방에서 천천히 변한다는 가정이며 Phase Index neff=2.4를 무조건 대입하면 안 됩니다. 이번 Notebook은 Phase 축을 직접 Sweep하여 Dispersion 예측과 분리합니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"상쇄되는 것은 한 Port의 Field입니다","scene":"passive","html":"\u003cp>아래 질문에서는 Output Port 하나만 보지 말고 두 Port를 함께 생각하세요. Tutor 설명에서 수식 전개와 Notebook을 연결한 뒤 Phasor의 길이와 그 제곱이 일치하는지 확인해 봅니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Field 합과 Transfer Curve를 동시에 확인합니다","scene":"passive","html":"\u003cp>Notebook에서 Δφ/π를 0 → 0.5 → 1 → 2로 바꾸세요. Figure 2.4B의 두 Transfer Curve와 Figure 2.4C의 Port 1 Phasor가 같은 Parameter와 Model Output을 사용합니다. Vector 합이 0일 때 T₁=0이 되고 T₂=1입니다. Slider를 움직여도 전체 Page를 새로 그리지 않아 Field와 Curve를 연속해서 읽을 수 있습니다.\u003c/p>\u003cp>그 다음, 두 출력의 합이 1이 아닌 실제 실험을 상상해 보세요. Loss가 있는지, 모든 Port를 측정했는지, 입력 Reference가 맞는지 등을 확인해야 합니다. 다음 Lesson의 Passive Circuit Ledger에서는 Propagation Loss와 Split Ratio를 포함해 이 균형을 다시 계산합니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"MZI는 Phase를 두 출력의 Power로 읽습니다","scene":"passive","html":"\u003cul>\u003cli>두 번의 진폭 분배와 복소 Phase를 연속적으로 적용합니다.\u003c/li>\u003cli>이번 U† 기준에서 T₁=cos²(Δφ/2), T₂=sin²(Δφ/2)입니다.\u003c/li>\u003cli>상보적 출력의 합은 이상 Lossless 조건에서 1입니다.\u003c/li>\u003cli>ER과 FSR에는 각각 불균형/손실과 Group Index 가정이 중요합니다.\u003c/li>\u003c/ul>\u003cp>원본 순서의 다음은 Ring Resonator입니다. MZI가 두 번 만나는 경로의 간섭이라면, Ring은 재순환한 Field가 매번 Bus Field와 만납니다. 이어 Bragg Grating에서는 전진·후진 Field의 결합을 배운 뒤 Passive PIC 실습으로 Chapter를 마무리합니다.\u003c/p>"}],"prediction":"Δφ를 0에서 π로 바꾸면 두 출력은?","predictionOptions":["먼저 예측을 선택하세요","Port1 1→0, Port2 0→1이며 합은 1이다","두 출력 모두 0이 되어 에너지가 사라진다","두 출력 모두 1이 되어 에너지가 두 배가 된다"],"predictionFeedback":"이번 U† Convention에서 (T₁,T₂)는 (1,0)에서 (0,1)로 바뀝니다. 한 Port의 상쇄는 다른 Port의 보강과 연결되며 이상 Lossless 전체 Power는 보존됩니다.","reflection":"1/√2를 두 번 적용하는 이유와 Port 1에서 cos²(Δφ/2)가 나오는 과정을 Complex Field로 설명해 보세요.","sources":["C0","C1"],"tutor":{"question":"이상 MZI에서 Δφ=π이면 이번 Port Convention의 출력은?","choices":[{"text":"두 Arm이 반대이므로 모든 곳에서 Power가 0이다.","feedback":"Port 1의 Field는 상쇄되지만 Port 2의 Field는 보강됩니다. 두 Coupler는 Unitary이므로 손실 없는 전체 입력 Power가 없어질 수 없습니다.","concept":"국소 상쇄와 전체 에너지 혼동"},{"text":"Port1=0, Port2=1이며 두 출력 합은 1이다.","feedback":"맞습니다. U†DU Convention에서 a₁=0, a₂=i입니다. 출력 Port 이름은 기준에 따라 바뀔 수 있지만 전체 보존은 같습니다.","concept":"상보적 두 출력","correct":true},{"text":"Power 0.5와 0.5를 더하므로 Phase에 상관없이 항상 Port1=1이다.","feedback":"동일 Port에서는 Complex Field를 먼저 더합니다. |a+b|²에는 Relative Phase에 의존하는 Cross Term이 있습니다. 각 Arm Power를 먼저 더하면 간섭 정보를 잃습니다.","concept":"Field 합을 Power 합으로 대체"}],"why":"두 입력 기여는 각 Output에서 다른 Phase로 합쳐집니다. Unitary Combiner의 직교한 두 행은 한 Port에서의 상쇄와 다른 Port에서의 보강을 동시에 만듭니다. 에너지 보존은 두 Port를 함께 볼 때 드러납니다.","simple":"한쪽 문이 어두워졌다고 에너지가 소멸한 것은 아닙니다. Field가 더해지는 방향이 다른 출구로 바뀌었습니다. 다만 이 비유 대신 실제 결과는 두 Complex Amplitude의 제곱으로 확인해야 합니다.","math":"a₁=(e^(iΔφ)+1)/2, a₂=i(1−e^(iΔφ))/2입니다. 각각의 절댓값 제곱은 (1±cosΔφ)/2이고 합은 1입니다. Δφ=π이면 e^(iπ)=−1이므로 a₁=0, a₂=i입니다.","notebook":"Δφ/π=0,0.5,1,2를 넣고 두 Transmission과 Port1 Phasor 길이 제곱을 비교하세요. Phase Convention은 Figure/Model 모두 U†DU로 동일하며 실제 측정 ER을 주장하지 않습니다."}},{"id":"2.5","short":"Filters & PIC","title":"Ring Resonators, Bragg Gratings and Your First Passive PIC","time":"30–45분","lead":"원본의 MZI 다음 순서인 Ring과 Bragg를 먼저 배웁니다. 서로 다른 간섭 구조를 비교한 뒤 Power와 Phase Ledger로 첫 Passive Circuit을 읽습니다.","question":"같은 Waveguide와 Coupler로 어떻게 재순환 Resonance와 특정 파장의 반사를 만들 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"두 경로에서 반복 간섭으로 확장합니다","scene":"passive","html":"\u003cp>지금까지는 빛을 나누고 한 번 다시 합치는 MZI를 배웠습니다. 원본 Chapter 4는 여기서 멈추지 않습니다. §4.4의 \u003cstrong>Ring Resonator\u003c/strong>와 §4.5의 \u003cstrong>Waveguide Bragg Grating Filter\u003c/strong>가 이어집니다. 이번 Lesson에서도 그 순서를 유지합니다. Part A는 재순환하는 Field, Part B는 전후진 Field의 결합을 다루며, Part C에서 앞서 배운 MZI의 Engineering Ledger를 완성합니다.\u003c/p>\u003cp>Ring과 Bragg는 선택적으로 건너뛰는 이름 소개가 아닙니다. 각 구조의 원리, 기초 Transfer Function, Worked Example과 Notebook을 제공합니다. 다만 상세 제작 형상·원본 실험 데이터·Apodized/Phase-shifted Grating의 Full-wave 계산까지 이 이상 모델로 대체하지는 않습니다. 마지막 실습은 최적화 조건을 통과해야 하는 Mission이 아니라, 예측과 계산을 비교해 스스로 물리적 판단을 적는 교재형 Exercise입니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Part A Ring → Part B Bragg → Part C Circuit","scene":"passive","html":"\u003ch3 id=\"ring-resonator\" data-notebook-scene=\"ring\">Part A · 원본 §4.4 Ring Resonator\u003c/h3>\u003cp>직선 Bus Waveguide 옆에 닫힌 Ring을 Coupling시키면 일부 Field가 Ring에 들어가 한 바퀴 돈 뒤 다시 Coupling 지점에 도착합니다. 도착한 Field는 Bus의 직접 전달 Field와 간섭합니다. MZI의 두 경로와 달리 Ring에는 이전 Round-trip의 기여들이 계속 남을 수 있어 \u003cstrong>Feedback Interference\u003c/strong>가 생깁니다. 한 바퀴 Phase θ가 2πm을 만족하면 같은 Phase로 재방문하는 Resonance 조건입니다.\u003c/p>\u003cp>여기서는 Bus 하나만 있는 \u003cstrong>All-pass Ring\u003c/strong>을 사용합니다. Self-coupling의 실수 진폭을 t, 한 바퀴 뒤 남는 진폭을 a로 정의합니다. Power Survival은 a²이며 a가 Power 비율이 아님에 주의합니다. Ring 내부 Field가 커져도 Bus Through Power는 감소할 수 있습니다. \u003cstrong>Critical Coupling\u003c/strong> t=a&lt;1에서는 Resonance의 직접 전달과 재결합 Field가 상쇄되어 Bus Through가 0이 됩니다. 정상상태에서 그 Power는 내부 손실로 소모됩니다. 이 단일 Bus 모델에는 Drop Port가 없습니다.\u003c/p>\u003cp>반대로 내부 손실이 없는 a=1인 이상 All-pass Ring은 정상상태의 Bus Transmission 크기가 모든 θ에서 1입니다. Phase와 내부 Stored Energy는 변할 수 있지만 에너지를 소모하거나 다른 출력으로 보내지 않기 때문입니다. 따라서 ‘Ring이면 언제나 Power Notch가 나타난다’는 결론은 틀립니다. 실제 Resonator의 Q, Linewidth, Backscattering, 온도 변화, Add-drop 출력은 추가 모델과 측정이 필요합니다.\u003c/p>\u003cp>여러 Resonance 사이의 \u003cstrong>Free Spectral Range, FSR\u003c/strong>는 한 바퀴 누적 Phase가 파장에 따라 2π 변하는 간격입니다. 위상에 쓰는 neff와 Spectrum 미분에 쓰는 ng를 구별해야 합니다. Notebook은 θ를 직접 Sweep하며, 별도 가정한 ng로 국소 FSR만 계산합니다. 이 θ 그래프를 실제 파장 Spectrum이라고 표시하지 않습니다.\u003c/p>\u003ch3 id=\"bragg-grating\" data-notebook-scene=\"bragg\">Part B · 원본 §4.5 Waveguide Bragg Grating\u003c/h3>\u003cp>Waveguide를 따라 Refractive Index 또는 Width를 주기적으로 바꾸면 각 위치에서 약하게 뒤로 산란된 Field들이 생깁니다. 특정 파장에서는 이 후진 성분의 Phase가 정렬되어 큰 반사를 만듭니다. 1차 \u003cstrong>Bragg Condition\u003c/strong>은 λB≈2neffΛ입니다. Λ는 Grating Period입니다. 이 장치는 진행 방향을 뒤집는 Guided-wave Filter이며 Fiber/Free-space로 빛을 방출하는 Optical I/O의 Grating Coupler와 다릅니다.\u003c/p>\u003cp>DC가 서로 다른 Guide의 같은 방향 Field를 결합한다면, 균일 Bragg Grating은 같은 Guide의 \u003cstrong>Forward/Backward Mode\u003c/strong>를 결합합니다. κg는 그 결합 세기이고 Detuning δ=β−π/Λ는 Bragg 조건에서 벗어난 정도입니다. DC의 cos²/sin²를 그대로 가져올 수 없습니다. 뒤쪽 끝에서 들어오는 Backward 입력이 없다는 경계조건 때문에 Resonance에서 R=tanh²(κgLg)가 나옵니다.\u003c/p>\u003cp>원본의 설계 Section은 TMM, 물리 구조, FDTD와 제작 비교로 이어집니다. \u003cstrong>Transfer Matrix Method, TMM\u003c/strong>는 각 구간에서 Forward/Backward Field의 관계를 행렬로 만들고, 구간 행렬들을 순서대로 곱해 전체 경계조건을 적용하는 방법입니다. 이번 Notebook은 Uniform CMT의 해석해만 사용합니다. Corrugation 크기에서 κg를 추정하거나 실제 Lithography를 계산한 결과는 아닙니다.\u003c/p>\u003cdetails>\u003csummary>원본 §4.5.3–4.5.8 · 제작과 심화 구조로 이어지는 길\u003c/summary>\u003cp>Strip과 Rib Grating은 Etch와 Mode Overlap이 달라 같은 형상 변화가 같은 κg를 주지 않습니다. Period는 반사 중심을 정하지만 실제 제작된 Width·Sidewall·Etch Depth가 neff와 κg를 함께 바꿀 수 있습니다. 따라서 경험식은 제작 데이터로 맞춰야 하며 이상 Layout 값을 그대로 측정 성능으로 읽으면 안 됩니다.\u003c/p>\u003cp>\u003cstrong>Spiral Grating\u003c/strong>은 긴 Grating을 작은 Footprint에 배치하지만 Bend와 공정 균일도를 함께 봐야 합니다. 온도에 따른 Index/Length 변화는 반사 파장도 바꿉니다. \u003cstrong>Phase-shifted Grating\u003c/strong>은 주기 구조 중간의 위상 결함으로 Stopband 안의 좁은 Resonance를 만들 수 있습니다. \u003cstrong>Multi-period Grating\u003c/strong>은 여러 주기 성분으로 반사 대역을 구성합니다. \u003cstrong>Grating-assisted Contra-directional Coupler\u003c/strong>는 서로 다른 Guide의 전진/후진 Mode를 Phase Matching하여 결합합니다.\u003c/p>\u003cp>이 심화 구조의 정량 Spectrum은 이번 Uniform Notebook이 계산하지 않습니다. 후속 Passive Advanced의 Grating-TMM/Fabrication에서 구간 행렬, 제작 형상과 실험을 연결하도록 예약했습니다. Ring의 Add-drop/Q와 원본 실험 비교도 Ring-Filters에서 다룹니다. 상세 대응은 TEXTBOOK_SOURCE_MAPPING.md에서 확인할 수 있습니다.\u003c/p>\u003c/details>\u003ch3 id=\"passive-circuit\" data-notebook-scene=\"circuit\">Part C · Guided Engineering Exercise\u003c/h3>\u003cp>이제 Laser Input → Splitter → 두 Optical Arm → Combiner → 두 Optical Output을 읽어 봅니다. Ring이나 Bragg를 마지막 MZI Circuit에 억지로 넣을 필요는 없습니다. 방금 배운 세 Filter의 차이를 이해한 상태에서, 가장 단순한 Feed-forward 구조에 이전 Lesson의 모든 계산을 적용합니다.\u003c/p>\u003cp>Notebook의 \u003cstrong>Ring / Bragg / Circuit\u003c/strong> 탭은 서로 다른 명시 모델입니다. Circuit에서는 두 Coupler의 Through Power 비율 r, ΔL, λ₀, neff, Propagation Loss α를 설정합니다. 두 Arm 기준 길이는 1 mm이며 Upper만 ΔL만큼 더 깁니다. r는 독립 Coupler Parameter로 사용하며 같은 회로에 별도의 DC κL를 중복 적용하지 않습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"세 구조의 식은 서로 다른 경계조건을 반영합니다","scene":"passive","html":"\u003ch3>Ring Transfer · 정상상태의 반복 합\u003c/h3>\u003cdiv class=\"equation\">H = (t − ae\u003csup>iθ\u003c/sup>)/(1−tae\u003csup>iθ\u003c/sup>)\u003cbr>T = |H|², θ = β(2πR)\u003cbr>FSR\u003csub>λ\u003c/sub> ≈ λ₀²/(n\u003csub>g\u003c/sub>2πR)\u003c/div>\u003cdl class=\"terms\">\u003cdt>t,a\u003c/dt>\u003cdd>Self-coupling 진폭과 Round-trip 진폭 잔존율 · 0–1\u003c/dd>\u003cdt>θ,R\u003c/dt>\u003cdd>Round-trip Phase [rad], Ring Radius [µm]\u003c/dd>\u003cdt>ng\u003c/dt>\u003cdd>Group Index, neff−λ dneff/dλ · 국소 FSR에 사용\u003c/dd>\u003c/dl>\u003cdiv class=\"worked\" id=\"ring-example\">\u003ch3>Worked Example A · Ring의 Critical Coupling\u003c/h3>\u003cp>t=a=0.9, θ=0이면 분자는 0, 분모는 1−0.81=0.19이므로 T=0입니다. θ=π이면 H=1.8/1.81이고 T≈\u003cstrong>0.9890\u003c/strong>입니다. a=1로 바꾸면 임의 θ에서 |H|²=1이며 Lossless All-pass의 크기 특성이 됩니다.\u003c/p>\u003cp>λ₀=1.55 µm, R=10 µm, ng=4이면 FSR≈1.55²/(4×2π×10)=0.009559 µm≈\u003cstrong>9.56 nm\u003c/strong>입니다. 이 국소 근사에서 Index 4는 ng이며, Phase Index를 4로 가정했다는 뜻은 아닙니다.\u003c/p>\u003c/div>\u003ch3>Uniform Bragg Transfer · 전후진 결합\u003c/h3>\u003cdiv class=\"equation\">δ = β−π/Λ, s² = κg²−δ²\u003cbr>f = sinh(sLg)/s\u003cbr>D = |cosh(sLg)−iδf|²\u003cbr>R = κg²|f|²/D, T = 1/D\u003cbr>δ=0: R=tanh²(κgLg), T=sech²(κgLg)\u003c/div>\u003cdl class=\"terms\">\u003cdt>κg, δ\u003c/dt>\u003cdd>Grating Coupling과 Detuning · µm⁻¹\u003c/dd>\u003cdt>Lg, Λ\u003c/dt>\u003cdd>Grating Length와 Period · µm (Period 예제는 nm로 환산)\u003c/dd>\u003cdt>s\u003c/dt>\u003cdd>δ²&gt;κg²이면 허수; sinh(ix)=i sinx로 연속 계산\u003c/dd>\u003cdt>가정\u003c/dt>\u003cdd>Uniform, 실수 κg, Lossless, 하나의 전진/후진 Mode, 오른쪽 입사 없음\u003c/dd>\u003c/dl>\u003cdiv class=\"worked\" id=\"bragg-example\">\u003ch3>Worked Example B · Bragg 중심과 반사율\u003c/h3>\u003cp>neff=2.4에서 λB=1550 nm인 1차 Grating은 Λ≈1550/(2×2.4)=\u003cstrong>322.917 nm\u003c/strong>입니다. κg=0.01 µm⁻¹, Lg=100 µm이면 κgLg=1이고 R=tanh²1≈\u003cstrong>0.5800\u003c/strong>, T≈\u003cstrong>0.4200\u003c/strong>입니다. Lg=200 µm이면 R≈0.9293으로 커집니다. Energy Conservation은 R+T=1이며 이때 T는 Bus Ring의 Through가 아니라 Grating의 Forward Transmission입니다.\u003c/p>\u003c/div>\u003ch3>Passive Circuit · 단위를 맞춘 Ledger\u003c/h3>\u003cdiv class=\"equation\">U(r)=[[√r,i√(1−r)],[i√(1−r),√r]]\u003cbr>gⱼ=10\u003csup>−αLⱼ/(20×10000)\u003c/sup>\u003cbr>Eout=U(r)† diag(gᵤe\u003csup>iφᵤ\u003c/sup>,gₗe\u003csup>iφₗ\u003c/sup>)U(r)[√Pin,0]\u003csup>T\u003c/sup>\u003cbr>P₁+P₂ = Pin[r gᵤ²+(1−r)gₗ²]\u003c/div>\u003cp>α는 Power Loss 계수 [dB/cm]이고 L은 µm이므로 10000으로 나누어 cm로 변환합니다. Field 잔존율에는 10이 아니라 20을 사용합니다. 분배·전파·합성을 한 번씩만 적용하며 각 Port의 Power는 계산한 Field의 절댓값 제곱입니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example C · Phase 0에서 손실까지 확인\u003c/h3>\u003cp>Pin=1 mW, r=0.5, λ₀=1550 nm, neff=2.4, 두 Arm 모두 L=1000 µm=0.1 cm, α=3 dB/cm로 둡니다. ΔL=0이므로 Δφ=0입니다. 각 Arm의 Power Survival은 10^(−0.3/10)≈0.933254입니다. 따라서 Port1≈\u003cstrong>0.933254 mW\u003c/strong>, Port2=0, Propagation Loss≈\u003cstrong>0.066746 mW\u003c/strong>이며 합은 1 mW입니다.\u003c/p>\u003cp>α=0으로 두고 ΔL≈0.322917 µm를 주면 Port1≈0, Port2≈1 mW가 됩니다. 실제 Slider는 0.001 µm 간격이므로 정확한 Zero보다 작은 잔여가 남을 수 있습니다. α&gt;0이고 길이가 다르면 두 Arm의 잔존 진폭도 조금 달라져 이상적인 상쇄가 깨집니다.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"서로 다른 간섭을 같은 말로 섞지 않습니다","scene":"passive","html":"\u003cp>Ring의 Bus Notch와 MZI의 Dark Port는 둘 다 Field Interference이지만, 전체 Energy Ledger는 다릅니다. MZI에는 두 출력이 있고 단일 Bus Ring에는 내부 손실이 있습니다. Bragg에는 전진과 후진 출력이 있습니다. Notebook의 각 탭에서 무엇을 입력/출력으로 세는지 먼저 확인하세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"예측 → 계산 → 관찰 → 설계 판단","scene":"passive","html":"\u003col>\u003cli>\u003cstrong>Ring:\u003c/strong> t=a=0.9, θ=0의 Through를 예측한 뒤 확인하세요. a=1로 바꿔 Notch가 사라지는 이유를 적습니다.\u003c/li>\u003cli>\u003cstrong>Bragg:\u003c/strong> κg=0.01 µm⁻¹, Lg=100 µm에서 δ=0의 R/T를 손으로 계산한 뒤 확인합니다. δ를 바꾸면 왜 반사가 변하는지 설명합니다.\u003c/li>\u003cli>\u003cstrong>Circuit:\u003c/strong> r=0.5, ΔL=0, λ=1550 nm, neff=2.4, α=3 dB/cm 조건을 읽고 예상 Output Power를 메모합니다.\u003c/li>\u003cli>β와 Δφ를 계산하고 Matrix의 각 Arm Field를 구합니다. Notebook Ledger의 두 Port 및 Loss와 비교합니다.\u003c/li>\u003cli>r를 0.6으로 바꾸거나 ΔL을 약 0.323 µm로 바꾸어, Dark Port의 잔여와 Propagation Loss가 어떻게 다른지 관찰합니다.\u003c/li>\u003cli>Phase 민감도, Loss, Split Ratio 균형 사이의 Trade-off를 자신의 말로 정리합니다. 완료는 정답 최적화 수치로 차단하지 않습니다.\u003c/li>\u003c/ol>\u003cp>Ring·Bragg 탭과 본문 Figure는 각 모델의 설정을 공유합니다. Circuit Figure 2.5A/B는 같은 Ledger 결과를 사용합니다. 실제 Foundry 값, FDTD/FEM 결과, 측정 Spectrum, 제조 수율은 계산하지 않습니다. neff를 바꿨다는 이유로 같은 단면의 Loss나 κ까지 자동으로 바뀌었다고 해석하면 안 됩니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Chapter Review · 구조가 달라도 Field와 경계조건을 따릅니다","scene":"passive","html":"\u003cul>\u003cli>\u003cstrong>Splitter:\u003c/strong> Power와 진폭을 구별하고 분배와 Excess Loss를 분리했습니다.\u003c/li>\u003cli>\u003cstrong>DC → Y → MMI:\u003c/strong> Evanescent Coupling, 대칭 분기, Self-imaging의 차이를 배웠습니다.\u003c/li>\u003cli>\u003cstrong>Phase → MZI:\u003c/strong> OPL 차이가 Relative Phase를 만들고 Combiner가 이를 두 Output Power로 읽습니다.\u003c/li>\u003cli>\u003cstrong>Ring:\u003c/strong> 재순환 Field의 정상상태 간섭과 Critical Coupling을 이해했습니다.\u003c/li>\u003cli>\u003cstrong>Bragg:\u003c/strong> 주기 섭동이 Forward/Backward Mode를 결합하고 반사를 만든다는 것을 배웠습니다.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>학습 점검:\u003c/strong> ‘왜 Power가 진폭의 제곱인가?’, ‘왜 DC Power가 되돌아오는가?’, ‘Y의 반대칭 역입력은 어디로 가는가?’, ‘MMI는 어떤 Mode를 겹치는가?’, ‘한 MZI Port가 어두울 때 Power는 어디로 가는가?’, ‘Lossless All-pass Ring에 Power Notch가 없는 이유는?’, ‘Bragg와 I/O Grating Coupler는 무엇이 다른가?’를 설명해 보세요.\u003c/p>\u003cp>원본 실험·공정·TMM 심화는 Source Mapping의 Passive Advanced 위치로 이어집니다. 이번 Release Candidate는 여기서 사용자 학습 검토를 기다립니다. Chapter 3 또는 Active Modulation은 아직 개발하지 않았습니다. 읽음 표시는 학습 기록이며 통과 Gate가 아닙니다.\u003c/p>"}],"prediction":"Critical Coupling의 All-pass Ring과 Lossless MZI에서 어두운 출력의 Energy는?","predictionOptions":["먼저 예측을 선택하세요","Ring은 내부 손실, MZI는 다른 Port로 가며 구조의 Energy Ledger가 다르다","두 장치 모두 Energy가 보존되지 않는다","두 장치 모두 반드시 뒤로 반사된다"],"predictionFeedback":"단일 Bus Ring의 Critical Coupling은 t=a\u003c1인 내부 손실과 외부 결합의 균형입니다. 반면 이상 Lossless MZI의 상쇄 Power는 다른 Output에 나타납니다. Bragg에서는 뒤로 향하는 Reflection을 따로 셉니다.","reflection":"Ring·Bragg·MZI의 출력 채널을 비교하고, Circuit의 Split Ratio·ΔL·Loss를 바꾼 설계 판단을 수치와 함께 설명해 보세요.","sources":["C0","C3","C4"],"tutor":{"question":"내부 손실이 없는 a=1인 단일 Bus All-pass Ring의 정상상태 Power Transmission은?","choices":[{"text":"Resonance에서 반드시 0이 된다.","feedback":"Bus Notch에는 내부 손실 또는 다른 출력 채널이 필요합니다. a=1인 이상 단일 Bus All-pass는 크기 Transmission이 1입니다. Phase와 내부 Stored Energy는 변할 수 있습니다.","concept":"모든 Ring은 Power Notch라는 오개념"},{"text":"크기는 모든 Phase에서 1이며 Phase response는 변할 수 있다.","feedback":"맞습니다. 에너지를 소모하거나 다른 Port로 보낼 채널이 없는 정상상태입니다. Critical Coupling Notch는 t=a\u003c1의 내부 손실을 포함합니다.","concept":"All-pass 크기와 Phase 구분","correct":true},{"text":"Bragg Grating과 같으므로 사라진 Through는 모두 뒤로 반사된다.","feedback":"이 모델의 All-pass Ring에는 Backreflection 항이 없습니다. Bragg는 전진·후진 Mode를 결합하며 R+T를 계산하는 다른 구조입니다.","concept":"출력 채널의 혼동"}],"why":"Ring의 반복 Field 합에서 내부 손실이 0이면 Coupler의 Unitary 성질로 모든 입력 Power가 Bus로 다시 나와야 합니다. Critical Coupling에서는 내부 손실률과 Bus로부터의 결합이 균형을 이룹니다.","simple":"같은 한 출구만 있고 내부에서 에너지를 쓰지 않는 정상상태라면 입력 Energy가 그 출구로 다시 나옵니다. 내부에서 에너지를 소모하면 출구가 어두울 수 있습니다. MZI의 두 출구와 Bragg의 앞뒤 출구는 따로 세어야 합니다.","math":"|H|²=(t²+a²−2ta cosθ)/(1+t²a²−2ta cosθ). a=1이면 분자=분모라 T=1입니다. t=a\u003c1, θ=0이면 분자=0입니다. Bragg는 δ=0에서 R=tanh²κL, T=sech²κL로 R+T=1입니다.","notebook":"Ring 탭에서 t=a=0.9, θ=0을 확인한 뒤 a=1로 바꾸세요. Bragg 탭에서는 R와 T를 함께 읽고 Circuit 탭에서는 P1+P2+Loss=Pin을 확인하세요. 서로 다른 모델의 출력 채널을 혼합하지 마세요."}},{"id":"3.1","short":"Coupling Basics","title":"Why Is Fiber-to-Chip Coupling Difficult?","time":"15–25분","lead":"Chapter 1의 Mode와 Chapter 2의 Field 정규화를 외부 Optical Interface에 적용합니다. 빛이 Chip에 도착하는 것과 원하는 Guided Mode로 들어가는 것은 서로 다른 조건입니다.","question":"Fiber에서 나온 빛이 Silicon Core를 향하면, 그 Power가 모두 PIC의 단일 Mode가 될까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"회로의 입구와 출구도 Optical Component입니다","scene":"io","html":"\u003cp>Chapter 2에서 Laser Input을 회로의 입력으로 두었을 때, 우리는 이미 원하는 Guided Mode가 여기되었다고 가정했습니다. 실제 장치에서는 그 앞에 Fiber나 Free-space에서 Chip으로 들어오는 \u003cstrong>Optical I/O\u003c/strong>가 있습니다. 밖에서 온 Field가 원하는 Mode로 얼마나 잘 결합하는지에 따라 같은 Laser Power라도 회로에 전달되는 Power가 달라집니다.\u003c/p>\u003cp>이번 앱 Chapter 3는 원본 교재 Chapter 5의 순서를 따릅니다. 먼저 Coupling의 어려움을 이해하고, Grating Coupler, Edge Coupler, Polarization을 배운 뒤 I/O Ledger를 완성합니다. 앞서 배운 Bragg Grating Filter는 Guided Field를 뒤로 반사하는 소자였고, 이번 Surface Grating은 Chip 밖의 Field와 연결하는 장치입니다. 두 개념은 분명히 구별하겠습니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Core가 겹쳐도 Mode가 같지는 않습니다","scene":"io","html":"\u003cp>Chapter 1에서 Mode는 전체 경계조건을 만족하는 Field Pattern이었습니다. Fiber의 Core 크기, Gaussian에 가까운 Mode Field Diameter, Silicon Core의 Width는 같은 양이 아닙니다. 두 물체의 중심을 정확히 맞추어도 Field의 크기·공간 분포·Phase·Polarization이 맞지 않으면 원하는 Mode에 전달되는 성분은 작을 수 있습니다.\u003c/p>\u003cp>\u003cstrong>Mode Overlap\u003c/strong>은 입력 Field를 수신 Mode라는 기저에 투영했을 때 남는 성분을 나타냅니다. 여기서는 먼저 같은 평면과 같은 매질의 두 Scalar Profile을 사용합니다. 각 Profile을 ∫|ψ|²dA=1로 정규화하면 복소 겹침 a=∫ψtarget*ψin dA이고, ηoverlap=|a|²입니다. 모양만 비슷한지 보는 것이 아니라, Field를 같은 정규화와 Phase 기준에서 적분한다는 점이 중요합니다.\u003c/p>\u003cp>예를 들어 입력과 Target의 Intensity가 같아도 한쪽 Field가 단면을 따라 빠르게 Phase를 바꾸면 적분 중 서로 상쇄될 수 있습니다. 반대로 공통 Absolute Phase를 곱하는 것은 η를 바꾸지 않습니다. 이는 Chapter 2의 MZI에서 Relative Phase와 공통 Phase를 구별했던 원리와 연결됩니다.\u003c/p>\u003cp>실제 Vector Mode에서는 E와 H의 Poynting Power 정규화가 필요합니다. 서로 다른 재료·Impedance가 만나는 Facet에서는 반사와 전파 가능한 채널도 고려해야 합니다. 따라서 \u003cstrong>Scalar Overlap을 실제 총 Coupling Efficiency와 동일시하지 않습니다.\u003c/strong> 이번 Lesson의 Gaussian 모델은 원리를 분리해 공부하기 위한 공통 평면의 해석 예제입니다.\u003c/p>\u003cp>출력 중 원하는 Guided Mode로 가지 않은 Power가 모두 흡수되었다고 단정해서도 안 됩니다. 다른 Mode, Reflection, Radiation이나 수집되지 않은 채널로 갈 수 있습니다. Notebook의 Overlap Deficit은 이 채널들을 구분하지 않습니다. 실제 Return Loss는 뒤로 돌아오는 Power를 별도로 측정하거나 계산해야 합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Gaussian 크기와 겹침을 정규화해 계산합니다","scene":"io","html":"\u003cdiv class=\"equation\">ψ\u003csub>w\u003c/sub>(x,y) = √(2/π)/w · exp[−(x²+y²)/w²]\u003cbr>∫|ψ\u003csub>w\u003c/sub>|²dA = 1, MFD = 2w\u003cbr>η = |∫ψ₂*ψ₁dA|²\u003cbr>중심 정렬: η\u003csub>size\u003c/sub> = [2w₁w₂/(w₁²+w₂²)]²\u003c/div>\u003cdl class=\"terms\">\u003cdt>w\u003c/dt>\u003cdd>1/e Field radius = 1/e² Intensity radius · µm\u003c/dd>\u003cdt>MFD\u003c/dt>\u003cdd>이 Gaussian 정의의 Mode Field Diameter · µm\u003c/dd>\u003cdt>ψ\u003c/dt>\u003cdd>단위 Power로 정규화한 Scalar Profile · µm⁻¹\u003c/dd>\u003cdt>η\u003c/dt>\u003cdd>주어진 두 Scalar Profile 사이의 Power Overlap · 0–1\u003c/dd>\u003c/dl>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 같거나 다른 Mode 크기\u003c/h3>\u003cp>가정한 Fiber Gaussian 반경 w₁=5.2 µm이면 MFD=10.4 µm입니다. Target 반경 w₂=2.0 µm, 같은 중심·Phase·Polarization이면 η=[2×5.2×2/(5.2²+2²)]²≈\u003cstrong>0.4490\u003c/strong>입니다. Overlap Penalty는 −10log₁₀η≈\u003cstrong>3.48 dB\u003c/strong>입니다. 중심 정렬이 완벽해도 크기 차이 때문에 1이 되지 않습니다.\u003c/p>\u003cp>w₂를 5.2 µm로 같게 만들면 이 가정에서 η=1입니다. 하지만 실제 소자의 Facet Reflection이나 Taper Loss가 0이 되었다는 뜻은 아닙니다. 두 Profile 사이의 한 가지 제한만 제거한 것입니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>크기 이외에 위치가 다르면\u003c/summary>\u003cdiv class=\"equation\">S = w₁²+w₂²\u003cbr>η(Δx,Δy) = η\u003csub>size\u003c/sub> exp[−2(Δx²+Δy²)/S]\u003c/div>\u003cp>단위는 모두 µm로 맞춥니다. 위치가 달라져도 각 입력 Profile의 전체 Power는 1이며 겹침만 줄어듭니다. 실제 Taper Geometry를 바꾸어 w₂를 얻는 계산은 이 식이 하지 않습니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"모양의 겹침과 전체 장치 효율을 구별합니다","scene":"io","html":"\u003cp>중심을 잘 맞췄다는 조건만으로 Efficiency가 1인지 판단할 수 있을까요? 다음 질문에서 Field 정규화, 공간 모양, 실제 Interface의 나머지 채널을 나
