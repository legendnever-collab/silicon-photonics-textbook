누어 생각해 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Mode 크기부터 비교한 뒤 위치를 바꿉니다","scene":"io","html":"\u003cp>Notebook에서 w₁=5.2 µm, w₂=2.0 µm와 5.2 µm를 차례로 비교하세요. Figure의 두 Map은 동일한 Unit-power 정규화를 사용하며 표시에는 공통 Intensity Scale의 제곱근을 사용합니다. 밝기의 차이를 실제 Laser Power 차이로 읽으면 안 됩니다. 두 Profile의 전체 Power는 같습니다.\u003c/p>\u003cp>다음 Δx를 0에서 2 µm로 옮겨 Overlap을 비교합니다. 한 Profile이 옮겨져도 그 자체의 정규화는 바뀌지 않습니다. 먼저 예측을 기록하고, ηsize와 Offset Factor가 어떻게 곱해지는지 확인하세요. 이 Lesson은 Diffraction Propagation이나 Facet 재료 경계의 Vector 해를 계산하지 않습니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"잘 도착하는 것과 잘 결합하는 것은 다릅니다","scene":"io","html":"\u003cul>\u003cli>Core Geometry와 Mode Field 크기를 구별했습니다.\u003c/li>\u003cli>Overlap은 정규화된 Complex Field의 투영이며 Power는 그 크기의 제곱입니다.\u003c/li>\u003cli>같은 중심에서도 크기·Phase·Polarization이 맞아야 합니다.\u003c/li>\u003cli>총 Interface Efficiency에는 Reflection과 다른 손실 채널이 추가됩니다.\u003c/li>\u003c/ul>\u003cp>다음에는 Chip의 윗면에서 들어오는 Field를 Guided Mode로 연결하는 Grating Coupler를 봅니다. 왜 Period와 Fiber Angle을 함께 정해야 하는지 Chapter 2의 Phase 개념을 이용해 설명하겠습니다.\u003c/p>"}],"prediction":"같은 중심에서 Target 반경을 2.0→5.2 µm로 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","이 Gaussian 모델의 Size Overlap이 1에 가까워진다","Core 중심이 같으므로 처음부터 언제나 1이다","Profile의 전체 Power가 자동으로 증가한다"],"predictionFeedback":"두 반경이 같을 때 정규화된 Profile이 같아져 ηsize=1입니다. 전체 Power가 증가한 것이 아니며 실제 Device의 Reflection/Taper Loss를 없앴다는 뜻도 아닙니다.","reflection":"정렬은 같지만 크기가 다른 두 Mode의 Overlap과 실제 Coupling Efficiency를 구별해 설명해 보세요.","sources":["I0","I1","I2"],"tutor":{"question":"정렬된 두 Scalar Profile의 Overlap이 1입니다. 무엇을 결론 내릴 수 있나요?","choices":[{"text":"실제 Fiber–Silicon Interface도 모든 손실 없이 100% 결합한다.","feedback":"Overlap은 명시한 공통 평면·매질의 두 Profile에 대한 결과입니다. 실제 Facet의 Impedance/Reflection, Mode Conversion, Taper Loss와 Polarization은 따로 확인해야 합니다.","concept":"Overlap과 장치 효율의 혼동"},{"text":"주어진 정규화 Profile의 공간·Phase 일치는 완벽하며, 실제 장치의 나머지 채널은 별도다.","feedback":"맞습니다. Scalar η는 Profile 투영의 한 부분입니다. 실제 총 효율에 적용하려면 같은 조건인지와 Vector/Fresnel/다른 채널의 처리를 확인해야 합니다.","concept":"모델 범위와 채널","correct":true},{"text":"Field를 두 배로 키우면 정규화 Overlap도 항상 네 배로 증가한다.","feedback":"정규화 Overlap은 입력과 Target의 Power로 나누므로 공통 Amplitude 크기에 의존하지 않습니다. 실제 결합 Power는 정규화 Efficiency에 입력 Power를 곱한 값입니다.","concept":"정규화 Efficiency와 절대 Power 혼동"}],"why":"기저 투영은 Field의 유사성을 정규화해 계산합니다. Cauchy–Schwarz 부등식으로 0≤|∫ψ₂*ψ₁|²≤1입니다. 실제 다른 재료 경계에서 어떤 Field가 만들어지는지는 이 적분만으로 풀지 않습니다.","simple":"입구의 모양과 들어오는 무늬가 잘 맞는지를 먼저 따지는 계산입니다. 잘 맞아도 입구에서 반사되거나 연결부에서 다른 Mode가 생길 수 있으므로 실제 장치 효율은 별도로 봐야 합니다.","math":"각 Profile의 ∫|ψ|²=1이면 η=|∫ψ₂*ψ₁|²입니다. 중심 정렬 Gaussian의 적분은 2w₁w₂/(w₁²+w₂²)이므로 η는 그 제곱입니다. 공통 exp(iχ)의 절댓값은 1이므로 η에 영향이 없습니다.","notebook":"반경을 같게 한 뒤 Δx만 바꾸세요. η가 줄어도 각 Map의 전체 Power는 1입니다. 크기 Slider를 실제 Silicon Tip Width로 읽지 말고 주어진 Scalar Profile의 반경으로 읽어 주세요."}},{"id":"3.2","short":"Grating Coupler","title":"Surface Grating Couplers and Phase Matching","time":"15–25분","lead":"주기 구조가 추가하는 Spatial Momentum으로 바깥 Field와 Guided Field의 Phase를 연결합니다. Phase가 맞는 조건과 높은 효율을 만드는 조건을 따로 배웁니다.","question":"왜 Grating Period만 바꾸어도 Fiber가 바라보는 각도와 결합 파장이 달라질까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"윗면에서 Chip에 접근하는 방법","scene":"io","html":"\u003cp>Surface Grating Coupler는 Chip 윗면 근처의 주기 구조를 이용해 외부 Optical Field와 Guided Mode를 연결합니다. Fiber를 위에서 놓을 수 있어 입출력 위치와 Wafer-level 접근을 설계할 여지가 생깁니다. 그러나 주기 구조가 있다는 사실만으로 빛이 원하는 방향과 원하는 Mode에 잘 결합하는 것은 아닙니다.\u003c/p>\u003cp>원본 §5.2는 성능 지표, 이론, 설계 방법, 실험 순서로 이어집니다. 이번 Lesson도 먼저 무엇을 Efficiency로 부르는지 정하고, 그 다음 Phase Matching을 계산한 뒤 실제 설계에서 더 필요한 항목을 정리합니다. 본문은 Grating을 반사 필터로 사용했던 Chapter 2와 직접 연결됩니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Period는 Phase를 맞추고, 구조는 나머지 채널을 정합니다","scene":"io","html":"\u003cp>Guided Field는 축 z를 따라 exp(iβgz)로 Phase를 누적합니다. 외부로 나가는 Plane Wave의 z 방향 성분은 kparallel=k₀nclad sinθ입니다. 여기서 θ는 \u003cstrong>Chip Surface Normal\u003c/strong>에서 잰 각도입니다. 이 두 Phase 누적이 다르면 긴 영역의 산란 기여가 상쇄될 수 있습니다. Grating은 Spatial Frequency G=2π/Λ를 제공하여 그 차이를 맞춥니다.\u003c/p>\u003cp>이번에는 전파 +z, 시간 exp(−iωt), 위쪽으로 나가는 Field의 +z 성분을 양으로 정합니다. 1차 조건은 βg−kparallel=G입니다. Fiber를 반대쪽으로 기울이거나 반대 방향 Guided Mode를 쓰면 부호를 일관되게 바꿔야 합니다. 단순히 sinθ의 절댓값을 넣으면 원래 정의와 다른 설계가 됩니다.\u003c/p>\u003cp>\u003cstrong>Grating 영역의 Effective Phase Index ngrat\u003c/strong>는 그 주기 구조 안의 전파를 근사하는 입력입니다. 이전 Chapter의 고정된 Strip neff와 자동으로 같은 값이 아니며 Group Index도 아닙니다. 이 Notebook은 ngrat를 Geometry에서 풀지 않습니다. 주어진 값에서 Period, 각도, 파장 관계만 계산합니다.\u003c/p>\u003cp>\u003cstrong>성능 지표.\u003c/strong> Coupling Efficiency는 원하는 외부/Guided Mode로 가는 Power 비율입니다. Directionality는 전체 방사 중 원하는 위쪽 방향으로 향하는 비율이며, Mode Overlap은 방사된 Field가 Fiber Mode와 맞는 정도입니다. 반사, 아래쪽 누설, 불완전한 산란과 연결부 손실도 영향을 줍니다. 따라서 Phase Matching의 만족이 Efficiency=1을 보장하지 않습니다. Bandwidth와 Return Loss 역시 별도의 성능입니다.\u003c/p>\u003cp>\u003cstrong>Uniform Array Model.\u003c/strong> N개의 동일한 산란 기여가 있다고 가정해 상대 Phase만 합하면 정규화된 Array Factor를 계산할 수 있습니다. Phase가 맞을 때 최대가 되고 N이 늘면 Phase Mismatch에 더 민감해집니다. 하지만 각 위치의 실제 산란 세기, Guided Power 감소, Gaussian Apodization, 반사와 BOX 간섭을 모두 생략하므로 이 그래프는 실제 Grating의 Coupling Spectrum이 아닙니다.\u003c/p>\u003cdetails>\u003csummary>원본 설계 Section · BOX, Focusing, Layout, 2D/3D와 측정\u003c/summary>\u003cp>실제 설계는 Waveguide/Cladding/Etch 구조에서 Mode를 구하고, 방사 방향·Profile·반사를 계산한 뒤 Fiber와의 Vector Overlap을 확인합니다. BOX와 Substrate는 아래쪽 Field가 반사되어 위쪽 Field와 간섭하는 Phase를 바꿀 수 있습니다. 이를 검증하지 않고 특정 BOX가 항상 더 좋은 효율을 준다고 단정할 수 없습니다.\u003c/p>\u003cp>Focusing Grating의 곡선 Groove는 횡 방향 Phase를 맞춰 좁은 Guide로 연결하는 구조적 방법입니다. 이는 1D Uniform Array만으로 검증할 수 없습니다. 2D FDTD의 단면 가정과 3D의 횡 방향 Focusing/Polarization 차이, Mesh/Port 수렴을 확인해야 합니다. 실제 Mask의 최소 Feature, Etch·Width 오차와 측정 Fiber 정렬도 별도로 봅니다.\u003c/p>\u003cp>측정에서는 Input/Output 두 Interface, Route Loss, Reference와 정렬 조건을 구분해야 합니다. 두 Coupler의 총 Loss를 하나의 값으로 착각하지 않습니다. 원본 실험 수치나 FDTD 결과를 이 릴리스에서 재현한 것은 아니며, 후속 GC-Vector-Solver/Stack/3D-Layout/Measurement로 연결합니다.\u003c/p>\u003c/details>"},{"key":"equation","label":"C · Understand the equation","title":"길이 방향 Phase 조건을 직접 계산합니다","scene":"io","html":"\u003cdiv class=\"equation\">βg = (2π/λ₀)ngrat, k∥ = (2π/λ₀)nclad sinθ\u003cbr>βg−k∥ = 2π/Λ\u003cbr>Λ = λ₀ / (ngrat−nclad sinθ)\u003cbr>sinθmatch = (ngrat−λ₀/Λ)/nclad\u003c/div>\u003cdl class=\"terms\">\u003cdt>λ₀, Λ\u003c/dt>\u003cdd>Vacuum Wavelength와 Period · Notebook nm, 내부 µm\u003c/dd>\u003cdt>θ\u003c/dt>\u003cdd>Surface Normal 기준 방사각 · °, 수식 내부 rad\u003c/dd>\u003cdt>ngrat\u003c/dt>\u003cdd>Grating 영역의 주어진 Phase Index 근사 · 무차원\u003c/dd>\u003cdt>βg,G,k∥\u003c/dt>\u003cdd>길이 방향 Phase 누적 / Spatial Momentum · rad/µm\u003c/dd>\u003c/dl>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 1550 nm, +10°의 Period\u003c/h3>\u003cp>ngrat=2.4, nclad=1, λ₀=1550 nm, θ=+10°이면 Λ=1550/(2.4−sin10°)≈\u003cstrong>696.21 nm\u003c/strong>입니다. θ=0이면 Λ≈645.83 nm이고, −10°이면 약 602.26 nm입니다. 각도의 부호가 바뀌면 같은 식의 결과도 달라집니다. Slider는 1 nm 간격이므로 Λ=696 nm에서 작은 Mismatch가 남을 수 있습니다.\u003c/p>\u003cp>|sinθmatch|&gt;1인 조건에서는 이 매질로 나가는 해당 차수의 Propagating Wave가 없습니다. 예를 들어 λ₀=1550 nm, Λ=400 nm, ngrat=2.4이면 sinθmatch=−1.475입니다. 이를 억지로 실수 각도로 표시하지 않습니다.\u003c/p>\u003c/div>\u003cdiv class=\"equation\">Δβ = βg−k∥−G, δ = ΔβΛ\u003cbr>F = |(1/N) Σ\u003csub>j=0\u003c/sub>\u003csup>N−1\u003c/sup> exp(ijδ)|²\u003cbr>δ→0: F→1\u003c/div>\u003cp>F는 동일한 N개 기여를 총 진폭 N으로 정규화한 상대 Coherent Factor입니다. F=1은 이 정규화의 최댓값이며 실제 100% Coupling이 아닙니다. 파장 곡선에서는 ngrat와 nclad를 고정하고 Phase 조건만 Sweep합니다.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"Phase가 맞으면 모든 Power가 Fiber로 갈까요?","scene":"io","html":"\u003cp>Phase Matching은 멀리 떨어진 산란 기여가 서로 보강될 수 있는 조건입니다. Directionality와 Mode Shape, 실제 산란 강도는 다른 조건이라는 것을 생각하며 Tutor에 답해 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Period, 각도, 산란 기여 수를 분리합니다","scene":"io","html":"\u003cp>ngrat=2.4, θ=10°, Λ=696 nm, λ₀=1550 nm에서 Δβ와 F를 확인하세요. 먼저 θ를 0°로 바꾸면 1550 nm 지점의 결과가 어떻게 바뀔지 예측합니다. 이후 Λ를 약 646 nm로 바꾸어 새 각도의 조건을 다시 맞춥니다.\u003c/p>\u003cp>다음 N만 바꾸어 같은 Phase Mismatch의 상대 민감도를 관찰하세요. N을 늘려 F 곡선이 좁아져도 실제 장치의 1 dB Bandwidth를 얻은 것은 아닙니다. N이 실제 방사 Envelope와 어떻게 연결되는지 풀지 않았기 때문입니다. 구조 Figure의 선이나 Groove 높이 역시 EM Field가 아닌 개념도입니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"공간적 주기는 Phase Matching의 설계 변수입니다","scene":"io","html":"\u003cul>\u003cli>외부 Wave의 축 방향 Phase와 Guided Wave의 Phase를 Grating G가 연결합니다.\u003c/li>\u003cli>Period, Angle, Wavelength는 부호 Convention 아래 함께 결정됩니다.\u003c/li>\u003cli>그 조건과 실제 Coupling Efficiency·Directionality·Bandwidth는 구별합니다.\u003c/li>\u003cli>BOX·Apodization·Focusing·2D/3D·실험은 후속 검증 단계입니다.\u003c/li>\u003c/ul>\u003cp>다음은 Chip 끝면으로 빛을 넣는 Edge Coupler입니다. 이번에는 공간적인 산란 주기 대신, Facet의 Mode 크기를 Fiber와 맞추고 그 Mode를 Chip 내부로 부드럽게 전달하는 과정을 살펴봅니다.\u003c/p>"}],"prediction":"같은 Index에서 Fiber Angle을 +10°→0°로 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","1550 nm에 맞는 Period가 약 696→646 nm로 달라진다","Angle은 Mode Phase와 무관해서 Period가 같다","Phase Matching만 맞추면 실제 효율도 항상 100%다"],"predictionFeedback":"Λ=λ/(ngrat−nclad sinθ)이므로 +10°와 0°의 matched Period가 다릅니다. F의 최댓값 1은 상대 Phase Factor의 정규화이며 실제 장치 효율을 뜻하지 않습니다.","reflection":"Bragg Filter와 Surface Grating Coupler의 출력 채널 차이, Phase Matching과 실제 Efficiency의 차이를 설명해 보세요.","sources":["I0","I3"],"tutor":{"question":"Grating Array Factor F=1을 얻었습니다. 올바른 해석은?","choices":[{"text":"이 Grating의 실제 Fiber Coupling Efficiency가 100%로 검증됐다.","feedback":"F는 동일 산란 기여들의 상대 Phase 합을 정규화한 값입니다. 실제 산란 Envelope, 위/아래 Directionality, Fiber Overlap, Reflection 등을 풀지 않았으므로 총 효율을 알 수 없습니다.","concept":"정규화 Array Factor를 Device 성능으로 오해"},{"text":"주어진 Period·Index·각도에서 동일 기여의 Phase가 맞았고, 실제 효율은 다른 채널도 필요하다.","feedback":"맞습니다. ΔβΛ가 2π 주기 안에서 정렬되었음을 뜻합니다. 원하는 실제 설계에서는 해당 차수와 방사 가능 여부, 전체 Field와 손실도 확인해야 합니다.","concept":"위상 조건과 성능 분리","correct":true},{"text":"원본 Bragg Filter와 같으므로 원하는 출력은 항상 Guide 뒤쪽의 Reflection이다.","feedback":"Bragg Filter는 전진·후진 Guided Mode를 결합합니다. Surface Grating은 외부 방사 Mode와 Guided Mode를 연결합니다. 주기 구조라는 공통점만으로 출력 채널을 같게 놓으면 안 됩니다.","concept":"두 Grating 용도의 혼동"}],"why":"Phase 합은 산란 기여들이 서로 상쇄되는지 보강되는지를 설명합니다. 같은 Phase라도 원하는 방향이 아닌 곳으로 방사하거나 Fiber Profile과 맞지 않으면 해당 Fiber에 전달되는 Power는 작을 수 있습니다.","simple":"여러 사람이 같은 박자로 맞춘 것과 소리가 원하는 마이크에 얼마나 들어오는지는 다른 문제입니다. 여기서는 박자에 해당하는 Relative Phase만 계산합니다. 이 비유는 실제 Field 계산을 대신하지 않습니다.","math":"βg−k₀nclad sinθ−2π/Λ=0이면 Σexp(ijδ)=N이므로 F=|N/N|²=1입니다. 실제 η에는 산란 세기와 Directionality, Vector Overlap 등 추가 입력/계산이 필요합니다.","notebook":"Period와 θ를 바꾸고 F와 Δβ를 함께 보세요. N을 바꾸면 상대 Envelope가 달라지지만 실제 측정 Bandwidth나 Efficiency라고 부르지 않습니다. θ의 Normal 기준과 부호도 확인하세요."}},{"id":"3.3","short":"Edge Coupler","title":"Edge Couplers, Inverse Tapers and Alignment","time":"15–25분","lead":"Facet에서 Mode 크기를 맞춘 뒤 Chip 내부의 작은 Mode로 연결합니다. 공간 정렬과 Angular Error를 분리해 관찰하고, Taper의 역할과 모델의 범위를 구별합니다.","question":"Silicon을 더 가늘게 만든 Inverse Taper가 어떻게 Fiber와 더 큰 Mode로 만날 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"끝면에서 Mode를 받아 Chip 내부로 전달합니다","scene":"io","html":"\u003cp>원본 §5.3의 Edge Coupler는 Chip의 끝면, 즉 \u003cstrong>Facet\u003c/strong> 쪽으로 빛을 주고받습니다. Surface Grating처럼 길이 방향의 주기로 외부 Wave의 Momentum을 바꾸는 대신, 외부 Field와 Facet의 Guided Mode를 맞추고 그 Mode를 Chip 내부로 전달합니다. 따라서 Mode 변환 구조와 실제 Facet 접근·정렬 조건을 함께 설계해야 합니다.\u003c/p>\u003cp>이번 Lesson은 먼저 Inverse Taper와 Overlay의 원리를 이해하고, 명시한 Gaussian Profile로 크기·위치·각도 오차의 영향을 나눠 계산합니다. ‘좁은 Tip이면 효율이 얼마’라는 임의 함수를 만들지 않습니다. Geometry를 바꾸면 Mode가 실제로 어떻게 달라지는지는 별도의 Vector Mode/Propagation 계산이 필요합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"작은 Core와 작은 Mode를 동일시하지 않습니다","scene":"io","html":"\u003cp>\u003cstrong>Inverse Taper\u003c/strong>는 Facet 쪽 Silicon Core를 가늘게 하고 내부로 갈수록 넓히는 구조입니다. 매우 좁은 Silicon Tip에서는 Confinement가 약해져 주변 낮은 Index 영역에 Field가 더 펼쳐질 수 있습니다. 따라서 Core가 작아져도 Mode의 공간 분포는 오히려 커질 수 있습니다. 이 관계는 Chapter 1에서 Core 밖의 Evanescent Field와 Cutoff를 배웠던 내용에 연결됩니다.\u003c/p>\u003cp>그대로 가늘게만 만들면 언제나 좋은 것은 아닙니다. 어떤 Local Mode가 존재하는지, Substrate로 새는 성분이나 제작 가능한 Tip 크기는 무엇인지 확인해야 합니다. \u003cstrong>Overlay Waveguide\u003c/strong>는 낮은 Index의 더 큰 구조에 Field를 담아 Fiber와의 Profile을 맞추고, 길이에 따라 Silicon Mode로 옮기는 방식입니다. 실제 Mode는 Silicon과 Overlay를 함께 포함한 단면의 해입니다.\u003c/p>\u003cp>\u003cstrong>Adiabatic Transition\u003c/strong>은 변화하는 단면의 Local Mode를 따라가면서 다른 Mode나 Radiation으로의 전환을 작게 하는 조건입니다. 단순히 길다는 이유만으로 충분하지 않고, Mode 간 β 차이와 단면의 변화율을 함께 봅니다. EME는 Local Mode 기저를 연결하는 방법이며 FDTD는 시간 영역의 Field를 전파시키는 방법입니다. 이번 정성 도식은 어느 쪽 Solver의 결과도 아닙니다.\u003c/p>\u003cp>\u003cstrong>Lateral Offset\u003c/strong>은 두 Mode 중심이 같은 평면에서 어긋난 경우입니다. Gaussian 반경이 같으면 Offset Penalty는 exp[−Δx²/w²]입니다. 반경이 커지면 같은 이동 거리의 상대 Penalty는 작아집니다. 하지만 처음부터 Size Mismatch가 있으면 중심 정렬의 절대 Overlap 자체가 낮을 수 있으므로, 절대 η와 η(Δx)/η(0)를 나눠 읽어야 합니다.\u003c/p>\u003cp>\u003cstrong>Angular Error\u003c/strong>는 Intensity가 같은 모양으로 겹쳐도 단면에 Phase Gradient를 만듭니다. 이번에는 같은 평면의 Field 하나에 exp(iqx)를 곱한 작은 각도 모델을 사용합니다. 큰 Mode일수록 단면 전체에 더 많은 Phase 차이가 쌓일 수 있으므로, Lateral Tolerance가 좋아지는 방향이 Angular Tolerance에도 항상 좋은 것은 아닙니다. 실제 Gap·NA·Facet Refraction·Wavefront Curvature는 이 모델의 범위 밖입니다.\u003c/p>\u003cp>실제 장치의 Tolerance를 말하려면 어떤 기준점에서 몇 dB 낮아지는지, 어느 방향의 이동인지, 여러 오차가 동시에 있는지 명시해야 합니다. 하나의 Gaussian 1 dB 거리에서 전체 Assembly Yield를 바로 얻을 수는 없습니다. Yield에는 오차 분포와 실제 Geometry/공정 결과가 필요합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"크기·위치·각도의 Penalty를 나눕니다","scene":"io","html":"\u003cdiv class=\"equation\">S=w₁²+w₂², q=(2πn/λ₀)sinδθ\u003cbr>η = [2w₁w₂/S]² × exp[−2Δx²/S] × exp[−q²w₁²w₂²/(2S)]\u003cbr>η(Δx)/η(0)=exp[−2Δx²/S]\u003cbr>Δx\u003csub>1dB\u003c/sub>=√(S ln10/20)\u003c/div>\u003cdl class=\"terms\">\u003cdt>w₁,w₂,Δx\u003c/dt>\u003cdd>가정한 Gaussian 반경과 Lateral Offset · µm\u003c/dd>\u003cdt>δθ\u003c/dt>\u003cdd>작은 Angular Error · °, 수식은 rad\u003c/dd>\u003cdt>q\u003c/dt>\u003cdd>평면의 Phase Gradient · rad/µm. n=1, λ₀=1.55 µm 고정\u003c/dd>\u003cdt>Δx1dB\u003c/dt>\u003cdd>같은 Size/Tilt 조건의 중심 정렬 대비 1 dB Offset · µm\u003c/dd>\u003c/dl>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 같은 5.2 µm Mode의 정렬\u003c/h3>\u003cp>w₁=w₂=5.2 µm, δθ=0이면 Δx=0에서 η=1입니다. Δx=2 µm에서는 η=exp(−4/27.04)≈\u003cstrong>0.8625\u003c/strong>이고 약 \u003cstrong>0.642 dB\u003c/strong> 낮아집니다. 상대 1 dB 거리는 Δx1dB=5.2√(ln10/10)≈\u003cstrong>2.495 µm\u003c/strong>입니다.\u003c/p>\u003cp>Offset을 0으로 돌리고 δθ=1°를 주면 q≈0.07075 rad/µm, ηtilt=exp[−(qw)²/4]≈\u003cstrong>0.9667\u003c/strong>입니다. 이 Angular Penalty는 같은 평면의 Phase Ramp만으로 계산한 값이며 Facet에서의 굴절이나 실제 Optical Gap 전파 결과가 아닙니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Adiabatic 조건을 식으로 읽는 방법\u003c/summary>\u003cdiv class=\"equation\">|⟨m|∂/∂z|n⟩| ≪ |βₙ−βₘ|\u003c/div>\u003cp>Local Mode의 변화가 다른 Mode의 상대 Phase 누적보다 충분히 느려야 한다는 개념적인 기준입니다. 양쪽 단위는 1/길이이며, 실제 Vector Mode 정규화·방사 채널·축방향 변화의 해석이 필요합니다. Local β가 비슷해지는 구간에서는 같은 길이 변화라도 전환이 커질 수 있습니다. 이 식에 임의의 β 값을 넣어 ‘필수 Taper 길이’를 생성하지 않습니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"큰 Mode가 모든 정렬 오차에 유리할까요?","scene":"io","html":"\u003cp>공간적인 위치 오차와 Phase Gradient가 있는 각도 오차는 같은 효과가 아닙니다. 큰 Mode의 Lateral Tolerance와 Angular Sensitivity를 나눠 생각한 뒤 Tutor의 설명과 비교해 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Offset과 Tilt를 각각 한 번씩만 바꿉니다","scene":"io","html":"\u003cp>먼저 Fiber와 Facet Gaussian 반경을 5.2 µm로 맞추고 Tilt=0에서 Δx를 0, 2.0, 2.5 µm로 움직이세요. Figure의 곡선은 중심 정렬 대비 상대 값이고, Readout의 η는 Size와 Tilt까지 포함한 절대 Scalar Overlap입니다. 두 값을 같은 이름으로 비교하지 않습니다.\u003c/p>\u003cp>Δx=0을 유지하고 Tilt를 0°→1°→3°로 바꾸세요. 다음 두 반경을 3 µm로 맞춘 경우와 비교합니다. Mode 크기가 변하면 위치 오차와 각도 오차의 민감도가 반대 방향으로 움직일 수 있습니다. 그림의 실제 Inverse Taper Width는 Slider와 연결하지 않으며, 이 실험은 주어진 Profile 간 비교입니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Facet에서의 일치와 Taper 안의 전달은 모두 필요합니다","scene":"io","html":"\u003cul>\u003cli>Inverse Taper는 작은 Core가 더 큰 Mode를 만들 수 있다는 원리를 이용합니다.\u003c/li>\u003cli>Overlay와 Local Mode 전환은 실제 단면/전파 Solver로 확인해야 합니다.\u003c/li>\u003cli>Size Mismatch, Offset, Tilt는 분리한 후 같은 조건에서 합칩니다.\u003c/li>\u003cli>상대 1 dB 거리를 실제 조립 수율로 바로 읽지 않습니다.\u003c/li>\u003c/ul>\u003cp>이제 공간적인 Profile과 Phase를 다뤘습니다. 다음에는 모양이 완벽하게 맞아도 Polarization이 다르면 결합이 줄어드는 이유를 배웁니다. Fiber의 두 직교 성분을 PIC의 원하는 입력 Mode에 어떻게 연결할지 생각해 보겠습니다.\u003c/p>"}],"prediction":"같은 반경을 키울 때 Offset과 Tilt의 민감도는?","predictionOptions":["먼저 예측을 선택하세요","같은 위치 이동에는 더 관대해질 수 있지만 같은 Tilt에는 더 민감해질 수 있다","두 오차에 항상 같은 비율로 유리하다","크기는 Phase Gradient와 무관하므로 Tilt Penalty는 없다"],"predictionFeedback":"같은 반경 w이면 Offset factor=exp(−Δx²/w²), Tilt factor=exp[−(qw)²/4]입니다. w가 커질 때 두 항의 민감도가 반대가 될 수 있습니다. 실제 Facet의 전체 공차는 추가 검증이 필요합니다.","reflection":"Inverse Taper의 Core 크기와 Mode 크기 관계, 그리고 Lateral/Tilt 오차의 Trade-off를 설명해 보세요.","sources":["I0","I1","I2"],"tutor":{"question":"Inverse Taper와 정렬 공차를 올바르게 설명한 것은?","choices":[{"text":"Silicon Tip을 좁히면 Mode도 언제나 작아져 Fiber와의 Mismatch가 커진다.","feedback":"Core와 Mode 크기는 같지 않습니다. Confinement가 약해지면 Field가 주변으로 펼쳐질 수 있습니다. 실제 크기와 Leakage는 전체 단면의 Local Mode를 풀어 확인해야 합니다.","concept":"Core Width와 Mode Radius 혼동"},{"text":"Field를 확장해 Facet의 공간 일치를 개선할 수 있지만 Taper 전환과 Offset/Tilt는 따로 확인해야 한다.","feedback":"맞습니다. Facet Overlap, Adiabatic Transfer, Reflection과 제조 가능성은 연결되어 있지만 서로 다른 검증입니다. Scalar 반경 Slider가 실제 Tip Geometry를 풀지는 않습니다.","concept":"인터페이스와 전파를 구분","correct":true},{"text":"Mode를 크게 하면 위치와 각도 오차가 모두 무조건 줄며 수율을 알 수 있다.","feedback":"큰 Mode는 같은 Lateral Offset에 관대해질 수 있지만 Phase Gradient에 의한 Angular Penalty는 커질 수 있습니다. Yield에는 실제 오차 분포와 장치 응답이 더 필요합니다.","concept":"Tolerance를 수율과 동일시"}],"why":"Facet의 입력 투영과 길이 방향의 Local Mode 전달은 별개입니다. 첫 번째가 좋아도 Taper 변화가 빠르면 다른 Mode로 전달될 수 있으며, Lateral/Angular 오차는 Amplitude와 Phase에 서로 다른 영향을 줍니다.","simple":"작은 Silicon이 약하게 빛을 붙잡으면 빛의 무늬가 주변으로 넓어질 수 있습니다. 넓은 무늬는 조금 옆으로 움직여도 겹치지만, 기울어진 Phase가 넓은 영역에 쌓이면 적분이 상쇄될 수 있습니다.","math":"같은 w에서 ηoffset=e^(−Δx²/w²), ηtilt=e^(−q²w²/4)입니다. w를 두 배로 하면 같은 Offset의 지수 크기는 1/4, 같은 q의 지수 크기는 4배입니다. 이것은 공통 평면 Gaussian 모델의 결과입니다.","notebook":"먼저 w₁=w₂, Tilt=0에서 상대 Offset 곡선을 읽으세요. 그 다음 Offset=0에서 Tilt만 바꾸세요. 두 실험의 원인을 구별한 뒤 실제 Taper/Facet의 빠진 항목을 메모해 보세요."}},{"id":"3.4","short":"Polarization","title":"Polarization, Jones States and Diversity","time":"15–25분","lead":"Field의 공간 모양이 같아도 Vector 방향과 상대 Phase가 다르면 같은 Optical State가 아닙니다. 두 직교 성분의 복소 Amplitude로 결합과 손실을 설명합니다.","question":"같은 Intensity를 가진 Linear, Circular Polarization을 원하는 PIC Mode로 똑같이 넣을 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"좋은 Spatial Overlap만으로 충분하지 않습니다","scene":"io","html":"\u003cp>지금까지의 Gaussian 모델은 두 Profile의 Polarization이 같다고 가정했습니다. 이제 이 가정을 풀어 봅니다. 같은 모양으로 같은 위치에 들어오는 빛도 원하는 Vector Mode와 Polarization이 직교하면 결합 성분이 0이 될 수 있습니다. 반대로 서로 다른 두 Polarization을 둘 다 사용하도록 Interface를 설계할 수도 있습니다.\u003c/p>\u003cp>원본 §5.4의 Polarization은 Grating과 Edge Coupler 모두에 연결되는 조건입니다. Fiber에서는 두 직교 성분을 생각할 수 있고, Chip의 높은 Index Contrast와 비대칭 단면에서는 Quasi-TE/TM의 Profile·Index·Coupling 응답이 달라질 수 있습니다. 이번 Lesson은 공통 기준면의 Jones State로 이 차이의 출발점을 이해합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"진폭 두 개와 상대 Phase가 상태를 정합니다","scene":"io","html":"\u003cp>한 지점의 Transverse Field를 두 직교 기준축 x,y의 Complex Amplitude로 나타낸 것을 \u003cstrong>Jones Vector\u003c/strong>라고 합니다. 공통 Absolute Phase는 관측 Power에 영향을 주지 않으므로, 전체 크기를 정규화하고 성분의 상대 진폭과 Relative Phase를 사용합니다. Ex와 Ey의 상대 Phase가 0 또는 π이면 직선으로 진동하고, 다른 Phase에서는 일반적으로 타원을 그립니다.\u003c/p>\u003cp>여기서는 전파 +z, 시간 exp(−iωt), j=[cosψ, exp(iχ)sinψ]를 사용합니다. ψ는 두 성분의 혼합 정도이고 χ는 y 성분의 x 대비 Relative Phase입니다. ψ=45°, χ=±90°이면 두 성분 크기가 같고 Quadrature이므로 원을 그립니다. 원편광의 좌·우 손잡이 명칭은 바라보는 방향과 시간 Convention에 따라 혼동될 수 있어, 그림에는 성분과 Convention을 직접 적습니다.\u003c/p>\u003cp>\u003cstrong>Projection.\u003c/strong> 수신 Mode가 공통 기준의 Linear Polarization u=[cosα,sinα]를 받는다면 결합 진폭은 u†j이고 Power 비율은 |u†j|²입니다. 직교한 다른 Analyzer의 결과를 합하면 정규화 입력 Power 1이 됩니다. 한쪽 Projection이 0이라고 모든 에너지가 사라진 것은 아닙니다. 실제 소자에서 그 다른 성분이 반사·흡수·다른 출력으로 가는지는 구조가 결정합니다.\u003c/p>\u003cp>\u003cstrong>TE/TM와 좌표.\u003c/strong> Chapter 1의 Chip 단면에서 x를 Width, y를 Height, z를 전파축으로 두면 Quasi-TE는 주로 Ex, Quasi-TM는 주로 Ey라는 설명을 사용했습니다. Fiber가 기울어져 들어오는 경우 그 Transverse 기준축을 Chip 기준으로 연결하는 변환도 필요합니다. 이번 Notebook은 이미 같은 기준면/기저로 표현한 두 성분을 가정하며, 실제 Quasi-TE/TM Mode Solver나 3D 좌표 변환을 계산하지 않습니다.\u003c/p>\u003cp>\u003cstrong>Polarization Dependent Loss, PDL\u003c/strong>은 입력 Polarization에 따른 최대/최소 Power Transmission의 비율을 dB로 나타냅니다. 공간적으로 좋은 정렬을 해도 PDL이 크면 입력 State 변화에 따라 전달 Power가 달라집니다. 하나의 Polarization에 대한 IL과 전체 State를 바꿔 측정하는 PDL은 다른 지표입니다.\u003c/p>\u003cp>\u003cstrong>Polarization Diversity\u003c/strong>는 입력의 두 직교 성분을 나눈 뒤 필요한 회전/변환을 거쳐 두 처리 경로로 보내는 방식입니다. 2D Polarization-splitting Grating이나 Splitter/Rotator가 이 목적에 쓰일 수 있습니다. 이는 한 성분을 단순히 버리는 Analyzer와 다른 구조입니다. 실제 두 경로의 Loss와 불균형까지 0이라는 뜻은 아닙니다.\u003c/p>\u003cp>Jones Vector는 Fully Polarized Coherent State를 나타냅니다. 두 성분의 Phase 관계가 무작위인 Unpolarized Light를 한 개의 고정 Jones Vector로 표현하면 안 됩니다. 그 경우 Stokes/Coherency 같은 통계적 표현이 필요하며, 이번 Notebook의 범위 밖입니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"복소 Vector의 내적을 Power로 바꿉니다","scene":"io","html":"\u003cdiv class=\"equation\">j = [cosψ, exp(iχ)sinψ]\u003csup>T\u003c/sup>, j†j=1\u003cbr>uα = [cosα,sinα]\u003csup>T\u003c/sup>\u003cbr>η∥=|uα†j|², η⊥=1−η∥\u003cbr>Linear input, χ=0°: η∥=cos²(ψ−α)\u003cbr>Linear input, χ=±180°: η∥=cos²(ψ+α)\u003c/div>\u003cdl class=\"terms\">\u003cdt>ψ,χ\u003c/dt>\u003cdd>혼합각, y/x Relative Phase · ° 입력, 내부 rad\u003c/dd>\u003cdt>α\u003c/dt>\u003cdd>Linear 수신/Analyzer의 방향 · °\u003c/dd>\u003cdt>η∥,η⊥\u003c/dt>\u003cdd>두 직교 Linear Channel의 Power 비율 · 무차원\u003c/dd>\u003cdt>Assumptions\u003c/dt>\u003cdd>정규화 Fully Polarized State, 공통 기저, 이상 Projection\u003c/dd>\u003c/dl>\u003cdiv class=\"worked\">\u003ch3>Worked Example · Linear와 Circular 입력\u003c/h3>\u003cp>x Linear 입력 ψ=0에서 Analyzer α=60°이면 η∥=cos²60°=\u003cstrong>0.25\u003c/strong>, η⊥=0.75입니다. 1 mW 입력이라면 이상적인 두 채널은 0.25/0.75 mW입니다. 반면 ψ=45°, χ=90°의 Circular State는 어떤 Linear Analyzer 방향에서도 η∥=\u003cstrong>0.5\u003c/strong>입니다.\u003c/p>\u003cp>ψ=45°, χ=0°와 χ=180°는 각 성분의 |Ex|²=|Ey|²=0.5가 같습니다. 하지만 α=45°에서 첫 번째는 η∥=1, 두 번째는 0입니다. 직교 축의 Power만으로 Relative Phase를 모두 알 수 없다는 예입니다.\u003c/p>\u003c/div>\u003cdiv class=\"equation\">가정한 독립 Power Transmissions Tx,Ty:\u003cbr>T(ψ)=Tx cos²ψ+Ty sin²ψ\u003cbr>PDL=10log₁₀[Tmax/Tmin]\u003c/div>\u003cp>Tx=1, Ty=0.1이면 PDL=10 dB이고 ψ=45°에서 T=0.55입니다. Ty=0이면 이상 PDL은 무한대입니다. 두 값 모두 0이면 최대/최소 비율이 정의되지 않습니다. 이것은 독립적으로 가정한 대각 Transmission 예이며 실제 Grating/Edge Device의 PDL 데이터가 아닙니다.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"Intensity가 같아도 Relative Phase는 다를 수 있습니다","scene":"io","html":"\u003cp>두 성분의 Power가 각각 0.5라는 정보만으로 Polarization State를 결정할 수 있을까요? j의 Relative Phase와 Analyzer 방향을 함께 생각한 뒤 Tutor 설명을 읽어 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Polarization State와 수신 기저를 따로 바꿉니다","scene":"io","html":"\u003cp>먼저 ψ=45°, χ=0°로 두고 Analyzer를 0°→45°→90°로 움직입니다. 다음 χ=180°로 바꿔 같은 위치의 Transmission을 비교합니다. 성분의 Power는 같아도 45° Analyzer에서는 결과가 바뀝니다. Field Ellipse Figure와 Projection Curve가 같은 State를 사용합니다.\u003c/p>\u003cp>χ=90°에서 ψ=45°인 원편광도 확인합니다. Linear Analyzer 방향을 바꾸어도 각 채널은 0.5입니다. ψ와 χ를 바꿀 때 Curve는 변하지만 두 직교 출력의 합은 항상 1입니다. 이 결과를 실제 단일 Polarization Coupler의 총 효율로 읽지 말고 이상적인 기저 Projection으로 읽어 주세요.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Optical I/O에는 Vector State도 포함됩니다","scene":"io","html":"\u003cul>\u003cli>정규화 Jones Vector는 두 성분의 복소 진폭을 나타냅니다.\u003c/li>\u003cli>Polarization 결합은 u†j의 크기 제곱입니다.\u003c/li>\u003cli>같은 Intensity 성분도 Relative Phase에 따라 다른 상태가 됩니다.\u003c/li>\u003cli>PDL과 단일 상태의 IL을 구별하고, Diversity는 두 성분의 처리 구조로 이해합니다.\u003c/li>\u003c/ul>\u003cp>다음은 Chapter의 마지막 Engineering Exercise입니다. 공간 Overlap과 Polarization Projection, Interface Residual Loss, Route Loss를 중복 없이 연결해 실제 입력 대비 Output Power를 계산하겠습니다.\u003c/p>"}],"prediction":"ψ=45°에서 χ를 0°→180°로 바꾸고 α=45°를 유지하면?","predictionOptions":["먼저 예측을 선택하세요","성분 Power는 같지만 Analyzer Transmission은 1→0으로 바뀐다","각 성분 Power가 같으므로 어떤 Analyzer 결과도 같다","Polarization은 Phase와 무관하므로 상태가 같다"],"predictionFeedback":"χ는 성분 사이의 Relative Phase입니다. j=(1,1)/√2와 (1,−1)/√2는 α=45° 기저에 대해 서로 직교합니다. 성분별 Intensity만으로 이 차이를 볼 수 없습니다.","reflection":"동일한 Ex/Ey Intensity에서 서로 다른 Polarization을 만드는 Relative Phase와, PDL·Diversity의 의미를 설명해 보세요.","sources":["I0","I4"],"tutor":{"question":"ψ=45°일 때 χ=0°와 180°를 어떻게 구별하나요?","choices":[{"text":"Ex/Ey Power가 각각 0.5로 같으므로 같은 Optical State다.","feedback":"같은 Intensity만으로 Relative Phase를 알 수 없습니다. (1,1)/√2와 (1,−1)/√2는 서로 직교한 Linear State이며 α=45° Projection에서 1과 0이 됩니다.","concept":"Intensity만으로 State를 판단"},{"text":"성분 Power는 같아도 Relative Phase가 달라 공통 기저의 Projection 결과가 달라진다.","feedback":"맞습니다. Jones Vector는 복소 성분을 포함합니다. α=45°에서 Field 합이 보강/상쇄되는 과정은 Chapter 2의 Interference와 같은 복소 합 원리입니다.","concept":"Relative Phase와 Vector 투영","correct":true},{"text":"어떤 Jones Vector 하나를 선택해도 Unpolarized Light를 그대로 표현할 수 있다.","feedback":"고정 Jones Vector는 Fully Polarized Coherent State입니다. Unpolarized 혼합에서는 성분 간 안정된 Relative Phase가 없으므로 Coherency/Stokes의 통계적 처리가 필요합니다.","concept":"순수 State와 비편광 혼합 혼동"}],"why":"두 직교 축의 측정은 그 기저의 Power만 줍니다. 다른 방향으로 투영하면 두 복소 성분이 합쳐져 Relative Phase에 대한 Cross Term이 나타나므로 두 상태를 구별할 수 있습니다.","simple":"같은 두 진폭이라도 함께 같은 방향으로 움직이는지 반대 방향으로 움직이는지가 다릅니다. 관찰 방향을 45°로 돌리면 그 차이가 보강과 상쇄로 나타납니다.","math":"u45†j=(cosψ+e^(iχ)sinψ)/√2입니다. ψ=45°이면 (1+e^(iχ))/2가 되고 χ=0,π에서 그 제곱 크기가 1,0입니다. 두 직교 Analyzer의 합은 Unit Norm 때문에 1입니다.","notebook":"ψ=45°를 고정하고 χ를 0,90,180°로 바꾼 뒤 α=45°에서 1,0.5,0을 확인하세요. 두 직교 채널의 합과 Field Ellipse도 함께 읽어 보세요."}},{"id":"3.5","short":"I/O Ledger","title":"Engineering an Optical I/O Power Ledger","time":"15–25분","lead":"앞서 배운 공간·Phase·Polarization을 실제 입력과 출력의 Power로 연결합니다. 서로 다른 정의의 Loss를 중복해서 곱하지 않고, 계산에 포함된 채널과 빠진 채널을 설명합니다.","question":"Interface의 전체 Insertion Loss를 이미 알고 있을 때, Mode Overlap Penalty를 또 곱해도 될까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"소자의 숫자를 연결하기 전에 정의를 맞춥니다","scene":"io","html":"\u003cp>Optical I/O를 비교할 때는 Efficiency와 Loss가 어떤 기준면, 어떤 Mode, 어떤 Polarization을 포함하는지부터 읽어야 합니다. 같은 ‘1 dB’라도 전체 Interface Loss인지, Profile Mismatch를 제외한 추가 Loss인지에 따라 연결 방법이 달라집니다. 숫자만 더하면 같은 손실을 두 번 셀 수 있습니다.\u003c/p>\u003cp>이번 마지막 Lesson은 원본의 Problems와 학습 목표를 바탕으로 새로 작성한 \u003cstrong>Guided Engineering Exercise\u003c/strong>입니다. Fiber Input → I/O Interface → On-chip Route → Output의 Power를 계산합니다. 모든 Parameter는 가정한 입력이며 특정 Foundry나 실제 장치의 추천 성능이 아닙니다. 최적화 점수나 정답 Gate 없이 자신의 설계 설명으로 Chapter를 마무리합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"각 Factor가 포함하는 채널을 먼저 적습니다","scene":"io","html":"\u003cp>첫째, 입력 Fiber와 주어진 Facet Gaussian Profile의 \u003cstrong>Spatial Overlap ηspatial\u003c/strong>을 계산합니다. 둘째, 공통 기저의 Linear Polarization을 수신 x축에 투영해 \u003cstrong>ηpol\u003c/strong>을 구합니다. 세 번째 \u003cstrong>Residual Interface Loss\u003c/strong>는 이 두 Penalty를 \u003cem>제외한\u003c/em> 독립 추가 손실로 정의합니다. 실제 반사나 Taper 전달을 계산한 것이 아니라 외부에서 주어진 가정입니다.\u003c/p>\u003cp>이렇게 정의할 때만 ηspatial×ηpol×ηresidual을 곱할 수 있습니다. 실제 Interface의 측정 Total IL이 이미 공간·편광·반사·연결 손실을 포함한다면, 측정값을 ηtotal로 한 번만 사용해야 합니다. 이때 공간과 편광 Penalty를 다시 곱하면 중복입니다. Factorization 자체도 공간 Profile과 Polarization이 분리된다는 이 모델의 가정이며 실제 Vector Device에서는 정확히 분리되지 않을 수 있습니다.\u003c/p>\u003cp>Chip 내부 Route에는 α[dB/cm]와 길이 L[mm]를 사용합니다. 앞선 Chapter의 dB/cm와 mm→cm 변환을 다시 적용합니다. Output Interface Loss는 \u003cstrong>Total IL\u003c/strong>로 정의해 한 번만 적용합니다. 출력에 또 Gaussian/Polarization Factor를 붙이지 않습니다.\u003c/p>\u003cp>각 단계의 Power를 순서대로 계산하면 그 단계에서 남은 Power와 감소량을 기록할 수 있습니다. 모든 단계의 감소량을 더해 최종 출력에 합하면 입력과 같아야 합니다. 다만 ‘감소량’이 어디로 갔는지까지 이 단순 Ledger가 풀지는 않습니다. 실제 Reflection/Radiation/Absorption을 나누려면 해당 채널을 가진 Solver나 측정이 필요합니다.\u003c/p>\u003cp>\u003cstrong>Grating과 Edge를 비교하는 기준.\u003c/strong> Grating은 Surface 접근과 방사 Phase Matching을, Edge는 Facet 접근과 Mode 변환을 요구합니다. 실제 Bandwidth, Polarization 응답, Alignment와 공정 제약은 구현에 따라 달라집니다. 이번 Gaussian Ledger의 값을 Grating 전체의 효율로 치환하거나, 어느 방식이 항상 우수하다는 결론을 내리지 않습니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>검토 조건\u003c/th>\u003cth>Surface Grating\u003c/th>\u003cth>Edge Coupler\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth>외부 접근\u003c/th>\u003ctd>Chip 윗면과 방사각\u003c/td>\u003ctd>끝면·Facet/패키지 접근\u003c/td>\u003c/tr>\u003ctr>\u003cth>핵심 Field 과정\u003c/th>\u003ctd>주기 구조의 방사·Mode Overlap\u003c/td>\u003ctd>Facet 일치와 Local Mode 변환\u003c/td>\u003c/tr>\u003ctr>\u003cth>이번 정량 범위\u003c/th>\u003ctd>Phase 조건과 상대 Array Factor\u003c/td>\u003ctd>가정한 Profile의 Overlap\u003c/td>\u003c/tr>\u003ctr>\u003cth>후속 검증\u003c/th>\u003ctd>BOX/Apodization/Focusing/Vector Spectrum\u003c/td>\u003ctd>Taper/Overlay/반사/3D 전달\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"key":"equation","label":"C · Understand the equation","title":"Sequential Power와 dB 계산이 같은지 확인합니다","scene":"io","html":"\u003cdiv class=\"equation\">P₁=Pinηspatial\u003cbr>P₂=P₁ηpol\u003cbr>P₃=P₂10\u003csup>−ILresidual/10\u003c/sup>\u003cbr>P₄=P₃10\u003csup>−(αLmm/10)/10\u003c/sup>\u003cbr>Pout=P₄10\u003csup>−ILout/10\u003c/sup>\u003cbr>Pout + Σ(Pbefore−Pafter) = Pin\u003c/div>\u003cdl class=\"terms\">\u003cdt>Pin,Pout\u003c/dt>\u003cdd>입출력 Optical Power · mW\u003c/dd>\u003cdt>α,Lmm\u003c/dt>\u003cdd>Propagation Loss [dB/cm], Route Length [mm]; Lcm=Lmm/10\u003c/dd>\u003cdt>ILresidual\u003c/dt>\u003cdd>Spatial/Polarization을 제외한 Interface Loss · dB\u003c/dd>\u003cdt>ILout\u003c/dt>\u003cdd>출력 Interface의 Total Loss · dB, 한 번만 적용\u003c/dd>\u003c/dl>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 1 mW 입력의 I/O Ledger\u003c/h3>\u003cp>가정한 Fiber와 Facet 반경을 모두 5.2 µm, Offset=0, Linear Polarization Error=0으로 둡니다. 따라서 ηspatial=ηpol=1입니다. Residual Interface IL=1 dB, α=3 dB/cm, L=2 mm=0.2 cm, Output Total IL=1 dB이면 Route는 0.6 dB이고 Total은 \u003cstrong>2.6 dB\u003c/strong>입니다.\u003c/p>\u003cp>Pout=1×10^(−2.6/10)≈\u003cstrong>0.549541 mW\u003c/strong>입니다. 입력 Polarization을 x축에서 45°인 Linear State로 바꾸면 ηpol=0.5가 되어 Pout≈\u003cstrong>0.274770 mW\u003c/strong>, Total≈\u003cstrong>5.610 dB\u003c/strong>입니다. 0.5를 Field Amplitude로 잘못 제곱해 0.25를 적용하면 3 dB를 추가로 중복 잃습니다.\u003c/p>\u003cp>Notebook 기본값 w₂=4.0 µm에서는 Spatial Overlap≈0.934205이므로 기본 Pout≈\u003cstrong>0.513384 mW\u003c/strong>입니다. Worked Example의 반경 5.2 µm를 먼저 넣어 비교한 뒤, 다른 조건을 한 번에 하나씩 바꿔 보세요.\u003c/p>\u003cp>Optical Power의 절대 단위와 손실 비율도 구별합니다. \u003cstrong>P[dBm]=10log₁₀(P[mW]/1 mW)\u003c/strong>이고, 역변환은 \u003cstrong>P[mW]=10^(P[dBm]/10)\u003c/strong>입니다. 1 mW는 0 dBm이므로 위 예제의 2.6 dB 손실 뒤에는 −2.6 dBm=0.549541 mW가 남습니다. 45° 조건에서는 −5.610 dBm≈0.274770 mW입니다. 입력이 달라져도 Pout[dBm]=Pin[dBm]−ILtotal[dB]가 성립합니다. Power=0이면 이상적인 dBm은 −∞이며 유한한 Power 측정값을 뜻하지 않습니다.\u003c/p>\u003c/div>\u003cdetails>\u003csummary>Interface의 측정 Total IL이 주어진 다른 문제\u003c/summary>\u003cp>입력 Interface Total IL이 2 dB이고 그것이 이미 정렬·편광·반사·Taper를 포함한다면, 입력 Interface의 전송은 10^(−2/10) 한 번입니다. 여기에 이번 Spatial Factor와 Polarization Factor를 다시 곱하면 안 됩니다. 이 Notebook은 Residual 정의를 사용하므로 측정 Total IL을 Residual Slider에 그대로 넣어서는 안 됩니다.\u003c/p>\u003c/details>"},{"key":"tutor","label":"D · Think with your tutor","title":"손실의 크기보다 정의가 먼저입니다","scene":"io","html":"\u003cp>아래 Tutor는 중복 계산과 단위 변환을 점검합니다. 수식으로 설명을 읽은 뒤 현재 Notebook의 각 Stage가 무엇을 포함하는지 직접 말해 보세요. 자유 메모는 자동으로 채점하지 않습니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"예측을 쓰고 Ledger와 비교합니다","scene":"io","html":"\u003col>\u003cli>기본 조건에서 입력과 각 Factor의 의미를 읽고 예상 Pout을 적습니다.\u003c/li>\u003cli>반경을 5.2 µm, Offset=0, Polarization Error=0으로 맞춰 Worked Example의 0.549541 mW를 확인합니다.\u003c/li>\u003cli>Polarization Error만 45°로 바꾸어 Output이 절반이 되는지 확인합니다.\u003c/li>\u003cli>Offset만 2 µm로 바꾸거나 Route Length를 바꾸어 Spatial Penalty와 Propagation Loss의 차이를 설명합니다.\u003c/li>\u003cli>각 단계 Lost Power와 최종 Pout의 합이 1 mW인지 확인합니다.\u003c/li>\u003cli>이 결과에서 알 수 없는 것—실제 Return Loss, 제조 수율, Grating/Edge의 우열—을 모델의 빠진 채널과 연결해 정리합니다.\u003c/li>\u003c/ol>\u003cp>Slider의 값은 현재 Figure와 Ledger가 공유합니다. Figure의 Schematic은 Conceptual이며 Graph와 숫자만 명시한 해석식에서 계산합니다. 실제 장치 데이터가 생기면 입력 정의와 기준면을 먼저 맞춘 다음 교체해야 합니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Chapter Review · Fiber에서 Guided Mode까지","scene":"io","html":"\u003cul>\u003cli>\u003cstrong>Coupling Challenge:\u003c/strong> 같은 중심에서도 공간·Phase·Polarization과 경계가 맞아야 합니다.\u003c/li>\u003cli>\u003cstrong>Grating:\u003c/strong> 주기 구조의 Phase Matching과 실제 Device Efficiency를 구별했습니다.\u003c/li>\u003cli>\u003cstrong>Edge:\u003c/strong> Facet Mode 일치와 Inverse Taper/Overlay의 전파 변환을 구별했습니다.\u003c/li>\u003cli>\u003cstrong>Polarization:\u003c/strong> Jones Vector와 공통 기저의 Projection으로 입력 State를 설명했습니다.\u003c/li>\u003cli>\u003cstrong>Ledger:\u003c/strong> 독립적인 Factor의 의미를 명시하고 손실을 한 번씩만 적용했습니다.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>자기 설명:\u003c/strong> ‘왜 완전한 중심 정렬이 Efficiency=1이 아닌가?’, ‘Grating Period와 θ의 부호가 왜 중요한가?’, ‘왜 작은 Silicon Tip이 큰 Mode를 만들 수 있는가?’, ‘같은 성분 Power인데 왜 다른 Polarization State인가?’, ‘Total IL과 Residual Loss를 어떻게 구별하는가?’를 자신의 말로 답해 보세요.\u003c/p>\u003cp>원본 순서상 다음은 Active Components와 Modulators입니다. 이번 Chapter의 Release Candidate는 여기서 학습 검토를 기다립니다. PN Phase Shifter나 다음 Chapter의 코드는 추가하지 않습니다. I/O Advanced의 Vector/EME/FDTD/제작/측정 심화 위치는 Source Mapping에서 확인할 수 있습니다.\u003c/p>"}],"prediction":"입력 Interface의 측정 Total IL을 사용하면서 Overlap Penalty를 또 곱하면?","predictionOptions":["먼저 예측을 선택하세요","이미 포함한 항목을 중복 계산할 수 있으므로 정의와 기준면을 확인한다","항상 더 정확해지므로 모든 Penalty를 무조건 곱한다","dB 단위면 물리량 정의와 상관없이 더해도 된다"],"predictionFeedback":"Total IL에 이미 Spatial/Polarization 등이 포함됐다면 해당 Penalty를 다시 적용하지 않습니다. 이번 Notebook의 Interface Slider는 두 항을 제외한 Residual Loss로 명시했습니다.","reflection":"현재 I/O Ledger의 입력 정의, Output Power의 변화 원인, 실제 장치 검증에서 추가로 필요한 채널을 수치와 함께 설명해 보세요.","sources":["I0","I1","I2"],"tutor":{"question":"측정 Input Interface Total IL에 Spatial/Polarization Penalty가 이미 포함돼 있습니다. 어떻게 계산하나요?","choices":[{"text":"Total IL에 이번 Gaussian Overlap과 Polarization을 다시 곱해 더 정확하게 만든다.","feedback":"이미 포함된 채널을 다시 적용하면 같은 손실을 중복 계산합니다. 전체 측정 전송을 한 번 쓰거나, 실제로 분리한 독립 Factor를 한 번씩 사용해야 합니다.","concept":"손실 채널 중복 계산"},{"text":"기준면과 포함 채널을 확인하고 측정 Total Transmission을 한 번 적용한다.","feedback":"맞습니다. 이번 Notebook은 Residual Interface Loss를 별도로 정의했으므로 측정 Total IL과 같은 입력이 아닙니다. 물리량의 범위를 맞춘 뒤 계산해야 합니다.","concept":"Loss 정의와 기준면","correct":true},{"text":"α=3 dB/cm, L=2 mm이면 Propagation Loss는 6 dB이다.","feedback":"2 mm는 0.2 cm입니다. 따라서 Propagation Loss는 3×0.2=0.6 dB입니다. 숫자에 단위를 맞추지 않으면 10배의 손실 오류가 생깁니다.","concept":"mm와 cm 단위 변환 오류"}],"why":"Loss는 특정 입력·출력 기준면과 채널을 비교한 비율입니다. 독립 Factor로 분해할 때만 각 Penalty를 곱할 수 있습니다. Total IL은 이미 그 내부 Factor를 합친 값일 수 있습니다.","simple":"한 번의 비용에 이미 포함된 항목을 장부에 다시 쓰면 합계가 달라집니다. Optical Power도 어떤 단계에서 빠진 양인지 먼저 이름을 붙이고 한 번만 계산해야 합니다.","math":"독립 ηj의 곱이면 ILtotal=−10log₁₀(Πηj)=ΣILj입니다. 같은 η를 두 번 곱하면 해당 IL을 두 번 더합니다. α[dB/cm]×L[mm]/10이 Route IL이며, Power는 10^(−IL/10)로 변환합니다.","notebook":"반경5.2, Offset0, Polarization0에서 2.6dB와0.549541mW를 확인하세요. 다음 ψ45°에서 Power가 절반이 됩니다. 각 Lost Stage와 최종 출력의 합이1mW인지도 확인하세요."}},{"id":"4.1","short":"Plasma Dispersion","title":"How Do Free Carriers Change Silicon Optics?","time":"12–18분","lead":"Passive Waveguide에서 고정된 n_eff를 다뤘다면, 이제 Carrier Density를 변경하여 Silicon의 Refractive Index와 Absorption을 조절하는 Active Photonics를 시작합니다.","question":"Carrier를 증가시키면 빛의 Phase만 변할까요, 아니면 Optical Loss도 달라질까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"빛을 전기적으로 조절한다는 뜻","scene":"carriers","html":"\u003cp>Chapter 1에서 굴절률은 Waveguide가 빛을 붙잡는 이유를 설명했습니다. Chapter 2에서는 Phase Difference가 MZI 출력 Power를 결정했습니다. 이제 \u003cstrong>같은 Waveguide의 Optical Property 자체를 전압과 전류로 바꾸는 방법\u003c/strong>을 배우겠습니다.\u003c/p>\u003cp>Silicon은 일반적인 조건에서 강한 Bulk Pockels Effect를 이용하는 소재가 아닙니다. 실제 Silicon Modulator에서는 Carrier Depletion, Injection, Accumulation으로 Free-carrier 농도를 변경하는 \u003cstrong>Plasma Dispersion Effect\u003c/strong>가 핵심입니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Electron과 Hole이 Silicon Optical Property를 바꿉니다","scene":"carriers","html":"\u003cp>Conduction Band의 \u003cstrong>Electron\u003c/strong>과 Valence Band의 \u003cstrong>Hole\u003c/strong>은 Optical Frequency의 전기장에 반응합니다. Free Carrier의 농도가 달라지면 복소 유전율이 달라지고, 그 결과 실수 Refractive Index뿐 아니라 Free-carrier Absorption도 변화합니다.\u003c/p>\u003cp>일반적으로 1550 nm에서 Carrier가 늘어나는 경우 Silicon의 Index는 낮아지고 Absorption은 커지는 방향을 보입니다. 이 두 효과를 반드시 함께 고려해야 합니다. Phase Shift가 커져도 삽입 Loss가 동시에 커질 수 있습니다.\u003c/p>\u003cp>Bulk Silicon의 Material Index 변화 \u003cstrong>Δn_Si\u003c/strong>는 Waveguide Mode의 \u003cstrong>Δn_eff\u003c/strong>와 같지 않습니다. 실제 Modulator에서는 전하가 어디에 분포하고 Optical Mode와 얼마나 겹치는지 계산해야 합니다. Chapter 1에서 공부한 Field Distribution이 다시 필요한 이유입니다.\u003c/p>\u003cp>이 효과를 실제 회로에 적용하려면 \u003cstrong>Complex Refractive Index\u003c/strong>를 함께 생각해야 합니다. Material 안에서 Phase Velocity를 정하는 실수 부분의 변화와 Field Energy가 감소하는 허수 부분의 변화는 서로 독립된 현상이 아닙니다. 그래도 학습 중에는 단위를 분리하여 읽어야 합니다. Δn은 무차원이고 α는 단위 길이당 감쇠계수입니다.\u003c/p>\u003cp>또한 Mode는 Silicon뿐 아니라 Cladding에도 퍼져 있습니다. Carrier가 존재하는 영역에서만 Optical Index가 달라지므로 동일한 Material Density를 가정하더라도 Waveguide Width, Junction Position, Polarization에 따라 Modulation Efficiency가 달라집니다. 이번 경험식 계산 뒤에 PN Junction과 Mode Overlap을 배우는 이유가 바로 여기에 있습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Material Index와 Mode Index를 구별합니다","scene":"carriers","html":"\u003cdiv class=\"equation\">Δn\u003csub>Si\u003c/sub> ≈ −(8.8×10⁻²² N + 8.5×10⁻¹⁸ P\u003csup>0.8\u003c/sup>)\u003cbr>Δα\u003csub>Si\u003c/sub> ≈ 8.5×10⁻¹⁸ N + 6.0×10⁻¹⁸ P [cm⁻¹]\u003c/div>\u003cp>위 식은 1550 nm의 Soref–Bennett 근사 경험식입니다. N과 P는 cm⁻³ 단위의 가정된 비음수 Carrier Density이며, Δn과 Δα는 \u003cstrong>Carrier가 없는 참조 상태\u003c/strong>에 대한 Bulk Material의 기여입니다. Doping/Temperature/Wavelength에 따른 실제 적용 정확도를 검증한 것이 아닙니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 두 물리 효과를 따로 읽기\u003c/h3>\u003cp>N=P=10¹⁷ cm⁻³라고 가정하면 Δn_Si≈−4.26×10⁻⁴, Δα≈1.45 cm⁻¹입니다. Power Absorption만 dB/cm로 바꾸면 4.343×1.45≈6.30 dB/cm입니다. 이 숫자를 실제 Waveguide Loss라고 사용하면 안 됩니다. Mode Overlap, Geometry와 전하 분포를 반영하지 않았기 때문입니다.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"Index만 바뀐다고 단정하면?","scene":"carriers","html":"\u003cp>Material과 Guided Mode의 차이를 확인하겠습니다. \u003cstrong>Bulk Δn_Si가 곧 실제 MZM의 Δn_eff\u003c/strong>라는 주장에는 어떤 문제가 있을까요?\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Carrier Density와 Δn, Δα를 각각 관찰하세요","scene":"carriers","html":"\u003cp>Physics Notebook에서 Electron/Hole Density를 개별적으로 조절하세요. Material Δn과 Absorption이 어떤 방향으로 바뀌는지 미리 예측한 뒤 두 결과를 확인합니다.\u003c/p>\u003cp>이 모델은 경험식 계산이며, 전극 전압에서 Carrier Density를 계산하지 않습니다. 다음 Lesson의 PN Junction은 Carrier 분포를 전기적으로 제어하는 단계입니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Phase와 Absorption을 함께 생각합니다","scene":"carriers","html":"\u003cul>\u003cli>Plasma Dispersion은 Refractive Index와 Absorption 모두에 영향을 줍니다.\u003c/li>\u003cli>Material Δn과 Optical Mode의 Δn_eff는 구별해야 합니다.\u003c/li>\u003cli>Carrier Distribution과 Mode Overlap 없이는 실제 Modulator 효율을 예측할 수 없습니다.\u003c/li>\u003c/ul>\u003cp>다음은 PN Junction을 사용하여 Carrier를 제거하는 방법을 배우겠습니다.\u003c/p>"}],"prediction":"Electron과 Hole Density를 동시에 증가시키면?","predictionOptions":["먼저 예측을 선택하세요","Bulk Δn은 음의 방향, Free-carrier Absorption은 증가","Refractive Index는 증가하고 Loss는 항상 0","Phase만 바뀌고 Absorption은 변하지 않음"],"predictionFeedback":"1550 nm 경험식에서는 Carrier 증가가 Bulk Index 감소와 Free-carrier Absorption 증가를 함께 만듭니다. 이는 Waveguide Δn_eff/Total Loss를 직접 예측하지는 않습니다.","reflection":"Carrier가 Δn과 Δα를 동시에 바꾸는 이유와, Material Δn에서 실제 Device Phase로 바로 갈 수 없는 이유를 설명하세요.","sources":["A0","A1"],"tutor":{"question":"Bulk Silicon 계산에서 Δn_Si가 −4×10⁻⁴라면 실제 PN Waveguide Δn_eff도 반드시 같은가요?","choices":[{"text":"예. 같은 Silicon이므로 두 값은 언제나 같습니다.","feedback":"Material 변화가 어디에 존재하는지와 Optical Mode Overlap이 결정되지 않았습니다. Δn_eff는 Field Weighting과 Vector Mode를 고려해야 합니다."},{"text":"아닙니다. 전하 분포 및 Optical Mode Overlap을 알아야 합니다.","feedback":"정확합니다. Material의 복소 Index 변화는 시작점이며 Device의 유효 Index와 Loss는 별도 계산이 필요합니다.","correct":true},{"text":"Absorption만 고려하면 Phase는 바뀌지 않습니다.","feedback":"Free Carrier는 실수 Index와 Absorption에 모두 영향을 주므로 Phase 효과를 버릴 수 없습니다."}],"why":"실제 Device는 공간적으로 다른 Carrier Density를 가지므로 전기/광학 Solver가 필요합니다.","simple":"재료의 색이 조금 바뀌어도 실제 빛의 공간 분포와 겹치는 영역에 따라 효과가 달라집니다.","math":"Δφ=(2π/λ₀)·Δn_eff·L입니다. Δn_eff를 Material Δn과 같게 두는 것은 별도 가정입니다.","notebook":"N/P Slider는 1550 nm Bulk 경험식 입력이며 Voltage → N/P 변환은 하지 않습니다."}},{"id":"4.2","short":"PN Phase Shifter","title":"How Does Reverse Bias Change Optical Phase?","time":"15–22분","lead":"PN Junction에서 Reverse Bias를 증가시키면 Depletion Region이 넓어집니다. 이 전기적 변화가 실제 Optical Mode의 Phase까지 이어지려면 무엇을 계산해야 할까요?","question":"Reverse Voltage가 증가했을 때 Depletion Width가 커지면, 그 자체로 VπL을 알 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Carrier와 Light가 만나는 영역","scene":"junction","html":"\u003cp>Silicon의 Carrier Density는 물리적으로 바꾸어야 합니다. \u003cstrong>PN Junction\u003c/strong>은 p-type과 n-type 영역을 접합하여 전기장과 Depletion Region을 형성합니다. Reverse Bias를 걸면 자유 Carrier가 비어 있는 영역이 확장됩니다.\u003c/p>\u003cp>목표는 전압을 Optical Phase의 변화로 연결하는 것입니다. 그러나 전압과 광학 Phase 사이에는 전하 분포, 복소 굴절률, Mode Overlap이라는 세 단계가 존재합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Depletion과 Optical Overlap","scene":"junction","html":"\u003cp>이상적인 Abrupt PN Junction에서는 Ionized Donor/Acceptor가 형성한 Space Charge Region이 전압에 따라 확장됩니다. 정성적 Figure의 파란/붉은 영역이 실제 TCAD Electron/Hole Distribution이라고 오해해서는 안 됩니다.\u003c/p>\u003cp>Reverse Bias가 증가하면 일정 영역의 Free Carrier가 줄어들어 Silicon의 Bulk Plasma Dispersion 기여가 달라집니다. 하지만 Optical Phase Response는 \u003cstrong>전하가 제거된 정확한 위치\u003c/strong>와 Optical Mode Profile의 겹침에 달려 있습니다. 서로 다른 Junction Position과 Doping에서는 같은 Depletion Width라도 Δn_eff가 다를 수 있습니다.\u003c/p>\u003cp>또한 Junction Capacitance와 Electrode Resistance는 동작 속도에 영향을 줍니다. \u003cstrong>Lumped RC Bandwidth\u003c/strong>는 첫 단순화이며, 실제 Traveling-wave MZM은 RF Loss, Impedance, Microwave/Optical Velocity Matching을 함께 다뤄야 합니다.\u003c/p>\u003cp>p 쪽과 n 쪽으로 뻗는 Depletion Region의 폭은 일반적으로 같지 않습니다. 총 폭 W가 같아도 N_A와 N_D 비율에 따라 경계 위치가 달라지고, 그 결과 빛이 집중된 Waveguide Core 안의 Carrier 제거 분포도 달라질 수 있습니다. 단면도만 보고 자동으로 Optical Phase를 계산해서는 안 됩니다.\u003c/p>\u003cp>Reverse Bias가 커지는 과정에서 Junction Capacitance도 변합니다. 반면 전극 금속의 Resistance, Contact, Distributed RF Line은 기하구조에 의존합니다. 특정 주파수에서 Voltage Swing이 실제 Junction에 얼마나 걸리는지를 모르면 정적 VπL와 고속 Modulation 성능을 하나의 숫자로 합칠 수 없습니다. TCAD, Vector Eigenmode, RF Co-simulation의 필요성을 단계적으로 이해하세요.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Depletion Width · Phase · VπL · RC","scene":"junction","html":"\u003cdiv class=\"equation\">W = √[(2ε\u003csub>Si\u003c/sub>/q)(1/N\u003csub>A\u003c/sub>+1/N\u003csub>D\u003c/sub>)(V\u003csub>bi\u003c/sub>+V\u003csub>R\u003c/sub>)]\u003cbr>Δφ=(2π/λ₀)Δn\u003csub>eff\u003c/sub>L\u003cbr>f\u003csub>3dB,RC\u003c/sub> = 1/(2πRC)\u003cbr>VπL = λ₀/[2|∂n\u003csub>eff\u003c/sub>/∂V|] (상수 민감도 모델)\u003c/div>\u003cp>W는 Abrupt 1D Junction의 총 Depletion Width입니다. N_A,N_D를 cm⁻³로 받으면 SI인 m⁻³로 변환해야 합니다. Δn_eff는 이 W 식에서 \u003cstrong>자동으로 나오지 않습니다.\u003c/strong> VπL에는 실제 Mode와 Carrier 변화에서 구한 ∂n_eff/∂V가 필요합니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 두 계산은 독립\u003c/h3>\u003cp>N_A=N_D=10¹⁷ cm⁻³, 300 K, 이상적 Silicon, V_R=2 V를 가정하면 W≈0.271 µm입니다. 별도로 Δn_eff=−0.001, L=775 µm, λ₀=1550 nm를 가정하면 Δφ=−π입니다. 첫 결과로 두 번째 값을 도출한 것은 아닙니다.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"전기적 폭과 광학적 Phase를 구분합니다","scene":"junction","html":"\u003cp>PN Junction의 Depletion Width를 계산한 후 실제 Device의 Optical Phase를 바로 예측할 수 있을까요? 모델의 범위를 확인해 봅니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Reverse Bias를 바꿔 Depletion Width를 확인합니다","scene":"junction","html":"\u003cp>Reverse Bias를 0→4 V로 바꾸어 1D Abrupt Junction의 W를 관찰하세요. 다음 R,C를 바꾸어 RC -3 dB Frequency가 변화하는 방향을 확인하세요.\u003c/p>\u003cp>Notebook의 별도 Δn_eff 입력은 \u003cstrong>가정한 Device Effective Index Change\u003c/strong>입니다. Depletion Width로부터 추정된 결과가 아니며 실제 TCAD나 Full-vector Mode 계산이 아닙니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"TCAD가 필요한 경계를 이해합니다","scene":"junction","html":"\u003cul>\u003cli>Reverse Bias는 PN Junction의 Depletion Region을 확장합니다.\u003c/li>\u003cli>Optical Phase는 Δn_eff와 Active Length로 계산합니다.\u003c/li>\u003cli>VπL와 RC는 다른 물리 지표이며 실제 Device에서는 전하·광학·전기 모델이 필요합니다.\u003c/li>\u003c/ul>\u003cp>다음에는 이 Phase Shifter를 Chapter 2의 MZI 한쪽 Arm에 연결해 보겠습니다.\u003c/p>"}],"prediction":"N_A,N_D 고정에서 Reverse Bias를 증가시키면?","predictionOptions":["먼저 예측을 선택하세요","이상적인 1D Depletion Width가 증가한다","Depletion Width는 반드시 줄어든다","이 식만으로 실제 Optical VπL도 자동 결정된다"],"predictionFeedback":"Abrupt Junction의 W는 √(Vbi+VR)에 비례해 증가하지만, 실제 Optical VπL은 Carrier·Mode Overlap과 Voltage Response가 필요합니다.","reflection":"PN Reverse Bias → Depletion Width → Carrier Redistribution → Δn_eff → Phase에서 실제 계산이 필요한 단계를 설명하세요.","sources":["A0","A2"],"tutor":{"question":"1D PN Depletion Width W만 알면 VπL을 결정할 수 있을까요?","choices":[{"text":"예. W는 Phase Shifter의 Optical Mode Overlap과 동일합니다.","feedback":"W는 전기적 Space Charge Region의 폭입니다. Optical Mode 분포와 Carrier-dependent Index가 빠져 있습니다."},{"text":"아닙니다. 전하 분포와 Optical Mode Overlap, 전압 감도가 필요합니다.","feedback":"맞습니다. 전기적 Depletion과 Optical Phase를 연결하려면 전기적·광학적 모델이 필요합니다.","correct":true},{"text":"RC Bandwidth만 알면 VπL을 계산할 수 있습니다.","feedback":"RC는 Small-signal Electrical Response의 근사이고 VπL은 전기 광학 Phase Sensitivity 지표입니다."}],"why":"W는 전기적 폭입니다. 실제 Mode와의 공간 중첩을 통해 Δn_eff로 변환합니다.","simple":"전압을 올려 비어 있는 공간이 넓어져도, 빛이 그 공간에 얼마나 있는지는 또 다른 질문입니다.","math":"Δφ=(2π/λ₀)Δn_eff L, f3dB=1/(2πRC). 두 식은 독립 입력으로 표시합니다.","notebook":"VR Slider와 별도의 Δn_eff 입력을 섞지 말고 모델 조건을 비교하세요."}},{"id":"4.3","short":"MZI Modulation","title":"From Voltage to Optical Power","time":"13–18분","lead":"Chapter 2에서 MZI는 Phase Difference를 출력 Power로 변환했습니다. 이제 PN Phase Shifter의 Voltage-controlled Δn_eff를 그 한쪽 Arm에 넣어 MZM의 작동 원리를 완성합니다.","question":"전압이 Optical Field를 직접 흡수하지 않아도, 왜 Output Power가 달라질 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Passive Interference에서 Active Modulation으로","scene":"mzi","html":"\u003cp>Chapter 2에서는 Passive MZI에 두 Optical Path를 주고 Interference를 공부했습니다. Chapter 4.2에서 PN Junction이 Phase Shifter를 만들 수 있다는 것도 배웠습니다. 두 지식을 연결하면 **Mach–Zehnder Modulator(MZM)**가 됩니다.\u003c/p>\u003cp>전압이 Photon의 에너지를 직접 크게 바꾸는 것이 아니라, 한 경로에 전달되는 Field의 Phase를 제어하고, 두 경로의 간섭 조건을 바꾸어 Output Port의 Power를 조절합니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Complex Field가 합쳐지는 순간","scene":"mzi","html":"\u003cp>이상적인 50:50 Splitter는 하나의 Optical Input을 두 경로로 나눕니다. 한 Arm의 Phase가 φ₁, 다른 Arm이 φ₂라면 Combiner의 한 출력은 두 복소 Field의 합, 다른 출력은 차에 해당하는 Port Convention을 가집니다.\u003c/p>\u003cp>절대 Phase가 아니라 \u003cstrong>Δφ=φ₁−φ₂\u003c/strong>가 중요합니다. Δφ=0에서는 한 Port에 Power가 집중되고, Δφ=π에서는 보완적인 다른 Port로 Power가 이동합니다. Lossless Model에서는 두 출력의 합이 항상 입력 Power와 같습니다.\u003c/p>\u003cp>실제 MZM에서는 각 Arm의 Insertion Loss, Electrode RC 및 Traveling-wave, Chirp와 Bias Drift, Extinction Ratio와 Laser Noise 등 추가 효과를 고려합니다. 이번 Lesson은 \u003cstrong>정상 상태의 이상적인 Field Interference\u003c/strong>를 정확하게 이해하는 것이 목적입니다.\u003c/p>\u003cp>Complex Optical Field를 더하는 과정에서 한쪽 Port는 Constructive Interference가 최대일 때 다른 Port는 Destructive Interference를 경험할 수 있습니다. 본 교재의 Port Convention에서 Δφ=0이면 Port 1에 모두 모이고, π라면 Port 2로 이동합니다. 실험에 앞서 이 결과를 손으로 유도해 보는 것이 Slider를 조작하는 것보다 중요합니다.\u003c/p>\u003cp>실제 Modulator는 한쪽 Arm만 Driven하는 Single-arm 방식, 양쪽 Arm에 반대 Phase를 걸 수 있는 Push–Pull 방식 등 다양한 구성을 가집니다. 동일한 Relative Phase를 만들더라도 광학 Chirp, 구동 전압, Common-mode 성분과 Loss Imbalance는 달라질 수 있습니다. 지금 배우는 Cosine Transfer는 이러한 설계 차이를 이해하기 위한 첫 출발점입니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Voltage → Δn_eff → Δφ → Transmission","scene":"mzi","html":"\u003cdiv class=\"equation\">Δφ = (2π/λ₀)·Δn\u003csub>eff\u003c/sub>(V)·L + φ\u003csub>bias\u003c/sub>\u003cbr>T₁ = cos²(Δφ/2)\u003cbr>T₂ = sin²(Δφ/2)\u003cbr>T₁+T₂=1\u003c/div>\u003cp>가정한 Linear Index Sensitivity S=∂n_eff/∂V에서 Δn_eff(V)=S·V라고 두는 간단한 예제입니다. S를 PN Junction의 Depletion Width에서 계산한 값이라고 주장하지 않습니다. 실제 Vπ 및 Loss를 알기 위해서는 Device Simulation/Measurement가 필요합니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · Phase π를 만들어 보기\u003c/h3>\u003cp>λ₀=1550 nm, L=1 mm, |S|=10⁻³/V를 가정하면 Vπ=λ₀/(2|S|L)=0.775 V입니다. Input Power를 1로 정규화하면 Δφ=0에서 T₁=1, T₂=0이고 Δφ=π에서 T₁=0, T₂=1입니다. 이 값은 이상적인 50:50, Lossless 조건에 한정됩니다.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"Phase와 Power를 혼동하지 않습니다","scene":"mzi","html":"\u003cp>PN Phase Shifter는 Δn_eff를 통해 Phase를 조절합니다. 그런데 MZI Combiner를 지나면 왜 Optical Power가 변할까요?\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"가정한 Device Sensitivity를 조작합니다","scene":"mzi","html":"\u003cp>Notebook에서 Applied Voltage와 Effective Index Sensitivity를 변경하며 Phase와 두 Output Power를 함께 관찰합니다. 특히 V=0, Vπ/2, Vπ 조건을 비교해 보세요.\u003c/p>\u003cp>Voltage→Δn_eff는 교육용 Linear Sensitivity 입력입니다. 실제 PN Junction의 Carrier Distribution, Voltage-dependent Absorption과 RF 동작을 계산한 결과가 아닙니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"MZM은 MZI의 Phase를 제어합니다","scene":"mzi","html":"\u003cul>\u003cli>MZM은 전압으로 Optical Phase를 조절하고, Interference를 통해 Output Power를 바꿉니다.\u003c/li>\u003cli>두 Port의 Power는 이상적인 Lossless Model에서 보완적입니다.\u003c/li>\u003cli>VπL는 Device Sensitivity가 있어야 정의됩니다.\u003c/li>\u003c/ul>\u003cp>다음은 MZI 대신 Ring Resonance를 이용하는 Micro-ring Modulator를 배웁니다.\u003c/p>"}],"prediction":"Lossless MZI에서 Δφ를 0에서 π로 바꾸면?","predictionOptions":["먼저 예측을 선택하세요","두 Port의 정규화 Power가 서로 교환된다","두 Port Power가 모두 같은 방향으로 사라진다","Power는 Phase와 무관하므로 변화하지 않는다"],"predictionFeedback":"T₁=cos²(Δφ/2), T₂=sin²(Δφ/2)이므로 한 Port에서 다른 Port로 전달됩니다. Lossless Model에서 합은 1입니다.","reflection":"PN Junction의 Voltage 변경이 왜 MZI Combiner에서 Intensity Modulation으로 변환되는지 설명하세요.","sources":["A0","C0"],"tutor":{"question":"이상적인 Lossless MZI에서 Phase만 조절했을 때 두 Output Port의 Power 합은?","choices":[{"text":"Phase가 π일 때 두 Port 합이 모두 0이 됩니다.","feedback":"보완적인 두 Port를 모두 모으면 Lossless Model에서 Power는 보존됩니다."},{"text":"항상 입력 Power와 같습니다.","feedback":"맞습니다. Δφ는 두 Port 사이의 Power 분배를 바꾸며, 이 이상 모델에서는 전체 Power가 보존됩니다.","correct":true},{"text":"Phase 자체가 Power이므로 π를 곱해 계산합니다.","feedback":"Phase의 단위는 rad이고 Power는 Field Amplitude 크기의 제곱과 연결됩니다."}],"why":"출력 두 포트는 간섭하는 복소 Field 조합이며 Δφ가 에너지 분배를 정합니다.","simple":"두 물결이 같은 위상으로 만나면 한쪽 출구에서 강해지고, 반대 출구에서는 약해집니다.","math":"|1+e^{iΔφ}|²/4=cos²(Δφ/2), |1−e^{iΔφ}|²/4=sin²(Δφ/2).","notebook":"Voltage를 바꿀 때 Phase와 두 Transmission Curve를 같이 보세요."}},{"id":"4.4","short":"Ring Modulators","title":"How Does Resonance Turn Index into Intensity?","time":"15–22분","lead":"Chapter 2의 Ring Resonator에 Carrier-driven Effective Index 변화가 생기면 Resonance가 이동합니다. 고정된 Laser Wavelength에서 Through Port Transmission이 왜 바뀌는지 설명합니다.","question":"Ring Resonance를 약간 움직였을 뿐인데, 왜 고정 파장 Laser의 Output Power가 크게 달라질까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Interference와 Resonance의 민감도","scene":"ring","html":"\u003cp>Chapter 2에서 Ring Resonator는 한 바퀴 돌아온 Optical Field와 Bus Waveguide의 Field가 간섭하는 구조였습니다. 이 \u003cstrong>Resonant Filter\u003c/strong>를 Active하게 만들면 Micro-ring Modulator(MRM)가 됩니다.\u003c/p>\u003cp>MZI와 달리 Ring은 Resonance 근처에서 작은 Phase 또는 Index 변화가 큰 Transmission 변화를 일으킬 수 있습니다. 작은 Footprint와 구동 규모의 장점이 있지만, Wavelength/Temperature Drift와 Photon Lifetime에 민감해지는 새로운 Trade-off가 생깁니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Ring의 Coupling과 Loss, Resonance","scene":"ring","html":"\u003cp>Bus Waveguide와 Ring 사이의 Coupler는 일부 Optical Field를 Ring 내부로 전달하고, Ring은 한 바퀴 돌며 Phase와 Loss를 누적합니다. Through Port Field는 직접 지나간 Field와 Ring에서 누적되어 나온 Field의 Coherent Sum입니다.\u003c/p>\u003cp>\u003cstrong>Self-coupling Amplitude r\u003c/strong>와 \u003cstrong>Roundtrip Amplitude a\u003c/strong>는 Power가 아니라 Field Amplitude입니다. Resonance 조건에서 r=a일 때 이상적인 단일 Bus All-pass Ring의 Through Port Transmission은 0이 될 수 있습니다. 이 상황을 Critical Coupling이라고 합니다.\u003c/p>\u003cp>PN Junction이 Ring 일부 또는 전체의 Δn_eff를 바꾸면 Resonance Wavelength가 이동합니다. 하지만 Thermal Drift도 같은 방식으로 Resonance를 이동시킬 수 있기 때문에, 실제 MRM에서는 Laser Locking과 Tuning이 중요합니다. DC Optical Response와 고속 EO Response를 혼동하지 않습니다.\u003c/p>\u003cp>Ring이 민감한 또 다른 이유는 Optical Energy가 Cavity에 잠시 저장되기 때문입니다. 강하게 공명하는 조건에서는 Roundtrip Field가 계속 더해져 Sharp한 Spectral Feature를 만들지만, 저장된 Energy가 빠져나오는 데에도 시간이 필요합니다. Optical Photon Lifetime과 전기적 Junction RC의 영향을 분리해야 합니다.\u003c/p>\u003cp>MRM의 Optical Spectrum에서는 특정 Laser Line이 Resonance Dip의 어느 경사에 놓여 있는지도 중요합니다. 너무 깊거나 평탄한 지점에서는 작은 Detuning이 출력 Power를 거의 바꾸지 않거나, 원하는 Modulation Depth를 얻기 어려울 수 있습니다. 따라서 Bias Point와 Thermal Tracking이 실제 Ring Modulator의 설계·제어에서 핵심입니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"All-pass Ring Transfer와 Resonance Shift","scene":"ring","html":"\u003cdiv class=\"equation\">T\u003csub>through\u003c/sub>(θ) = (r²+a²−2ra cosθ)/(1+r²a²−2ra cosθ)\u003cbr>Δλ\u003csub>res\u003c/sub> ≈ λ\u003csub>res\u003c/sub> Δn\u003csub>eff\u003c/sub>/n\u003csub>g\u003c/sub>\u003c/div>\u003cp>첫 식은 이상적인 단일 Bus, Lossy Ring의 Through Power Transfer입니다. r과 a는 [0,1]의 실수 Amplitude이고 θ는 Roundtrip Phase입니다. Resonance Shift 근사는 작은 Δn_eff, 고정 Geometry 및 Group Index를 가정합니다. \u003cstrong>Group Index\u003c/strong>는 Phase Index와 구별해야 합니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 작은 Index 변화\u003c/h3>\u003cp>λ=1550 nm, n_g=4.0, Δn_eff=−1×10⁻⁴이면 Δλ_res≈−0.03875 nm입니다. Wavelength 이동이 작아 보여도 Linewidth가 좁은 Ring에서는 고정된 Laser의 Transmission 변화가 클 수 있습니다. 그러나 단순 정적 Transfer 곡선만으로 EO Bandwidth를 계산할 수는 없습니다.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"Resonance Dip과 전기적 Bandwidth는 같은가?","scene":"ring","html":"\u003cp>Ring의 Through Spectrum과 EO Small-signal Response가 왜 서로 다른 측정인지 확인합니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Detuning과 Coupling을 분리해 관찰합니다","scene":"ring","html":"\u003cp>Notebook에서 Roundtrip Phase(Detuning), r과 a를 조절하며 Resonance Dip 깊이를 비교합니다. Δn_eff 입력을 바꿔 Shifted Resonance가 어느 방향으로 이동하는지 함께 확인합니다.\u003c/p>\u003cp>이 Figure는 정적 All-pass Ring Model입니다. Carrier Lifetime, Traveling RF Electrode, Photon Lifetime, RC가 포함되지 않아 실제 Gb/s Modulation을 예측하지 않습니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Micro-ring의 장점과 Trade-off","scene":"ring","html":"\u003cul>\u003cli>MRM은 Δn_eff를 Resonance Wavelength 이동으로 변환합니다.\u003c/li>\u003cli>Critical Coupling은 Amplitude 조건이고 Optical Spectrum과 Dynamic Bandwidth는 다릅니다.\u003c/li>\u003cli>고 Q Resonance의 민감도는 Thermal Drift와 Optical/Electrical Speed Trade-off도 가져옵니다.\u003c/li>\u003c/ul>\u003cp>다음에는 Carrier를 제거하는 대신 주입하는 PIN 구조를 배웁니다.\u003c/p>"}],"prediction":"Δn_eff가 음의 방향으로 바뀌면 n_g>0 조건의 Ring Resonance는?","predictionOptions":["먼저 예측을 선택하세요","더 짧은 Wavelength 쪽으로 이동한다","항상 더 긴 Wavelength 쪽으로 이동한다","Resonance는 Index와 무관하다"],"predictionFeedback":"Δλ_res≈λΔn_eff/ng이므로 이 모델에서는 Δn_eff\u003c0일 때 Blue Shift입니다. 이것만으로 고속 응답은 알 수 없습니다.","reflection":"MZM과 MRM이 Phase 변화로 Optical Intensity를 제어하는 방법의 차이와 MRM에서 Thermal Control이 중요한 이유를 설명하세요.","sources":["A0","C3"],"tutor":{"question":"고 Q Ring의 Optical Transmission Spectrum만으로 3 dB EO Modulation Bandwidth를 알아낼 수 있나요?","choices":[{"text":"예. Spectral Linewidth만 알면 실제 전체 EO Bandwidth가 자동 확정됩니다.","feedback":"Photon Lifetime 관련 광학 제한과 전기 RC/Carrier Transport 등이 별개이며 측정/모델이 필요합니다."},{"text":"아닙니다. Cavity Dynamics, Junction RC와 Carrier Transport까지 필요합니다.","feedback":"맞습니다. 정적 Ring Spectrum은 동적 전체 Device Response를 직접 나타내지 않습니다.","correct":true},{"text":"고 Q는 모든 경우 속도를 무한히 증가시킵니다.","feedback":"더 좁은 Resonance는 민감도를 높일 수 있지만 Photon Lifetime과 Thermal Stability에 제한을 줍니다."}],"why":"광학 Spectrum의 폭과 시간응답 사이에는 관계가 있으나 전기/Carrier 동역학을 포함해야 실제 EO Bandwidth가 됩니다.","simple":"민감한 공명기는 작은 변화를 잘 보여주지만 반응 속도와 온도 변화에도 민감할 수 있습니다.","math":"T=(r²+a²−2ra cosθ)/(1+r²a²−2ra cosθ); Δλ≈λΔn_eff/ng. 두 식을 전기 주파수 응답으로 오용하지 않습니다.","notebook":"r=a, θ=0에서 Transmission Dip을 확인한 다음 r−a를 바꾸세요."}},{"id":"4.5","short":"Forward PIN / VOA","title":"How Does Carrier Injection Attenuate Light?","time":"12–18분","lead":"Reverse-biased PN의 Depletion과 달리 Forward-biased PIN은 Carrier Injection을 이용합니다. Phase 제어뿐 아니라 Optical Attenuation을 능동적으로 만들 수 있습니다.","question":"주입한 Carrier가 늘면 같은 Waveguide의 Optical Power는 어떻게 줄어들 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Depletion과 Injection은 서로 다릅니다","scene":"pin","html":"\u003cp>Chapter 4.2에서는 Reverse Bias가 Junction의 Carrier를 제거하는 Depletion Regime를 배웠습니다. 이제 \u003cstrong>Forward-biased PIN Junction\u003c/strong>에서는 Carrier를 Active Region으로 주입하는 Injection Regime를 이해합니다.\u003c/p>\u003cp>주입 Carrier가 만든 Free-carrier Absorption을 이용하면 전기적 제어만으로 Optical Intensity를 낮추는 Variable Optical Attenuator(VOA)를 만들 수 있습니다. 이 경우 MZI를 통해 Phase를 Power로 변환할 필요가 없습니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"PIN Junction과 Absorption","scene":"pin","html":"\u003cp>PIN Junction은 p형과 n형 사이에 본래 낮은 Doping의 Intrinsic Region을 두고 있습니다. Forward Bias에서는 Electron과 Hole이 Injection/Transport되어 Optical Mode와 겹치는 위치의 Carrier Density가 변할 수 있습니다.\u003c/p>\u003cp>Free-carrier Injection은 Index와 Absorption 둘 다 바꿉니다. 따라서 PIN Phase Shifter와 VOA는 서로 완전히 독립된 Effect가 아니라, 같은 Carrier Control의 다른 이용 방식입니다. 이 Lesson은 먼저 Power Absorption에 주목합니다.\u003c/p>\u003cp>실제 Injection Dynamics는 Carrier Lifetime, Diffusion, Recombination 및 Device Geometry에 의해 결정됩니다. 임의의 Voltage-to-Carrier Density 곡선을 만들면 물리적으로 타당하지 않으므로, Notebook에서는 \u003cstrong>가정한 추가 Absorption Coefficient\u003c/strong>만 직접 입력하도록 합니다.\u003c/p>\u003cp>Attenuation Device와 Phase Shifter의 기능을 비교할 때 Optical Power와 Optical Field를 다시 구별합시다. Power가 1/e로 줄었다면 Field Amplitude는 통상 1/√e로 줄어듭니다. 어떤 문헌에서는 α를 Field Amplitude Loss로, 다른 경우에는 Power Loss로 정의하기 때문에 식의 지수에 Factor 2가 나타날 수 있습니다. 단위를 명시한 정의에서 시작해야 합니다.\u003c/p>\u003cp>Carrier Injection은 Depletion과 반대로 Device 안에 이동 Carrier가 추가되는 과정입니다. Forward Current를 유지하려면 전력을 소비하고, 주입된 Carrier를 다시 제거하려면 Recombination이나 Extraction이 필요할 수 있습니다. 따라서 Attenuation Strength와 Dynamic Speed 사이의 실제 Trade-off는 Voltage나 Carrier Density만으로 판단할 수 없습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Power Attenuation의 지수 법칙","scene":"pin","html":"\u003cdiv class=\"equation\">P(L)/P(0) = exp(−Δα·L)\u003cbr>IL = −10log₁₀[P(L)/P(0)] = 4.343·Δα·L\u003c/div>\u003cp>Δα는 \u003cstrong>Power Attenuation Coefficient\u003c/strong>이고 cm⁻¹, L은 cm입니다. Field Amplitude 감쇠계수로 정의할 때는 지수의 Factor가 달라지므로 정의를 명확히 합니다. 산란/반사 및 입력 Connector Loss는 포함되지 않습니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · Carrier-induced extra Loss\u003c/h3>\u003cp>Δα=10 cm⁻¹, L=1 mm=0.1 cm이라면 T=e⁻¹≈0.368, 추가 IL≈4.343 dB입니다. 여기서 Δα는 실측/TCAD 결과가 아닌 \u003cstrong>독립적으로 가정한 숫자\u003c/strong>입니다. 이를 특정 PIN Voltage의 Loss로 오해하지 마세요.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"Carrier Lifetime 없이 Speed를 주장할 수 없습니다","scene":"pin","html":"\u003cp>주입한 Carrier가 Optical Phase와 Absorption에 미치는 관계를 생각해 봅니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Δα와 Active Length를 조절합니다","scene":"pin","html":"\u003cp>Notebook에서 Δα와 Active Length L을 변화시키고 Output Transmission과 추가 Loss[dB]의 관계를 관찰합니다. 동일한 Δα에서 L을 늘릴수록 Power가 지수적으로 감소합니다.\u003c/p>\u003cp>실제 PIN VOA의 Control Voltage를 입력받지 않습니다. Carrier Dynamics를 풀지 않았으므로 응답 시간이나 소비 전력을 예측하지 않습니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Variable Optical Attenuator 이해","scene":"pin","html":"\u003cul>\u003cli>Forward PIN은 Carrier Injection으로 Free-carrier Absorption을 조절할 수 있습니다.\u003c/li>\u003cli>Power Attenuation은 정의된 α와 L에 대해 exp(−αL)입니다.\u003c/li>\u003cli>적용 Voltage, Speed, Device Loss는 전하 수송과 Mode Overlap이 있어야 계산할 수 있습니다.\u003c/li>\u003c/ul>\u003cp>다음 Lesson에서 Injection과 Thermal Tuning을 비교합니다.\u003c/p>"}],"prediction":"Δα=10 cm⁻¹ 고정에서 Length를 두 배로 늘리면?","predictionOptions":["먼저 예측을 선택하세요","Transmission은 감소하고 Loss[dB]는 두 배가 된다","Transmission은 정확히 두 배 증가한다","Loss가 Waveguide Length와 무관하다"],"predictionFeedback":"T=exp(−αL)이며 dB Loss는 αL에 비례합니다. Length 2배는 Power Transmission을 제곱합니다.","reflection":"Depletion Phase Shifter와 Forward PIN VOA의 Control Mechanism, Loss/Speed 근본 차이를 설명하세요.","sources":["A0","A1"],"tutor":{"question":"Forward-biased PIN의 Voltage를 입력하면 이 Loss 식으로 곧바로 Δα를 계산할 수 있나요?","choices":[{"text":"예. Δα=Voltage/L로 무조건 결정됩니다.","feedback":"Carrier Injection/Transport/Optical Overlap이 빠져 있습니다. Voltage는 곧 Absorption Coefficient가 아닙니다."},{"text":"아닙니다. 주입 Carrier와 재료 흡수, Optical Mode Overlap을 먼저 알아야 합니다.","feedback":"맞습니다. 본 예제의 Δα는 독립 입력이며 실제 Device Control Voltage와 연결된 것이 아닙니다.","correct":true},{"text":"Loss는 Phase와 동일한 단위 rad이므로 Voltage가 필요 없습니다.","feedback":"Phase와 Power Attenuation은 복소 Optical Response의 다른 부분이며 단위도 다릅니다."}],"why":"전압으로 Carrier를 주입하고, 그 Carrier의 재료 광학 특성 및 Mode Overlap으로 Δα_eff가 정해집니다.","simple":"같은 광로에 빛을 더 많이 흡수하는 영역을 만든다고 생각하면 됩니다. 얼마나 흡수할지는 별도 모델이 필요합니다.","math":"T=e^{-αL}; loss[dB]=(10/ln10)αL. 여기서 α는 Power 감쇠계수입니다.","notebook":"α Slider는 cm⁻¹ 단위, L Slider는 mm 단위이므로 내부에서 L/10으로 cm 변환합니다."}},{"id":"4.6","short":"Active Tuning","title":"Carrier Injection or Thermal Tuning?","time":"12–18분","lead":"Optical Phase는 Carrier Injection으로도 바꿀 수 있고, Heater가 만든 Temperature Change로도 바꿀 수 있습니다. 물리적 제어 경로와 시간 응답을 비교합니다.","question":"같은 Phase Shift를 만들 수 있다면 Carrier와 Heater는 서로 교환 가능한 소자일까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"광학 위상을 맞추는 두 가지 방법","scene":"thermal","html":"\u003cp>실제 PIC에서는 Fabrication Variation, Laser Wavelength Drift 및 Ring Resonance Offset을 조정해야 합니다. \u003cstrong>Active Tuning\u003c/strong>은 목표 Optical Operating Point를 유지하기 위한 방법입니다.\u003c/p>\u003cp>Plasma Dispersion으로 Carrier를 조절할 수도 있고, Silicon의 Thermo-optic Effect를 이용하여 Temperature를 바꿀 수도 있습니다. 두 방식은 필요한 Electric Drive, Static Power 및 Time Constant 측면에서 다릅니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"PIN Phase Shifter와 Thermo-optic Effect","scene":"thermal","html":"\u003cp>Forward-biased PIN Phase Shifter는 Carrier Injection이 Refractive Index를 바꾸는 경로입니다. 고속 Depletion 방식보다 큰 Carrier Storage와 Recombination Time의 영향을 받을 수 있습니다.\u003c/p>\u003cp>반면 Heater는 전기 에너지를 열로 바꾸어 Waveguide의 Temperature를 높입니다. Silicon의 Thermo-optic Coefficient가 양의 값인 조건에서 Effective Index가 증가하고 Optical Phase가 누적됩니다. \u003cstrong>Bulk Si dn/dT와 Waveguide dn_eff/dT를 구별\u003c/strong>해야 합니다.\u003c/p>\u003cp>실제 열확산은 여러 시간 상수와 인접 소자 간 Thermal Crosstalk을 포함합니다. Notebook의 한 개 R_th, C_th를 가진 Lumped Thermal Model은 첫 번째 학습 근사이며, 실제 Heater Layout이나 실측 Temperature를 예측하지 않습니다.\u003c/p>\u003cp>Thermal Tuning은 광학 회로의 느린 Operating Point를 안정적으로 맞추는 데 자주 사용됩니다. 목표 Phase에 필요한 Heater Power가 낮더라도 Device가 너무 느리거나 인접 Ring에도 열을 전달하면 시스템 레벨에서는 불리할 수 있습니다. Thermal Resistance가 높을수록 같은 Power에서 온도는 크게 증가하지만, 동시에 열용량과 결합해 Time Constant가 달라질 수 있습니다.\u003c/p>\u003cp>한 개의 Lumped Thermal Time Constant는 실제 구조의 복잡한 Heat Flow를 압축한 근사입니다. 실제 Heater의 전압·전류에서 Temperature를 얻으려면 Electrical Power의 분포와 열 경계조건이 필요하며, Waveguide의 Optical Temperature Sensitivity도 구조별로 다릅니다. 모델이 계산한 ΔT를 실제 칩 온도 센서 데이터처럼 표시하지 않습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Temperature에서 Phase까지","scene":"thermal","html":"\u003cdiv class=\"equation\">ΔT\u003csub>steady\u003c/sub> = R\u003csub>th\u003c/sub> P\u003csub>heater\u003c/sub>\u003cbr>ΔT(t) = ΔT\u003csub>steady\u003c/sub>[1−exp(−t/τ\u003csub>th\u003c/sub>)]\u003cbr>Δn\u003csub>eff\u003c/sub> = (dn\u003csub>eff\u003c/sub>/dT) ΔT\u003cbr>Δφ=(2π/λ₀)Δn\u003csub>eff\u003c/sub>L\u003c/div>\u003cp>R_th는 K/W, P는 W, τ_th는 ms, t는 ms입니다. Effective Thermo-optic Sensitivity는 독립적인 Mode Parameter이며 Bulk Si 값과 자동으로 동일하지 않습니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · Heater Step\u003c/h3>\u003cp>R_th=1000 K/W, P=10 mW이면 정상상태 ΔT=10 K입니다. t=τ_th에서는 ΔT≈6.32 K이고, t가 충분히 길면 10 K에 가까워집니다. 실제 Device의 Response Time을 이 숫자로 예측하려면 측정하거나 Electrothermal Model을 따로 검증해야 합니다.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"Power, Phase와 Time Constant는 독립입니다","scene":"thermal","html":"\u003cp>Heater를 통해 Optical Phase를 제어하더라도 Temperature가 즉시 정상 상태에 도달하지 않는 이유를 설명합니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"Heater Step Response를 관찰합니다","scene":"thermal","html":"\u003cp>Notebook에서 Heater Power와 Elapsed Time을 변경해 ΔT, Δn_eff, Δφ를 동시에 봅니다. Time을 0→5τ_th로 이동하면 무엇이 달라지는지 예측하세요.\u003c/p>\u003cp>시간에 따른 Phase가 MZI에 연결되면 보완적인 두 Optical Output도 같이 변합니다. 그러나 이 시간응답을 PN Junction RF Bandwidth와 동일시하지 않습니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"빠른 Data와 느린 Alignment를 구별합니다","scene":"thermal","html":"\u003cul>\u003cli>Carrier Injection과 Heater는 다른 경로로 Δn_eff를 제어합니다.\u003c/li>\u003cli>Thermal Response에는 Power, R_th, τ_th가 모두 중요합니다.\u003c/li>\u003cli>정상상태 Phase Tuning과 고속 Data Modulation은 별도 설계 문제입니다.\u003c/li>\u003c/ul>\u003cp>다음은 Thermal Phase를 사용해 실제 Optical Switch를 설명합니다.\u003c/p>"}],"prediction":"Heater Power Step 입력 후 t=0에 Temperature는?","predictionOptions":["먼저 예측을 선택하세요","첫 순간의 ΔT는 0이고 시간에 따라 정상상태로 접근한다","첫 순간 정상상태까지 무한히 상승한다","Heater Power와 관계없이 ΔT=0이 유지된다"],"predictionFeedback":"1st-order Lumped Thermal Model에서 ΔT(t)=R_th P[1−exp(−t/τ)]입니다. t=0에서는 0이고 정상상태에는 지수적으로 접근합니다.","reflection":"PIN Phase Shifter와 Thermal Tuning이 서로 다른 속도/소비전력 문제를 만드는 이유를 설명하세요.","sources":["A0","A3"],"tutor":{"question":"Heater에 10 mW를 공급했을 때 Optical Phase는 즉시 정상상태가 되나요?","choices":[{"text":"그렇습니다. ΔT=RthP만 계산하면 시간의 영향은 없습니다.","feedback":"RthP는 정상상태입니다. Thermal Capacitance와 열확산 때문에 T(t)가 시간에 따라 변합니다."},{"text":"아닙니다. Thermal Time Constant에 따라 천천히 접근합니다.","feedback":"맞습니다. 정상상태와 시간응답을 분리해 공부해야 합니다.","correct":true},{"text":"항상 수백 GHz 이상의 Optical Modulation을 만듭니다.","feedback":"Thermo-optic Tuning의 속도는 구조의 열 응답에 제한되며, RF Modulation과 동일하지 않습니다."}],"why":"Heater는 Temperature를 올리고 열용량은 온도 응답을 느리게 합니다. τth=RthCth가 시간 단위입니다.","simple":"컵을 데우는 것처럼 바로 최고 온도가 되지 않고 서서히 올라갑니다.","math":"ΔT(t)=RthP(1−e^{−t/τ}); Δφ=(2π/λ)S_TOΔT L.","notebook":"P와 t를 바꿀 때 ΔT와 두 Optical Port를 함께 관찰하세요."}},{"id":"4.7","short":"Thermo-optic Switch","title":"How Does a Thermo-optic Switch Route Light?","time":"15–20분","lead":"Chapter 2 MZI의 두 Output Port, Chapter 4 Thermal Tuning을 연결해 Optical Switching을 이해합니다. 마지막에는 PN, MZM, MRM, PIN VOA 및 Heater의 역할을 스스로 비교합니다.","question":"같은 MZI에서도 Heater Power를 바꿔 빛의 출구를 바꿀 수 있을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"Active Photonic Circuit의 첫 종합","scene":"switch","html":"\u003cp>이번 장의 출발점은 Carrier에 따라 Material Index와 Absorption이 변한다는 사실이었습니다. 이제 그 물리적 변화가 실제 \u003cstrong>Optical Device Function\u003c/strong>으로 이어지는 전체 경로를 정리합니다.\u003c/p>\u003cp>Thermo-optic Switch는 Heated Arm의 Phase를 변화시켜 MZI Output Port 사이에 Optical Power를 재분배할 수 있습니다. Data Modulation에 필요한 전기적 속도와 Switch의 Retuning 요구조건은 서로 다릅니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"Thermal Phase Shifter + MZI","scene":"switch","html":"\u003cp>이상적인 Balanced MZI에서 두 Port는 서로 보완적인 Optical Transmission을 갖습니다. Heater로 한 Arm의 Phase를 π만큼 변화시키면 두 Port의 선호 출력이 서로 바뀔 수 있습니다. 즉 Heater Power로 Light Routing State를 선택합니다.\u003c/p>\u003cp>실제 Thermo-optic Switch에서는 Heater Efficiency, Thermal Crosstalk, Nonuniform Temperature, Insertion Loss, Extinction Ratio, Static Heater Power 및 Switch Time을 함께 고려해야 합니다. 이 Lesson의 Figure는 이상적인 위상-간섭 결과와 단일 Thermodynamic RC만 계산합니다.\u003c/p>\u003cp>Chapter 4의 기법을 비교하면 PN Depletion은 Carrier Removal에 기반한 고속 Phase Control, PIN Injection은 Carrier Storage를 동반할 수 있는 Index/Absorption Control, MRM은 Resonance Detuning, Heater는 안정적인 Operating Point 제어의 한 수단입니다. 어떤 기술이 가장 좋다는 결론은 Device Specification과 검증 데이터가 있어야 가능합니다.\u003c/p>\u003cp>Switching은 출력을 어느 Port로 보낼지 결정하는 기능이고, Modulation은 데이터를 표현하기 위해 신호를 시간적으로 바꾸는 기능입니다. 둘 다 Interference를 이용할 수 있지만 Speed, Loss, Power, Control Precision의 요구사항은 다릅니다. Thermo-optic Switch를 이해했다고 해서 실제 200G MZM의 RF Design을 검증한 것은 아닙니다.\u003c/p>\u003cp>마지막으로 모델의 완전성을 확인해 봅니다. Heater Step은 Time에 따른 ΔT를 계산하고, 같은 ΔT에서 Δn_eff를 계산하며, 동일한 Δn_eff로 Phase와 두 Port Power를 계산해야 합니다. 각 Figure에서 Parameter가 다른 별도의 모델을 사용하면 겉보기로는 그럴듯해도 인과관계가 끊어집니다. 모든 도식과 Readout을 하나의 Model Output으로 연결하는 이유입니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Heater → ΔT → Δφ → Optical Port","scene":"switch","html":"\u003cdiv class=\"equation\">ΔT(t)=R\u003csub>th\u003c/sub>P[1−exp(−t/τ\u003csub>th\u003c/sub>)]\u003cbr>Δφ(t)=(2π/λ₀)(dn\u003csub>eff\u003c/sub>/dT)ΔT(t)L\u003cbr>P\u003csub>1\u003c/sub>/P\u003csub>in\u003c/sub>=cos²[Δφ(t)/2]\u003cbr>P\u003csub>2\u003c/sub>/P\u003csub>in\u003c/sub>=sin²[Δφ(t)/2]\u003c/div>\u003cdiv class=\"worked\">\u003ch3>Worked Example · Thermal Switching Condition\u003c/h3>\u003cp>목표 Δφ=π라면 필요한 ΔT_π = λ₀/[2(dn_eff/dT)L]입니다. d n_eff/dT=10⁻⁴/K, L=1 mm, λ₀=1550 nm를 독립적으로 가정하면 ΔT_π≈7.75 K입니다. R_th=1000 K/W라면 정상상태 P≈7.75 mW가 됩니다. 실제 제작 Device에서 이 Efficiency를 보장하지 않습니다.\u003c/p>\u003c/div>\u003cp>정상상태에서 얻는 π Phase와 주어진 시간에 얻는 Phase는 달라야 합니다. τ_th를 고려해 같은 Source의 상태로 계산하세요.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"Model은 실제 Switch의 Loss와 Crosstalk을 예측하지 않습니다","scene":"switch","html":"\u003cp>이번 Chapter를 마치기 전에 Device 수준의 성능과 이상적인 교육용 회로 모델을 구별하는지 확인합니다.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"한 회로를 처음부터 끝까지 계산해 봅니다","scene":"switch","html":"\u003cp>Notebook에서 Heater Power와 Time을 조절하세요. Phase가 π에 가까워지면 두 Output Port의 Power가 교환되는 현상을 관찰하고, 동일 P라도 t가 짧을 때는 완전히 Switch되지 않는 이유를 설명합니다.\u003c/p>\u003cp>목표는 특정 Heater의 실제 효율을 예측하는 것이 아니라 \u003cstrong>Thermal Dynamics → Effective Index → Phase → Optical Switching\u003c/strong>을 하나의 인과관계로 이해하는 것입니다.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"Chapter 4 Review와 다음 Chapter 연결","scene":"switch","html":"\u003cul>\u003cli>Plasma Dispersion은 Active Silicon Photonics에서 Index와 Absorption을 바꿉니다.\u003c/li>\u003cli>Depletion, Injection, Resonance 및 Thermal Tuning은 다른 소자/시간응답을 만듭니다.\u003c/li>\u003cli>실제 Device Design에는 전하·광학·RF·Thermal Solver와 측정이 필요합니다.\u003c/li>\u003c/ul>\u003cp>이제 다음 원본 Chapter 7인 Detectors를 공부할 준비가 되었습니다. 아직 Chapter 5 코드는 개발하지 않습니다.\u003c/p>"}],"prediction":"충분한 시간 후 Heater가 Δφ=π를 만들면 Lossless MZI 두 Port는?","predictionOptions":["먼저 예측을 선택하세요","입력 Power가 한 Port에서 다른 Port로 이동한다","두 Port 모두 Power=0","항상 Input과 무관한 새로운 Energy가 생성된다"],"predictionFeedback":"이상적인 Lossless MZI에서는 한 Port의 Transmission이 0이 되고 반대 Port의 Transmission은 1이 됩니다. 현실의 Loss/Crosstalk은 이 근사 밖입니다.","reflection":"PN Phase Shifter, MZM, MRM, PIN VOA, Thermo-optic Switch가 각각 어떤 물리 경로로 Optical Power를 바꾸는지 비교하세요.","sources":["A0","A3"],"tutor":{"question":"Chapter 4의 Thermal 모델에서 Lossless MZI가 Port를 완전히 전환했다면 실제 Device Loss도 0이라고 결론내릴 수 있나요?","choices":[{"text":"네. Ideal Transfer가 1이면 실제 Waveguide와 Interface Loss도 반드시 0입니다.","feedback":"이상 모델은 Splitter imbalance, Heater Absorption, Coupling/Propagation Loss와 Crosstalk 등을 생략합니다."},{"text":"아닙니다. Ideal Transfer는 간섭에 의한 Port 분배만 설명합니다.","feedback":"정확합니다. 실제 Device IL와 ER는 공정/물리 모델 또는 측정으로 별도 평가해야 합니다.","correct":true},{"text":"Heater Temperature는 Optical Phase에 절대 영향을 주지 않습니다.","feedback":"Thermo-optic Effect는 Δn_eff를 통해 Phase를 변화시키므로 이상적인 Switching 설명에 사용됩니다."}],"why":"Ideal Model은 학습에 필요한 하나의 효과를 분리해 설명합니다. 실제 Performance는 누락된 손실/불균형의 영향까지 필요합니다.","simple":"길을 바꾸는 분기기의 동작을 이해했다고 도로 전체의 마찰이 없다는 뜻은 아닙니다.","math":"P1=cos²(φ/2), P2=sin²(φ/2); φ는 Thermal Step Model이 계산합니다.","notebook":"Power/Time 변경 후 Phase와 두 Optical Transmission이 같은 계산 상태에서 반영되는지 확인하세요."}},{"id":"5.1","short":"Photon → Current","title":"How Does Light Become Electrical Current?","time":"15–22분","lead":"Chapter 4에서는 전기 입력이 빛을 조절했습니다. 이제 빛이 흡수되어 Electron–Hole Pair를 만들고, 수집된 전하가 외부 회로의 Current가 되는 과정을 배웁니다.","question":"1550 nm의 빛이 들어오면 어떻게 전류가 생성될까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"빛을 전류로 읽는 첫 단계","scene":"detector","html":"\u003cp>Chapter 1의 Mode는 빛이 어디에 분포하는지, Chapter 3의 Coupling은 얼마나 많은 Optical Power가 Device에 도달하는지 설명했습니다. Detector에서는 그 빛의 일부가 흡수된 뒤 실제 전하로 수집되어야 합니다. \u003cstrong>빛의 도달, 흡수, 전하 생성, 수집\u003c/strong>은 서로 다른 단계입니다.\u003c/p>\u003cp>Responsivity를 단순한 성능 숫자로 외우기보다 Photon 한 개가 운반하는 Energy와 수집 전하를 세어 보면 단위 A/W의 의미를 이해할 수 있습니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"흡수된 Photon이 모두 검출되는 것은 아닙니다","scene":"detector","html":"\u003cp>Photon Energy가 허용된 전자 전이에 충분하고 광학적 전이 확률도 존재하면, 흡수된 Photon은 Valence Band의 Electron을 들뜨게 하고 Hole을 남길 수 있습니다. 이 \u003cstrong>Electron–Hole Pair\u003c/strong>는 아직 외부 회로에서 측정한 전류와 같지 않습니다. Recombination으로 사라지거나 Trap에 붙잡힐 수도 있기 때문입니다.\u003c/p>\u003cp>PIN의 Built-in Electric Field와 Reverse Bias는 Electron과 Hole을 반대 방향으로 이동시켜 Contacts로 수집합니다. 두 Carrier가 이동하면서 외부 회로에 유도되는 전하를 합하면, Unity Gain과 완전 수집 조건에서 한 Pair당 전하 q가 기여합니다. Electron과 Hole이 둘이라는 이유로 \u003cstrong>2q를 곱하지 않습니다.\u003c/strong>\u003c/p>\u003cp>이 Chapter의 \u003cstrong>External Quantum Efficiency η_ext\u003c/strong>는 Detector Coupling Region 앞의 Waveguide Reference Plane을 통과한 Photon 중 수집 전하에 기여한 비율입니다. 따라서 Coupling, Absorption, Collection의 손실이 이미 포함됩니다. Fiber 입력을 기준으로 바꾸면 Fiber-to-chip Loss까지 반영한 다른 η가 됩니다.\u003c/p>\u003cp>\u003cstrong>Internal Quantum Efficiency η_int\u003c/strong>는 여기서 Absorbed Photon당 수집된 Pair 수로 정의하며 Collection/Recombination을 포함합니다. 문헌마다 Internal Reference Plane의 사용법이 다를 수 있으므로 정의를 먼저 읽어야 합니다. Absorption이 90%라고 해도 Collection이 불완전하면 η_ext는 90%가 되지 않습니다.\u003c/p>\u003cp>Responsivity는 같은 Reference Plane의 Photocurrent를 Optical Power로 나눈 비율입니다. 동일한 R에서도 입력 Power가 두 배이면 선형 범위의 Photocurrent는 두 배입니다. 반대로 높은 R만으로 높은 속도나 낮은 Noise를 보장할 수 없습니다. Carrier Gain이 있는 APD는 5.4에서 구분합니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"Photon Counting에서 A/W까지","scene":"detector","html":"\u003cdiv class=\"equation\">E_ph = hc/λ\u003cbr>Φ = P_opt / E_ph\u003cbr>R = η_ext qλ/(hc)\u003cbr>I_primary = R P_opt\u003c/div>\u003cp>h=6.62607015×10⁻³⁴ J·s, c=299792458 m/s, q=1.602176634×10⁻¹⁹ C입니다. λ는 nm에서 m로, Power는 µW에서 W로 변환합니다. C/J=A/W이므로 R의 단위가 확인됩니다. 표시 Current는 양의 크기이며 Diode의 Signed I–V Convention을 정의한 값은 아닙니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 같은 Photon, 다른 수집 확률\u003c/h3>\u003cp>λ=1550 nm이면 E_ph≈0.800 eV입니다. Unity-gain Ideal R은 η=0.5, 0.8, 1.0에서 각각 약 0.625, 1.000, 1.250 A/W입니다. η_ext=0.8, P=100 µW라면 I≈100 µA입니다. 독립적인 교육용 η를 가정한 계산이며 실제 Ge Device 측정값이 아닙니다.\u003c/p>\u003c/div>\u003cp>R(λ) 그래프는 η를 고정한 비례 관계입니다. 실제 Material에서는 η 자체가 λ에 따라 달라지므로 이 직선을 Ge의 Spectral Responsivity로 읽으면 안 됩니다.\u003c/p>"},{"key":"tutor","label":"D · Think with your tutor","title":"100개의 Photon을 어떻게 세나요?","scene":"detector","html":"\u003cp>Photon 100개 중 80개가 수집 전하에 기여한다면 η_ext는 80%입니다. 이미 External QE에 들어 있는 Coupling Loss를 다시 곱하면 어떤 오류가 생기는지 Tutor와 확인하세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"η, λ, Power를 따로 바꿔 보세요","scene":"detector","html":"\u003cp>η_ext를 0.5 → 0.8 → 1.0으로 바꾸고 R과 Photocurrent가 같은 비율로 달라지는지 확인하세요. Power만 바꾸면 R은 유지되며 Current만 바뀝니다. λ를 바꿀 때는 고정 η라는 가정이 실제 Material Spectrum과 다른 점을 설명해 보세요.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"흡수와 수집을 구별합니다","scene":"detector","html":"\u003cul>\u003cli>Photon Energy와 Photon Flux는 다른 양입니다.\u003c/li>\u003cli>Generation과 Collection을 거쳐야 외부 Current가 생깁니다.\u003c/li>\u003cli>QE와 R은 Reference Plane을 공유해야 합니다.\u003c/li>\u003cli>Responsivity [A/W]와 Photocurrent [A]는 구별합니다.\u003c/li>\u003c/ul>\u003cp>다음은 같은 전하를 얼마나 빨리 수집할 수 있는지 살펴보겠습니다.\u003c/p>"}],"prediction":"η_ext를 높이고 입력 Power는 고정하면?","predictionOptions":["먼저 예측을 선택하세요","R과 I가 같은 비율로 증가","R만 증가하고 I는 일정","I와 RC Bandwidth가 반드시 함께 증가"],"predictionFeedback":"Unity Gain과 선형 범위에서는 R∝η_ext, I=RP입니다. RC와 Transit은 이 계산에서 결정하지 않습니다.","reflection":"Absorption Efficiency, Internal QE, External QE의 분모를 각각 적고 R과 I의 차이를 자신의 말로 설명하세요.","sources":["D0","D1","D2","D3"],"tutor":{"question":"1550 nm에서 External QE가 80%라면 Reference Plane의 Photon 100개 중 평균 몇 개가 검출 전하에 기여하나요?","choices":[{"text":"80개입니다. 이 η_ext에는 정의된 Plane 뒤의 Coupling Loss도 포함됩니다.","feedback":"맞습니다. 평균 80개이며 실제 사건 수는 변동합니다. Absorption만의 비율이 아니라 수집까지 포함한 External QE입니다.","correct":true},{"text":"160개입니다. Electron과 Hole이 각각 전하를 만들기 때문입니다.","feedback":"한 Pair의 두 Carrier가 외부 회로에 기여하는 총 전하는 완전 수집 시 q입니다. 2q로 두 배 계산하지 않습니다."},{"text":"80개에서 Coupling Efficiency를 반드시 한 번 더 곱합니다.","feedback":"External QE에 이미 Coupling이 들어 있으면 중복 계산입니다. Plane을 바꾸거나 Factorized QE를 정의했을 때만 별도로 계산합니다."}],"why":"Photon Flux와 수집 전하의 비율을 먼저 정의해야 Optical Coupling과 Carrier Collection의 손실을 중복 적용하지 않습니다.","simple":"입구를 지난 100개 중 최종 출구까지 기여한 80개를 셌다면, 중간 입구 손실을 다시 빼면 같은 손실을 두 번 세게 됩니다.","math":"Φ=P/(hc/λ), I=η_ext qΦ이므로 R=I/P=η_ext qλ/(hc)입니다. Photon 1개당 완전 수집 Pair 1개에서 q가 기여합니다.","notebook":"η_ext Slider는 이미 합성된 QE입니다. Power를 바꿔 Current와 R을 비교하고 5.5에서 Factorized QE와 연결하세요."}},{"id":"5.2","short":"Response & Noise","title":"What Limits Photodetector Bandwidth?","time":"15–22분","lead":"빛의 흡수는 빠르게 일어나도 전하 이동과 전기 회로의 충전은 시간이 걸립니다. Transit, RC와 Dark Current를 서로 다른 원인으로 나누어 학습합니다.","question":"빛을 전류로 바꿀 수 있다면 왜 무한히 빠른 Optical Signal을 검출할 수 없을까요?","sections":[{"key":"why","label":"A · Why are we learning this?","title":"전하와 회로 모두 시간이 필요합니다","scene":"detector","html":"\u003cp>Chapter 4에서 Lumped RC가 Modulator의 응답을 늦추는 것을 배웠습니다. Detector에도 Capacitance가 있으며, 여기에 \u003cstrong>Carrier를 수집하는 시간\u003c/strong>이 추가됩니다. 좋은 Absorber가 곧 빠른 Detector라는 결론은 성립하지 않습니다.\u003c/p>\u003cp>Bandwidth는 정해진 Small-signal 입력과 출력 사이의 Frequency Response를 설명합니다. Bit Rate는 Modulation, Coding, Receiver와 Noise에 의존하므로 두 숫자를 바로 같은 것으로 두지 않습니다.\u003c/p>"},{"key":"concept","label":"B · Learn the concept","title":"이동 시간, 충전 시간, 어두울 때의 전류","scene":"detector","html":"\u003cp>\u003cstrong>Transit Time\u003c/strong>은 Carrier가 생성된 위치에서 수집될 때까지 이동하는 시간과 관련됩니다. 높은 Electric Field에서는 Drift가 빨라질 수 있으나 Velocity Saturation, 서로 다른 Electron/Hole 속도, Recombination과 Diffusion Tail이 실제 응답을 바꿉니다. 광 전파 방향의 Detector Length와 Junction을 가로지르는 Carrier 이동 거리는 일반적으로 다른 방향입니다.\u003c/p>\u003cp>상수 Drift Velocity v를 가정하면 이동 거리 W에 대해 τ_tr≈W/v라는 시간 척도를 얻습니다. 그러나 생성 위치마다 두 Carrier의 경로가 다르고 유도 Current Impulse Shape도 다르므로 \u003cstrong>1/τ_tr를 실제 −3 dB Bandwidth라고 단정하지 않습니다.\u003c/strong> 이번 Notebook은 Transit 시간만 표시합니다.\u003c/p>\u003cp>\u003cstrong>RC Response\u003c/strong>는 Junction, Pad, Interconnect, Load의 총 Capacitance C_total이 Small-signal Equivalent Resistance R_eq를 통해 충방전되는 효과입니다. R_eq는 단순히 어느 Resistor 하나의 값으로 가정하지 말고 사용한 Equivalent Circuit에서 정의해야 합니다. Notebook에서는 전체를 독립적인 입력 두 개로 지정한 First-order Model만 풉니다.\u003c/p>\u003cp>\u003cstrong>Dark Current\u003c/strong>는 입사 Power가 0이어도 Bias와 Temperature에서 흐를 수 있는 Current입니다. Thermal Generation, Interface/Defect States, Surface Leakage 등이 원인이 될 수 있습니다. 평균 DC Current와 그 통계적 Noise는 다른 물리량입니다. Dark Offset을 빼도 Shot Noise는 사라지지 않습니다.\u003c/p>\u003cp>이상적인 Poisson 전하 사건의 단순 Shot-noise Model에서는 Photo와 Dark Current가 Noise Variance에 기여합니다. Noise를 적분하는 \u003cstrong>Equivalent Electrical Noise Bandwidth B\u003c/strong>는 독립 입력이며 자동으로 f_RC와 같지 않습니다. Thermal Noise, TIA Noise, 1/f Noise, APD Excess Noise는 포함하지 않습니다. APD Gain에 이 식을 그대로 적용하지 않습니다.\u003c/p>"},{"key":"equation","label":"C · Understand the equation","title":"서로 다른 모델을 분리해서 씁니다","scene":"detector","html":"\u003cdiv class=\"equation\">τ_RC = R_eq C_total\u003cbr>f_RC = 1/(2π R_eq C_total)\u003cbr>|H_RC(f)| = [1+(f/f_RC)²]⁻¹ᐟ²\u003cbr>τ_tr ≈ W/v_drift\u003cbr>i_shot,rms = √[2q(I_primary + I_dark)B]\u003c/div>\u003cp>R_eq [Ω], C_total [F], f [Hz], W [m], v [m/s], B [Hz]로 계산합니다. f_RC에서 Amplitude는 1/√2, Power는 1/2로 −3.0103 dB입니다. 서로 다른 물리적 응답을 근거 없이 합친 Total Bandwidth는 제공하지 않습니다.\u003c/p>\u003cdiv class=\"worked\">\u003ch3>Worked Example · 두 시간 척도\u003c/h3>\u003cp>R_eq=50 Ω, C_total=100 fF라면 τ_RC=5 ps, f_RC≈31.83 GHz입니다. W=1 µm, v=10⁵ m/s이면 τ_tr=10 ps입니다. 이 두 숫자만으로 실제 전체 Bandwidth를 결정할 수는 없습니다.\u003c/p>\u003cp>I_primary=100 µA, I_dark=10 nA, B=10 GHz라면 총 단순 Shot Noise≈0.566 µA rms, Dark-only≈5.66 nA rms입니다. 두 rms를 더하지 말고 제곱을 더합니다.\u003c/p>\u003c/div>"},{"key":"tutor","label":"D · Think with your tutor","title":"Capacitance를 줄이면 언제나 빨라질까요?","scene":"detector","html":"\u003cp>Capacitance를 절반으로 줄였을 때 이 RC 모델의 f_RC는 두 배가 됩니다. Carrier 수집이 지배적인 Device에서도 같은 개선이 나타날지 Tutor와 구분해 보세요.\u003c/p>"},{"key":"experiment","label":"E · Verify with physics","title":"한 번에 하나의 원인을 바꾸세요","scene":"detector","html":"\u003cp>C_total을 100→50 fF로 줄이고 RC Curve와 수치를 비교하세요. W를 늘리면 Transit 시간이 바뀌지만 RC Curve는 그대로입니다. B를 네 배로 키우면 Shot Noise rms는 두 배가 되는지도 확인하세요.\u003c/p>"},{"key":"summary","label":"F · What did we learn?","title":"물리적 제한을 구분합니다","scene":"detector","html":"\u003cul>\u003cli>RC와 Transit은 원인이 서로 다른 제한입니다.\u003c/li>\u003cli>Dark Current의 평균과 Shot Noise rms를 구별합니다.\u003c/li>\u003cli>Noise B와 RC −3 dB Fre
